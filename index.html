 a:["Xem dự báo thời tiết một thành phố lạnh và tính chênh lệch ngày và đêm.","Bấm thang máy toà nhà có tầng hầm và đọc các số âm.","Đặt một biểu thức có chữ n rồi nhờ bố mẹ thay số vào."],
 c:{q:"The temperature falls from 3&deg;C to &minus;6&deg;C. How many degrees did it fall?",o:["3","6","9","&minus;9"],a:2,
  e:"Từ 3 xuống 0 là 3 độ, từ 0 xuống &minus;6 là 6 độ nữa, tổng 9 độ."}},
m15:{d:[{en:"A square is also a rectangle, a rhombus and a parallelogram &mdash; it satisfies all their rules.",vi:"Hình vuông đồng thời là hình chữ nhật, hình thoi và hình bình hành vì thoả mãn hết các điều kiện."},
 {en:"The circumference of any circle is about 3.14 times its diameter. That number is called pi.",vi:"Chu vi hình tròn luôn gấp khoảng 3,14 lần đường kính; con số đó gọi là số pi."},
 {en:"A shape with rotational symmetry of order 1 has no rotational symmetry at all.",vi:"Bậc đối xứng quay bằng 1 nghĩa là hình đó không có đối xứng quay."}],
 a:["Tìm 5 hình tứ giác trong nhà và gọi đúng tên từng loại.","Đo đường kính và chu vi một cái đĩa bằng dây, rồi chia xem có ra khoảng 3,14 không.","Quay một tấm bìa hình chữ nhật xem bao nhiêu lần trông giống ban đầu."],
 c:{q:"A circle has a diameter of 10 cm. Its circumference is about:",o:["10 cm","20 cm","31 cm","100 cm"],a:2,
  e:"Chu vi khoảng 3,14 &times; đường kính = 3,14 &times; 10 &asymp; 31 cm."}},
m16:{d:[{en:"For any solid with flat faces: faces + vertices = edges + 2. This is Euler's rule.",vi:"Với mọi khối đa diện: số mặt + số đỉnh = số cạnh + 2 &mdash; công thức Euler."},
 {en:"A cube has 11 different nets, but many arrangements of six squares do not fold into a cube at all.",vi:"Hình lập phương có 11 kiểu khai triển, nhưng nhiều cách xếp 6 ô vuông lại không gấp được."},
 {en:"Doubling every side of a cube makes the volume 8 times bigger, not twice.",vi:"Gấp đôi mọi cạnh của lập phương thì thể tích gấp 8 lần chứ không phải 2 lần."}],
 a:["Mở một hộp bánh ra thành hình phẳng rồi vẽ lại hình khai triển.","Đo một hộp trong bếp và tính thể tích, so với số ml ghi trên vỏ.","Kiểm tra công thức Euler với một hộp và một kim tự tháp đồ chơi."],
 c:{q:"A cube has sides of 2 cm. If every side is doubled to 4 cm, the volume becomes:",o:["2 times bigger","4 times bigger","8 times bigger","16 times bigger"],a:2,
  e:"8 cm&sup3; thành 64 cm&sup3;, tức gấp 8 lần, vì cả ba chiều đều nhân đôi."}},
m17:{d:[{en:"Money is always written to two decimal places: $3.50, not $3.5.",vi:"Tiền luôn viết hai chữ số thập phân: $3.50 chứ không phải $3.5."},
 {en:"Adding fractions with different denominators is like adding different units &mdash; you must convert first.",vi:"Cộng phân số khác mẫu giống như cộng hai đơn vị khác nhau, phải đổi về cùng loại trước."},
 {en:"The lowest common denominator is just the lowest common multiple of the two denominators.",vi:"Mẫu số chung nhỏ nhất chính là bội chung nhỏ nhất của hai mẫu."}],
 a:["Cộng tiền ba món khi đi chợ, viết đủ hai chữ số thập phân.","Chia một chiếc bánh cho cả nhà rồi viết phần mỗi người thành phân số và cộng lại.","Đo hai đoạn dây bằng cm rồi cộng, chú ý thẳng hàng dấu phẩy."],
 c:{q:"2/3 + 1/6 =",o:["3/9","5/6","1/2","3/6"],a:1,
  e:"Quy đồng mẫu 6: 4/6 + 1/6 = 5/6."}},
m18:{d:[{en:"A number is divisible by 6 if it passes BOTH the test for 2 and the test for 3.",vi:"Chia hết cho 6 khi thoả cả dấu hiệu chia 2 và chia 3."},
 {en:"Divisibility tests are quick checks &mdash; they save time before doing a long division.",vi:"Dấu hiệu chia hết giúp kiểm tra nhanh trước khi đặt phép chia dài."},
 {en:"When a division has a remainder, the answer can be written as a fraction: 25 &divide; 4 = 6 &frac14;.",vi:"Phép chia có dư viết được thành hỗn số: 25 &divide; 4 = 6 và 1/4."}],
 a:["Chọn số bất kỳ trên biển số xe rồi kiểm tra chia hết cho 2, 3, 5, 9.","Chia số kẹo cho cả nhà và viết kết quả có số dư.","Nhân nhẩm số tuổi của mình với 23 bằng cách tách hàng."],
 c:{q:"Which number is divisible by 6?",o:["114","124","134","145"],a:0,
  e:"114 là số chẵn (chia hết 2) và 1+1+4 = 6 chia hết cho 3, nên chia hết cho 6."}},
m19:{d:[{en:"Multiplying by a number smaller than 1 makes the answer SMALLER: 8 &times; 0.5 = 4.",vi:"Nhân với số nhỏ hơn 1 làm kết quả NHỎ đi: 8 &times; 0.5 = 4."},
 {en:"Dividing by a number smaller than 1 makes the answer BIGGER: 8 &divide; 0.5 = 16.",vi:"Chia cho số nhỏ hơn 1 làm kết quả LỚN lên: 8 &divide; 0.5 = 16."},
 {en:"1/2 of 1/2 is 1/4 &mdash; taking a fraction of a fraction always gives something smaller.",vi:"Một nửa của một nửa là một phần tư; lấy phân số của phân số luôn cho kết quả nhỏ hơn."}],
 a:["Nấu nửa công thức món ăn bằng cách nhân mọi nguyên liệu với 1/2.","Tính giá 0,5 kg và 1,5 kg một loại quả khi biết giá 1 kg.","Cắt một tờ giấy làm đôi rồi lại làm đôi và viết phân số của mỗi mảnh."],
 c:{q:"Which gives the biggest answer?",o:["8 &times; 0.5","8 &divide; 0.5","8 &times; 0.1","8 &minus; 0.5"],a:1,
  e:"Chia cho 0.5 tức hỏi có bao nhiêu nửa trong 8, kết quả là 16 &mdash; lớn nhất."}},
m20:{d:[{en:"A pie chart cannot show numbers, only proportions. You need the total to work out amounts.",vi:"Biểu đồ tròn chỉ cho thấy tỉ lệ, không cho số lượng; phải biết tổng mới tính ra số cụ thể."},
 {en:"A dot plot keeps every single value, so you can still find the mode and range from it.",vi:"Biểu đồ chấm giữ nguyên từng giá trị nên vẫn tìm được mốt và khoảng biến thiên."},
 {en:"A scatter graph showing points rising together means the two things are linked, but one does not always cause the other.",vi:"Biểu đồ phân tán đi lên cho thấy hai đại lượng liên hệ với nhau, nhưng chưa chắc cái này gây ra cái kia."}],
 a:["Đếm màu áo của cả nhà rồi vẽ biểu đồ cột.","Ghi số phút học mỗi ngày trong tuần và vẽ đồ thị đường.","Tìm một biểu đồ trên báo và chỉ ra nó thuộc loại nào."],
 c:{q:"A pie chart shows 25% of 80 pupils walk to school. How many pupils is that?",o:["25","20","40","4"],a:1,
  e:"25% của 80 = 80 &divide; 4 = 20 học sinh. Biểu đồ tròn cho tỉ lệ, phải nhân với tổng mới ra số."}},
m21:{d:[{en:"Calculators follow the same order of operations, so 8 + 2 &times; 5 gives 18 on a calculator too.",vi:"Máy tính cũng theo đúng thứ tự phép tính, nên 8 + 2 &times; 5 cho 18."},
 {en:"Brackets are the only way to force an addition to happen first.",vi:"Dấu ngoặc là cách duy nhất buộc phép cộng làm trước."},
 {en:"The distributive law is exactly what you use every time you do long multiplication.",vi:"Tính phân phối chính là điều ta dùng mỗi lần đặt tính nhân số lớn."}],
 a:["Đố bố mẹ tính 12 + 3 &times; 4 rồi giải thích thứ tự đúng.","Nhẩm 25 &times; 12 bằng cách tách thành 25 &times; 10 + 25 &times; 2.","Viết một biểu thức rồi thêm ngoặc vào các chỗ khác nhau xem kết quả đổi thế nào."],
 c:{q:"Where should brackets go to make 4 + 6 &times; 2 = 20?",o:["(4 + 6) &times; 2","4 + (6 &times; 2)","(4 + 6 &times; 2)","No brackets needed"],a:0,
  e:"Đặt ngoặc quanh phép cộng: (4 + 6) &times; 2 = 10 &times; 2 = 20."}}
});
</script>

<script>
Object.assign(EXT, {
e12:{d:[{en:"<i>been</i> and <i>gone</i> are different: <i>She has been to Paris</i> (and came back) but <i>She has gone to Paris</i> (still there).",vi:"has been to là đã đi và về; has gone to là đang còn ở đó."},
 {en:"Malala Yousafzai won the Nobel Peace Prize at 17, the youngest person ever to do so.",vi:"Malala Yousafzai đoạt giải Nobel Hoà bình năm 17 tuổi, người trẻ nhất từ trước tới nay."},
 {en:"Feelings words often pair with prepositions: <i>proud of, nervous about, grateful for, excited about</i>.",vi:"Từ chỉ cảm xúc thường đi kèm giới từ cố định: proud of, nervous about, grateful for."}],
 a:["Kể ba việc con đã từng làm bằng <i>I have...</i> và ba việc chưa từng bằng <i>I have never...</i>","Nhìn bản đồ Việt Nam, chỉ hướng bắc nam đông tây và đọc tên thủ đô bằng tiếng Anh.","Nói một câu về người con ngưỡng mộ, bắt đầu bằng <i>I admire... because...</i>"],
 c:{q:"Mum is not here. She ______ to the market.",o:["has been","has gone","went to","have gone"],a:1,
  e:"Mẹ chưa về nên dùng has gone to. Nếu mẹ đã về rồi mới nói has been to."}},
e13:{d:[{en:"<i>mustn't</i> means it is forbidden; <i>don't have to</i> means it is not necessary. Very different.",vi:"mustn't là CẤM, don't have to là KHÔNG CẦN &mdash; hai nghĩa khác hẳn nhau."},
 {en:"You can put the if-clause second and drop the comma: <i>You will improve if you train hard.</i>",vi:"Có thể đảo mệnh đề if ra sau và bỏ dấu phẩy."},
 {en:"Athletes need carbohydrates for energy and protein to repair muscles.",vi:"Vận động viên cần tinh bột để lấy năng lượng và đạm để phục hồi cơ bắp."}],
 a:["Viết ba lời khuyên cho bạn muốn chơi thể thao giỏi hơn, dùng should.","Kể tên 5 dụng cụ thể thao bằng tiếng Anh và môn nào dùng nó.","Đặt hai câu điều kiện loại 1 về trận đấu sắp tới."],
 c:{q:"&lsquo;You ______ touch the ball with your hands in football.&rsquo;",o:["don't have to","mustn't","shouldn't","needn't"],a:1,
  e:"Đây là luật cấm tuyệt đối trong bóng đá nên dùng mustn't."}},
e14:{d:[{en:"You can leave out the relative pronoun when it is the object: <i>the bird (that) I saw</i>.",vi:"Có thể lược bỏ đại từ quan hệ khi nó là tân ngữ: the bird I saw."},
 {en:"Emperor penguins survive &minus;60&deg;C by huddling together and taking turns on the outside.",vi:"Chim cánh cụt hoàng đế chịu được &minus;60&deg;C nhờ túm tụm và thay phiên nhau đứng vòng ngoài."},
 {en:"Coral reefs cover less than 1% of the ocean floor but are home to about a quarter of all sea species.",vi:"Rạn san hô chiếm chưa tới 1% đáy biển nhưng là nhà của khoảng một phần tư số loài sinh vật biển."}],
 a:["Miêu tả một con vật bằng 3 câu có mệnh đề quan hệ.","Đặt 5 câu hỏi Wh- về một con vật rồi tự trả lời.","Kể tên bộ phận cơ thể của một con chim và một con cá bằng tiếng Anh."],
 c:{q:"Which sentence is correct?",o:["The bird who sings is a robin.","The bird which sings is a robin.","The bird what sings is a robin.","The bird whose sings is a robin."],a:1,
  e:"Chim là con vật nên dùng which hoặc that, không dùng who hay what."}},
e15:{d:[{en:"Multi-word verbs can be separable: <i>turn the light off</i> or <i>turn off the light</i> are both correct.",vi:"Nhiều cụm động từ tách được: turn the light off và turn off the light đều đúng."},
 {en:"But with a pronoun the parts must split: <i>turn it off</i>, never <i>turn off it</i>.",vi:"Nhưng với đại từ thì bắt buộc tách: turn it off chứ không nói turn off it."},
 {en:"The wheel is often called the most important invention because almost every machine uses one.",vi:"Bánh xe thường được coi là phát minh quan trọng nhất vì gần như mọi cỗ máy đều dùng tới nó."}],
 a:["Chọn một đồ dùng trong nhà và kể lịch sử của nó bằng 3 câu quá khứ đơn.","Dự đoán 3 điều về năm 2050 bằng will.","Tìm 5 cụm động từ trên hướng dẫn sử dụng một thiết bị."],
 c:{q:"Which sentence is INCORRECT?",o:["Turn off the radio.","Turn the radio off.","Turn it off.","Turn off it."],a:3,
  e:"Với đại từ <i>it</i> thì phải tách cụm động từ: turn it off."}},
e16:{d:[{en:"<i>lend</i> and <i>borrow</i> go in opposite directions: the lender gives, the borrower takes.",vi:"lend và borrow ngược chiều nhau: người cho mượn là lend, người đi mượn là borrow."},
 {en:"<i>fewer</i> is for countable nouns and <i>less</i> is for uncountable: fewer coins, less money.",vi:"fewer cho danh từ đếm được, less cho không đếm được: fewer coins, less money."},
 {en:"<i>by myself</i> means alone; <i>I did it myself</i> emphasises that nobody helped.",vi:"by myself nghĩa là một mình; I did it myself nhấn mạnh không ai giúp."}],
 a:["Ghi lại số tiền con tiêu hôm nay và nói bằng tiếng Anh: I spent... I saved...","Tính giá sau khi giảm 20% cho một món và nói bằng tiếng Anh.","Đặt ba câu dùng myself, yourself, himself."],
 c:{q:"There is ______ traffic today than yesterday.",o:["fewer","less","few","many"],a:1,
  e:"traffic là danh từ không đếm được nên dùng less. fewer chỉ dùng cho danh từ đếm được."}},
e17:{d:[{en:"Compound nouns are usually stressed on the FIRST word: <b>FIRE</b>fighter, <b>BUS</b> driver.",vi:"Danh từ ghép thường nhấn vào từ ĐẦU: FIREfighter, BUS driver."},
 {en:"<i>say</i> has no person after it; <i>tell</i> must have one: <i>She said that... / She told me that...</i>",vi:"say không có tân ngữ người, tell bắt buộc có: She told me that..."},
 {en:"When you report a fact that is still true, you may keep the present tense: <i>He said he lives in Hue.</i>",vi:"Nếu sự việc vẫn đúng ở hiện tại, có thể giữ nguyên thì hiện tại khi tường thuật."}],
 a:["Phỏng vấn bố mẹ về công việc rồi tường thuật lại bằng 3 câu.","Kể 5 nghề nghiệp có hậu tố -er, -or, -ist.","Nói 3 phẩm chất con nghĩ mình có, dùng I am + tính từ."],
 c:{q:"Which sentence is correct?",o:["She told that she was tired.","She said me she was tired.","She told me she was tired.","She said to she was tired."],a:2,
  e:"tell bắt buộc đi kèm tân ngữ chỉ người: told me. say thì không có."}},
e18:{d:[{en:"A person can be both: <i>I was bored</i> (how I felt) and <i>I was boring</i> (I made others bored).",vi:"Người có thể mang cả hai: I was bored là tôi thấy chán; I was boring là tôi làm người khác chán."},
 {en:"<i>Although</i> starts a clause; <i>however</i> starts a new sentence and takes a comma after it.",vi:"Although mở đầu mệnh đề; however mở đầu câu mới và có dấu phẩy theo sau."},
 {en:"Lightning heats the air to about 30 000&deg;C, five times hotter than the surface of the Sun.",vi:"Tia sét nung không khí lên khoảng 30 000&deg;C, nóng gấp năm lần bề mặt Mặt Trời."}],
 a:["Miêu tả một cơn mưa bão bằng 3 câu có tính từ -ing và -ed.","Nối hai câu bằng although rồi bằng however, so sánh cách viết.","Kể tên 5 hiện tượng thiên nhiên bằng tiếng Anh."],
 c:{q:"&lsquo;The journey was ______ so we were all ______.&rsquo;",o:["tired / tiring","tiring / tired","tire / tired","tiring / tiring"],a:1,
  e:"Chuyến đi gây mệt nên dùng -ing; con người cảm thấy mệt nên dùng -ed."}},
e19:{d:[{en:"In the passive, the doer can be added with <b>by</b>, but only if it adds useful information.",vi:"Trong câu bị động, thêm by + người làm chỉ khi thông tin đó thực sự cần."},
 {en:"The first films had no sound at all, so actors had to show everything with their faces and bodies.",vi:"Phim đầu tiên hoàn toàn không có tiếng, nên diễn viên phải diễn tả mọi thứ bằng nét mặt và cơ thể."},
 {en:"Frequency adverbs can also start a sentence for emphasis: <i>Sometimes we watch films at home.</i>",vi:"Trạng từ tần suất có thể đứng đầu câu để nhấn mạnh: Sometimes we watch films at home."}],
 a:["Kể về một bộ phim bằng 3 câu bị động quá khứ.","Nói con thường làm gì vào cuối tuần, dùng 3 trạng từ tần suất khác nhau.","Viết một bài đánh giá phim ngắn 4 câu."],
 c:{q:"Rewrite in the passive: &lsquo;Someone stole the camera.&rsquo;",o:["The camera stole.","The camera was stolen.","The camera is stealing.","The camera were stolen."],a:1,
  e:"Tân ngữ thành chủ ngữ, dùng was + V3 (stolen). Không cần <i>by someone</i> vì không rõ ai."}},
e20:{d:[{en:"Indefinite pronouns take a singular verb even though they feel plural: <i>Everybody is ready.</i>",vi:"Đại từ bất định luôn đi với động từ số ít dù nghe như số nhiều: Everybody is ready."},
 {en:"Two or three adjectives is usually enough &mdash; too many makes writing heavy.",vi:"Hai ba tính từ là đủ; dùng quá nhiều làm câu văn nặng nề."},
 {en:"An orchestra has four families of instruments: strings, woodwind, brass and percussion.",vi:"Dàn nhạc có bốn nhóm nhạc cụ: dây, gỗ hơi, đồng hơi và gõ."}],
 a:["Miêu tả một bức tranh bằng 3 câu có ít nhất hai tính từ đúng thứ tự.","Kể tên 5 nhạc cụ bằng tiếng Anh và xếp vào nhóm.","Nói con đã học môn nghệ thuật nào bao lâu rồi, dùng <i>for</i> hoặc <i>since</i>."],
 c:{q:"Put in order: a ______ scarf.",o:["silk long red","long red silk","red long silk","silk red long"],a:1,
  e:"Thứ tự: kích thước (long) &rarr; màu (red) &rarr; chất liệu (silk)."}}
});
</script>

 {q:"A triangle has base 12 cm and height 5 cm. Its area is:", o:["17 cm&sup2;","30 cm&sup2;","60 cm&sup2;","34 cm&sup2;"], a:1, e:"(12 &times; 5) &divide; 2 = 30 cm&sup2;. Quên chia đôi là lỗi phổ biến nhất."},
 {q:"A square has a perimeter of 48 cm. What is its area?", o:["12 cm&sup2;","96 cm&sup2;","144 cm&sup2;","2304 cm&sup2;"], a:2, e:"Cạnh = 48 &divide; 4 = 12 cm, diện tích = 12 &times; 12 = 144 cm&sup2;."},
 {q:"An L-shape is made of a 6 cm by 4 cm rectangle and a 3 cm by 2 cm rectangle. Total area?", o:["24 cm&sup2;","30 cm&sup2;","6 cm&sup2;","18 cm&sup2;"], a:1, e:"Chia thành hai hình: 24 + 6 = 30 cm&sup2;."},
 {q:"A film starts at 18:55 and lasts 1 hour 25 minutes. When does it end?", o:["20:20","19:80","20:10","19:20"], a:0, e:"18:55 + 1 giờ = 19:55; thêm 25 phút: 19:55 + 5 = 20:00, còn 20 phút &rarr; 20:20."},
 {q:"15:40 on a 24-hour clock is:", o:["3:40 am","3:40 pm","5:40 pm","1:40 pm"], a:1, e:"15 &minus; 12 = 3, buổi chiều &rarr; 3:40 pm."},
 {q:"A train leaves at 09:38 and arrives at 11:15. How long is the journey?", o:["1 h 37 min","1 h 23 min","2 h 23 min","1 h 77 min"], a:0, e:"Từ 09:38 tới 10:00 là 22 phút, tới 11:00 thêm 1 giờ, rồi 15 phút nữa &rarr; 1 giờ 37 phút."},
 {q:"Two shapes both have an area of 36 cm&sup2;. What can you say about their perimeters?", o:["They must be equal","They can be different","They must be 36 cm","They must be 24 cm"], a:1, e:"Ví dụ 6&times;6 có chu vi 24 cm, còn 1&times;36 có chu vi 74 cm &mdash; cùng diện tích, khác chu vi."},
 {q:"How many minutes are there in 3 and a quarter hours?", o:["180","195","315","325"], a:1, e:"3 giờ = 180 phút, thêm 15 phút &rarr; 195 phút."}]},

"math:8":{ name:"Unit 8 test", vi:"Kiểm tra Unit 8: Cộng trừ (2)", mins:15, qs:[
 {q:"6.8 + 15.47 =", o:["21.55","22.27","21.27","83.47"], a:1, e:"Xếp thẳng hàng: 06.80 + 15.47 = 22.27."},
 {q:"30 &minus; 7.85 =", o:["22.15","23.15","22.25","23.25"], a:0, e:"Viết 30 thành 30.00 rồi trừ: 30.00 &minus; 7.85 = 22.15."},
 {q:"2/5 + 1/4 =", o:["3/9","13/20","3/20","7/20"], a:1, e:"Mẫu chung 20: 8/20 + 5/20 = 13/20."},
 {q:"7/8 &minus; 1/2 =", o:["6/6","3/8","1/4","6/8"], a:1, e:"1/2 = 4/8, nên 7/8 &minus; 4/8 = 3/8."},
 {q:"5/6 + 1/6 =", o:["6/12","1","5/36","2/6"], a:1, e:"Cùng mẫu nên cộng tử: 6/6 = 1."},
 {q:"Lan buys items costing $4.75 and $3.60. How much change from $10?", o:["$1.65","$2.65","$8.35","$1.75"], a:0, e:"Bước 1: 4.75 + 3.60 = 8.35. Bước 2: 10 &minus; 8.35 = $1.65."},
 {q:"What must you do before adding 1/3 and 2/7?", o:["Add the denominators","Find a common denominator","Multiply the fractions","Simplify 2/7"], a:1, e:"Bắt buộc quy đồng mẫu trước; mẫu chung ở đây là 21."},
 {q:"Estimate 19.7 + 8.15 first. About how much is it?", o:["About 12","About 28","About 100","About 2.8"], a:1, e:"Làm tròn: 20 + 8 = 28. Kết quả chính xác 27.85 rất sát."},
 {q:"9.05 &minus; 2.7 =", o:["6.35","7.35","6.98","6.25"], a:0, e:"Viết 2.7 thành 2.70 rồi trừ: 9.05 &minus; 2.70 = 6.35."},
 {q:"3/4 + 5/8 =", o:["8/12","11/8","1 3/8","Cả 11/8 và 1 3/8"], a:3, e:"3/4 = 6/8, nên 6/8 + 5/8 = 11/8 = 1 và 3/8. Hai cách viết đều đúng."}]},

"math:9":{ name:"Unit 9 test", vi:"Kiểm tra Unit 9: Xác suất", mins:12, qs:[
 {q:"What is the probability of rolling a number greater than 4 on a fair dice?", o:["1/6","1/3","1/2","2/3"], a:1, e:"Chỉ 5 và 6 thoả mãn &rarr; 2/6 = 1/3."},
 {q:"A bag has 5 red, 3 blue and 2 green balls. What is P(blue)?", o:["3/7","3/10","2/10","1/3"], a:1, e:"Tổng 10 quả, 3 quả xanh dương &rarr; 3/10. Mẫu số phải là TỔNG."},
 {q:"The probability of snow is 0.15. What is the probability of no snow?", o:["0.15","0.75","0.85","1.15"], a:2, e:"1 &minus; 0.15 = 0.85."},
 {q:"Which event is impossible?", o:["Rolling a 6","Rolling a 0 on a normal dice","Rain tomorrow","Picking a red ball"], a:1, e:"Xúc xắc thường không có mặt 0 nên xác suất bằng 0."},
 {q:"A coin lands tails four times in a row. What is P(tails) next?", o:["Less than 1/2","1/2","More than 1/2","1"], a:1, e:"Mỗi lần tung độc lập nên vẫn là 1/2. Đồng xu không nhớ kết quả cũ."},
 {q:"A spinner has 8 equal parts: 3 red, 4 blue, 1 yellow. Which colour is most likely?", o:["Red","Blue","Yellow","All equal"], a:1, e:"Xanh chiếm 4 trên 8 phần, nhiều nhất."},
 {q:"On that spinner, what is P(not yellow)?", o:["1/8","7/8","1/2","3/8"], a:1, e:"P(vàng) = 1/8 nên P(không vàng) = 1 &minus; 1/8 = 7/8."},
 {q:"Probability is always a number between:", o:["0 and 10","0 and 1","1 and 100","&minus;1 and 1"], a:1, e:"0 là không thể, 1 là chắc chắn; mọi xác suất nằm giữa hai mốc đó."},
 {q:"A dice is rolled 60 times. About how many times would you expect a 3?", o:["3","6","10","30"], a:2, e:"P(3) = 1/6 nên kỳ vọng 60 &divide; 6 = 10 lần."},
 {q:"Which describes an event with probability 0.5?", o:["Impossible","Unlikely","Even chance","Certain"], a:2, e:"0.5 nghĩa là khả năng xảy ra và không xảy ra ngang nhau."}]},

"math:10":{ name:"Unit 10 test", vi:"Kiểm tra Unit 10: Nhân chia (1)", mins:15, qs:[
 {q:"What is 46 &times; 32?", o:["1372","1472","1462","1572"], a:1, e:"46&times;30 = 1380 và 46&times;2 = 92; cộng lại 1472."},
 {q:"What is 384 &divide; 8?", o:["46","48","47","44"], a:1, e:"8 &times; 48 = 384. Kiểm tra bằng phép nhân ngược lại."},
 {q:"What is 275 &divide; 6?", o:["45 r 5","45 r 3","46 r 1","44 r 11"], a:0, e:"6 &times; 45 = 270, dư 5. Số dư 5 nhỏ hơn 6 nên hợp lệ; cách viết 44 dư 11 có số dư lớn hơn số chia nên sai."},
 {q:"Which number is divisible by 9?", o:["3627","3628","3629","3630"], a:0, e:"3+6+2+7 = 18 chia hết cho 9."},
 {q:"Which number is divisible by both 3 and 4?", o:["114","124","132","142"], a:2, e:"132: tổng chữ số 6 chia hết 3, và hai chữ số cuối 32 chia hết 4."},
 {q:"A quick way to multiply by 25 is:", o:["Multiply by 100 then divide by 4","Multiply by 5 twice then add","Divide by 4 then times 10","Add 25 each time"], a:0, e:"25 = 100 &divide; 4, nên nhân 100 rồi chia 4. Ví dụ 16&times;25 = 1600&divide;4 = 400."},
 {q:"Estimate 297 &times; 6.", o:["About 1200","About 1800","About 2400","About 180"], a:1, e:"Làm tròn 300 &times; 6 = 1800. Kết quả chính xác là 1782."},
 {q:"A box holds 24 pencils. How many boxes are needed for 300 pencils?", o:["12","12.5","13","14"], a:2, e:"300 &divide; 24 = 12 dư 12, nên vẫn cần thêm một hộp &rarr; 13 hộp. Phải làm tròn LÊN."},
 {q:"Which test shows 5 130 is divisible by 5?", o:["It is even","It ends in 0","The digits add to 9","It is bigger than 5000"], a:1, e:"Chia hết cho 5 khi tận cùng là 0 hoặc 5."},
 {q:"What is 1 in the remainder when 100 is divided by 7?", o:["2","1","3","0"], a:0, e:"7 &times; 14 = 98, còn dư 2."}]},

"math:11":{ name:"Unit 11 test", vi:"Kiểm tra Unit 11: Hình khối", mins:12, qs:[
 {q:"How many edges does a cube have?", o:["6","8","12","24"], a:2, e:"Lập phương có 12 cạnh, 6 mặt và 8 đỉnh."},
 {q:"A square-based pyramid has how many faces?", o:["4","5","6","8"], a:1, e:"Một mặt đáy vuông và bốn mặt tam giác &rarr; 5 mặt."},
 {q:"A net made of 6 squares folds into a:", o:["Cuboid","Cube","Pyramid","Cylinder"], a:1, e:"Sáu mặt vuông bằng nhau tạo thành hình lập phương."},
 {q:"A cuboid is 8 cm &times; 5 cm &times; 2 cm. Its volume is:", o:["15 cm&sup3;","40 cm&sup3;","80 cm&sup3;","80 cm&sup2;"], a:2, e:"8 &times; 5 &times; 2 = 80 cm&sup3;, đơn vị mũ ba."},
 {q:"A container of 3500 cm&sup3; holds how many litres?", o:["0.35","3.5","35","350"], a:1, e:"1000 cm&sup3; = 1 lít nên 3500 cm&sup3; = 3,5 lít."},
 {q:"Which solid has two circular faces and one curved surface?", o:["Cone","Cylinder","Sphere","Prism"], a:1, e:"Hình trụ có hai đáy tròn song song và một mặt cong."},
 {q:"Check with Euler's rule: a triangular prism has 5 faces and 6 vertices. How many edges?", o:["8","9","10","11"], a:1, e:"Mặt + đỉnh = cạnh + 2 &rarr; 5 + 6 = cạnh + 2 &rarr; 9 cạnh."},
 {q:"A cube has sides of 3 cm. If every side doubles to 6 cm, the volume becomes:", o:["2 times bigger","4 times bigger","6 times bigger","8 times bigger"], a:3, e:"27 cm&sup3; thành 216 cm&sup3;, gấp 8 lần vì cả ba chiều đều nhân đôi."},
 {q:"Which is measured in millilitres?", o:["Area","Capacity","Perimeter","Mass"], a:1, e:"Dung tích đo bằng ml và lít; khối lượng đo bằng g và kg."},
 {q:"A box 10 cm &times; 10 cm &times; 10 cm holds exactly:", o:["100 ml","1 litre","10 litres","1 ml"], a:1, e:"Thể tích 1000 cm&sup3; = 1000 ml = 1 lít."}]}
});

"math:12":{ name:"Unit 12 test", vi:"Kiểm tra Unit 12: Tỉ số và tỉ lệ", mins:12, qs:[
 {q:"Simplify the ratio 20 : 35.", o:["4 : 7","5 : 7","2 : 3","10 : 17"], a:0, e:"Chia hai vế cho ước chung lớn nhất là 5 &rarr; 4 : 7."},
 {q:"Share $72 in the ratio 5 : 4. What is the larger share?", o:["$32","$40","$45","$36"], a:1, e:"Tổng 9 phần, mỗi phần 72 &divide; 9 = 8. Phần lớn = 5 &times; 8 = $40."},
 {q:"In a class the ratio of girls to boys is 3 : 4. There are 28 pupils. How many girls?", o:["12","14","16","21"], a:0, e:"Tổng 7 phần, mỗi phần 28 &divide; 7 = 4. Số nữ = 3 &times; 4 = 12."},
 {q:"A recipe for 6 people uses 450 g of flour. How much for 4 people?", o:["200 g","300 g","350 g","675 g"], a:1, e:"Một người cần 450 &divide; 6 = 75 g; bốn người cần 300 g."},
 {q:"Squash is mixed with water in the ratio 1 : 5. How much squash makes 900 ml of drink?", o:["150 ml","180 ml","900 ml","112.5 ml"], a:0, e:"Tổng 6 phần, mỗi phần 900 &divide; 6 = 150 ml. Nước cốt là 1 phần. Bẫy là chia cho 5."},
 {q:"For every 4 apples there are 7 oranges. If there are 28 oranges, how many apples?", o:["12","16","14","21"], a:1, e:"28 &divide; 7 = 4 nhóm, mỗi nhóm 4 quả táo &rarr; 16."},
 {q:"7 pencils cost $2.80. What do 12 cost?", o:["$4.20","$4.80","$5.60","$3.36"], a:1, e:"Một bút giá 2.80 &divide; 7 = $0.40; 12 bút giá $4.80."},
 {q:"A map scale is 1 : 200. A path is 6 cm on the map. How long is it really?", o:["120 cm","1200 cm","206 cm","33 cm"], a:1, e:"6 &times; 200 = 1200 cm, tức 12 m."},
 {q:"Which ratio is equivalent to 3 : 8?", o:["6 : 24","9 : 24","12 : 30","6 : 11"], a:1, e:"Nhân cả hai vế với 3: 3 : 8 = 9 : 24."},
 {q:"In the ratio 2 : 3, what fraction of the whole is the first part?", o:["2/3","2/5","3/5","1/2"], a:1, e:"Tổng 5 phần, phần đầu là 2 phần &rarr; 2/5 của tổng. Tỉ số so phần với phần, phân số so phần với tổng."}]},

"math:13":{ name:"Unit 13 test", vi:"Kiểm tra Unit 13: Góc", mins:12, qs:[
 {q:"Two angles on a straight line are 128&deg; and x. What is x?", o:["42&deg;","52&deg;","62&deg;","232&deg;"], a:1, e:"Tổng bằng 180&deg; nên x = 180 &minus; 128 = 52&deg;."},
 {q:"A triangle has angles 43&deg; and 68&deg;. What is the third?", o:["69&deg;","79&deg;","89&deg;","111&deg;"], a:0, e:"180 &minus; (43 + 68) = 180 &minus; 111 = 69&deg;."},
 {q:"An angle of 156&deg; is:", o:["Acute","Right","Obtuse","Reflex"], a:2, e:"Từ 90&deg; đến dưới 180&deg; là góc tù."},
 {q:"Angles around a point add up to:", o:["90&deg;","180&deg;","270&deg;","360&deg;"], a:3, e:"Quanh một điểm là trọn một vòng: 360&deg;."},
 {q:"An isosceles triangle has one angle of 40&deg; between its two equal sides. What are the other two?", o:["40&deg; and 100&deg;","70&deg; and 70&deg;","50&deg; and 90&deg;","60&deg; and 80&deg;"], a:1, e:"Hai góc đáy bằng nhau: (180 &minus; 40) &divide; 2 = 70&deg; mỗi góc."},
 {q:"Three angles around a point are 90&deg;, 145&deg; and y. Find y.", o:["115&deg;","125&deg;","135&deg;","145&deg;"], a:1, e:"360 &minus; (90 + 145) = 125&deg;."},
 {q:"Which angle is acute?", o:["95&deg;","90&deg;","89&deg;","181&deg;"], a:2, e:"Góc nhọn là góc nhỏ hơn 90&deg;."},
 {q:"When measuring with a protractor you must line up:", o:["Any edge with any line","The centre with the vertex and zero with one arm","The 90&deg; mark with the vertex","The longest side only"], a:1, e:"Đặt tâm thước đo góc trùng đỉnh và vạch 0 trùng một cạnh, rồi đọc trên đúng thang."},
 {q:"Can a triangle have two right angles?", o:["Yes, always","No, because the angles would already total 180&deg; with nothing left","Yes, if it is large","Only if it is isosceles"], a:1, e:"Hai góc vuông đã hết 180&deg;, không còn cho góc thứ ba nên không thể."},
 {q:"An equilateral triangle has each angle equal to:", o:["45&deg;","60&deg;","90&deg;","120&deg;"], a:1, e:"Ba góc bằng nhau và tổng 180&deg; nên mỗi góc 60&deg;."}]},

"math:14":{ name:"Unit 14 test", vi:"Kiểm tra Unit 14: Nhân chia (2)", mins:15, qs:[
 {q:"3/4 &times; 2/5 =", o:["5/9","6/20","3/10","Cả 6/20 và 3/10"], a:3, e:"Nhân tử với tử, mẫu với mẫu: 6/20, rút gọn thành 3/10. Hai cách viết cùng giá trị."},
 {q:"What is 2/3 of 45?", o:["15","30","67.5","22.5"], a:1, e:"45 &divide; 3 = 15 rồi &times; 2 = 30."},
 {q:"1/3 &divide; 4 =", o:["4/3","1/12","3/4","1/7"], a:1, e:"Chia phân số cho số nguyên thì nhân mẫu lên: 1/3 &divide; 4 = 1/12."},
 {q:"0.7 &times; 0.8 =", o:["5.6","0.56","0.056","56"], a:1, e:"7 &times; 8 = 56; tổng hai chữ số thập phân nên kết quả 0.56."},
 {q:"1.2 &times; 0.4 =", o:["4.8","0.48","0.048","48"], a:1, e:"12 &times; 4 = 48; tổng hai chữ số thập phân &rarr; 0.48."},
 {q:"8.4 &divide; 4 =", o:["2.1","21","0.21","2.4"], a:0, e:"8 &divide; 4 = 2 và 0.4 &divide; 4 = 0.1, cộng lại 2.1."},
 {q:"Which calculation gives the BIGGEST answer?", o:["12 &times; 0.5","12 &divide; 0.5","12 &times; 0.1","12 &minus; 0.5"], a:1, e:"Chia cho 0.5 là hỏi có bao nhiêu nửa trong 12 &rarr; 24, lớn nhất."},
 {q:"7.5 &divide; 5 =", o:["1.5","15","0.15","2.5"], a:0, e:"7.5 &divide; 5 = 1.5. Kiểm tra ngược: 1.5 &times; 5 = 7.5."},
 {q:"Half of 3/4 is:", o:["3/2","3/8","1/4","6/4"], a:1, e:"Lấy một nửa nghĩa là nhân với 1/2: 3/4 &times; 1/2 = 3/8."},
 {q:"A ribbon 4.5 m long is cut into 6 equal pieces. How long is each?", o:["0.75 m","0.65 m","7.5 m","0.9 m"], a:0, e:"4.5 &divide; 6 = 0.75 m, tức 75 cm."}]},

"math:15":{ name:"Unit 15 test", vi:"Kiểm tra Unit 15: Số liệu", mins:12, qs:[
 {q:"Which chart best shows how many pupils like each of four sports?", o:["Line graph","Bar chart","Scatter graph","Frequency diagram"], a:1, e:"Bốn môn là các nhóm riêng biệt nên dùng biểu đồ cột."},
 {q:"In a waffle diagram, 35 shaded squares out of 100 means:", o:["35 people","35%","3.5%","35 squares only"], a:1, e:"Lưới 10 &times; 10 nên mỗi ô là 1%, 35 ô là 35%."},
 {q:"A pie chart shows 40% of 250 pupils walk to school. How many pupils?", o:["40","90","100","150"], a:2, e:"40% của 250 = 100 học sinh. Biểu đồ tròn cho tỉ lệ, phải nhân với tổng."},
 {q:"Which chart keeps every individual value visible?", o:["Pie chart","Dot plot","Waffle diagram","Bar chart"], a:1, e:"Biểu đồ chấm giữ từng số liệu nên vẫn tìm được mốt và khoảng biến thiên."},
 {q:"Which chart shows a relationship between height and shoe size?", o:["Pie chart","Line graph","Scatter graph","Waffle diagram"], a:2, e:"Biểu đồ phân tán vẽ hai đại lượng theo nhau để tìm mối liên hệ."},
 {q:"A line graph of temperature every hour is used because the data is:", o:["In groups","Continuous over time","Percentages","Random"], a:1, e:"Số liệu liên tục theo thời gian nên nối điểm được và thấy xu hướng."},
 {q:"A bar chart's vertical axis starts at 80 instead of 0. What is the risk?", o:["Nothing","Small differences look much bigger","The bars disappear","It saves ink"], a:1, e:"Trục không bắt đầu từ 0 khiến chênh lệch nhỏ trông rất lớn — luôn kiểm tra thang chia."},
 {q:"In a pie chart, a sector of 90&deg; represents what fraction of the total?", o:["1/2","1/3","1/4","1/8"], a:2, e:"90&deg; trên 360&deg; là một phần tư, tức 25%."},
 {q:"A frequency diagram differs from a bar chart because its bars:", o:["Have gaps","Touch each other, showing continuous data","Are always red","Show percentages"], a:1, e:"Cột dính nhau vì số liệu liên tục; biểu đồ cột cho nhóm rời rạc thì cột có khoảng cách."},
 {q:"On a dot plot, the value with the most dots is the:", o:["Mean","Median","Mode","Range"], a:2, e:"Giá trị có nhiều chấm nhất là giá trị xuất hiện nhiều nhất, tức mốt."}]},

"math:16":{ name:"Unit 16 test", vi:"Kiểm tra Unit 16: Quy tắc phép tính", mins:12, qs:[
 {q:"7 + 3 &times; 6 =", o:["60","25","36","46"], a:1, e:"Nhân trước: 18, rồi cộng 7 &rarr; 25."},
 {q:"(9 &minus; 4) &times; 5 =", o:["25","11","41","20"], a:0, e:"Ngoặc trước: 5, rồi 5 &times; 5 = 25."},
 {q:"24 &divide; (2 + 4) =", o:["16","4","12","8"], a:1, e:"Ngoặc trước: 6, rồi 24 &divide; 6 = 4."},
 {q:"Which pair are equal?", o:["10 &minus; 6 and 6 &minus; 10","20 &divide; 5 and 5 &divide; 20","8 &times; 3 and 3 &times; 8","12 &minus; 3 and 3 + 12"], a:2, e:"Chỉ phép nhân và cộng mới giao hoán."},
 {q:"Use the distributive law: 9 &times; 47 =", o:["9&times;40 + 9&times;7","9&times;40 &times; 9&times;7","9 + 40 + 7","47 &divide; 9"], a:0, e:"Tách 47 thành 40 + 7: 360 + 63 = 423."},
 {q:"Where do brackets go to make 5 + 3 &times; 4 = 32?", o:["(5 + 3) &times; 4","5 + (3 &times; 4)","(5 + 3 &times; 4)","No brackets"], a:0, e:"(5 + 3) &times; 4 = 8 &times; 4 = 32."},
 {q:"A quick way to work out 24 &times; 25 is:", o:["24 &times; 100 &divide; 4","24 + 25","24 &times; 20 + 5","25 &divide; 24"], a:0, e:"25 = 100 &divide; 4 nên 2400 &divide; 4 = 600."},

<script>
/* ---------- ÔN TẬP ĐỊNH KỲ: tuần, tháng, cả năm ---------- */
function qPool(pick){
  const out=[];
  SUBJ_IDS.forEach(k=>DATA[k].units.forEach(u=>{
    if(pick && !pick(u)) return;
    u.quiz.forEach(q=>out.push({q:q.q, o:q.o, a:q.a, e:q.e, u:u.id}));
  }));
  return out;
}
function testPool(){
  const out=[];
  Object.keys(TESTS).forEach(key=>{
    if(key.indexOf("review:")===0) return;
    TESTS[key].qs.forEach(q=>out.push({q:q.q, o:q.o, a:q.a, e:q.e, u:q.u}));
  });
  return out;
}
const studiedIn = (days)=> (u)=>{ const r=S.units[u.id]; return r && r.date && r.date >= dayAdd(-days); };
const studiedEver = (u)=> !!S.units[u.id];

function buildPeriodic(kind){
  let pool, n, mins, name, vi;
  if(kind==="week"){
    pool = qPool(studiedIn(7));
    if(pool.length < 15) pool = qPool(studiedEver);
    if(pool.length < 15) pool = qPool(null);
    n = 15; mins = 20; name = "Weekly review"; vi = "Ôn tuần &middot; những bài con vừa học";
  } else if(kind==="month"){
    pool = qPool(studiedIn(31));
    if(pool.length < 25) pool = qPool(studiedEver);
    if(pool.length < 25) pool = qPool(null);
    n = 25; mins = 35; name = "Monthly review"; vi = "Ôn tháng &middot; gộp mọi bài trong tháng";
  } else {
    pool = qPool(null).concat(testPool());
    n = 40; mins = 50; name = "End-of-year mock", vi = "Thi thử cả năm &middot; ba môn trộn lẫn";
  }
  const qs = shuffle(pool).slice(0, Math.min(n, pool.length));
  return {key:"review:"+kind, name, vi, mins, qs, back:"periodic"};
}
function vPeriodic(){
  ttl.textContent = "Ôn tập định kỳ";
  const rows=[
    ["week","&#128198;","Ôn tuần","15 câu &middot; 20 phút","Lấy từ những bài con đã học trong 7 ngày gần nhất. Làm mỗi cuối tuần để kiến thức không rơi."],
    ["month","&#128197;","Ôn tháng","25 câu &middot; 35 phút","Gộp mọi bài đã học trong tháng, ba môn trộn lẫn giống đề thật."],
    ["year","&#127942;","Thi thử cả năm","40 câu &middot; 50 phút","Rút từ toàn bộ 66 bài và 32 bài kiểm tra unit. Đây là bài giống kỳ Checkpoint nhất."]
  ];
  const daHoc = allUnits().filter(x=>S.units[x.u.id]).length;
  view.innerHTML = `<div class="stack" style="--ac:var(--esl); --ac-bg:var(--esl-bg)">
    <div><p class="eyebrow">Kiểm tra lại cho chắc</p>
      <h2 style="font-size:20px;margin-top:2px">Ôn tập định kỳ</h2>
      <p style="font-size:13.5px;color:var(--ink-soft);margin-top:7px">Đề tự sinh mới mỗi lần, không bao giờ trùng thứ tự.
      Con đã học <b>${daHoc}/${allUnits().length}</b> bài &mdash; đề chỉ hỏi những phần con đã học qua.</p></div>
    <div class="stack-s" id="l"></div>
    <div class="note">Ba bài này không cộng điểm thưởng. Chúng để con biết mình còn nhớ được bao nhiêu, chứ không phải để lấy điểm.</div></div>`;
  const l = view.querySelector('#l');
  rows.forEach(([kind,ic,t,meta,desc])=>{
    const r = (S.tests||{})["review:"+kind];
    const b = el(`<button class="unit"><div class="row" style="align-items:flex-start">
      <span style="font-size:20px">${ic}</span>
      <div style="flex:1"><h4>${t}</h4><p class="en">${meta}</p>
        <p class="en" style="margin-top:5px;line-height:1.5">${desc}</p></div>
      ${r?`<span class="pill on mono">${r.best}%</span>`:`<span class="pill">Chưa làm</span>`}</div></button>`);
    b.onclick=()=>{
      const paper = buildPeriodic(kind);
      if(!paper.qs.length){ alert("Con cần học ít nhất một bài trước đã nhé."); return; }
      go("exam",{k:"esl", bu:0, paper, n:0, ans:new Array(paper.qs.length).fill(null),
        endAt:Date.now()+paper.mins*60000});
    };
    l.appendChild(b);
  });
}

      <p style="font-size:44px;margin-bottom:6px">&#128274;</p>
      <h2 style="font-size:20px">Nhập mật mã của gia đình</h2>
      <p style="font-size:13.5px;color:var(--ink-soft);margin-top:6px">Bố mẹ đã đặt mật mã cho app này.</p>
      <input class="pin" id="p" type="tel" inputmode="numeric" maxlength="4" placeholder="- - - -" autocomplete="off" style="margin-top:16px">
      <p id="err" style="font-size:13px;color:var(--bad);margin-top:9px;min-height:18px"></p>
      <button class="btn" id="ok">Mở khoá</button></div></div>`;
  const inp=view.querySelector('#p'), err=view.querySelector('#err');
  inp.focus();
  const submit=()=>{
    if(inp.value.trim()!==S.appPin){ err.textContent="Sai mật mã. Thử lại nhé."; inp.value=""; inp.focus(); return; }
    UNLOCKED = true;
    go(S.role ? (S.role==="admin"?"admin":"home") : "login");
  };
  view.querySelector('#ok').onclick=submit;
  inp.onkeydown=(e)=>{ if(e.key==="Enter") submit(); };
}
</script>

<script>
/* Tách thành một bài cho mỗi mục nhỏ trong sách — đợt Toán */
DATA.math.units.push(
{ id:"m22", subject:"math", t:"Rounding decimal numbers", vi:"Làm tròn số thập phân",
  kp:[
    {en:"To round, look ONLY at the digit immediately after the place you are rounding to.", vi:"Làm tròn thì chỉ nhìn chữ số NGAY SAU vị trí cần làm tròn."},
    {en:"If that digit is 5 or more, round up. If it is 4 or less, keep the digit the same.", vi:"Chữ số đó từ 5 trở lên thì tăng thêm 1; từ 4 trở xuống thì giữ nguyên."},
    {en:"Never round twice. 4.348 to 1 d.p. is 4.3, not 4.4.", vi:"Không làm tròn hai lần. 4.348 làm tròn 1 chữ số thập phân ra 4.3 chứ không phải 4.4."},
    {en:"Rounding up can change more than one digit: 2.97 to 1 d.p. becomes 3.0.", vi:"Làm tròn lên có thể đổi nhiều chữ số: 2.97 thành 3.0."},
    {en:"Keep the zero: 4.50 to 2 d.p. is written 4.50, not 4.5, when the question asks for 2 decimal places.", vi:"Đề hỏi 2 chữ số thập phân thì phải giữ số 0 ở cuối: viết 4.50."},
    {en:"Working backwards: a number that rounds to 6.5 lies from 6.45 up to just below 6.55.", vi:"Bài ngược: số làm tròn thành 6.5 nằm từ 6.45 đến dưới 6.55."}],
  voc:[["round up","làm tròn lên"],["round down","làm tròn xuống"],["decimal place","chữ số thập phân"],["nearest whole number","số nguyên gần nhất"],["nearest tenth","phần mười gần nhất"],["approximate","xấp xỉ"],["accurate","chính xác"],["estimate","ước lượng"]],
  quiz:[
    {q:"Round 7.264 to one decimal place.", o:["7.2","7.3","7.26","7.0"], a:1, e:"Chữ số sau phần mười là 6 (&ge;5) nên tăng 2 lên 3 &rarr; 7.3."},
    {q:"Round 7.264 to two decimal places.", o:["7.26","7.27","7.2","7.3"], a:0, e:"Chữ số thứ ba là 4 (<5) nên giữ nguyên &rarr; 7.26."},
    {q:"Round 2.97 to one decimal place.", o:["2.9","2.10","3.0","2.0"], a:2, e:"9 tăng lên thành 10 nên nhớ sang hàng đơn vị: 2.97 &rarr; 3.0."},
    {q:"Round 4.348 to one decimal place.", o:["4.3","4.4","4.35","4.0"], a:0, e:"Nhìn thẳng chữ số hàng phần trăm là 4 nên giữ nguyên. Làm tròn hai lần (4.35 rồi 4.4) là sai."},
    {q:"A number rounds to 3.8 to one decimal place. What is the smallest it could be?", o:["3.7","3.75","3.79","3.8"], a:1, e:"3.75 là số nhỏ nhất làm tròn lên thành 3.8."},
    {q:"Round 0.0649 to two decimal places.", o:["0.06","0.07","0.065","0.1"], a:0, e:"Chữ số thứ ba là 4 (<5) nên giữ nguyên &rarr; 0.06."}]},

{ id:"m23", subject:"math", t:"Common multiples and factors", vi:"Bội chung và ước chung",
  kp:[
    {en:"A common factor divides exactly into BOTH numbers. A common multiple is in the times table of both.", vi:"Ước chung chia hết cả HAI số; bội chung có trong bảng nhân của cả hai."},
    {en:"To find the HCF, list the factors of each number and pick the biggest one they share.", vi:"Tìm ƯCLN: liệt kê ước của từng số rồi chọn số chung lớn nhất."},
    {en:"To find the LCM, count up in each number until you meet the first shared value.", vi:"Tìm BCNN: đếm theo từng số cho tới khi gặp giá trị chung đầu tiên."},
    {en:"Two numbers with no common factor except 1 are called co-prime, like 8 and 9.", vi:"Hai số chỉ có ước chung là 1 gọi là nguyên tố cùng nhau, ví dụ 8 và 9."},
    {en:"The HCF is used to simplify fractions; the LCM is used to find a common denominator.", vi:"ƯCLN dùng để rút gọn phân số; BCNN dùng để quy đồng mẫu số."},
    {en:"If one number divides into the other, the smaller IS the HCF: HCF of 6 and 18 is 6.", vi:"Nếu số này chia hết số kia thì số nhỏ chính là ƯCLN: ƯCLN của 6 và 18 là 6."}],
  voc:[["common factor","ước chung"],["common multiple","bội chung"],["highest common factor","ước chung lớn nhất"],["lowest common multiple","bội chung nhỏ nhất"],["co-prime","nguyên tố cùng nhau"],["divides exactly","chia hết"],["times table","bảng nhân"],["simplify","rút gọn"]],
  quiz:[
    {q:"What is the highest common factor of 20 and 30?", o:["5","10","2","60"], a:1, e:"Ước chung của 20 và 30 là 1, 2, 5, 10; lớn nhất là 10."},
    {q:"What is the lowest common multiple of 4 and 10?", o:["2","14","20","40"], a:2, e:"Bội của 4: 4, 8, 12, 16, 20... Bội của 10: 10, 20... Chung nhỏ nhất là 20."},
    {q:"What is the HCF of 7 and 12?", o:["1","7","12","84"], a:0, e:"7 là số nguyên tố và không chia hết 12, nên ước chung duy nhất là 1 — hai số nguyên tố cùng nhau."},
    {q:"Use the HCF to simplify 30/45.", o:["6/9","10/15","2/3","3/4"], a:2, e:"ƯCLN của 30 và 45 là 15: 30&divide;15 = 2, 45&divide;15 = 3 &rarr; 2/3."},
    {q:"Two bells ring every 6 and 8 minutes. After how many minutes do they ring together?", o:["14","24","48","2"], a:1, e:"Đây là bài tìm BCNN: bội chung nhỏ nhất của 6 và 8 là 24 phút."},
    {q:"What is the HCF of 9 and 27?", o:["3","9","27","1"], a:1, e:"9 chia hết 27 nên số nhỏ chính là ƯCLN."}]},

{ id:"m24", subject:"math", t:"Using letters to represent numbers", vi:"Dùng chữ thay cho số",
  kp:[
    {en:"A letter stands for a number we do not know yet. It is called a variable.", vi:"Chữ cái thay cho số chưa biết, gọi là ẩn số hay biến."},
    {en:"Write 3n, not 3 &times; n. Write n/2, not n &divide; 2, when writing expressions.", vi:"Viết 3n chứ không viết 3 &times; n; viết n/2 thay cho n &divide; 2."},
    {en:"An expression has no equals sign (3n + 2). An equation does (3n + 2 = 14).", vi:"Biểu thức không có dấu bằng; phương trình thì có."},
    {en:"To substitute, replace the letter with its value and follow the order of operations.", vi:"Thay số vào thì thay chữ bằng giá trị rồi tính theo đúng thứ tự phép tính."},
    {en:"To solve, do the opposite operation to BOTH sides until the letter is alone.", vi:"Giải phương trình: làm phép ngược ở CẢ HAI vế cho tới khi ẩn đứng một mình."},
    {en:"Turn words into algebra: &lsquo;five more than twice a number&rsquo; is 2n + 5.", vi:"Đổi lời văn sang đại số: &lsquo;hơn hai lần một số 5 đơn vị&rsquo; là 2n + 5."}],
  voc:[["variable","biến, ẩn số"],["expression","biểu thức"],["equation","phương trình"],["substitute","thay số vào"],["solve","giải"],["inverse operation","phép tính ngược"],["term","hạng tử"],["unknown","số chưa biết"]],
  quiz:[
    {q:"If n = 9, what is 4n &minus; 6?", o:["30","36","42","24"], a:0, e:"4 &times; 9 = 36, trừ 6 &rarr; 30."},
    {q:"Which is written correctly?", o:["3 &times; n","n3","3n","n &times; 3 only"], a:2, e:"Trong đại số viết liền hệ số trước chữ: 3n."},
    {q:"Solve 6n + 5 = 41.", o:["n = 6","n = 7","n = 36","n = 46"], a:0, e:"Trừ 5 hai vế: 6n = 36; chia 6: n = 6."},
    {q:"Which is an equation, not an expression?", o:["5n + 2","n &minus; 7","2n = 10","3n"], a:2, e:"Chỉ 2n = 10 có dấu bằng nên là phương trình."},
    {q:"&lsquo;Three less than a number&rsquo; is written as:", o:["3 &minus; n","n &minus; 3","3n","n/3"], a:1, e:"&lsquo;Kém một số 3 đơn vị&rsquo; là n &minus; 3. Chú ý thứ tự, 3 &minus; n là phép khác."},
    {q:"If a = 4 and b = 5, what is 2a + 3b?", o:["23","27","35","17"], a:0, e:"2&times;4 = 8 và 3&times;5 = 15; cộng lại 23."}]},

{ id:"m25", subject:"math", t:"Circles", vi:"Hình tròn",
  kp:[
    {en:"The centre is the middle point. The radius goes from the centre to the edge.", vi:"Tâm là điểm chính giữa; bán kính đi từ tâm ra mép."},
    {en:"The diameter goes right across through the centre. Diameter = 2 &times; radius.", vi:"Đường kính đi ngang qua tâm; đường kính = 2 &times; bán kính."},
    {en:"The circumference is the distance all the way round the circle.", vi:"Chu vi hình tròn là độ dài đường bao quanh."},
    {en:"The circumference is always about 3.14 times the diameter, whatever the size of the circle.", vi:"Chu vi luôn gấp khoảng 3,14 lần đường kính, dù hình tròn to hay nhỏ."},
    {en:"A chord joins two points on the edge; an arc is part of the circumference.", vi:"Dây cung nối hai điểm trên đường tròn; cung là một phần của chu vi."},
    {en:"Every circle has infinitely many lines of symmetry, all passing through the centre.", vi:"Hình tròn có vô số trục đối xứng, tất cả đều đi qua tâm."}],
  voc:[["centre","tâm"],["radius","bán kính"],["diameter","đường kính"],["circumference","chu vi hình tròn"],["chord","dây cung"],["arc","cung tròn"],["compasses","com-pa"],["semicircle","nửa hình tròn"]],
  quiz:[
    {q:"A circle has a radius of 6 cm. What is its diameter?", o:["3 cm","6 cm","12 cm","36 cm"], a:2, e:"Đường kính gấp đôi bán kính: 6 &times; 2 = 12 cm."},
    {q:"A circle has a diameter of 30 cm. What is its radius?", o:["15 cm","30 cm","60 cm","10 cm"], a:0, e:"Bán kính bằng nửa đường kính: 30 &divide; 2 = 15 cm."},
    {q:"A circle has a diameter of 10 cm. Its circumference is about:", o:["10 cm","20 cm","31 cm","100 cm"], a:2, e:"Chu vi &asymp; 3,14 &times; 10 = 31 cm."},
    {q:"What is a chord?", o:["A line from the centre to the edge","A line joining two points on the edge","The distance round the circle","The middle point"], a:1, e:"Dây cung nối hai điểm trên đường tròn; nếu đi qua tâm thì thành đường kính."},
    {q:"How many lines of symmetry does a circle have?", o:["1","2","4","Infinitely many"], a:3, e:"Mọi đường thẳng qua tâm đều chia hình tròn thành hai nửa khớp nhau."},
    {q:"To draw a circle of radius 5 cm you set your compasses to:", o:["10 cm","5 cm","2.5 cm","3.14 cm"], a:1, e:"Khẩu độ com-pa chính bằng bán kính cần vẽ."}]}
);
</script>

<script>
DATA.math.units.push(
{ id:"m26", subject:"math", t:"Rotational symmetry", vi:"Đối xứng quay",
  kp:[
    {en:"A shape has rotational symmetry if it looks exactly the same after being turned less than a full circle.", vi:"Hình có đối xứng quay nếu quay chưa hết một vòng mà đã trông giống hệt ban đầu."},
    {en:"The ORDER is how many times it looks the same during one full turn.", vi:"BẬC đối xứng quay là số lần hình trông giống ban đầu trong một vòng quay."},
    {en:"Order 1 means no rotational symmetry at all &mdash; it only matches when back at the start.", vi:"Bậc 1 nghĩa là KHÔNG có đối xứng quay, vì chỉ khớp khi quay về đúng chỗ cũ."},
    {en:"Square: order 4. Equilateral triangle: order 3. Rectangle and rhombus: order 2.", vi:"Hình vuông bậc 4; tam giác đều bậc 3; chữ nhật và hình thoi bậc 2."},
    {en:"The angle of turn between matches is 360&deg; divided by the order.", vi:"Góc quay giữa hai lần khớp bằng 360&deg; chia cho bậc."},
    {en:"Rotational symmetry is different from line symmetry. A shape can have one without the other.", vi:"Đối xứng quay khác đối xứng trục; một hình có thể có cái này mà không có cái kia."}],
  voc:[["rotational symmetry","đối xứng quay"],["order","bậc"],["full turn","một vòng quay"],["line of symmetry","trục đối xứng"],["centre of rotation","tâm quay"],["clockwise","theo chiều kim đồng hồ"],["match","khớp, trùng khít"],["regular polygon","đa giác đều"]],
  quiz:[
    {q:"What is the order of rotational symmetry of a square?", o:["1","2","4","8"], a:2, e:"Quay một vòng thì bốn lần trông giống ban đầu, mỗi lần 90&deg;."},
    {q:"A shape has rotational symmetry of order 1. What does that mean?", o:["It turns once","It has no rotational symmetry","It has one line of symmetry","It is a circle"], a:1, e:"Bậc 1 nghĩa là chỉ khớp khi đã quay trọn vòng, tức không có đối xứng quay."},
    {q:"What is the order of rotational symmetry of an equilateral triangle?", o:["1","2","3","6"], a:2, e:"Ba lần khớp trong một vòng, mỗi lần 120&deg;."},
    {q:"A shape has rotational symmetry of order 6. What angle turns it to the next match?", o:["30&deg;","60&deg;","90&deg;","120&deg;"], a:1, e:"360 &divide; 6 = 60&deg;."},
    {q:"Which shape has rotational symmetry of order 2 but NO right angles?", o:["Square","Rectangle","Rhombus","Kite"], a:2, e:"Hình thoi quay 180&deg; là trùng khít nhưng các góc không vuông."},
    {q:"A regular pentagon has rotational symmetry of order:", o:["2","4","5","10"], a:2, e:"Đa giác đều n cạnh có bậc đối xứng quay bằng n, nên ngũ giác đều là bậc 5."}]},

{ id:"m27", subject:"math", t:"Percentages", vi:"Phần trăm",
  kp:[
    {en:"Per cent means &lsquo;out of 100&rsquo;. 40% means 40 out of every 100.", vi:"Phần trăm nghĩa là &lsquo;trên 100&rsquo;: 40% là 40 phần trong 100."},
    {en:"Quick keys: 50% = &divide;2, 25% = &divide;4, 10% = &divide;10, 1% = &divide;100.", vi:"Mốc tính nhanh: 50% chia 2, 25% chia 4, 10% chia 10, 1% chia 100."},
    {en:"Build any percentage from these: 35% = 25% + 10%; 15% = 10% + 5%.", vi:"Ghép các mốc lại để ra phần trăm bất kỳ: 35% = 25% + 10%."},
    {en:"To find a percentage of an amount, work out 10% first, then scale it.", vi:"Tính phần trăm của một số: tính 10% trước rồi nhân lên."},
    {en:"A discount question has two steps: find the amount off, then subtract it from the original price.", vi:"Bài giảm giá có hai bước: tính số tiền giảm, rồi trừ khỏi giá gốc."},
    {en:"To go backwards from a part to the whole: if 20% is 30, then 10% is 15 and 100% is 150.", vi:"Từ phần suy ngược ra tổng: 20% là 30 thì 10% là 15 và 100% là 150."}],
  voc:[["per cent","phần trăm"],["discount","giảm giá"],["increase","tăng"],["decrease","giảm"],["original price","giá gốc"],["sale price","giá bán sau giảm"],["profit","lợi nhuận"],["interest","lãi"]],
  quiz:[
    {q:"What is 45% of 200?", o:["45","80","90","110"], a:2, e:"10% của 200 là 20, nên 40% = 80; 5% = 10. Cộng lại 90."},
    {q:"What is 15% of 60?", o:["6","9","12","15"], a:1, e:"10% là 6 và 5% là 3, cộng lại 9."},
    {q:"A jacket costs $80 with 25% off. What do you pay?", o:["$20","$55","$60","$75"], a:2, e:"25% của 80 = 20 là số tiền giảm; phải trả 80 &minus; 20 = $60."},
    {q:"25% of a number is 18. What is the number?", o:["4.5","36","72","90"], a:2, e:"25% là một phần tư nên số đó gấp 4 lần: 18 &times; 4 = 72."},
    {q:"A price rises by 10% then falls by 10%. Compared with the start it is:", o:["The same","1% lower","1% higher","10% lower"], a:1, e:"100 &rarr; 110 &rarr; 99. Giảm 10% của 110 là 11 chứ không phải 10."},
    {q:"Which is the same as 3/4?", o:["34%","43%","75%","0.34"], a:2, e:"3 &divide; 4 = 0.75, nhân 100 ra 75%."}]},

{ id:"m28", subject:"math", t:"Equivalence and comparison", vi:"Quy đổi và so sánh phân số, thập phân, phần trăm",
  kp:[
    {en:"Learn the key set by heart: 1/2 = 0.5 = 50%, 1/4 = 0.25 = 25%, 1/5 = 0.2 = 20%, 1/8 = 0.125.", vi:"Học thuộc bộ quy đổi này, đề Checkpoint dùng liên tục."},
    {en:"Fraction to decimal: divide the top by the bottom. Decimal to percentage: multiply by 100.", vi:"Phân số sang thập phân: tử chia mẫu. Thập phân sang phần trăm: nhân 100."},
    {en:"To compare different forms, change them all into decimals first &mdash; then it is easy.", vi:"Muốn so sánh các dạng khác nhau, đổi hết về số thập phân trước là dễ nhất."},
    {en:"To compare two fractions quickly, cross-multiply: for 3/5 and 5/8, compare 24 with 25.", vi:"So sánh nhanh hai phân số bằng nhân chéo: 3/5 và 5/8 &rarr; 24 và 25."},
    {en:"Equivalent fractions come from multiplying or dividing top AND bottom by the same number.", vi:"Phân số bằng nhau: nhân hoặc chia cả tử và mẫu cho cùng một số."},
    {en:"A longer decimal is not always bigger: 0.5 is greater than 0.45.", vi:"Số thập phân dài hơn chưa chắc lớn hơn: 0.5 > 0.45."}],
  voc:[["equivalent","tương đương"],["convert","đổi dạng"],["compare","so sánh"],["ascending order","thứ tự tăng dần"],["descending order","thứ tự giảm dần"],["numerator","tử số"],["denominator","mẫu số"],["simplest form","dạng rút gọn nhất"]],
  quiz:[
    {q:"Which is the largest?", o:["0.6","3/5","62%","5/8"], a:3, e:"Đổi hết ra thập phân: 0.6, 0.6, 0.62, 0.625 &rarr; 5/8 lớn nhất."},
    {q:"Write 3/8 as a percentage.", o:["3.8%","37.5%","38%","83%"], a:1, e:"3 &divide; 8 = 0.375, nhân 100 ra 37,5%."},
    {q:"Which is bigger: 2/5 or 0.45?", o:["2/5","0.45","Equal","Cannot tell"], a:1, e:"2/5 = 0.4, nhỏ hơn 0.45."},
    {q:"Put in order, smallest first: 0.7, 68%, 3/4.", o:["0.7, 68%, 3/4","68%, 0.7, 3/4","3/4, 0.7, 68%","68%, 3/4, 0.7"], a:1, e:"Đổi ra thập phân: 0.68, 0.7, 0.75."},
    {q:"Which fraction is equivalent to 0.25?", o:["1/4","1/25","2/5","25/10"], a:0, e:"0.25 = 25/100, rút gọn thành 1/4."},
    {q:"Which pair are equal?", o:["1/3 and 0.3","2/3 and 66%","1/8 and 0.125","3/5 and 35%"], a:2, e:"1 &divide; 8 = 0.125 chính xác. 1/3 và 2/3 là số thập phân vô hạn nên không bằng 0.3 hay 66%."}]},

{ id:"m29", subject:"math", t:"Adding and subtracting fractions", vi:"Cộng trừ phân số",
  kp:[
    {en:"Fractions can only be added or subtracted when the denominators are the SAME.", vi:"Chỉ cộng trừ được phân số khi mẫu số GIỐNG NHAU."},
    {en:"Find a common denominator using the lowest common multiple of the two denominators.", vi:"Tìm mẫu chung bằng bội chung nhỏ nhất của hai mẫu."},
    {en:"Change both fractions, then add or subtract ONLY the numerators.", vi:"Đổi cả hai phân số rồi chỉ cộng trừ TỬ SỐ."},
    {en:"Never add the denominators. 1/4 + 1/3 is 7/12, not 2/7.", vi:"Không bao giờ cộng mẫu với mẫu. 1/4 + 1/3 = 7/12."},
    {en:"If one denominator divides into the other, use the bigger one: for 1/2 and 3/8, use eighths.", vi:"Nếu mẫu này chia hết mẫu kia thì lấy mẫu lớn làm mẫu chung."},
    {en:"Simplify the answer at the end, and turn a top-heavy fraction into a mixed number if asked.", vi:"Rút gọn kết quả ở bước cuối, và đổi phân số lớn hơn 1 thành hỗn số khi đề yêu cầu."}],
  voc:[["common denominator","mẫu số chung"],["lowest common multiple","bội chung nhỏ nhất"],["numerator","tử số"],["mixed number","hỗn số"],["improper fraction","phân số lớn hơn 1"],["simplify","rút gọn"],["equivalent fraction","phân số bằng nhau"],["whole","đơn vị, một phần nguyên"]],
  quiz:[

    {q:"1/2 + 3/8 =", o:["4/10","7/8","4/8","5/8"], a:1, e:"2 chia hết 8 nên lấy mẫu 8: 4/8 + 3/8 = 7/8."},
    {q:"3/4 + 5/8 =", o:["8/12","11/8","1 3/8","Cả 11/8 và 1 3/8"], a:3, e:"3/4 = 6/8 nên 6/8 + 5/8 = 11/8 = 1 và 3/8; hai cách viết cùng giá trị."},
    {q:"2/5 + 1/4 =", o:["3/9","13/20","3/20","7/20"], a:1, e:"Mẫu chung 20: 8/20 + 5/20 = 13/20."},
    {q:"What must you do BEFORE adding 1/3 and 2/7?", o:["Add the denominators","Find a common denominator","Multiply the fractions","Simplify 2/7"], a:1, e:"Phải quy đồng mẫu trước; mẫu chung ở đây là 21."}]}

</script>

<script>
DATA.math.units.push(
{ id:"m30", subject:"math", t:"Division", vi:"Phép chia",
  kp:[
    {en:"Division shares a number into equal groups, or asks how many groups fit inside.", vi:"Phép chia là chia đều thành các nhóm, hoặc hỏi bên trong chứa được bao nhiêu nhóm."},
    {en:"Check every division with multiplication: if 96 &divide; 8 = 12, then 12 &times; 8 must be 96.", vi:"Luôn kiểm tra phép chia bằng phép nhân ngược lại."},
    {en:"The remainder must always be SMALLER than the divisor.", vi:"Số dư luôn phải NHỎ HƠN số chia."},
    {en:"A remainder can be written three ways: 25 &divide; 4 = 6 r 1, or 6 &frac14;, or 6.25.", vi:"Số dư viết được ba cách: 6 dư 1, hỗn số 6 và 1/4, hoặc 6.25."},
    {en:"Read the question to decide what to do with the remainder: round UP for &lsquo;how many buses&rsquo;, round DOWN for &lsquo;how many full boxes&rsquo;.", vi:"Đọc kỹ đề để xử lý số dư: cần bao nhiêu xe thì làm tròn LÊN, được bao nhiêu hộp đầy thì làm tròn XUỐNG."},
    {en:"Divide by 10, 100 or 1000 by moving the digits right by one, two or three places.", vi:"Chia 10, 100, 1000 thì dịch các chữ số sang phải một, hai, ba cột."}],
  voc:[["divide","chia"],["divisor","số chia"],["dividend","số bị chia"],["quotient","thương"],["remainder","số dư"],["share equally","chia đều"],["exactly","vừa hết, không dư"],["round up","làm tròn lên"]],
  quiz:[
    {q:"What is 456 &divide; 8?", o:["57","56","58","64"], a:0, e:"8 &times; 57 = 456. Kiểm tra ngược lại là chắc chắn nhất."},
    {q:"What is 275 &divide; 6?", o:["45 r 5","45 r 3","46 r 1","44 r 11"], a:0, e:"6 &times; 45 = 270, dư 5. Cách viết 44 dư 11 sai vì số dư lớn hơn số chia 6."},
    {q:"A bus holds 45 people. How many buses for 200 people?", o:["4","4.4","5","6"], a:2, e:"200 &divide; 45 = 4 dư 20, vẫn cần thêm một xe cho 20 người &rarr; 5 xe."},

    {q:"25 &divide; 4 written as a decimal is:", o:["6.1","6.25","6.4","6.5"], a:1, e:"Dư 1 trên 4 là 0.25, nên kết quả là 6.25."},
    {q:"0.6 &divide; 100 =", o:["0.06","0.006","6","60"], a:1, e:"Chia 100 thì dịch hai cột sang phải: 0.6 &rarr; 0.06 &rarr; 0.006."}]},

{ id:"m31", subject:"math", t:"Capacity and volume", vi:"Dung tích và thể tích",
  kp:[
    {en:"Volume is the space a solid takes up. Capacity is how much a container can hold.", vi:"Thể tích là phần không gian vật chiếm; dung tích là lượng chứa được bên trong."},
    {en:"Volume of a cuboid = length &times; width &times; height, in cm&sup3; or m&sup3;.", vi:"Thể tích hình hộp chữ nhật = dài &times; rộng &times; cao, đơn vị mũ ba."},
    {en:"1 cm&sup3; holds exactly 1 ml, so 1000 cm&sup3; = 1000 ml = 1 litre.", vi:"1 cm&sup3; chứa đúng 1 ml, nên 1000 cm&sup3; = 1 lít."},
    {en:"Volume of any prism = area of the cross-section &times; length.", vi:"Thể tích mọi lăng trụ = diện tích mặt cắt &times; chiều dài."},
    {en:"Count cubes to find volume of a solid built from unit cubes, including hidden ones.", vi:"Đếm khối lập phương để tính thể tích, nhớ đếm cả những khối bị che khuất."},
    {en:"Doubling every side of a cube makes the volume 8 times bigger, not 2 times.", vi:"Gấp đôi mọi cạnh thì thể tích gấp 8 lần chứ không phải 2 lần."}],
  voc:[["volume","thể tích"],["capacity","dung tích"],["cuboid","hình hộp chữ nhật"],["cubic centimetre","xăng-ti-mét khối"],["litre / millilitre","lít / mi-li-lít"],["cross-section","mặt cắt"],["container","vật chứa"],["unit cube","khối lập phương đơn vị"]],
  quiz:[
    {q:"A cuboid is 7 cm &times; 4 cm &times; 3 cm. Its volume is:", o:["14 cm&sup3;","84 cm&sup3;","84 cm&sup2;","28 cm&sup3;"], a:1, e:"7 &times; 4 &times; 3 = 84, đơn vị cm&sup3;."},
    {q:"A container of 2500 cm&sup3; holds how many litres?", o:["0.25","2.5","25","250"], a:1, e:"1000 cm&sup3; = 1 lít nên 2500 cm&sup3; = 2,5 lít."},
    {q:"A box 10 cm &times; 10 cm &times; 10 cm holds exactly:", o:["100 ml","1 litre","10 litres","1 ml"], a:1, e:"Thể tích 1000 cm&sup3; = 1000 ml = 1 lít."},
    {q:"What is the difference between volume and capacity?", o:["They are the same","Volume is space taken up; capacity is how much fits inside","Volume uses litres only","Capacity uses cm&sup3; only"], a:1, e:"Một khối gỗ đặc có thể tích nhưng không có dung tích vì không chứa được gì."},
    {q:"A prism has a cross-section of area 12 cm&sup2; and length 5 cm. Its volume is:", o:["17 cm&sup3;","60 cm&sup3;","60 cm&sup2;","2.4 cm&sup3;"], a:1, e:"Diện tích mặt cắt &times; chiều dài = 12 &times; 5 = 60 cm&sup3;."},
    {q:"A cube of side 2 cm has every side doubled to 4 cm. The volume becomes:", o:["2 times bigger","4 times bigger","8 times bigger","16 times bigger"], a:2, e:"8 cm&sup3; thành 64 cm&sup3; vì cả ba chiều đều nhân đôi."}]},

{ id:"m32", subject:"math", t:"Direct proportion", vi:"Tỉ lệ thuận",
  kp:[
    {en:"Two amounts are in direct proportion when doubling one doubles the other.", vi:"Hai đại lượng tỉ lệ thuận khi gấp đôi cái này thì cái kia cũng gấp đôi."},
    {en:"The unitary method: find the value of ONE first, then multiply.", vi:"Phương pháp quy về đơn vị: tìm giá trị của MỘT trước rồi nhân lên."},
    {en:"5 pens cost $3.50 &rarr; one pen costs $0.70 &rarr; 8 pens cost $5.60.", vi:"5 bút giá 3,50 &rarr; một bút 0,70 &rarr; 8 bút 5,60."},
    {en:"Recipes scale the same way: for more people, find the amount per person first.", vi:"Công thức nấu ăn cũng vậy: tìm lượng cho một người trước."},
    {en:"In direct proportion, dividing one amount by the other always gives the same number.", vi:"Với tỉ lệ thuận, thương của hai đại lượng luôn là một hằng số."},
    {en:"Careful: not everything is in direct proportion. Two people do not always dig a hole in half the time.", vi:"Cẩn thận: không phải cái gì cũng tỉ lệ thuận. Hai người chưa chắc đào hố nhanh gấp đôi."}],
  voc:[["direct proportion","tỉ lệ thuận"],["unitary method","quy về đơn vị"],["per","mỗi"],["scale up","tăng theo tỉ lệ"],["scale down","giảm theo tỉ lệ"],["rate","tỉ suất, đơn giá"],["equivalent","tương đương"],["constant","hằng số"]],
  quiz:[
    {q:"6 apples cost $4.20. What do 10 cost?", o:["$6.00","$7.00","$7.20","$8.40"], a:1, e:"Một quả 4.20 &divide; 6 = $0.70; mười quả $7.00."},
    {q:"A recipe for 4 people uses 300 g of rice. How much for 6 people?", o:["350 g","400 g","450 g","500 g"], a:2, e:"Một người 75 g; sáu người 450 g."},
    {q:"A car travels 240 km on 16 litres. How far on 20 litres?", o:["280 km","300 km","320 km","360 km"], a:1, e:"Một lít đi được 15 km; 20 lít đi 300 km."},
    {q:"3 workers paint a wall in 8 hours. Is the time in direct proportion to the number of workers?", o:["Yes, more workers means more time","No, more workers means LESS time","Yes, exactly","There is no link"], a:1, e:"Đây là tỉ lệ nghịch: càng nhiều người thì càng ít thời gian, không phải tỉ lệ thuận."},
    {q:"8 notebooks cost $12. What is the cost of one?", o:["$1.20","$1.50","$2.00","$0.80"], a:1, e:"12 &divide; 8 = $1.50 mỗi quyển."},
    {q:"If 5 kg of flour costs $9, how much does 2 kg cost?", o:["$3.20","$3.60","$4.50","$18"], a:1, e:"Một ki-lô-gam 9 &divide; 5 = $1.80; hai ki-lô-gam $3.60."}]},

{ id:"m33", subject:"math", t:"Angles in a triangle", vi:"Góc trong tam giác",
  kp:[
    {en:"The three angles of ANY triangle always add up to 180&deg;.", vi:"Tổng ba góc của MỌI tam giác luôn bằng 180&deg;."},
    {en:"Find a missing angle by subtracting the two known angles from 180&deg;.", vi:"Tìm góc thiếu: lấy 180&deg; trừ đi hai góc đã biết."},
    {en:"Equilateral triangle: all sides equal and every angle is 60&deg;.", vi:"Tam giác đều: ba cạnh bằng nhau, mỗi góc 60&deg;."},
    {en:"Isosceles triangle: two equal sides and the two BASE angles are equal.", vi:"Tam giác cân: hai cạnh bằng nhau và hai góc ở đáy bằng nhau."},
    {en:"A triangle can have at most one right angle and at most one obtuse angle.", vi:"Tam giác có nhiều nhất một góc vuông và nhiều nhất một góc tù."},
    {en:"In an isosceles triangle, if you know the top angle, each base angle is (180 &minus; top) &divide; 2.", vi:"Tam giác cân biết góc đỉnh thì mỗi góc đáy bằng (180 &minus; góc đỉnh) &divide; 2."}],
  voc:[["triangle","tam giác"],["equilateral","đều"],["isosceles","cân"],["scalene","thường (ba cạnh khác nhau)"],["base angle","góc ở đáy"],["interior angle","góc trong"],["right-angled","vuông"],["sum","tổng"]],
  quiz:[
    {q:"A triangle has angles 55&deg; and 72&deg;. What is the third?", o:["43&deg;","53&deg;","63&deg;","127&deg;"], a:1, e:"180 &minus; (55 + 72) = 180 &minus; 127 = 53&deg;."},
    {q:"Each angle of an equilateral triangle is:", o:["45&deg;","60&deg;","90&deg;","30&deg;"], a:1, e:"Ba góc bằng nhau và tổng 180&deg; nên mỗi góc 60&deg;."},
    {q:"An isosceles triangle has a top angle of 50&deg;. What is each base angle?", o:["50&deg;","65&deg;","80&deg;","130&deg;"], a:1, e:"(180 &minus; 50) &divide; 2 = 65&deg; mỗi góc đáy."},
    {q:"Can a triangle have two right angles?", o:["Yes","No, the angles would already total 180&deg;","Only if it is large","Only if it is isosceles"], a:1, e:"Hai góc vuông đã hết 180&deg;, không còn cho góc thứ ba."},
    {q:"A right-angled triangle has one angle of 34&deg;. What is the third angle?", o:["46&deg;","56&deg;","66&deg;","146&deg;"], a:1, e:"180 &minus; 90 &minus; 34 = 56&deg;."},
    {q:"An isosceles triangle has a base angle of 70&deg;. What is the top angle?", o:["40&deg;","55&deg;","70&deg;","110&deg;"], a:0, e:"Hai góc đáy đều 70&deg;, nên góc đỉnh = 180 &minus; 140 = 40&deg;."}]}
);

<script>
DATA.math.units.push(
{ id:"m34", subject:"math", t:"Multiplying decimals", vi:"Nhân số thập phân",
  kp:[
    {en:"Ignore the decimal points, multiply as whole numbers, then put the point back.", vi:"Bỏ dấu phẩy, nhân như số nguyên, rồi đặt lại dấu phẩy."},
    {en:"Count the decimal places in BOTH numbers and give the answer that many places.", vi:"Đếm tổng số chữ số thập phân của CẢ HAI số, kết quả có đúng bấy nhiêu chữ số thập phân."},
    {en:"0.4 &times; 0.3: 4 &times; 3 = 12, two decimal places altogether, so the answer is 0.12.", vi:"0.4 &times; 0.3 &rarr; 4&times;3 = 12, tổng 2 chữ số thập phân &rarr; 0.12."},
    {en:"Multiplying by a number smaller than 1 makes the answer SMALLER, not bigger.", vi:"Nhân với số nhỏ hơn 1 làm kết quả NHỎ đi, không phải lớn lên."},
    {en:"Multiplying by 0.5 is the same as halving; by 0.1 is the same as dividing by 10.", vi:"Nhân 0.5 là chia đôi; nhân 0.1 là chia 10."},
    {en:"Estimate first: 3.9 &times; 6 is about 4 &times; 6 = 24, so an answer near 23.4 is sensible.", vi:"Ước lượng trước: 3.9 &times; 6 &asymp; 24 nên kết quả 23.4 là hợp lý."}],
  voc:[["multiply","nhân"],["decimal place","chữ số thập phân"],["product","tích"],["estimate","ước lượng"],["halve","chia đôi"],["sensible","hợp lý"],["place the point","đặt dấu phẩy"],["whole number","số nguyên"]],
  quiz:[
    {q:"0.6 &times; 0.4 =", o:["2.4","0.24","0.024","24"], a:1, e:"6 &times; 4 = 24; tổng hai chữ số thập phân &rarr; 0.24."},
    {q:"1.5 &times; 0.2 =", o:["3.0","0.3","0.03","30"], a:1, e:"15 &times; 2 = 30; tổng hai chữ số thập phân &rarr; 0.30 tức 0.3."},
    {q:"0.5 &times; 18 =", o:["0.9","9","90","36"], a:1, e:"Nhân 0.5 là chia đôi: 18 &divide; 2 = 9."},
    {q:"Which gives an answer SMALLER than 20?", o:["20 &times; 1.5","20 &times; 0.8","20 &times; 2","20 &times; 1"], a:1, e:"Nhân với số nhỏ hơn 1 luôn cho kết quả nhỏ hơn số ban đầu."},
    {q:"3.9 &times; 6 =", o:["23.4","2.34","234","21.4"], a:0, e:"39 &times; 6 = 234; một chữ số thập phân &rarr; 23.4. Ước lượng 4&times;6 = 24 nên hợp lý."},
    {q:"0.07 &times; 3 =", o:["0.21","2.1","0.021","21"], a:0, e:"7 &times; 3 = 21; hai chữ số thập phân &rarr; 0.21."}]},

{ id:"m35", subject:"math", t:"Dividing decimals", vi:"Chia số thập phân",
  kp:[
    {en:"To divide a decimal by a whole number, keep the decimal point in line and divide as usual.", vi:"Chia số thập phân cho số nguyên: giữ dấu phẩy thẳng hàng rồi chia bình thường."},
    {en:"7.2 &divide; 4: think 7 &divide; 4 = 1 remainder 3, carry on into the tenths &rarr; 1.8.", vi:"7.2 &divide; 4: 7 chia 4 được 1 dư 3, mang xuống phần thập phân &rarr; 1.8."},
    {en:"Add zeros after the decimal point if you need to keep dividing: 9 &divide; 4 = 2.25.", vi:"Thêm số 0 sau dấu phẩy để chia tiếp: 9 &divide; 4 = 2.25."},
    {en:"Dividing by a number smaller than 1 makes the answer BIGGER: 8 &divide; 0.5 = 16.", vi:"Chia cho số nhỏ hơn 1 làm kết quả LỚN lên: 8 &divide; 0.5 = 16."},
    {en:"Dividing by 0.5 asks &lsquo;how many halves fit inside?&rsquo; &mdash; the answer is double.", vi:"Chia cho 0.5 là hỏi &lsquo;có bao nhiêu nửa bên trong?&rsquo; nên kết quả gấp đôi."},
    {en:"Always check by multiplying back: if 8.4 &divide; 4 = 2.1, then 2.1 &times; 4 must be 8.4.", vi:"Luôn kiểm tra bằng phép nhân ngược lại."}],
  voc:[["divide","chia"],["dividend","số bị chia"],["divisor","số chia"],["quotient","thương"],["decimal point","dấu phẩy thập phân"],["carry","mang sang, nhớ"],["exact","chính xác, không dư"],["check","kiểm tra"]],
  quiz:[
    {q:"8.4 &divide; 4 =", o:["2.1","21","0.21","2.4"], a:0, e:"8 &divide; 4 = 2 và 0.4 &divide; 4 = 0.1, cộng lại 2.1."},
    {q:"9.6 &divide; 3 =", o:["3.2","32","0.32","3.6"], a:0, e:"9 &divide; 3 = 3 và 0.6 &divide; 3 = 0.2 &rarr; 3.2."},
    {q:"9 &divide; 4 =", o:["2.2","2.25","2.5","2 r 1"], a:1, e:"Thêm số 0 sau dấu phẩy và chia tiếp: 9.00 &divide; 4 = 2.25."},
    {q:"12 &divide; 0.5 =", o:["6","24","0.24","2.4"], a:1, e:"Hỏi có bao nhiêu nửa trong 12 &rarr; 24. Chia cho số nhỏ hơn 1 thì kết quả lớn lên."},
    {q:"A ribbon 4.5 m long is cut into 6 equal pieces. How long is each?", o:["0.75 m","0.65 m","7.5 m","0.9 m"], a:0, e:"4.5 &divide; 6 = 0.75 m, tức 75 cm."},
    {q:"Which calculation gives the BIGGEST answer?", o:["10 &times; 0.5","10 &divide; 0.5","10 &times; 0.2","10 &minus; 0.5"], a:1, e:"10 &divide; 0.5 = 20, lớn nhất trong bốn phép."}]},

{ id:"m36", subject:"math", t:"Frequency diagrams, line graphs and scatter graphs", vi:"Biểu đồ tần số, đồ thị đường và biểu đồ phân tán",
  kp:[
    {en:"A frequency diagram groups continuous data into intervals, so its bars TOUCH each other.", vi:"Biểu đồ tần số nhóm số liệu liên tục theo khoảng nên các cột DÍNH nhau."},
    {en:"A bar chart shows separate groups, so its bars have GAPS between them.", vi:"Biểu đồ cột cho các nhóm rời rạc nên các cột CÓ khoảng cách."},
    {en:"A line graph shows change over time. Join the points only when the data is continuous.", vi:"Đồ thị đường thể hiện thay đổi theo thời gian; chỉ nối điểm khi số liệu liên tục."},
    {en:"On a line graph, a steeper line means a faster change.", vi:"Trên đồ thị đường, đoạn càng dốc thì thay đổi càng nhanh."},
    {en:"A scatter graph plots two things against each other to see whether they are linked.", vi:"Biểu đồ phân tán vẽ hai đại lượng theo nhau để xem có liên hệ không."},
    {en:"Points rising together show a link, but one thing does not always CAUSE the other.", vi:"Các điểm cùng đi lên cho thấy có liên hệ, nhưng chưa chắc cái này GÂY RA cái kia."}],
  voc:[["frequency","tần số"],["interval","khoảng"],["continuous data","số liệu liên tục"],["line graph","đồ thị đường"],["scatter graph","biểu đồ phân tán"],["trend","xu hướng"],["steep","dốc"],["axis","trục"]],
  quiz:[
    {q:"Why do the bars of a frequency diagram touch?", o:["To save space","Because the data is continuous, with no gaps between intervals","Because it looks neater","Because the groups are separate"], a:1, e:"Số liệu liên tục không có khoảng trống giữa các khoảng nên cột dính nhau."},
    {q:"Which chart shows how a plant grew over 8 weeks?", o:["Pie chart","Bar chart","Line graph","Scatter graph"], a:2, e:"Thay đổi theo thời gian nên dùng đồ thị đường."},
    {q:"On a line graph, what does a steeper section mean?", o:["Slower change","Faster change","No change","An error"], a:1, e:"Càng dốc nghĩa là giá trị thay đổi nhiều trong cùng khoảng thời gian."},
    {q:"Which chart would show whether taller children have bigger feet?", o:["Pie chart","Scatter graph","Frequency diagram","Line graph"], a:1, e:"Biểu đồ phân tán vẽ hai đại lượng theo nhau để tìm mối liên hệ."},

m22:{d:[{en:"Money is always rounded to 2 decimal places, so $3.5 must be written $3.50.",vi:"Tiền luôn làm tròn 2 chữ số thập phân, nên viết $3.50 chứ không phải $3.5."},

m25:{d:[{en:"The number 3.14 is called pi. It is the same for every circle in the universe.",vi:"Con số 3,14 gọi là số pi, giống nhau với mọi hình tròn."},
 {en:"A wheel turns one full circumference for each complete turn, which is how bike computers measure distance.",vi:"Bánh xe quay một vòng thì đi được đúng một chu vi — đó là cách đồng hồ xe đạp đo quãng đường."},

m27:{d:[{en:"A 20% increase then a 20% decrease does NOT return to the start: 100 &rarr; 120 &rarr; 96.",vi:"Tăng 20% rồi giảm 20% không về số cũ: 100 &rarr; 120 &rarr; 96."},

 {en:"Percentages make comparison fair: 18 out of 25 and 7 out of 10 are easier to compare as 72% and 70%.",vi:"Phần trăm giúp so sánh công bằng: 18/25 và 7/10 đổi ra 72% và 70% là thấy ngay."}],

/* Đặt mã mở app ngay lần đầu vào */
function vSetPin(){
  ttl.textContent = "Đặt mã mở app";
  backBtn.hidden = true; tabsEl.style.display = "none";
  view.innerHTML = `<div class="stack">
    <div class="hero" style="text-align:center">
      <p style="font-size:42px;margin-bottom:6px">&#128274;</p>
      <h2 style="font-size:20px">Đặt mã 4 số cho app</h2>
      <p style="font-size:13.5px;color:var(--ink-soft);margin-top:8px;line-height:1.55">
        Từ lần sau, ai mở app cũng phải nhập mã này. Chọn 4 số cả nhà nhớ được.
        Mã này khác với mã riêng của bố mẹ dùng để duyệt điểm thưởng.</p>
      <input class="pin" id="p" type="tel" inputmode="numeric" maxlength="4" placeholder="- - - -" autocomplete="off" style="margin-top:16px">
      <p id="err" style="font-size:13px;color:var(--bad);margin-top:9px;min-height:18px"></p>
      <button class="btn" id="ok">Đặt mã và bắt đầu học</button>
      <button class="btn btn-ghost" id="skip" style="margin-top:9px">Để sau &middot; không đặt mã</button></div>
    <div class="note">Quên mã thì vào Cài đặt của người đang đăng nhập để đổi lại. Nếu quên hẳn, xoá dữ liệu trang web trên trình duyệt là mã được gỡ, nhưng tiến độ học cũng mất theo.</div></div>`;
  const inp=view.querySelector('#p'), err=view.querySelector('#err');
  inp.focus();
  const done=()=>{ S.pinAsked=true; save(); go("login"); };
  view.querySelector('#ok').onclick=()=>{
    const v=inp.value.trim();
    if(!/^\d{4}$/.test(v)){ err.textContent="Mã phải đúng 4 chữ số."; return; }
    S.appPin=v; UNLOCKED=true; done();
  };
  view.querySelector('#skip').onclick=done;
  inp.onkeydown=(e)=>{ if(e.key==="Enter") view.querySelector('#ok').click(); };
}

function deepen(map){

    const d = map[id];
    u.kp = u.kp.concat(d.kp);
    u.quiz = u.quiz.concat(d.q);
    MM[id] = (MM[id]||[]).concat(d.mm);
  });
}

  {en:"Word clue: &lsquo;happen together again&rsquo; means LCM; &lsquo;largest equal groups&rsquo; means HCF.", vi:"Mẹo đọc đề: &lsquo;cùng xảy ra lại&rsquo; là BCNN; &lsquo;nhóm đều lớn nhất&rsquo; là ƯCLN."}],

m24:{kp:[

<script>
/* Xáo trộn vị trí bốn đáp án mỗi lần mở app, để không đoán được theo vị trí */
function shuffleQ(q){
  if(!q || !q.o || q.o.length!==4 || !(q.a>=0 && q.a<4)) return;
  const idx=[0,1,2,3];
  for(let i=3;i>0;i--){ const j=Math.random()*(i+1)|0; const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  const newA = idx.indexOf(q.a);
  q.o = idx.map(i=>q.o[i]);
  q.a = newA;
}
SUBJ_IDS.forEach(k=>DATA[k].units.forEach(u=>u.quiz.forEach(shuffleQ)));
Object.keys(TESTS).forEach(key=>{ if(key.indexOf("review:")!==0) TESTS[key].qs.forEach(shuffleQ); });
SUBJ_IDS.forEach(k=>EXAMS[k].qs.forEach(shuffleQ));
Object.keys(EXT).forEach(id=>{ if(EXT[id].c) shuffleQ(EXT[id].c); });

if(S.goal===undefined) S.goal = 1;
if(S.appPin===undefined) S.appPin = null;
syncPoints();
ST = { v: (!S.pinAsked && !S.appPin) ? "setpin"
        : ((S.appPin && !UNLOCKED) ? "lock"
        : (S.role ? (S.role==="admin" ? "admin" : "home") : "login")) };
render();
</script>
