    {q:"A rectangle is 8 cm by 5 cm. What is its area?", o:["13 cm&sup2;","26 cm&sup2;","40 cm&sup2;","40 cm"], a:2,
     e:"Diện tích = 8 &times; 5 = 40, đơn vị cm&sup2;. Đáp án &ldquo;40 cm&rdquo; sai đơn vị nên không được điểm."},
    {q:"What is the perimeter of the same 8 cm by 5 cm rectangle?", o:["13 cm","26 cm","40 cm","30 cm"], a:1,
     e:"Chu vi = 2 &times; (8 + 5) = 26 cm. Nhớ cộng đủ cả bốn cạnh."},
    {q:"A triangle has base 10 cm and height 6 cm. Its area is:", o:["60 cm&sup2;","30 cm&sup2;","16 cm&sup2;","32 cm&sup2;"], a:1,
     e:"(10 &times; 6) &divide; 2 = 30 cm&sup2;. Quên chia đôi là lỗi phổ biến nhất ở dạng bài này."},
    {q:"A box is 4 cm &times; 3 cm &times; 2 cm. What is its volume?", o:["9 cm&sup3;","24 cm&sup3;","12 cm&sup3;","24 cm&sup2;"], a:1,
     e:"4 &times; 3 &times; 2 = 24, đơn vị cm&sup3; vì thể tích đo bằng đơn vị mũ ba."},
    {q:"A square has a perimeter of 36 cm. What is its area?", o:["81 cm&sup2;","36 cm&sup2;","144 cm&sup2;","9 cm&sup2;"], a:0,
     e:"Cạnh = 36 &divide; 4 = 9 cm. Diện tích = 9 &times; 9 = 81 cm&sup2;."},
    {q:"Which statement is true?", o:["Shapes with the same area always have the same perimeter","Shapes with the same area can have different perimeters","Area and perimeter are the same thing","Perimeter uses cm&sup2;"], a:1,
     e:"Ví dụ: hình 1&times;12 và hình 3&times;4 đều có diện tích 12 cm&sup2; nhưng chu vi lần lượt là 26 cm và 14 cm."}]},

{ id:"m10", t:"Handling data: mode, median, mean, range", vi:"Xử lí số liệu và biểu đồ",
  kp:[
    {en:"Mode = the value that appears most often. There can be more than one mode.", vi:"Mốt (mode) là giá trị xuất hiện nhiều lần nhất; có thể có nhiều mốt."},
    {en:"Median = the middle value AFTER putting the numbers in order.", vi:"Trung vị là giá trị ở giữa SAU KHI đã sắp xếp các số theo thứ tự."},
    {en:"If there are two middle values, the median is halfway between them.", vi:"Nếu có hai số ở giữa thì trung vị là số nằm chính giữa hai số đó."},
    {en:"Mean = total &divide; how many values.", vi:"Trung bình cộng = tổng &divide; số lượng giá trị."},
    {en:"Range = largest &minus; smallest. It shows how spread out the data is.", vi:"Khoảng biến thiên = lớn nhất &minus; nhỏ nhất, cho biết dữ liệu phân tán ra sao."},
    {en:"Bar charts compare groups; line graphs show change over time; pie charts show parts of a whole.", vi:"Biểu đồ cột so sánh nhóm; đồ thị đường thể hiện thay đổi theo thời gian; biểu đồ tròn thể hiện phần của tổng thể."},
    {en:"Always read the scale on the axis before answering a graph question.", vi:"Luôn đọc kỹ thang chia trên trục trước khi trả lời câu hỏi về biểu đồ."}],
  voc:[["mode","mốt (giá trị hay gặp nhất)"],["median","trung vị"],["mean / average","trung bình cộng"],["range","khoảng biến thiên"],["frequency","tần số"],["data set","tập số liệu"],["axis / axes","trục"],["tally chart","bảng kiểm đếm"]],
  quiz:[
    {q:"Find the mode of: 3, 7, 4, 7, 5, 7, 2.", o:["3","5","7","4"], a:2,
     e:"Số 7 xuất hiện 3 lần, nhiều hơn mọi số khác, nên mốt là 7."},
    {q:"Find the median of: 8, 3, 5, 9, 4.", o:["4","5","8","5.8"], a:1,
     e:"Sắp xếp trước: 3, 4, 5, 8, 9. Số ở giữa là 5. Nếu không sắp xếp sẽ chọn nhầm số 5 ở vị trí bất kỳ."},
    {q:"Find the mean of: 6, 10, 8, 12.", o:["8","9","10","36"], a:1,
     e:"Tổng = 36; có 4 số &rarr; 36 &divide; 4 = 9."},
    {q:"Find the range of: 12, 5, 20, 9.", o:["5","15","20","11.5"], a:1,
     e:"Lớn nhất 20 trừ nhỏ nhất 5 &rarr; 15."},
    {q:"Which chart best shows how a plant's height changed over 6 weeks?", o:["Pie chart","Bar chart","Line graph","Tally chart"], a:2,
     e:"Thay đổi theo thời gian là số liệu liên tục nên dùng đồ thị đường để thấy xu hướng."},
    {q:"Four children have a mean of 7 sweets. What is the total number of sweets?", o:["7","11","28","1.75"], a:2,
     e:"Từ trung bình suy ngược ra tổng: tổng = trung bình &times; số lượng = 7 &times; 4 = 28."}]},

{ id:"m11", t:"Probability", vi:"Xác suất",
  kp:[
    {en:"Probability is how likely something is: impossible, unlikely, even chance, likely, certain.", vi:"Xác suất mô tả khả năng xảy ra: không thể, ít khả năng, khả năng ngang nhau, nhiều khả năng, chắc chắn."},
    {en:"Probability is measured from 0 (impossible) to 1 (certain).", vi:"Xác suất nhận giá trị từ 0 (không thể) đến 1 (chắc chắn)."},
    {en:"Probability = number of ways it can happen &divide; total number of outcomes.", vi:"Xác suất = số cách xảy ra &divide; tổng số kết quả có thể."},
    {en:"For a fair six-sided dice, P(rolling a 3) = 1/6.", vi:"Với xúc xắc 6 mặt cân đối, xác suất ra mặt 3 là 1/6."},
    {en:"The probabilities of all possible outcomes add up to 1.", vi:"Tổng xác suất của tất cả kết quả có thể bằng 1."},
    {en:"P(not happening) = 1 &minus; P(happening).", vi:"Xác suất không xảy ra = 1 &minus; xác suất xảy ra."},
    {en:"Past results do not change the next result: a coin has no memory.", vi:"Kết quả trước không ảnh hưởng lần sau — đồng xu không có trí nhớ."}],
  voc:[["probability","xác suất"],["outcome","kết quả có thể"],["fair","cân đối, công bằng"],["certain","chắc chắn"],["impossible","không thể"],["even chance","khả năng ngang nhau"],["likely","nhiều khả năng"],["at random","một cách ngẫu nhiên"]],
  quiz:[
    {q:"What is the probability of rolling an even number on a fair six-sided dice?", o:["1/6","1/3","1/2","2/3"], a:2,
     e:"Số chẵn là 2, 4, 6 &rarr; 3 trong 6 kết quả = 3/6 = 1/2."},
    {q:"A bag has 3 red and 7 blue balls. What is P(red)?", o:["3/7","3/10","7/10","1/3"], a:1,
     e:"Tổng số bóng là 10, trong đó 3 bóng đỏ &rarr; 3/10. Mẫu số phải là TỔNG, không phải số bóng còn lại."},
    {q:"The probability it rains is 0.3. What is the probability it does not rain?", o:["0.3","0.5","0.7","1.3"], a:2,
     e:"Xác suất không xảy ra = 1 &minus; 0.3 = 0.7."},
    {q:"A coin lands on heads 5 times in a row. What is P(heads) on the next throw?", o:["Less than 1/2","1/2","More than 1/2","0"], a:1,
     e:"Mỗi lần tung là độc lập nên vẫn là 1/2. Đồng xu không &ldquo;nhớ&rdquo; những lần trước."},
    {q:"Which event is certain?", o:["It will snow in Hanoi tomorrow","A dice will land on 7","The Sun will set today","You will roll a 6"], a:2,
     e:"Mặt Trời lặn mỗi ngày nên xác suất bằng 1. Xúc xắc 6 mặt không thể ra 7, đó là biến cố không thể (xác suất 0)."},
    {q:"A spinner has 8 equal sections: 4 red, 2 blue, 2 green. P(blue) is:", o:["1/2","1/4","2/8 = 1/4","1/8"], a:2,
     e:"2 phần xanh trên tổng 8 phần &rarr; 2/8, rút gọn thành 1/4."}]},

{ id:"m12", t:"Word problems & problem solving", vi:"Giải toán có lời văn",
  kp:[
    {en:"Read the whole question twice. Underline the numbers AND what is actually being asked.", vi:"Đọc kỹ đề hai lần; gạch chân các số VÀ câu hỏi thật sự yêu cầu gì."},
    {en:"Decide the operation from the words: altogether/total (+), left/fewer (&minus;), each/per group (&times; or &divide;).", vi:"Chọn phép tính theo từ khoá: tổng cộng (+), còn lại (&minus;), mỗi (&times; hoặc &divide;)."},
    {en:"Many Checkpoint problems need TWO steps. Write down the answer to step 1 before going on.", vi:"Nhiều bài Checkpoint cần HAI bước; hãy viết kết quả bước 1 ra trước khi làm tiếp."},
    {en:"Show your working — method marks are given even if the final answer is wrong.", vi:"Trình bày cách làm — vẫn có điểm cho phương pháp dù đáp số sai."},
    {en:"Check the answer makes sense: money to 2 decimal places, people as whole numbers.", vi:"Kiểm tra đáp án hợp lý: tiền lấy 2 chữ số thập phân, số người phải là số nguyên."},
    {en:"Drawing a bar model or a quick sketch makes a hard problem much easier.", vi:"Vẽ sơ đồ đoạn thẳng hoặc hình phác giúp bài khó trở nên dễ hiểu hơn nhiều."},
    {en:"Always write the unit in your answer: $, cm, kg, minutes.", vi:"Luôn ghi đơn vị vào đáp số: $, cm, kg, phút."}],
  voc:[["altogether","tổng cộng"],["remaining","còn lại"],["share equally","chia đều"],["twice as many","gấp đôi"],["change (money)","tiền thối lại"],["working","phần trình bày cách làm"],["reasonable","hợp lý"],["step","bước giải"]],
  quiz:[
    {q:"A pen costs $2.40. Mai buys 3 pens and pays with a $10 note. How much change does she get?", o:["$7.20","$2.80","$7.60","$2.60"], a:1,
     e:"Bước 1: 3 &times; 2.40 = $7.20. Bước 2: 10 &minus; 7.20 = $2.80. Bài hai bước — dừng ở bước 1 là chọn nhầm $7.20."},
    {q:"A bus holds 45 people. How many buses are needed for 200 people?", o:["4","4.4","5","6"], a:2,
     e:"200 &divide; 45 = 4 dư 20, nên vẫn cần thêm một xe cho 20 người &rarr; 5 xe. Đáp án phải làm tròn LÊN vì không thể có 4.4 xe."},
    {q:"A rope 12 m long is cut into pieces of 80 cm. How many pieces?", o:["15","12","150","96"], a:0,
     e:"Đổi cùng đơn vị trước: 12 m = 1200 cm. Rồi 1200 &divide; 80 = 15 đoạn."},
    {q:"Nam has twice as many stickers as Lan. Together they have 36. How many does Lan have?", o:["18","12","24","9"], a:1,
     e:"Coi Lan là 1 phần, Nam là 2 phần &rarr; 3 phần bằng 36, mỗi phần 12. Lan có 12, Nam có 24."},
    {q:"A tank holds 4.5 litres. 1750 ml is poured out. How much is left?", o:["2750 ml","2.75 litres","Cả 2750 ml và 2,75 lít","1750 ml"], a:2,
     e:"4.5 lít = 4500 ml; 4500 &minus; 1750 = 2750 ml, cũng chính là 2.75 lít. Hai cách viết đều đúng."},
    {q:"Why should you show your working?", o:["It looks tidy","You can earn method marks even if the answer is wrong","It uses more paper","The examiner asks for it"], a:1,
     e:"Đề Checkpoint chấm cả phương pháp; trình bày rõ ràng vẫn ghi điểm dù đáp số cuối bị sai."}]}
]},

esl: { name:"English (ESL)", vi:"Tiếng Anh", icon:"&#128218;", ac:"--esl", acbg:"--esl-bg", units:[

{ id:"e1", t:"Present perfect vs past simple", vi:"Hiện tại hoàn thành và quá khứ đơn",
  kp:[
    {en:"Past simple = a finished action at a stated past time: <i>She went to Da Nang last summer.</i>", vi:"Quá khứ đơn: việc đã xong, CÓ mốc thời gian quá khứ rõ ràng."},
    {en:"Present perfect (have/has + past participle) = the past action still matters now: <i>I have finished my homework.</i>", vi:"Hiện tại hoàn thành: việc trong quá khứ nhưng còn liên quan tới hiện tại."},
    {en:"Signal words for present perfect: just, already, yet, ever, never, since, for, recently, so far.", vi:"Từ tín hiệu của hiện tại hoàn thành — thấy là dùng have/has + V3."},
    {en:"<b>since</b> + a point in time (since 2019). <b>for</b> + a length of time (for three years).", vi:"since đi với MỐC thời gian; for đi với KHOẢNG thời gian."},
    {en:"Never use present perfect with a finished past time. &#10007; <i>I have seen him yesterday.</i>", vi:"Lỗi thường gặp: dùng hiện tại hoàn thành với yesterday, last week, in 2020."},
    {en:"<b>yet</b> goes at the end of questions and negatives. <b>already</b> goes in positive sentences.", vi:"yet dùng ở câu hỏi và phủ định, đứng cuối câu; already dùng ở câu khẳng định."},
    {en:"<b>has been to</b> = went and came back. <b>has gone to</b> = is still there.", vi:"has been to: đã đi và đã về. has gone to: đang còn ở đó."}],
  voc:[["past participle","động từ cột 3 (V3)"],["so far","cho đến giờ"],["recently","gần đây"],["experience","trải nghiệm"],["duration","khoảng thời gian"],["ever / never","đã từng / chưa bao giờ"],["already","đã rồi"],["yet","chưa (trong câu hỏi, phủ định)"]],
  quiz:[
    {q:"I ______ my homework, so I can play now.", o:["finish","finished","have finished","was finishing"], a:2,
     e:"Việc làm xong bài tập ảnh hưởng tới hiện tại (nên giờ mới được chơi) &rarr; dùng hiện tại hoàn thành."},
    {q:"She ______ to Paris last summer.", o:["has gone","has been","went","goes"], a:2,
     e:"Có mốc thời gian quá khứ rõ ràng <i>last summer</i> nên bắt buộc dùng quá khứ đơn: went."},
    {q:"We have lived in Hanoi ______ 2019.", o:["for","since","from","during"], a:1,
     e:"2019 là một MỐC thời gian nên dùng since. Nếu nói &ldquo;for six years&rdquo; (khoảng thời gian) thì mới dùng for."},
    {q:"Have you finished your project ______?", o:["already","yet","just","ever"], a:1,
     e:"Trong câu hỏi và câu phủ định dùng <i>yet</i> ở cuối câu; <i>already</i> chỉ dùng ở câu khẳng định."},
    {q:"Dad has ______ to the market; he will be back in ten minutes.", o:["been","gone","went","being"], a:1,
     e:"Bố vẫn đang ở chợ, chưa về &rarr; has gone to. Nếu bố đã về rồi mới nói &ldquo;has been to&rdquo;."},
    {q:"Which sentence is INCORRECT?", o:["I have never eaten durian.","They have just arrived.","I have met her yesterday.","She has lived here for a year."], a:2,
     e:"Không dùng hiện tại hoàn thành với <i>yesterday</i>. Câu đúng là: <i>I met her yesterday.</i>"},
    {q:"They ______ the film three times so far this year.", o:["watched","have watched","watch","were watching"], a:1,
     e:"&ldquo;so far this year&rdquo; là khoảng thời gian chưa kết thúc, nên dùng hiện tại hoàn thành: have watched."}]},

{ id:"e2", t:"Reading: skim, scan & infer", vi:"Đọc hiểu: đọc lướt, tìm chi tiết, suy luận",
  passage:{title:"Plastic in our oceans", text:[
    "Every year, about eight million tonnes of plastic end up in the world's oceans. Much of it comes from bottles, bags and food packaging that people throw away on land. Rivers then carry the rubbish out to sea.",
    "Plastic does not rot away like a banana skin. Instead, sunlight and waves break it into tiny pieces called microplastics. Fish and seabirds mistake these pieces for food. Scientists in Indonesia found plastic in the stomachs of more than half of the fish they studied.",
    "The good news is that the problem can be reduced. Some countries now charge shoppers for plastic bags, and many schools have replaced plastic bottles with refillable ones. Small changes, made by millions of people, add up."]},
  kp:[
    {en:"<b>Skim</b> first: read the title and the first sentence of each paragraph to get the main idea. Take 30 seconds.", vi:"Đọc lướt trước: tiêu đề và câu đầu mỗi đoạn để nắm ý chính, chỉ mất 30 giây."},
    {en:"<b>Scan</b> for details: run your eyes over the text looking only for the key word, number or name in the question.", vi:"Tìm chi tiết: rà mắt tìm đúng từ khoá, con số hoặc tên riêng, không đọc lại cả bài."},
    {en:"Underline the key word in every question BEFORE you look back at the text.", vi:"Gạch chân từ khoá trong câu hỏi TRƯỚC khi quay lại bài đọc."},
    {en:"For &lsquo;What does the word ... mean?&rsquo;, read the whole sentence around it &mdash; the meaning comes from the context.", vi:"Câu hỏi nghĩa của từ: đọc cả câu chứa nó và đoán nghĩa theo ngữ cảnh."},
    {en:"An <b>inference</b> question asks for something true but not written word for word. Look for the evidence.", vi:"Câu suy luận: đáp án không có sẵn nguyên văn, phải tìm bằng chứng trong bài."},
    {en:"Answer in your own words when asked to explain, and use full sentences for long answers.", vi:"Câu trả lời dài phải viết thành câu đầy đủ, diễn đạt bằng lời của mình."},
    {en:"Never leave a question blank &mdash; a sensible guess based on the text can still earn a mark.", vi:"Không bỏ trống câu nào; đoán có căn cứ vẫn có thể được điểm."}],
  voc:[["skim","đọc lướt lấy ý chính"],["scan","rà tìm chi tiết"],["infer","suy luận"],["main idea","ý chính"],["evidence","bằng chứng"],["packaging","bao bì"],["microplastics","hạt vi nhựa"],["refillable","dùng lại được"],["rot away","phân huỷ"],["reduce","giảm bớt"]],
  quiz:[
    {q:"What is the main idea of the whole text?", o:["Fish in Indonesia are dangerous to eat","Plastic pollutes the oceans, but people can reduce it","Rivers are dirtier than oceans","Plastic bags should be free"], a:1,
     e:"Ý chính phải bao trùm cả ba đoạn: nêu vấn đề, tác hại, rồi giải pháp. Các đáp án khác chỉ là chi tiết của một đoạn."},
    {q:"How much plastic reaches the oceans each year?", o:["Eight thousand tonnes","Half of all fish","About eight million tonnes","Millions of bottles"], a:2,
     e:"Đây là câu SCAN — tìm con số trong đoạn 1: &ldquo;about eight million tonnes&rdquo;."},
    {q:"In paragraph 2, what does &ldquo;mistake these pieces for food&rdquo; mean?", o:["They refuse to eat them","They think the pieces are food","They spit the pieces out","They store the pieces"], a:1,
     e:"Đọc cả câu: cá và chim biển ăn nhầm vi nhựa vì tưởng là thức ăn. &ldquo;mistake A for B&rdquo; = nhầm A là B."},
    {q:"Why does the writer mention the banana skin?", o:["To show plastic does not break down naturally","To suggest eating more fruit","Because bananas pollute the sea","To explain what fish eat"], a:0,
     e:"Câu suy luận: vỏ chuối phân huỷ tự nhiên còn nhựa thì không — tác giả dùng so sánh để làm nổi bật điều đó."},
    {q:"What can you infer about the writer's opinion?", o:["The problem cannot be solved","Only scientists can help","Ordinary people's actions matter","Plastic bags should be banned everywhere"], a:2,
     e:"Câu cuối &ldquo;Small changes, made by millions of people, add up&rdquo; cho thấy tác giả tin hành động của mỗi người là quan trọng."},
    {q:"Which paragraph tells you what is being done about the problem?", o:["Paragraph 1","Paragraph 2","Paragraph 3","None of them"], a:2,
     e:"Đoạn 3 mở đầu bằng &ldquo;The good news is...&rdquo; và nêu giải pháp. Câu đầu mỗi đoạn thường cho biết đoạn đó nói gì."},
    {q:"Where does most ocean plastic come from, according to the text?", o:["Ships at sea","Rubbish thrown away on land","Factories in Indonesia","Fish and seabirds"], a:1,
     e:"Đoạn 1 nói rác từ đất liền (chai, túi, bao bì) được sông cuốn ra biển. Đừng chọn theo phỏng đoán mà phải bám vào chữ trong bài."}]},

{ id:"e3", t:"Passive voice", vi:"Câu bị động",
  kp:[
    {en:"The passive is formed with the verb <b>be</b> + past participle: <i>The window was broken.</i>", vi:"Bị động = động từ <b>be</b> chia thì + V3: <i>The window was broken.</i>"},
    {en:"Use the passive when the person who did the action is unknown or not important.", vi:"Dùng bị động khi không biết hoặc không cần nói ai làm."},
    {en:"Present simple passive: <i>Rice is grown in Vietnam.</i> Past simple passive: <i>The letter was sent yesterday.</i>", vi:"Bị động hiện tại đơn: is/are + V3. Bị động quá khứ đơn: was/were + V3."},
    {en:"The <b>be</b> verb must match the subject: <i>The books <u>are</u> kept here.</i>", vi:"Động từ be phải hợp với chủ ngữ số ít hay số nhiều."},
    {en:"Add <b>by</b> + the doer only if it adds useful information: <i>The book was written by Dahl.</i>", vi:"Chỉ thêm <b>by</b> + người làm khi thông tin đó thực sự cần thiết."},
    {en:"To change active to passive: the object of the active sentence becomes the subject.", vi:"Đổi chủ động sang bị động: tân ngữ của câu chủ động trở thành chủ ngữ."},
    {en:"Science and report writing use the passive a lot: <i>The water was heated for five minutes.</i>", vi:"Bài báo cáo khoa học dùng bị động rất nhiều — rất hữu ích cho môn Science."}],
  voc:[["passive voice","câu bị động"],["active voice","câu chủ động"],["agent","người/vật thực hiện hành động"],["be + V3","cấu trúc bị động"],["is made of","được làm từ"],["was built","đã được xây"],["are grown","được trồng"],["report","bài báo cáo"]],
  quiz:[
    {q:"Change to the passive: &lsquo;Someone stole my bike.&rsquo;", o:["My bike stole.","My bike was stolen.","My bike is stealing.","My bike has stole."], a:1,
     e:"Tân ngữ &lsquo;my bike&rsquo; thành chủ ngữ, dùng was + V3 (stolen). Không cần &lsquo;by someone&rsquo; vì không rõ ai."},
    {q:"Rice ______ in many parts of Vietnam.", o:["grows","is grown","is growing","grew"], a:1,
     e:"Lúa được người ta trồng nên dùng bị động hiện tại đơn: is grown."},
    {q:"The bridge ______ in 1998.", o:["was built","is built","built","has built"], a:0,
     e:"Có mốc quá khứ 1998 nên dùng bị động quá khứ đơn: was built."},
    {q:"Which sentence is passive?", o:["The chef cooked the fish.","The fish was cooked by the chef.","The chef is cooking.","The fish tastes good."], a:1,
     e:"Chỉ câu <i>The fish was cooked by the chef</i> có be + V3 và chủ ngữ là vật nhận hành động."},
    {q:"These toys ______ made in China.", o:["is","are","was","be"], a:1,
     e:"Chủ ngữ &lsquo;these toys&rsquo; số nhiều nên dùng are. Lỗi hay gặp là không hợp chủ ngữ với động từ be."},
    {q:"Why is the passive often used in science reports?", o:["It is shorter","The method matters more than who did it","It sounds friendlier","It is easier to spell"], a:1,
     e:"Trong báo cáo khoa học, điều quan trọng là cách làm chứ không phải ai làm — nên dùng bị động."},
    {q:"Complete: &lsquo;The homework ______ by all the students last night.&rsquo;", o:["was finished","were finished","finished","is finishing"], a:0,
     e:"&lsquo;The homework&rsquo; là danh từ không đếm được, số ít, và ở quá khứ &rarr; was finished."}]},

{ id:"e4", t:"Conditionals (0, 1, 2)", vi:"Câu điều kiện loại 0, 1, 2",
  kp:[
    {en:"Zero conditional (always true): <i>If you heat ice, it melts.</i> if + present, present.", vi:"Điều kiện loại 0 (luôn đúng): if + hiện tại đơn, hiện tại đơn."},
    {en:"First conditional (a real future possibility): <i>If it rains, we will stay at home.</i> if + present, will + verb.", vi:"Loại 1 (có thể xảy ra trong tương lai): if + hiện tại đơn, will + V."},
    {en:"Second conditional (imaginary now): <i>If I had a million dollars, I would travel.</i> if + past, would + verb.", vi:"Loại 2 (tưởng tượng, không có thật): if + quá khứ đơn, would + V."},
    {en:"Never write <b>will</b> in the if-clause. &#10007; <i>If it will rain...</i>", vi:"Không bao giờ dùng <b>will</b> trong mệnh đề if."},
    {en:"In the second conditional, use <b>were</b> for all subjects: <i>If I were you...</i>", vi:"Ở loại 2, dùng <b>were</b> cho mọi chủ ngữ: <i>If I were you...</i>"},
    {en:"If the if-clause comes first, put a comma after it. If it comes second, no comma.", vi:"Mệnh đề if đứng trước thì có dấu phẩy; đứng sau thì không."},
    {en:"<b>unless</b> means &lsquo;if not&rsquo;: <i>Unless you hurry, you will be late.</i>", vi:"<b>unless</b> nghĩa là &lsquo;nếu không&rsquo;."}],
  voc:[["condition","điều kiện"],["result","kết quả"],["unless","trừ khi, nếu không"],["imaginary","tưởng tượng"],["possibility","khả năng"],["advice","lời khuyên"],["would","sẽ (giả định)"],["comma","dấu phẩy"]],
  quiz:[
    {q:"If you heat water to 100&deg;C, it ______.", o:["will boil","boils","would boil","boiled"], a:1,
     e:"Đây là sự thật khoa học luôn đúng &rarr; điều kiện loại 0: cả hai vế dùng hiện tại đơn."},
    {q:"If it ______ tomorrow, we will cancel the picnic.", o:["will rain","rains","rained","would rain"], a:1,
     e:"Loại 1: mệnh đề if dùng hiện tại đơn, mệnh đề chính dùng will. Không được viết &lsquo;if it will rain&rsquo;."},
    {q:"If I ______ a bird, I would fly to the sea.", o:["am","was","were","will be"], a:2,
     e:"Loại 2 (tưởng tượng) dùng <i>were</i> cho mọi chủ ngữ — đây là dạng chuẩn trong bài thi."},
    {q:"Which is a second conditional sentence?", o:["If you press this, the light comes on.","If she studies, she will pass.","If I lived in Japan, I would eat sushi every day.","If it is cold, wear a coat."], a:2,
     e:"Loại 2 có if + quá khứ đơn (lived) và would + V (would eat), diễn tả điều không có thật ở hiện tại."},
    {q:"______ you leave now, you will miss the bus.", o:["If","Unless","When","Because"], a:1,
     e:"Unless = if not. &lsquo;Unless you leave now&rsquo; nghĩa là &lsquo;nếu bạn không đi ngay&rsquo;."},
    {q:"Where does the comma go? &lsquo;If I finish early I will call you.&rsquo;", o:["After &lsquo;early&rsquo;","After &lsquo;If&rsquo;","After &lsquo;call&rsquo;","No comma is needed"], a:0,
     e:"Mệnh đề if đứng đầu câu nên có dấu phẩy sau nó: <i>If I finish early, I will call you.</i>"},
    {q:"If I were you, I ______ that jacket.", o:["will buy","would buy","bought","buy"], a:1,
     e:"&lsquo;If I were you&rsquo; là cấu trúc khuyên nhủ dạng loại 2, nên vế sau dùng would + V."}]},

{ id:"e5", t:"Reported speech", vi:"Câu tường thuật",
  kp:[
    {en:"When you report what someone said, the tense usually moves one step back: present &rarr; past.", vi:"Khi tường thuật, thì thường lùi một bậc: hiện tại thành quá khứ."},
    {en:"&lsquo;I am tired,&rsquo; she said. &rarr; She said (that) she <b>was</b> tired.", vi:"am &rarr; was; is/are &rarr; was/were; do/does &rarr; did."},
    {en:"will &rarr; would, can &rarr; could, must &rarr; had to.", vi:"will &rarr; would; can &rarr; could; must &rarr; had to."},
    {en:"Pronouns change too: <i>I</i> &rarr; <i>he/she</i>, <i>my</i> &rarr; <i>his/her</i>.", vi:"Đại từ cũng đổi theo người nói: I &rarr; he/she, my &rarr; his/her."},
    {en:"Time words change: today &rarr; that day, tomorrow &rarr; the next day, yesterday &rarr; the day before.", vi:"Từ chỉ thời gian đổi: today &rarr; that day, tomorrow &rarr; the next day."},
    {en:"Reported questions use normal word order and no question mark: <i>He asked where I lived.</i>", vi:"Câu hỏi tường thuật dùng trật tự câu kể và KHÔNG có dấu hỏi."},
    {en:"Use <b>told</b> + person, but <b>said</b> without a person: <i>She told me... / She said that...</i>", vi:"<b>told</b> phải có tân ngữ người; <b>said</b> thì không cần."}],
  voc:[["reported speech","câu tường thuật"],["direct speech","câu trực tiếp"],["say / tell","nói / bảo ai"],["ask","hỏi"],["backshift","lùi thì"],["pronoun","đại từ"],["that day","ngày hôm đó"],["the next day","ngày hôm sau"]],
  quiz:[
    {q:"&lsquo;I am hungry,&rsquo; said Nam. &rarr; Nam said that he ______ hungry.", o:["is","was","were","has been"], a:1,
     e:"Lùi thì: am &rarr; was. Đại từ I cũng đổi thành he."},
    {q:"&lsquo;We will help you,&rsquo; they said. &rarr; They said they ______ help me.", o:["will","would","can","did"], a:1,
     e:"will lùi thành would khi tường thuật."},
    {q:"Which is correct?", o:["She told that she was busy.","She said me she was busy.","She told me she was busy.","She said to she was busy."], a:2,
     e:"<b>tell</b> phải đi kèm tân ngữ chỉ người (tell <u>me</u>); <b>say</b> thì không có tân ngữ người."},
    {q:"&lsquo;Where do you live?&rsquo; he asked. &rarr; He asked where I ______.", o:["live","lived","did live","do live"], a:1,
     e:"Câu hỏi tường thuật dùng trật tự câu kể (I lived) và lùi thì; bỏ trợ động từ do."},
    {q:"&lsquo;I saw her yesterday,&rsquo; he said. &rarr; He said he had seen her ______.", o:["yesterday","the day before","tomorrow","that day"], a:1,
     e:"yesterday khi tường thuật đổi thành <i>the day before</i>."},
    {q:"&lsquo;I can swim,&rsquo; she said. &rarr; She said she ______ swim.", o:["can","could","will","might"], a:1,
     e:"can lùi thành could."},
    {q:"Which sentence needs NO question mark?", o:["Where are you going?","He asked where I was going","Are you ready?","Can you help?"], a:1,
     e:"Câu hỏi tường thuật là câu kể nên kết thúc bằng dấu chấm, không dùng dấu hỏi."}]},

{ id:"e6", t:"Relative clauses", vi:"Mệnh đề quan hệ",
  kp:[
    {en:"A relative clause adds information about a noun, using who, which, that, where, whose.", vi:"Mệnh đề quan hệ bổ sung thông tin cho danh từ, dùng who, which, that, where, whose."},
    {en:"<b>who</b> for people, <b>which</b> for things and animals, <b>that</b> for both.", vi:"<b>who</b> cho người, <b>which</b> cho vật và con vật, <b>that</b> dùng được cho cả hai."},
    {en:"<b>where</b> for places, <b>when</b> for times, <b>whose</b> for possession.", vi:"<b>where</b> cho nơi chốn, <b>when</b> cho thời gian, <b>whose</b> chỉ sở hữu."},
    {en:"The relative pronoun comes straight after the noun it describes: <i>the boy <u>who</u> lives next door</i>.", vi:"Đại từ quan hệ đứng ngay sau danh từ mà nó bổ nghĩa."},
    {en:"Do not repeat the subject: &#10007; <i>The man who he called me...</i>", vi:"Không lặp lại chủ ngữ: sai khi viết &lsquo;The man who he called me&rsquo;."},
    {en:"Extra information between commas can be left out and the sentence still makes sense.", vi:"Thông tin thêm nằm giữa hai dấu phẩy — bỏ đi câu vẫn đủ nghĩa."},
    {en:"Joining two short sentences with a relative clause makes writing sound more advanced.", vi:"Nối hai câu ngắn bằng mệnh đề quan hệ giúp bài viết trưởng thành hơn — rất được điểm ở phần Writing."}],
  voc:[["relative clause","mệnh đề quan hệ"],["relative pronoun","đại từ quan hệ"],["who","người mà"],["which","cái mà"],["whose","của người/vật mà"],["describe","miêu tả"],["combine","kết hợp"],["extra information","thông tin bổ sung"]],
  quiz:[
    {q:"The girl ______ won the prize is my sister.", o:["which","who","where","whose"], a:1,
     e:"&lsquo;The girl&rsquo; là người nên dùng who (hoặc that)."},
    {q:"This is the book ______ I told you about.", o:["who","whose","which","where"], a:2,
     e:"&lsquo;Book&rsquo; là vật nên dùng which hoặc that, không dùng who."},
    {q:"That is the village ______ my grandmother was born.", o:["which","who","where","when"], a:2,
     e:"Nói về nơi chốn nên dùng where."},
    {q:"I met a boy ______ father is a pilot.", o:["who","whose","which","that"], a:1,
     e:"Chỉ sự sở hữu (bố CỦA cậu bé) nên dùng whose."},
    {q:"Which sentence is INCORRECT?", o:["The man who called is my uncle.","The car which I bought is red.","The dog that barks is loud.","The teacher who she teaches us is kind."], a:3,
     e:"Câu <i>The teacher who she teaches us is kind</i> lặp chủ ngữ: đã có &lsquo;who&rsquo; thì không dùng thêm &lsquo;she&rsquo;. Viết đúng: <i>The teacher who teaches us is kind.</i>"},
    {q:"Combine: &lsquo;I have a friend. He lives in Hue.&rsquo;", o:["I have a friend who lives in Hue.","I have a friend which lives in Hue.","I have a friend where lives in Hue.","I have a friend he lives in Hue."], a:0,
     e:"Thay &lsquo;He&rsquo; bằng đại từ quan hệ who để nối hai câu thành một câu mượt hơn."},
    {q:"In &lsquo;My bike, which is new, was expensive&rsquo;, the part between commas is:", o:["The main idea","Extra information that can be removed","A question","A mistake"], a:1,
     e:"Thông tin giữa hai dấu phẩy là phần bổ sung; bỏ đi vẫn còn câu đủ nghĩa: <i>My bike was expensive.</i>"}]},

{ id:"e7", t:"Modal verbs & obligation", vi:"Động từ khuyết thiếu",
  kp:[
    {en:"A modal verb is followed by the bare infinitive: <i>can go</i>, not <i>can to go</i>.", vi:"Sau động từ khuyết thiếu là động từ nguyên thể KHÔNG có <i>to</i>."},
    {en:"<b>can / could</b> = ability or permission. <i>She can swim. Could I borrow this?</i>", vi:"can / could: khả năng hoặc xin phép."},
    {en:"<b>must</b> = strong obligation from the speaker. <b>have to</b> = obligation from a rule outside.", vi:"must là bắt buộc do người nói; have to là bắt buộc do quy định bên ngoài."},
    {en:"<b>mustn't</b> = it is forbidden. <b>don't have to</b> = it is not necessary. These are very different.", vi:"mustn't là CẤM; don't have to là KHÔNG CẦN. Hai nghĩa hoàn toàn khác nhau."},
    {en:"<b>should / shouldn't</b> gives advice: <i>You should drink more water.</i>", vi:"should / shouldn't dùng để khuyên."},
    {en:"<b>might / may</b> = possibility: <i>It might rain later.</i>", vi:"might / may diễn tả khả năng có thể xảy ra."},
    {en:"Modals never take <i>-s</i> in the third person: &#10007; <i>He cans.</i>", vi:"Động từ khuyết thiếu không thêm <i>-s</i> ở ngôi thứ ba."}],
  voc:[["ability","khả năng"],["permission","sự cho phép"],["obligation","nghĩa vụ, bắt buộc"],["forbidden","bị cấm"],["advice","lời khuyên"],["possibility","khả năng xảy ra"],["bare infinitive","động từ nguyên thể không to"],["rule","quy định"]],
  quiz:[
    {q:"You ______ touch that wire. It is very dangerous.", o:["mustn't","don't have to","should","might"], a:0,
     e:"Nguy hiểm nên là điều CẤM &rarr; mustn't. &lsquo;don't have to&rsquo; chỉ nghĩa là không cần, sẽ sai hoàn toàn ở đây."},
    {q:"It is Sunday, so we ______ get up early.", o:["mustn't","don't have to","can't","shouldn't"], a:1,
     e:"Chủ nhật thì KHÔNG CẦN dậy sớm (nhưng vẫn được phép) &rarr; don't have to."},
    {q:"Which sentence is correct?", o:["He can to swim.","He cans swim.","He can swim.","He can swimming."], a:2,
     e:"Sau modal là động từ nguyên thể không &lsquo;to&rsquo;, và modal không thêm -s."},
    {q:"You look tired. You ______ go to bed early.", o:["must","should","might","can"], a:1,
     e:"Đây là lời khuyên nhẹ nhàng nên dùng should."},
    {q:"Take an umbrella. It ______ rain this afternoon.", o:["must","might","should","has to"], a:1,
     e:"Chỉ là khả năng chưa chắc chắn &rarr; might."},
    {q:"In this school students ______ wear a uniform. It is a rule.", o:["have to","might","could","don't have to"], a:0,
     e:"Quy định của trường (bên ngoài áp đặt) nên dùng have to."},
    {q:"______ I open the window, please?", o:["Must","May","Should","Would"], a:1,
     e:"Xin phép lịch sự dùng May I (hoặc Could I)."}]},

{ id:"e8", t:"Writing: emails, stories & reports", vi:"Viết: email, truyện và báo cáo",
  kp:[
    {en:"Plan for two minutes first: jot down the main ideas and the order of paragraphs.", vi:"Dành 2 phút lập dàn ý: ghi nhanh ý chính và thứ tự các đoạn."},
    {en:"An informal email starts <i>Dear Minh / Hi Minh</i> and ends <i>Best wishes / See you soon</i>.", vi:"Email thân mật mở đầu Dear/Hi + tên, kết thúc Best wishes hoặc See you soon."},
    {en:"A formal letter starts <i>Dear Sir or Madam</i> and ends <i>Yours faithfully</i>.", vi:"Thư trang trọng mở đầu Dear Sir or Madam, kết thúc Yours faithfully."},
    {en:"A story needs a beginning (setting and characters), a middle (a problem) and an end (how it is solved).", vi:"Truyện cần mở đầu (bối cảnh, nhân vật), diễn biến (vấn đề) và kết thúc (giải quyết ra sao)."},
    {en:"Use paragraphs: one idea per paragraph, and start a new line for each.", vi:"Chia đoạn: mỗi đoạn một ý, và xuống dòng cho đoạn mới."},
    {en:"Link ideas with connectives: <i>however, because, after that, finally, although</i>.", vi:"Nối ý bằng từ liên kết: however, because, after that, finally, although."},
    {en:"Leave two minutes at the end to check capital letters, full stops and spelling.", vi:"Chừa 2 phút cuối để soát chữ hoa, dấu chấm và chính tả."}],
  voc:[["greeting","lời chào mở đầu"],["closing","lời kết"],["formal / informal","trang trọng / thân mật"],["paragraph","đoạn văn"],["connective","từ nối"],["setting","bối cảnh"],["draft","bản nháp"],["proofread","soát lỗi"]],
  quiz:[
    {q:"Which greeting is right for an email to a friend?", o:["Dear Sir or Madam","Hi Minh","To whom it may concern","Yours faithfully"], a:1,
     e:"Email cho bạn là văn phong thân mật nên dùng Hi hoặc Dear + tên riêng."},
    {q:"How should a formal letter to a company end?", o:["See you soon","Love","Yours faithfully","Bye"], a:2,
     e:"Thư trang trọng gửi người không quen tên kết thúc bằng Yours faithfully."},
    {q:"Which connective shows contrast?", o:["and","because","however","finally"], a:2,
     e:"however diễn tả sự tương phản. because chỉ nguyên nhân, finally chỉ thứ tự."},
    {q:"When should you start a new paragraph?", o:["Every three lines","When you start a new idea","When the page is full","Never"], a:1,
     e:"Mỗi đoạn trình bày một ý; sang ý mới thì xuống dòng — đây là tiêu chí chấm điểm Writing."},
    {q:"What should a story's middle part contain?", o:["The greeting","A problem or exciting event","The address","The conclusion of a report"], a:1,
     e:"Phần giữa của truyện là nơi xuất hiện vấn đề hoặc tình huống gay cấn để dẫn tới cách giải quyết."},
    {q:"What is the FIRST thing to do in a writing task?", o:["Start writing immediately","Plan the ideas and paragraphs","Count the words","Draw a picture"], a:1,
     e:"Lập dàn ý ngắn giúp bài viết mạch lạc và đủ ý — chỉ tốn khoảng 2 phút nhưng được rất nhiều điểm."},
    {q:"Why leave time at the end of a writing task?", o:["To rest","To check spelling, capital letters and full stops","To count pages","To rewrite everything"], a:1,
     e:"Soát lỗi cuối bài giúp lấy lại điểm ngữ pháp và chính tả bị mất do vội."}]},

{ id:"e9", t:"Word building & vocabulary", vi:"Cấu tạo từ và từ vựng",
  kp:[
    {en:"A prefix goes before a word and changes its meaning: <b>un</b>happy, <b>re</b>write, <b>dis</b>agree.", vi:"Tiền tố đứng trước từ và làm đổi nghĩa: unhappy, rewrite, disagree."},
    {en:"A suffix goes after a word and often changes its word class: care &rarr; care<b>ful</b>, help &rarr; help<b>less</b>.", vi:"Hậu tố đứng sau từ và thường đổi loại từ."},
    {en:"Common noun suffixes: -tion, -ment, -ness, -er. <i>inform &rarr; information</i>.", vi:"Hậu tố tạo danh từ thường gặp: -tion, -ment, -ness, -er."},
    {en:"Common adjective suffixes: -ful, -less, -able, -ive. <i>use &rarr; useful / useless</i>.", vi:"Hậu tố tạo tính từ: -ful, -less, -able, -ive."},
    {en:"Synonyms mean nearly the same (big / large). Antonyms mean the opposite (big / small).", vi:"Từ đồng nghĩa gần giống nghĩa; từ trái nghĩa là ngược nghĩa."},
    {en:"A compound word joins two words: <i>foot + ball = football</i>.", vi:"Từ ghép là hai từ ghép lại thành một: football, playground."},
    {en:"When you meet a new word, use the sentence around it and the word parts to work out its meaning.", vi:"Gặp từ mới: dựa vào câu văn xung quanh và các thành phần của từ để đoán nghĩa."}],
  voc:[["prefix","tiền tố"],["suffix","hậu tố"],["synonym","từ đồng nghĩa"],["antonym","từ trái nghĩa"],["compound word","từ ghép"],["word class","loại từ"],["root word","từ gốc"],["context","ngữ cảnh"]],
  quiz:[
    {q:"Which prefix means &lsquo;not&rsquo;?", o:["re-","un-","pre-","-ful"], a:1,
     e:"un- mang nghĩa phủ định: unhappy = không vui. re- nghĩa là làm lại; -ful là hậu tố chứ không phải tiền tố."},
    {q:"What is the noun form of &lsquo;decide&rsquo;?", o:["decided","deciding","decision","decisive"], a:2,
     e:"Thêm hậu tố -sion tạo danh từ: decision. decisive là tính từ."},
    {q:"Choose the antonym of &lsquo;ancient&rsquo;.", o:["old","modern","historic","huge"], a:1,
     e:"ancient nghĩa là rất cổ xưa, trái nghĩa là modern (hiện đại). old là từ đồng nghĩa chứ không phải trái nghĩa."},
    {q:"&lsquo;Careless&rsquo; means:", o:["Full of care","Without care","Caring a lot","Able to care"], a:1,
     e:"Hậu tố -less nghĩa là &lsquo;không có&rsquo;, nên careless = bất cẩn. -ful mới nghĩa là &lsquo;đầy&rsquo;."},
    {q:"Which is a compound word?", o:["Unkind","Playground","Quickly","Happiness"], a:1,
     e:"playground = play + ground, hai từ đầy đủ ghép lại. Các từ còn lại chỉ có tiền tố hoặc hậu tố."},
    {q:"&lsquo;The path was <u>treacherous</u>, so we walked very slowly and held the rail.&rsquo; Treacherous probably means:", o:["Beautiful","Dangerous","Short","Crowded"], a:1,
     e:"Manh mối trong câu: đi rất chậm và bám lan can &rarr; con đường nguy hiểm. Đây là kỹ năng đoán nghĩa theo ngữ cảnh."},
    {q:"Choose the synonym of &lsquo;enormous&rsquo;.", o:["Tiny","Huge","Narrow","Empty"], a:1,
     e:"enormous nghĩa là rất to lớn, đồng nghĩa với huge."}]},

{ id:"e10", t:"Listening strategies", vi:"Chiến lược nghe hiểu",
  kp:[
    {en:"Read the questions BEFORE the recording starts and underline the key words.", vi:"Đọc câu hỏi TRƯỚC khi băng chạy và gạch chân từ khoá."},
    {en:"Predict what kind of answer is needed: a number, a name, a place or a time.", vi:"Đoán trước dạng câu trả lời: con số, tên, nơi chốn hay thời gian."},
    {en:"You will hear the recording twice: get the main answers first, check details second.", vi:"Băng được nghe hai lần: lần đầu bắt ý chính, lần hai kiểm tra chi tiết."},
    {en:"Listen for the speaker correcting themselves: &lsquo;It's at four... no, sorry, half past four.&rsquo; The last one is the answer.", vi:"Chú ý khi người nói tự sửa lại — thông tin SAU CÙNG mới là đáp án."},
    {en:"Do not just pick a word you heard. Distractors are words that appear but are not the answer.", vi:"Đừng chọn chỉ vì nghe thấy từ đó; đề luôn cài từ gây nhiễu (distractor)."},
    {en:"Spell names and places carefully &mdash; a wrong letter loses the mark.", vi:"Viết đúng chính tả tên riêng và địa danh; sai một chữ là mất điểm."},
    {en:"If you miss an answer, move on immediately or you will lose the next one too.", vi:"Nếu lỡ một câu, bỏ qua ngay để không mất luôn câu tiếp theo."}],
  voc:[["recording","đoạn ghi âm"],["predict","dự đoán"],["distractor","đáp án gây nhiễu"],["detail","chi tiết"],["gist","ý chính"],["correct oneself","tự sửa lời"],["spelling","chính tả"],["instruction","hướng dẫn"]],
  quiz:[
    {q:"What should you do before the recording starts?", o:["Close your eyes","Read the questions and underline key words","Write any answer","Ask the teacher"], a:1,
     e:"Đọc trước câu hỏi giúp biết cần nghe thông tin gì, tiết kiệm thời gian khi băng chạy."},
    {q:"The speaker says: &lsquo;We meet at six... sorry, at seven.&rsquo; What is the answer?", o:["Six","Seven","Both","Neither"], a:1,
     e:"Khi người nói tự sửa, thông tin sau cùng mới đúng &rarr; seven."},
    {q:"Why should you predict the type of answer?", o:["To finish early","So you know whether to listen for a number, name or time","To copy your friend","To avoid reading"], a:1,
     e:"Biết trước dạng đáp án giúp tai tập trung đúng loại thông tin cần bắt."},
    {q:"You hear the word &lsquo;museum&rsquo; but the question asks where they finally went. This word might be:", o:["The answer for certain","A distractor","A spelling test","An instruction"], a:1,
     e:"Đề thường nhắc tới nhiều địa điểm; chỉ nơi họ THỰC SỰ đến mới là đáp án, còn lại là từ gây nhiễu."},
    {q:"What should you do if you miss one answer?", o:["Stop and think about it","Move on to the next question","Start again","Guess every answer"], a:1,
     e:"Dừng lại để tiếc một câu sẽ khiến em mất luôn câu sau. Hãy đi tiếp và quay lại ở lần nghe thứ hai."},
    {q:"How many times will you usually hear a Checkpoint listening text?", o:["Once","Twice","Three times","As many as you like"], a:1,
     e:"Thường được nghe hai lần: lần một nắm ý chính, lần hai kiểm tra và bổ sung chi tiết."},
    {q:"You write &lsquo;Jonson&rsquo; but the speaker spelt &lsquo;J-O-H-N-S-O-N&rsquo;. What happens?", o:["It is still correct","The mark is lost because of the spelling","Half a mark","It does not matter"], a:1,
     e:"Với tên riêng được đánh vần, chính tả phải chính xác tuyệt đối mới được điểm."}]},

{ id:"e11", t:"Speaking: describe & give opinions", vi:"Nói: miêu tả và nêu ý kiến",
  kp:[
    {en:"Answer in full sentences, not one word. <i>&lsquo;Do you like sport?&rsquo; &rarr; &lsquo;Yes, I love football because...&rsquo;</i>", vi:"Trả lời thành câu đầy đủ, không đáp một từ."},
    {en:"Always give a reason with <b>because</b> &mdash; it turns a short answer into a good one.", vi:"Luôn thêm lý do với <b>because</b> để câu trả lời trở nên đầy đủ."},
    {en:"To describe a picture, start with the general view, then details: <i>In the picture I can see... On the left there is...</i>", vi:"Miêu tả tranh: nói tổng quát trước, rồi tới chi tiết."},
    {en:"Use position phrases: <i>in the background, on the right, in the middle, next to</i>.", vi:"Dùng cụm chỉ vị trí: in the background, on the right, in the middle, next to."},
    {en:"Give opinions with: <i>I think..., In my opinion..., I would rather...</i>", vi:"Nêu ý kiến bằng: I think..., In my opinion..., I would rather..."},
    {en:"If you do not know a word, describe it instead: <i>&lsquo;It's a thing you use for...&rsquo;</i>", vi:"Không nhớ từ thì hãy miêu tả vòng: &lsquo;It's a thing you use for...&rsquo;"},
    {en:"Speak slowly and clearly. Fluency matters more than using difficult words.", vi:"Nói chậm, rõ ràng; nói trôi chảy quan trọng hơn dùng từ khó."}],
  voc:[["in my opinion","theo ý tôi"],["I would rather","tôi thích hơn"],["in the background","ở phía sau"],["on the right","ở bên phải"],["describe","miêu tả"],["fluency","sự trôi chảy"],["give a reason","đưa ra lý do"],["agree / disagree","đồng ý / không đồng ý"]],
  quiz:[
    {q:"Which is the best answer to &lsquo;Do you enjoy reading?&rsquo;", o:["Yes.","Yes, I do.","Yes, I love adventure stories because they are exciting.","Reading."], a:2,
     e:"Câu trả lời tốt phải có câu đầy đủ + lý do. Trả lời một từ sẽ bị trừ điểm phần Speaking."},
    {q:"Which phrase starts a picture description well?", o:["I don't know","In the picture I can see...","Maybe nothing","The end"], a:1,
     e:"Bắt đầu bằng cái nhìn tổng quát: &lsquo;In the picture I can see...&rsquo; rồi mới đi vào chi tiết."},
    {q:"Which phrase gives an opinion?", o:["There is a dog.","In my opinion, city life is better.","It is raining.","He went home."], a:1,
     e:"&lsquo;In my opinion&rsquo; là cụm nêu quan điểm cá nhân; các câu còn lại chỉ nêu sự việc."},
    {q:"You forget the word &lsquo;umbrella&rsquo;. What is the best strategy?", o:["Stop talking","Say it in Vietnamese","Describe it: &lsquo;the thing you use when it rains&rsquo;","Change the subject"], a:2,
     e:"Miêu tả vòng giúp giữ mạch nói và vẫn ghi điểm giao tiếp — dừng lại hoặc chuyển sang tiếng Việt thì mất điểm."},
    {q:"Which phrase describes position in a picture?", o:["Last year","On the right","Because","However"], a:1,
     e:"&lsquo;On the right&rsquo; chỉ vị trí trong tranh; because và however là từ nối ý."},
    {q:"What matters most in the speaking test?", o:["Using very difficult words","Speaking clearly and keeping going","Speaking as fast as possible","Being silent to think"], a:1,
     e:"Giám khảo chấm sự rõ ràng và trôi chảy. Dùng từ khó nhưng ngập ngừng sẽ không được điểm cao hơn."},
    {q:"Complete: &lsquo;I ______ play outside than watch TV.&rsquo;", o:["would rather","would like","prefer to rather","am rather"], a:0,
     e:"Cấu trúc &lsquo;would rather + V nguyên thể + than&rsquo; dùng để nêu điều mình thích hơn."}]}
]}
};
</script>

<script>
/* Câu hỏi bổ sung để mỗi unit có SỐ CÂU QUIZ = SỐ Ý CHÍNH */
const EXTRA = {
s1:[{q:"Which blood vessel has valves inside it?", o:["Artery","Vein","Capillary","Aorta"], a:1,
     e:"Máu trong tĩnh mạch chảy chậm và áp lực thấp nên cần van một chiều để không chảy ngược."},
    {q:"Why are capillary walls only one cell thick?", o:["To make them strong","So oxygen and nutrients can pass into the cells","To carry more blood","To keep blood warm"], a:1,
     e:"Thành cực mỏng cho phép oxygen và chất dinh dưỡng khuếch tán ra tế bào, đồng thời nhận lại chất thải."}],
s2:[{q:"Which of these is a REVERSIBLE change?", o:["Baking a cake","Melting butter","Burning paper","Frying an egg"], a:1,
     e:"Bơ tan chảy rồi để nguội lại đông cứng — vẫn là bơ, không tạo chất mới."},
    {q:"How do you separate salt from a mixture of sand and salt?", o:["Use a magnet","Add water, filter, then evaporate","Burn the mixture","Freeze it"], a:1,
     e:"Ba bước: hoà tan muối vào nước, lọc bỏ cát, rồi cho nước bay hơi để thu lại muối."}],
s3:[{q:"Which group has moist skin and lays eggs in water?", o:["Reptiles","Amphibians","Birds","Mammals"], a:1,
     e:"Lưỡng cư (ếch, cóc) có da ẩm và đẻ trứng dưới nước; bò sát thì da khô có vảy và đẻ trứng trên cạn."},
    {q:"What is the job of a decomposer?", o:["To make its own food","To hunt other animals","To break down dead plants and animals","To pollinate flowers"], a:2,
     e:"Sinh vật phân huỷ (nấm, vi khuẩn) phân giải xác sinh vật, trả chất dinh dưỡng lại cho đất."}],
s4:[{q:"In which state are the particles far apart and moving very fast?", o:["Solid","Liquid","Gas","All the same"], a:2,
     e:"Chất khí có các hạt cách xa nhau và chuyển động rất nhanh, nên khí lan đầy mọi không gian."},
    {q:"Washing dries faster on a windy day because:", o:["Wind is cold","Wind carries away water vapour so evaporation speeds up","Wind adds heat","Wind makes clothes heavier"], a:1,
     e:"Gió cuốn hơi nước đi khỏi bề mặt, giúp thêm nhiều hạt nước tiếp tục bay hơi."}],
s5:[{q:"Which force pulls a dropped ball towards the ground?", o:["Friction","Gravity","Air resistance","Magnetism"], a:1,
     e:"Trọng lực kéo mọi vật về tâm Trái Đất. Lực cản không khí thì chống lại chuyển động rơi."},
    {q:"Which change INCREASES friction?", o:["Adding oil","Polishing the surface","Making the surface rougher","Using wheels"], a:2,
     e:"Bề mặt càng nhám thì ma sát càng lớn. Dầu, đánh bóng và bánh xe đều làm giảm ma sát."}],
s6:[{q:"Which material is opaque?", o:["Clear glass","Thin paper","A wooden door","Cling film"], a:2,
     e:"Cửa gỗ chặn hoàn toàn ánh sáng nên là vật cản sáng (opaque), vì thế nó tạo bóng rõ nét."},
    {q:"How does light travel?", o:["In curves","In straight lines","In circles","Only downwards"], a:1,
     e:"Ánh sáng truyền thẳng — đó là lý do bóng có hình giống vật và ta không nhìn được qua góc tường."}],
s7:[{q:"What happens when a switch is turned off?", o:["It makes a gap so the current stops","It adds more voltage","It removes the cell","It cools the wire"], a:0,
     e:"Công tắc tắt tạo khe hở, mạch không còn kín nên dòng điện ngừng chạy."},

 {u:"s9",q:"To make a test fair you must:", o:["Change several things at once","Change one thing and keep the rest the same","Do it only once","Guess the results"], a:1, e:"Chỉ đổi một biến, giữ nguyên tất cả các biến còn lại."},
 {u:"s9",q:"Repeating readings and taking an average makes results more:", o:["Colourful","Reliable","Difficult","Expensive"], a:1, e:"Lặp lại và lấy trung bình giúp giảm sai số, kết quả đáng tin cậy hơn."}]},

 {u:"m4",q:"12 + 6 &divide; 3 =", o:["6","14","18","2"], a:1, e:"Chia trước: 6 &divide; 3 = 2, rồi 12 + 2 = 14."},

 {u:"m8",q:"3.2 kg in grams is:", o:["32 g","320 g","3200 g","0.32 g"], a:2, e:"1 kg = 1000 g nên 3.2 &times; 1000 = 3200 g."},
 {u:"m9",q:"A cube has sides of 3 cm. Its volume is:", o:["9 cm&sup3;","18 cm&sup3;","27 cm&sup3;","12 cm&sup3;"], a:2, e:"3 &times; 3 &times; 3 = 27 cm&sup3;."},
 {u:"m10",q:"The mean of 5, 9, 10 and 8 is:", o:["8","8.5","9","32"], a:0, e:"Tổng = 32, chia cho 4 &rarr; 8."},
 {u:"m11",q:"A bag has 4 green and 6 yellow counters. P(green) is:", o:["4/6","4/10","6/10","1/4"], a:1, e:"Tổng 10 quân, 4 quân xanh &rarr; 4/10 (tức 2/5)."},
 {u:"m12",q:"A book costs $6.50. How much change from $20 after buying two?", o:["$13.50","$7.00","$6.50","$13.00"], a:1, e:"Bước 1: 2 &times; 6.50 = $13.00. Bước 2: 20 &minus; 13 = $7.00."}]},

 {u:"e1",q:"They ______ the museum last Friday.", o:["have visited","visited","has visited","visit"], a:1, e:"Có mốc quá khứ &lsquo;last Friday&rsquo; nên dùng quá khứ đơn."},

 {u:"e7",q:"You ______ swim here. The water is dangerous.", o:["mustn't","don't have to","should","might"], a:0, e:"Nguy hiểm nên đây là điều cấm &rarr; mustn't."},
 {u:"e8",q:"Which connective shows a result?", o:["although","however","so","but"], a:2, e:"&lsquo;so&rsquo; dẫn tới kết quả; although, however, but đều chỉ tương phản."},
 {u:"e9",q:"The opposite of &lsquo;possible&rsquo; is:", o:["unpossible","impossible","dispossible","nonpossible"], a:1, e:"Tiền tố im- dùng trước các từ bắt đầu bằng p &rarr; impossible."},
 {u:"e10",q:"Before a listening test you should:", o:["Close the paper","Read the questions","Write random answers","Talk to a friend"], a:1, e:"Đọc câu hỏi trước để biết cần nghe thông tin gì."},
 {u:"e11",q:"Which answer would score highest in a speaking test?", o:["Yes.","Yes, I do.","Yes, because I enjoy playing with my cousins at weekends.","No."], a:2, e:"Câu đầy đủ kèm lý do luôn được điểm cao nhất."}]}

<script>
const KID = "Lâm";
const SUBJ_IDS = ["science","math","esl"];
const view = document.getElementById('view');
const ttl  = document.getElementById('ttl');
const backBtn = document.getElementById('back');
const topright = document.getElementById('topright');
const tabsEl = document.getElementById('tabs');

/* mỗi unit: số câu quiz = số ý chính */
SUBJ_IDS.forEach(k => DATA[k].units.forEach(u => {
  if(EXTRA[u.id]) u.quiz = u.quiz.concat(EXTRA[u.id]);
  u.subject = k;
}));

/* ---------- lưu trữ ---------- */
const KEY = "checkpointlab.v2";
let S = {units:{}, streak:0, lastDay:null, doneToday:[], hist:{}, srs:{}, exams:{}, showVI:false, tts:true};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const today = () => new Date().toISOString().slice(0,10);
const dayAdd = (n) => new Date(Date.now()+n*864e5).toISOString().slice(0,10);
(function rollDay(){
  const t = today();
  if(S.lastDay !== t){
    S.streak = (S.lastDay === dayAdd(-1)) ? S.streak : 0;
    S.doneToday = []; S.lastDay = t; save();
  }
})();
function addMinutes(m){ S.hist[today()] = Math.round((S.hist[today()]||0) + m); save(); }
function markDone(uid, pct){
  const u = S.units[uid] || {best:0, tries:0};
  const before = (S.pts && S.pts.claimed[uid]) || 0;
  u.best = Math.max(u.best, pct); u.last = pct; u.tries++; u.date = today();
  S.units[uid] = u;
  if(!S.doneToday.includes(uid)){ S.doneToday.push(uid); if(S.doneToday.length===1) S.streak = (S.streak||0)+1; }
  syncPoints();
  LAST_DELTA = ((S.pts && S.pts.claimed[uid]) || 0) - before;
  save();
}
/* ôn lại câu sai theo khoảng cách tăng dần */
const GAPS = [1,2,4,7,14];
function srsWrong(uid,i){ S.srs[uid+":"+i] = {box:0, due:dayAdd(1)}; save(); }
function srsRight(uid,i){
  const k=uid+":"+i, it=S.srs[k]; if(!it) return;
  it.box = Math.min(it.box+1, GAPS.length-1);
  if(it.box >= GAPS.length-1){ delete S.srs[k]; } else { it.due = dayAdd(GAPS[it.box]); }
  save();
}
function dueList(){
  const t = today(), out=[];
  Object.keys(S.srs).forEach(k=>{
    if(S.srs[k].due > t) return;
    const [uid,i] = k.split(":"); const u = findUnit(uid); if(!u) return;
    const q = u.quiz[+i]; if(q) out.push({uid, i:+i, q, k:u.subject});
  });
  return out;
}
function findUnit(uid){ for(const k of SUBJ_IDS){ const u = DATA[k].units.find(x=>x.id===uid); if(u) return u; } return null; }

/* ---------- tiện ích ---------- */
const el = (h)=>{ const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstElementChild; };
const plain = (h)=>{ const d=document.createElement('div'); d.innerHTML=h; return (d.textContent||"").trim(); };
const subjStyle = (k)=>`--ac:var(${DATA[k].ac}); --ac-bg:var(${DATA[k].acbg})`;
const readyUnits = (k)=>DATA[k].units;
const allUnits = ()=>SUBJ_IDS.flatMap(k=>DATA[k].units.map(u=>({k,u})));
function pct(k){ const r=readyUnits(k); return Math.round(r.reduce((a,u)=>a+((S.units[u.id]||{}).best||0),0)/r.length); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- phát âm ---------- */
let voice=null;
function pickVoice(){ const v=speechSynthesis.getVoices();
  voice = v.find(x=>x.lang==="en-GB") || v.find(x=>x.lang && x.lang.startsWith("en")) || null; }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!S.tts || !window.speechSynthesis) return;
  try{ speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain(text));
    u.lang="en-GB"; u.rate=.88; if(voice) u.voice=voice; speechSynthesis.speak(u);
  }catch(e){}
}
const spk = (t)=>`<button class="spk" data-say="${t.replace(/"/g,'&quot;')}" aria-label="Nghe phát âm">&#128266;</button>`;

/* ---------- mindmap ---------- */
function wrap(s, max){
  if(s.length<=max) return [s];
  const w=s.split(" "); let a="",b="";
  w.forEach(x=>{ if((a+" "+x).trim().length<=max && b==="") a=(a+" "+x).trim(); else b=(b+" "+x).trim(); });
  return [a,b];
}
function mindmapSVG(uid, title){
  const items = (MM[uid]||[]).map(s=>s.split("|"));
  if(!items.length) return "";
  const rowH=52, top=54, H = top + items.length*rowH + 12, cx=160;
  let out = `<svg viewBox="0 0 320 ${H}" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">`;
  out += `<path d="M${cx} 34 v${H-56}" stroke="var(--ac)" stroke-width="2" fill="none" stroke-dasharray="3 5" opacity=".55"/>`;
  const t = wrap(title, 26);
  out += `<rect x="42" y="6" width="236" height="${t.length>1?34:26}" rx="9" fill="var(--ac)"/>`;
  out += `<text x="${cx}" y="${t.length>1?20:23}" text-anchor="middle" font-family="Literata,serif" font-size="12" font-weight="700" fill="var(--card)">${t[0]}</text>`;
  if(t[1]) out += `<text x="${cx}" y="34" text-anchor="middle" font-family="Literata,serif" font-size="12" font-weight="700" fill="var(--card)">${t[1]}</text>`;
  items.forEach((it,i)=>{
    const y = top + i*rowH, left = i%2===0;
    const bx = left ? 6 : 176, tx = left ? 12 : 182;
    out += `<path d="M${cx} ${y+20} H${left?138:182}" stroke="var(--ac)" stroke-width="2" fill="none" opacity=".6"/>`;
    out += `<circle cx="${cx}" cy="${y+20}" r="3.5" fill="var(--ac)"/>`;
    out += `<rect x="${bx}" y="${y}" width="138" height="42" rx="10" fill="var(--ac-bg)" stroke="var(--ac)" stroke-width="1.2" opacity=".95"/>`;
    const en = wrap(it[0], 21);
    out += `<text x="${tx}" y="${y+16}" font-family="Lexend,sans-serif" font-size="9.5" font-weight="500" fill="var(--ink)">${en[0]}</text>`;
    if(en[1]) out += `<text x="${tx}" y="${y+27}" font-family="Lexend,sans-serif" font-size="9.5" font-weight="500" fill="var(--ink)">${en[1]}</text>`;
    out += `<text x="${tx}" y="${y+(en[1]?38:30)}" font-family="Lexend,sans-serif" font-size="8.5" fill="var(--ink-soft)">${wrap(it[1]||"",24)[0]}</text>`;
  });
  return out + `</svg>`;
}
const diagramFor = (uid)=> DIA[uid] ? `<div class="card" style="padding:14px 12px">${DIA[uid]}</div>` : "";

/* ---------- router ---------- */
let ST = {v:"home"};
const ROOTS = ["home","subjects","review","progress","wallet","admin","login","lock","setpin"];
function go(v, patch){ ST = Object.assign({}, patch||{}, {v}); render(); window.scrollTo(0,0); }
backBtn.onclick = ()=>{
  if(ST.v==="unit") go(ST.bu!=null?"bookunit":"subject",{k:ST.k,bu:ST.bu});
  else if(ST.v==="bookunit"||ST.v==="source") go("subject",{k:ST.k});
  else if(ST.v==="quiz"||ST.v==="result") go(ST.src==="unit"?"unit":(ST.src==="mix"?"bookunit":"home"),{k:ST.k,uid:ST.uid,bu:ST.bu});
  else if(ST.v==="exam"||ST.v==="examresult") go(ST.paper ? (ST.paper.back||"bookunit") : "exams",{k:ST.k,bu:ST.bu});
  else if(ST.v==="session") go("home");
  else go(S.role==="admin" ? "admin" : "home");
};
function render(){
  backBtn.hidden = ROOTS.includes(ST.v);
  topright.innerHTML = "";
  tabsEl.style.display = (["session","exam","login","lock","setpin"].includes(ST.v)) ? "none" : "flex";
  view.className = "fade";
  if(ST.v!=="exam" && ST.v!=="session") clearInterval(timerId);
  const fn = {lock:vLock, setpin:vSetPin, periodic:vPeriodic, login:vLogin, wallet:vWallet, admin:vAdmin, home:vHome, subjects:vSubjects, subject:vSubject, bookunit:vBookUnit, source:vSource,
    unit:vUnit, quiz:vQuiz, result:vResult, session:vSession, review:vReview, progress:vProgress,
    exams:vExams, exam:vExam, examresult:vExamResult, settings:vSettings, report:vReport}[ST.v];
  fn();
  bindCommon(); renderTabs();
}
function bindCommon(){
  view.querySelectorAll('[data-say]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); say(b.dataset.say); });
  view.querySelectorAll('.veil').forEach(n=>n.onclick=()=>n.classList.remove('veil'));
}
function renderTabs(){
  const d = dueList().length;
  const cho = S.pts ? S.pts.reqs.filter(r=>r.st==="cho").length : 0;
  const items = S.role==="admin"
    ? [["admin","&#128100;","Bố mẹ",cho],["report","&#128203;","Báo cáo",0],
       ["subjects","&#128214;","Môn học",0],["progress","&#128200;","Tiến độ",0]]
    : [["home","&#127968;","Hôm nay",0],["subjects","&#128214;","Môn học",0],
       ["review","&#128260;","Ôn lại",d],["wallet","&#11088;","Thưởng",0],
       ["progress","&#128200;","Tiến độ",0]];
  const cur = ROOTS.includes(ST.v) || ST.v==="report" ? ST.v
    : (["subject","bookunit","unit","source"].includes(ST.v) ? "subjects" : (ST.v==="session"?"home":""));
  tabsEl.innerHTML = items.map(([id,ic,lb,b])=>
    `<button class="tab" data-go="${id}" aria-current="${cur===id}"><span>${ic}</span><span>${lb}</span>${b?`<span class="badge">${b>99?"99+":b}</span>`:""}</button>`).join("");
  tabsEl.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}
const viClass = ()=> S.showVI ? "" : " veil";

/* ---------- HÔM NAY ---------- */
function vHome(){
  ttl.textContent = "Checkpoint Lab";
  topright.innerHTML = `<span class="streak">&#128293; ${S.streak||0} ngày</span>
    <button class="spk" id="gear" aria-label="Cài đặt">&#9881;&#65039;</button>`;
  topright.querySelector('#gear').onclick=()=>go("settings");
  const hour=new Date().getHours();
  const hi = hour<11?"Chào buổi sáng":hour<18?"Chào buổi chiều":"Chào buổi tối";
  const due = dueList().length;
  view.innerHTML = `<div class="stack">
    <div class="hero">
      <p class="eyebrow">${hi}, ${KID}</p>
      <h2>Phiên ôn 15 phút hôm nay</h2>
      <p style="font-size:14px;color:var(--ink-soft)">Ba chặng ngắn: nhớ lại &rarr; học kỹ &rarr; kiểm tra. Xong là nhớ hết ý chính của bài.</p>
      <div class="plan">
        <div class="leg"><b>1. Nhớ lại</b><small>4 phút &middot; thẻ lật</small></div>
        <div class="leg"><b>2. Học kỹ</b><small>6 phút &middot; mindmap</small></div>
        <div class="leg"><b>3. Kiểm tra</b><small>5 phút &middot; quiz</small></div>
      </div>
      <button class="btn" id="start">${S.doneToday.length? "Ôn thêm một phiên nữa" : "Bắt đầu phiên hôm nay"} &rarr;</button>
      <p style="font-size:13px;margin-top:11px;text-align:center;color:${S.doneToday.length>=(S.goal||1)?"var(--good)":"var(--ink-soft)"}">
        ${S.doneToday.length>=(S.goal||1)?"&#10003; Đã đạt mục tiêu hôm nay":"Mục tiêu hôm nay"}:
        <b>${S.doneToday.length}/${S.goal||1} phiên</b>${S.hist[today()]?` &middot; ${S.hist[today()]} phút`:""}</p>
    </div>
    ${due? `<button class="unit" id="rv" style="--ac:var(--bad);--ac-bg:var(--bad-bg)"><div class="row">
      <span class="num">${due}</span><div style="flex:1"><h4>Ôn lại câu đã làm sai</h4>
      <p class="en">Đến hạn ôn hôm nay &middot; khoảng 3 phút</p></div><span style="color:var(--ink-faint)">&rsaquo;</span></div></button>`:""}
    <div><p class="label" style="margin-bottom:9px">Ba môn</p><div class="stack-s" id="sl"></div></div>
    <button class="unit" id="pe"><div class="row"><span style="font-size:20px">&#128197;</span>
      <div style="flex:1"><h4>Ôn tập định kỳ</h4><p class="en">Kiểm tra theo tuần, theo tháng và cả năm</p></div>
      <span style="color:var(--ink-faint)">&rsaquo;</span></div></button>
    <button class="unit" id="ex"><div class="row"><span style="font-size:20px">&#128221;</span>
      <div style="flex:1"><h4>Đề thi thử Checkpoint</h4><p class="en">3 đề &middot; 12 câu &middot; 25 phút mỗi đề</p></div>
      <span style="color:var(--ink-faint)">&rsaquo;</span></div></button>
    <button class="unit" id="rp"><div class="row"><span style="font-size:20px">&#128203;</span>
      <div style="flex:1"><h4>Báo cáo cho bố mẹ</h4><p class="en">Tuần này con học thế nào</p></div>
      <span style="color:var(--ink-faint)">&rsaquo;</span></div></button>
  </div>`;
  const sl = view.querySelector('#sl');
  SUBJ_IDS.forEach(k=>{
    const s=DATA[k], p=pct(k), done=s.units.filter(u=>S.units[u.id]).length;
    const b = el(`<button class="subj" style="${subjStyle(k)}"><div class="row">
      <span style="font-size:20px">${s.icon}</span>
      <div style="flex:1"><h3>${s.vi} <span style="font-family:Lexend;font-weight:400;font-size:13px;color:var(--ink-soft)">${s.name}</span></h3>
      <p class="n">${done}/${s.units.length} unit đã học</p></div>

    <div id="after"></div></div>`;
  const opts=view.querySelector('#opts'), after=view.querySelector('#after');
  q.o.forEach((o,j)=>{
    const b=el(`<button class="opt"><span class="k">${"ABCD"[j]}</span><span>${o}</span></button>`);
    b.onclick=()=>answer(j); opts.appendChild(b);
  });
  function answer(j){
    [...opts.children].forEach((b,x)=>{ b.disabled=true;
      if(x===q.a) b.dataset.s="right"; else if(x===j) b.dataset.s="wrong"; });
    ST.ans[n]=j;

    ok ? srsRight(item.uid||ST.uid, item.i) : srsWrong(item.uid||ST.uid, item.i);
    after.innerHTML = `<div class="stack fade" style="margin-top:16px">
      <div class="expl"><p class="v" style="color:var(--${ok?'good':'bad'})">${ok?"&#10003; Chính xác":"&#10007; Chưa đúng &mdash; đáp án đúng là "+"ABCD"[q.a]}</p><p>${q.e}</p></div>
      <button class="btn" id="nx">${n+1<ST.qs.length?"Câu tiếp theo &rarr;":"Xem kết quả &rarr;"}</button></div>`;
    after.querySelector('#nx').onclick=()=>{
      if(n+1<ST.qs.length) go("quiz",Object.assign({},ST,{n:n+1}));
      else go("result",Object.assign({},ST));
    };
  }
}

/* ---------- PHIÊN 15 PHÚT ---------- */
let timerId=null, endAt=0;
function startSession(){
  const pool = allUnits();
  const fresh = pool.filter(x=>!S.doneToday.includes(x.u.id) && !S.units[x.u.id]);
  const seen  = pool.filter(x=>!S.doneToday.includes(x.u.id));
  const pick = (fresh.length?fresh:(seen.length?seen:pool));
  const c = pick[Math.floor(Math.random()*pick.length)];
  endAt = Date.now()+15*60*1000;
  go("session",{k:c.k, uid:c.u.id, phase:0, ci:0, flipped:false});
}
function tick(){
  const t=Math.max(0,endAt-Date.now());
  const n=document.getElementById('clk'); if(!n) return;
  n.textContent = `${String(Math.floor(t/60000)).padStart(2,'0')}:${String(Math.floor(t%60000/1000)).padStart(2,'0')}`;
  n.classList.toggle('low', t<120000);
}
function vSession(){
  const k=ST.k, u=findUnit(ST.uid);
  ttl.textContent = "Phiên 15 phút";
  topright.innerHTML = `<span class="timer" id="clk">15:00</span>`;
  clearInterval(timerId); timerId=setInterval(tick,1000); tick();
  const cards=u.kp.slice(0,4);
  if(ST.phase===0){
    view.innerHTML = `<div class="stack" style="${subjStyle(k)}">
      <div class="hero"><p class="eyebrow">${DATA[k].vi} &middot; hôm nay ôn</p>

        <div class="plan"><div class="leg"><b>4 thẻ</b><small>nhớ lại</small></div>

        <button class="btn btn-accent" id="g1">Bắt đầu &rarr;</button></div>
      <button class="btn btn-ghost" id="sk">Đổi bài khác</button></div>`;
    view.querySelector('#g1').onclick=()=>go("session",Object.assign({},ST,{phase:1,ci:0,flipped:false}));
    view.querySelector('#sk').onclick=()=>startSession();
  } else if(ST.phase===1){
    const c=cards[ST.ci];
    view.innerHTML = `<div class="stack" style="${subjStyle(k)}">
      <div class="row"><span class="label">Chặng 1 &middot; Nhớ lại</span><span class="spacer"></span>
        ${spk(c.en)}<span class="pill mono">${ST.ci+1}/${cards.length}</span></div>
      <div class="fc" id="card"><p class="q">${c.en}</p>
        ${ST.flipped?`<p class="a fade">${c.vi}</p>`:`<p class="a" style="color:var(--ink-faint)">Chạm vào thẻ để xem nghĩa tiếng Việt</p>`}</div>
      <button class="btn ${ST.flipped?'btn-accent':'btn-ghost'}" id="nx">${ST.flipped?(ST.ci+1<cards.length?"Thẻ tiếp theo &rarr;":"Sang chặng học kỹ &rarr;"):"Lật thẻ"}</button></div>`;
    const flip=()=>go("session",Object.assign({},ST,{flipped:true}));
    view.querySelector('#card').onclick=()=>{ if(!ST.flipped) flip(); };
    view.querySelector('#nx').onclick=()=>{
      if(!ST.flipped) return flip();
      if(ST.ci+1<cards.length) go("session",Object.assign({},ST,{ci:ST.ci+1,flipped:false}));
      else go("session",Object.assign({},ST,{phase:2}));
    };
  } else {
    view.innerHTML = `<div class="stack" style="${subjStyle(k)}">
      <div class="row"><span class="label">Chặng 2 &middot; Học kỹ</span><span class="spacer"></span>

        <p class="en" style="flex:1">${i+1}. ${p.en}</p>${spk(p.en)}</div>
        <p class="vi${viClass()}">${p.vi}</p></div>`).join("")}</div>

        `<div class="voc">${spk(a)}<b>${a}</b><i class="${S.showVI?"":"veil"}">${b}</i></div>`).join("")}</div>
      <button class="btn btn-accent" id="toq">Chặng 3 &middot; Kiểm tra ${u.quiz.length} câu &rarr;</button></div>`;
    view.querySelector('#toq').onclick=()=>{

function vExamResult(){
  const k=ST.k, ex=ST.paper || EXAMS[k];
  clearInterval(timerId);
  const right = ex.qs.filter((q,i)=>ST.ans[i]===q.a).length;
  const p = Math.round(right/ex.qs.length*100);
  const key = ST.paper ? ST.paper.key : k;
  const store = ST.paper ? (S.tests = S.tests || {}) : S.exams;
  const rec = store[key] || {best:0, tries:0};
  rec.best=Math.max(rec.best,p); rec.last=p; rec.tries++; rec.date=today();
  store[key]=rec; addMinutes(ex.mins);
  const pkey = ST.paper ? ("test_"+ST.paper.key) : ("exam_"+k);
  const _b=(S.pts&&S.pts.claimed[pkey])||0; syncPoints();
  LAST_DELTA = ((S.pts&&S.pts.claimed[pkey])||0)-_b; save();
  const byUnit={};
  ex.qs.forEach((q,i)=>{ if(!q.u) return; byUnit[q.u]=byUnit[q.u]||{r:0,n:0}; byUnit[q.u].n++; if(ST.ans[i]===q.a) byUnit[q.u].r++; });
  const weak = Object.keys(byUnit).filter(id=>byUnit[id].r<byUnit[id].n);
  ttl.textContent = "Kết quả thi thử";
  view.innerHTML = `<div class="stack" style="${subjStyle(k)}">
    <div class="hero" style="text-align:center"><p class="label">${ex.vi}</p>
      <p class="score" style="color:var(--ac);margin:10px 0 4px">${p}%</p>
      <p style="font-size:14px;color:var(--ink-soft)">Đúng ${right}/${ex.qs.length} câu</p>
      <p style="font-size:14px;margin-top:10px">${p>=80?"Mức này đã sẵn sàng cho kỳ thi.":p>=60?"Gần đạt — tập trung vào các unit còn yếu bên dưới.":"Cần ôn lại các unit bên dưới rồi thi lại."}</p>
      ${LAST_DELTA>0?`<p style="margin-top:12px"><span class="chip">&#11088; +${LAST_DELTA} điểm thưởng</span></p>`:""}</div>
    ${weak.length?`<div><p class="label" style="margin-bottom:9px">Unit cần ôn lại</p><div class="stack-s" id="w"></div></div>`:""}
    <div><p class="label" style="margin-bottom:9px">Chi tiết từng câu</p><div class="stack-s" id="rv"></div></div>
    <button class="btn btn-ghost" id="bk">Về danh sách đề</button></div>`;
  if(weak.length){ const w=view.querySelector('#w');
    weak.forEach(id=>{ const u=findUnit(id); if(!u) return;
      const b=el(`<button class="unit"><div class="row"><span class="dot"></span>
        <div style="flex:1"><h4>${u.vi}</h4><p class="en">${byUnit[id].r}/${byUnit[id].n} câu đúng</p></div>
        <span style="color:var(--ink-faint)">&rsaquo;</span></div></button>`);
      b.onclick=()=>go("unit",{k:u.subject,uid:id}); w.appendChild(b); }); }
  const rv=view.querySelector('#rv');
  ex.qs.forEach((q,i)=>{
    const ok=ST.ans[i]===q.a;
    rv.appendChild(el(`<div class="rev"><p class="qq"><span class="${ok?'tick':'cross'}">${ok?"&#10003;":"&#10007;"}</span> ${i+1}. ${q.q}</p>
      <p class="aa">Đáp án đúng: <b>${q.o[q.a]}</b>${ST.ans[i]==null?" &middot; <i>bỏ trống</i>":""}</p>
      ${ok?"":`<p class="aa" style="color:var(--ink-soft)">${q.e}</p>`}</div>`));
  });
  view.querySelector('#bk').onclick=()=> ST.paper ? go(ST.paper.back||"bookunit",{k:k,bu:ST.bu}) : go("exams");
}
