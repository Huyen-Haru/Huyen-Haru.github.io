     e:"Thụ tinh là thời điểm tinh trùng và trứng kết hợp tạo ra một tế bào mới, khởi đầu của một cơ thể mới."},
    {q:"Where does a human baby develop before it is born?", o:["In the stomach","In the uterus","In the lungs","In an egg outside the body"], a:1,
     e:"Em bé phát triển trong tử cung (uterus) của mẹ, không phải trong dạ dày — đây là chỗ rất hay bị nhầm."},
    {q:"How long does human pregnancy usually last?", o:["About 3 months","About 6 months","About 9 months","About 12 months"], a:2,
     e:"Khoảng 9 tháng, tức 40 tuần. Mỗi loài có thời gian mang thai khác nhau."},
    {q:"What does the umbilical cord do?", o:["Helps the baby breathe air","Carries food and oxygen from the mother to the baby","Keeps the baby warm","Makes the baby's bones"], a:1,
     e:"Dây rốn nối em bé với nhau thai, mang chất dinh dưỡng và oxygen vào, mang chất thải ra."},
    {q:"Puberty is the time when:", o:["A baby is born","A child's body changes into an adult body","Someone becomes elderly","Teeth first appear"], a:1,
     e:"Dậy thì là giai đoạn cơ thể thay đổi để trở thành người lớn, thường bắt đầu trong khoảng 10 đến 16 tuổi."},
    {q:"Put the human life cycle in order.", o:["baby, adult, child, elderly","baby, child, adolescent, adult, elderly","child, baby, adult, elderly","adult, child, baby, elderly"], a:1,
     e:"Sơ sinh &rarr; trẻ em &rarr; thiếu niên &rarr; trưởng thành &rarr; người già. Giai đoạn thiếu niên (adolescent) hay bị bỏ sót."}]},

{ id:"s14", subject:"science", t:"Diseases", vi:"Bệnh tật",
  kp:[
    {en:"Infectious diseases are caused by microorganisms &mdash; bacteria, viruses and fungi &mdash; and can pass from person to person.", vi:"Bệnh truyền nhiễm do vi sinh vật gây ra (vi khuẩn, virus, nấm) và lây từ người sang người."},
    {en:"Non-infectious diseases such as asthma or scurvy do NOT spread between people.", vi:"Bệnh không truyền nhiễm như hen suyễn hay thiếu vitamin C thì không lây."},
    {en:"Diseases spread by touch, by droplets in the air when we cough or sneeze, by dirty water and by insects.", vi:"Bệnh lây qua tiếp xúc, qua giọt bắn khi ho hắt hơi, qua nước bẩn và qua côn trùng."},
    {en:"Washing hands with soap, covering coughs and drinking clean water stop many diseases spreading.", vi:"Rửa tay bằng xà phòng, che miệng khi ho và uống nước sạch chặn được nhiều bệnh."},
    {en:"A vaccine teaches the body to fight one disease before you ever catch it.", vi:"Vắc-xin dạy cơ thể cách chống lại một bệnh trước khi ta mắc bệnh đó."},
    {en:"Antibiotics kill bacteria but they do NOT work against viruses such as the common cold.", vi:"Kháng sinh diệt vi khuẩn nhưng KHÔNG có tác dụng với virus như cảm lạnh."},
    {en:"White blood cells are the body's own defence: they attack microorganisms that get inside.", vi:"Bạch cầu là hàng phòng thủ của cơ thể, tấn công vi sinh vật lọt vào bên trong."}],
  voc:[["infectious","truyền nhiễm, lây được"],["microorganism","vi sinh vật"],["bacteria","vi khuẩn"],["virus","vi rút"],["droplet","giọt bắn"],["vaccine","vắc-xin"],["antibiotic","thuốc kháng sinh"],["immune","miễn dịch"],["hygiene","vệ sinh"],["symptom","triệu chứng"]],
  quiz:[
    {q:"Which of these is an INFECTIOUS disease?", o:["Asthma","Flu","Scurvy","Short sight"], o2:null, a:1,
     e:"Cúm do virus gây ra và lây từ người sang người. Hen suyễn, thiếu vitamin C và cận thị đều không lây."},
    {q:"How does a cold most often spread?", o:["Through droplets when someone coughs or sneezes","Through sunlight","Through cold weather alone","Through eating vegetables"], a:0,
     e:"Virus cảm lạnh bay theo giọt bắn khi ho, hắt hơi. Trời lạnh không tự gây bệnh, nó chỉ khiến ta ở trong nhà đông người hơn."},
    {q:"Why do antibiotics not cure a cold?", o:["Colds are caused by viruses, not bacteria","Colds are too strong","Antibiotics are too weak","Colds are not real diseases"], a:0,
     e:"Kháng sinh chỉ diệt vi khuẩn. Cảm lạnh do virus nên uống kháng sinh vừa vô ích vừa gây kháng thuốc."},
    {q:"What does a vaccine do?", o:["Kills all bacteria in the body","Prepares the body to fight one disease before you catch it","Cures every illness","Replaces washing hands"], a:1,
     e:"Vắc-xin tập cho hệ miễn dịch nhận diện một mầm bệnh, nên khi gặp thật thì cơ thể chống lại được ngay."},
    {q:"Which habit stops the most diseases spreading in school?", o:["Washing hands with soap","Sitting still","Drinking hot tea","Wearing a hat"], a:0,
     e:"Rửa tay bằng xà phòng loại bỏ vi sinh vật trên tay — biện pháp rẻ và hiệu quả nhất."},
    {q:"Which part of the blood fights microorganisms?", o:["Red blood cells","White blood cells","Platelets","Plasma"], a:1,
     e:"Bạch cầu (white blood cells) là lực lượng phòng thủ; hồng cầu chở oxygen, tiểu cầu làm đông máu."},
    {q:"Malaria is spread by mosquitoes. This makes the mosquito a:", o:["Vaccine","Vector that carries the disease","Symptom","Antibiotic"], a:1,
     e:"Con vật mang mầm bệnh từ người này sang người khác gọi là vật trung gian truyền bệnh (vector)."}]},

{ id:"s15", subject:"science", t:"Properties of substances", vi:"Tính chất của các chất",
  kp:[
    {en:"A property is something we can observe or measure about a material: hardness, strength, flexibility, transparency.", vi:"Tính chất là điều ta quan sát hoặc đo được ở vật liệu: độ cứng, độ bền, độ dẻo, độ trong suốt."},
    {en:"Materials are chosen for a job because of their properties &mdash; glass is transparent, rubber is flexible and waterproof.", vi:"Người ta chọn vật liệu theo tính chất: thuỷ tinh trong suốt, cao su dẻo và không thấm nước."},
    {en:"Solubility is whether a substance dissolves in water. Sugar is soluble; sand is insoluble.", vi:"Độ tan là khả năng hoà tan trong nước: đường tan, cát không tan."},
    {en:"Only iron, steel, nickel and cobalt are magnetic. Other metals such as copper and aluminium are NOT.", vi:"Chỉ sắt, thép, niken và coban có từ tính; đồng và nhôm thì không, dù cũng là kim loại."},
    {en:"Density decides whether something floats: an object less dense than water floats.", vi:"Khối lượng riêng quyết định vật nổi hay chìm: nhẹ hơn nước thì nổi."},
    {en:"Test properties fairly: use pieces of the same size and test each material the same way.", vi:"Thử tính chất phải công bằng: dùng mẫu cùng kích thước và thử theo cùng một cách."}],
  voc:[["property","tính chất"],["hardness","độ cứng"],["flexible","dẻo, uốn được"],["transparent","trong suốt"],["waterproof","không thấm nước"],["soluble","tan được"],["magnetic","có từ tính"],["density","khối lượng riêng"],["absorbent","hút nước"],["durable","bền"]],
  quiz:[
    {q:"Why is glass used for windows?", o:["It is soft","It is transparent so light passes through","It is magnetic","It dissolves in water"], a:1,
     e:"Cửa sổ cần cho ánh sáng đi qua và nhìn rõ, nên vật liệu phải trong suốt."},
    {q:"Which metal is NOT attracted to a magnet?", o:["Iron","Steel","Copper","Nickel"], a:2,
     e:"Đồng không có từ tính. Đây là bẫy quen thuộc: không phải kim loại nào cũng bị nam châm hút."},
    {q:"Sand does not dissolve in water. Sand is:", o:["Soluble","Insoluble","Magnetic","Transparent"], a:1,
     e:"Không tan gọi là insoluble, nên tách cát khỏi nước bằng cách lọc."},
    {q:"A raincoat is made of a material that is:", o:["Absorbent","Waterproof","Soluble","Magnetic"], a:1,
     e:"Áo mưa cần chặn nước nên phải không thấm. Vật liệu hút nước (absorbent) như bông thì làm khăn."},
    {q:"An object floats in water. This tells you the object is:", o:["Less dense than water","More dense than water","Magnetic","Transparent"], a:0,
     e:"Vật có khối lượng riêng nhỏ hơn nước thì nổi; lớn hơn thì chìm."},
    {q:"To compare how strong three materials are, you must:", o:["Use different sized pieces","Use pieces of the same size and test them the same way","Test only one of them","Guess"], a:1,
     e:"Chỉ được đổi loại vật liệu; kích thước mẫu và cách thử phải giữ nguyên thì so sánh mới công bằng."}]}
);
</script>

<script>
DATA.science.units.push(
{ id:"s16", subject:"science", t:"Thermal and electrical conductors", vi:"Vật dẫn nhiệt và dẫn điện",
  kp:[
    {en:"A thermal conductor lets heat pass through it quickly. Most metals are good thermal conductors.", vi:"Vật dẫn nhiệt cho nhiệt truyền qua nhanh; hầu hết kim loại dẫn nhiệt tốt."},
    {en:"A thermal insulator does not let heat pass easily: wood, plastic, wool, air.", vi:"Vật cách nhiệt không cho nhiệt truyền qua dễ: gỗ, nhựa, len, không khí."},
    {en:"Trapped air is a very good insulator, which is why a woolly jumper keeps you warm.", vi:"Không khí bị giữ lại cách nhiệt rất tốt, vì thế áo len giữ ấm."},
    {en:"An electrical conductor lets electricity flow: all metals and graphite (pencil lead).", vi:"Vật dẫn điện cho dòng điện đi qua: mọi kim loại và than chì trong ruột bút chì."},
    {en:"An electrical insulator stops electricity flowing: plastic, rubber, glass, dry wood.", vi:"Vật cách điện chặn dòng điện: nhựa, cao su, thuỷ tinh, gỗ khô."},
    {en:"Not the same thing: a material can conduct heat but not electricity. Water conducts electricity when salts are dissolved in it.", vi:"Hai loại khác nhau: có vật dẫn nhiệt nhưng không dẫn điện. Nước có muối hoà tan thì dẫn điện."},
    {en:"Pans have metal bases to conduct heat and plastic handles to insulate your hand.", vi:"Nồi có đáy kim loại để dẫn nhiệt và tay cầm nhựa để cách nhiệt cho tay."}],
  voc:[["thermal conductor","vật dẫn nhiệt"],["thermal insulator","vật cách nhiệt"],["electrical conductor","vật dẫn điện"],["electrical insulator","vật cách điện"],["trapped air","không khí bị giữ lại"],["graphite","than chì"],["handle","tay cầm"],["transfer","sự truyền"],["heat loss","sự mất nhiệt"],["safety","an toàn"]],
  quiz:[
    {q:"Why is the base of a saucepan made of metal?", o:["Metal is light","Metal conducts heat quickly to the food","Metal is transparent","Metal is an insulator"], a:1,
     e:"Kim loại dẫn nhiệt nhanh nên thức ăn nóng đều và nhanh."},
    {q:"Why is the handle of the same saucepan made of plastic?", o:["Plastic is cheap","Plastic is a thermal insulator so your hand does not get burnt","Plastic conducts heat","Plastic is magnetic"], a:1,
     e:"Nhựa cách nhiệt nên nhiệt không truyền tới tay."},
    {q:"Why does a woolly jumper keep you warm?", o:["Wool makes heat","It traps air, which is a good insulator","Wool is a conductor","It is heavy"], a:1,
     e:"Sợi len giữ lại nhiều túi khí nhỏ; không khí cách nhiệt tốt nên nhiệt cơ thể ít thoát ra."},
    {q:"Which of these conducts electricity but is NOT a metal?", o:["Rubber","Graphite","Glass","Dry wood"], a:1,
     e:"Than chì trong ruột bút chì dẫn điện dù không phải kim loại — câu này rất hay ra đề."},
    {q:"Why is it dangerous to touch a switch with wet hands?", o:["Water is a good insulator","Water with dissolved salts conducts electricity","Water makes plastic melt","Water is magnetic"], a:1,
     e:"Nước ở tay không tinh khiết, có muối hoà tan nên dẫn điện, dòng điện có thể truyền qua người."},
    {q:"Which set are ALL thermal insulators?", o:["Wood, wool, plastic","Copper, steel, aluminium","Iron, water, silver","Graphite, gold, air"], a:0,
     e:"Gỗ, len và nhựa đều cản nhiệt. Các nhóm khác đều chứa kim loại dẫn nhiệt tốt."},
    {q:"A metal spoon is left in hot soup. What happens?", o:["Nothing","The handle becomes hot because metal conducts heat","The spoon melts","The soup cools instantly"], a:1,
     e:"Nhiệt truyền dọc theo thìa kim loại lên tận cán, nên cầm vào thấy nóng."}]},

{ id:"s17", subject:"science", t:"Chemical reactions", vi:"Phản ứng hoá học",
  kp:[
    {en:"In a chemical reaction the starting substances turn into new substances. This cannot be undone.", vi:"Trong phản ứng hoá học, các chất ban đầu biến thành chất mới và không quay lại được."},
    {en:"Signs of a chemical reaction: bubbles of gas, a colour change, heat or light given out, a new solid forming.", vi:"Dấu hiệu phản ứng hoá học: bọt khí, đổi màu, toả nhiệt hoặc phát sáng, xuất hiện chất rắn mới."},
    {en:"Burning is a reaction between a fuel and oxygen. It gives out heat and light.", vi:"Sự cháy là phản ứng giữa nhiên liệu và oxygen, toả nhiệt và phát sáng."},
    {en:"Vinegar plus bicarbonate of soda gives off carbon dioxide gas &mdash; that is why the mixture fizzes.", vi:"Giấm trộn baking soda sinh ra khí carbon dioxide, nên hỗn hợp sủi bọt."},
    {en:"Rusting is a slow reaction between iron, oxygen and water.", vi:"Gỉ sét là phản ứng chậm giữa sắt, oxygen và nước."},
    {en:"Mass is not lost in a reaction. If a candle seems lighter, the missing mass has escaped as gas.", vi:"Khối lượng không mất đi. Nến nhẹ đi vì chất đã bay ra dạng khí, không phải biến mất."},
    {en:"Cooking is a chemical reaction: a raw egg cannot be turned back from a cooked one.", vi:"Nấu ăn là phản ứng hoá học: trứng chín không thể trở lại thành trứng sống."}],
  voc:[["chemical reaction","phản ứng hoá học"],["reactant","chất tham gia"],["product","chất tạo thành"],["fizz","sủi bọt"],["combustion","sự cháy"],["fuel","nhiên liệu"],["carbon dioxide","khí carbonic"],["oxidation","sự oxy hoá"],["precipitate","chất rắn kết tủa"],["conserved","được bảo toàn"]],
  quiz:[
    {q:"Which is the clearest sign that a chemical reaction has happened?", o:["The mixture gets colder in the fridge","A new substance is made that cannot be changed back","The mixture is stirred","The container is full"], a:1,
     e:"Điều quyết định là tạo ra chất mới và không đảo ngược được."},
    {q:"Vinegar is poured onto bicarbonate of soda and it fizzes. The gas made is:", o:["Oxygen","Carbon dioxide","Hydrogen","Steam"], a:1,
     e:"Phản ứng sinh khí carbon dioxide — chính khí này làm bánh nở khi nướng."},
    {q:"Burning wood needs which gas from the air?", o:["Carbon dioxide","Nitrogen","Oxygen","Helium"], a:2,
     e:"Cháy cần oxygen. Đậy kín ngọn nến là hết oxygen, lửa tắt."},
    {q:"A candle burns away on a balance in the open air and the mass falls. Why?", o:["Mass has been destroyed","Gases made have escaped into the air","The balance is broken","Wax turns into light"], a:1,
     e:"Khối lượng được bảo toàn; phần hụt đi đã bay ra dưới dạng khí carbon dioxide và hơi nước."},
    {q:"Which pair of changes are BOTH chemical reactions?", o:["Melting ice and boiling water","Frying an egg and rusting a nail","Dissolving salt and freezing water","Cutting paper and folding cloth"], a:1,
     e:"Rán trứng và gỉ sét đều tạo chất mới. Các cặp còn lại chỉ đổi trạng thái hoặc hình dạng."},
    {q:"Rusting needs iron and which two other things?", o:["Oxygen and water","Heat and light","Salt and sugar","Carbon dioxide and oil"], a:0,
     e:"Đủ ba yếu tố sắt + oxygen + nước mới gỉ; sơn phủ để chặn nước và không khí là cách chống gỉ."},
    {q:"Why can you not turn a cooked egg back into a raw egg?", o:["It is too hot","Cooking is a chemical reaction that makes new substances","The shell is broken","Eggs are soluble"], a:1,
     e:"Nhiệt làm protein trong trứng biến đổi hẳn thành chất mới, không có cách nào đảo ngược."}]},

{ id:"s25", subject:"science", t:"Food chains, food webs and energy transfers", vi:"Chuỗi thức ăn, lưới thức ăn và truyền năng lượng",
  kp:[
    {en:"Nearly all energy in a food chain starts at the Sun and is captured by green plants.", vi:"Gần như toàn bộ năng lượng trong chuỗi thức ăn bắt đầu từ Mặt Trời và được cây xanh giữ lại."},
    {en:"Producers make their own food. Consumers eat other living things.", vi:"Sinh vật sản xuất tự tạo thức ăn; sinh vật tiêu thụ ăn sinh vật khác."},
    {en:"Arrows in a food chain show energy moving, and always point to the animal doing the eating.", vi:"Mũi tên chỉ chiều năng lượng truyền đi và luôn hướng về con vật ăn."},
    {en:"A primary consumer eats the producer; a secondary consumer eats the primary consumer.", vi:"Sinh vật tiêu thụ bậc 1 ăn cây; bậc 2 ăn sinh vật bậc 1."},
    {en:"At every step most energy is lost as heat, so only a small part passes on. Chains are rarely longer than five links.", vi:"Mỗi bậc mất phần lớn năng lượng dưới dạng nhiệt nên chuỗi hiếm khi dài quá 5 mắt xích."},
    {en:"A food web joins many food chains in one habitat and shows that most animals eat more than one thing.", vi:"Lưới thức ăn nối nhiều chuỗi trong cùng môi trường và cho thấy hầu hết loài ăn nhiều thứ."},
    {en:"Decomposers break down dead plants and animals and return nutrients to the soil.", vi:"Sinh vật phân huỷ phân giải xác chết, trả chất dinh dưỡng về đất."}],
  voc:[["producer","sinh vật sản xuất"],["primary consumer","sinh vật tiêu thụ bậc 1"],["secondary consumer","sinh vật tiêu thụ bậc 2"],["energy transfer","sự truyền năng lượng"],["food web","lưới thức ăn"],["decomposer","sinh vật phân huỷ"],["nutrients","chất dinh dưỡng"],["habitat","môi trường sống"],["predator","kẻ săn mồi"],["prey","con mồi"]],
  quiz:[
    {q:"Where does the energy in almost every food chain come from originally?", o:["The soil","The Sun","The rain","Decomposers"], a:1,
     e:"Cây xanh dùng ánh sáng Mặt Trời để tạo thức ăn, nên năng lượng của cả chuỗi bắt nguồn từ Mặt Trời."},
    {q:"In grass &rarr; grasshopper &rarr; frog, the grasshopper is the:", o:["Producer","Primary consumer","Secondary consumer","Decomposer"], a:1,
     e:"Châu chấu ăn trực tiếp sinh vật sản xuất nên là sinh vật tiêu thụ bậc 1."},
    {q:"What do the arrows in a food chain actually show?", o:["Which animal is bigger","The direction energy is transferred","Where the animals live","How fast they run"], a:1,
     e:"Mũi tên chỉ dòng năng lượng, đọc là &ldquo;bị ăn bởi&rdquo; chứ không phải &ldquo;ăn&rdquo;."},
    {q:"Why are food chains rarely longer than five links?", o:["There are not enough animals","Most energy is lost as heat at each step","Arrows run out","Plants stop growing"], a:1,
     e:"Chỉ khoảng một phần mười năng lượng lên được bậc trên, nên tới bậc thứ năm gần như không còn đủ."},
    {q:"What is the main difference between a food chain and a food web?", o:["A web shows many chains linked together","A web has no arrows","A chain has no producers","There is no difference"], a:0,
     e:"Lưới thức ăn là nhiều chuỗi nối nhau, phản ánh đúng thực tế là mỗi loài ăn nhiều loại thức ăn."},
    {q:"What is the job of a decomposer?", o:["To hunt prey","To break down dead material and return nutrients to the soil","To make food from sunlight","To pollinate flowers"], a:1,
     e:"Nấm và vi khuẩn phân giải xác sinh vật, trả chất dinh dưỡng lại cho đất để cây dùng tiếp."},
    {q:"In a food web the number of frogs falls sharply. What is most likely?", o:["Only frogs are affected","Insects they ate increase and snakes that ate them decrease","Nothing changes","Plants die immediately"], a:1,
     e:"Mất một mắt xích ảnh hưởng cả hai chiều: con mồi của nó tăng lên, kẻ ăn nó giảm đi."}]}
);
</script>

<script>
DATA.science.units.push(
{ id:"s18", subject:"science", t:"Igneous rocks", vi:"Đá mắc-ma",
  kp:[
    {en:"Igneous rocks form when molten rock cools and hardens into crystals.", vi:"Đá mắc-ma hình thành khi đá nóng chảy nguội đi và kết tinh."},
    {en:"Molten rock under the ground is called magma; when it reaches the surface it is called lava.", vi:"Đá nóng chảy dưới lòng đất gọi là magma; khi phun lên mặt đất gọi là dung nham (lava)."},
    {en:"Slow cooling deep underground gives LARGE crystals, like granite.", vi:"Nguội chậm sâu dưới đất tạo tinh thể TO, ví dụ đá granit."},
    {en:"Fast cooling on the surface gives SMALL crystals, like basalt.", vi:"Nguội nhanh trên mặt đất tạo tinh thể NHỎ, ví dụ đá bazan."},
    {en:"So crystal size tells you how fast the rock cooled &mdash; big crystals mean slow cooling.", vi:"Nhìn cỡ tinh thể là biết đá nguội nhanh hay chậm: tinh thể to nghĩa là nguội chậm."},
    {en:"Igneous rocks are usually hard and have no layers and no fossils.", vi:"Đá mắc-ma thường cứng, không có lớp và không chứa hoá thạch."}],
  voc:[["igneous rock","đá mắc-ma"],["magma","đá nóng chảy dưới đất"],["lava","dung nham"],["molten","nóng chảy"],["crystal","tinh thể"],["granite","đá granit"],["basalt","đá bazan"],["volcano","núi lửa"],["cool down","nguội đi"],["harden","hoá cứng"]],
  quiz:[
    {q:"How do igneous rocks form?", o:["Layers of sand press together","Molten rock cools and hardens","Heat and pressure change other rocks","Plants rot in soil"], a:1,
     e:"Đá mắc-ma sinh ra từ đá nóng chảy nguội lại — ba đáp án kia là cách hình thành của các loại đá khác."},
    {q:"What is molten rock called once it reaches the surface?", o:["Magma","Lava","Granite","Soil"], a:1,
     e:"Dưới đất là magma, phun lên mặt đất thì gọi là lava. Hai từ này rất hay bị nhầm."},
    {q:"A rock has very large crystals. What does this tell you?", o:["It cooled quickly on the surface","It cooled slowly deep underground","It has fossils in it","It formed from sand"], a:1,
     e:"Nguội càng chậm thì tinh thể càng có thời gian lớn lên, nên tinh thể to nghĩa là nguội sâu dưới đất."},
    {q:"Basalt has tiny crystals. Where did it form?", o:["Deep underground","On the surface, cooling fast","In a river","Under the sea bed over millions of years"], a:1,
     e:"Tinh thể nhỏ vì dung nham nguội rất nhanh khi ra tới không khí hoặc nước."},
    {q:"Which is an igneous rock?", o:["Sandstone","Granite","Limestone","Chalk"], a:1,
     e:"Granit là đá mắc-ma. Sa thạch, đá vôi và phấn đều là đá trầm tích."},
    {q:"Why do igneous rocks contain no fossils?", o:["They are too hard","They formed from molten rock, which would destroy any remains","They are too young","Fossils dissolve in them"], a:1,
     e:"Đá nóng chảy có nhiệt độ rất cao nên xác sinh vật không thể giữ lại được."}]},

{ id:"s19", subject:"science", t:"Sedimentary rocks and fossils", vi:"Đá trầm tích và hoá thạch",
  kp:[
    {en:"Sedimentary rocks form from tiny pieces of rock, sand and shell that settle in layers, usually under water.", vi:"Đá trầm tích hình thành từ các mảnh đá, cát và vỏ sò lắng thành từng lớp, thường ở dưới nước."},
    {en:"Over millions of years the weight of the layers above presses the sediment together into rock.", vi:"Qua hàng triệu năm, sức nặng của các lớp bên trên nén trầm tích lại thành đá."},
    {en:"Sedimentary rocks show visible layers and are usually softer than igneous rocks.", vi:"Đá trầm tích có các lớp nhìn thấy được và thường mềm hơn đá mắc-ma."},
    {en:"Sandstone, limestone and chalk are sedimentary rocks.", vi:"Sa thạch, đá vôi và đá phấn là đá trầm tích."},
    {en:"Fossils are the preserved remains or traces of living things, and are found ONLY in sedimentary rock.", vi:"Hoá thạch là dấu tích của sinh vật xưa, và CHỈ tìm thấy trong đá trầm tích."},
    {en:"The deepest layer of rock is the oldest, so fossils lower down come from earlier times.", vi:"Lớp đá sâu nhất là lớp cổ nhất, nên hoá thạch nằm càng sâu thì càng lâu đời."},
    {en:"Fossils tell scientists what lived long ago and what the environment was like.", vi:"Hoá thạch cho nhà khoa học biết ngày xưa có loài gì sống và môi trường khi đó ra sao."}],
  voc:[["sedimentary rock","đá trầm tích"],["sediment","trầm tích"],["layer","lớp"],["compress","nén ép"],["sandstone","sa thạch"],["limestone","đá vôi"],["fossil","hoá thạch"],["remains","dấu tích, di tích"],["preserved","được bảo tồn"],["evidence","bằng chứng"]],
  quiz:[
    {q:"How do sedimentary rocks form?", o:["Molten rock cools","Layers of sediment settle and are pressed together","Heat and pressure change existing rock","Plants decay in soil"], a:1,
     e:"Trầm tích lắng thành lớp rồi bị nén lại qua hàng triệu năm."},
    {q:"Which feature helps you recognise a sedimentary rock?", o:["Large shiny crystals","Visible layers","It is always black","It floats"], a:1,
     e:"Các lớp nhìn thấy được là dấu hiệu đặc trưng của đá trầm tích."},
    {q:"In which type of rock are fossils found?", o:["Igneous","Sedimentary","Metamorphic","All three equally"], a:1,
     e:"Chỉ đá trầm tích giữ được hoá thạch, vì nó hình thành ở nhiệt độ thấp và bao lấy xác sinh vật."},
    {q:"Which rock is sedimentary?", o:["Granite","Basalt","Limestone","Marble"], a:2,
     e:"Đá vôi tạo từ vỏ sinh vật biển lắng đọng. Granit và bazan là mắc-ma, cẩm thạch là biến chất."},
    {q:"Two fossils are found, one in a deep layer and one nearer the surface. Which is older?", o:["The deeper one","The one nearer the surface","They are the same age","Cannot tell"], a:0,
     e:"Lớp dưới lắng trước nên cổ hơn — nguyên tắc cơ bản khi đọc các lớp đá."},
    {q:"A fossil of a sea shell is found on a mountain. What does this suggest?", o:["Shells can climb","That area was once under the sea","The fossil is fake","Mountains are made of shells"], a:1,
     e:"Vùng đó từng nằm dưới biển, sau đó lớp đá được nâng lên thành núi."},
    {q:"Why are sedimentary rocks often softer than igneous rocks?", o:["They are newer","They are made of pieces stuck together rather than interlocking crystals","They contain water","They are always wet"], a:1,
     e:"Đá trầm tích gồm các hạt gắn với nhau nên dễ vỡ hơn khối tinh thể đan xen của đá mắc-ma."}]},

{ id:"s20", subject:"science", t:"Metamorphic rocks and the rock cycle", vi:"Đá biến chất và vòng tuần hoàn đá",
  kp:[
    {en:"Metamorphic rocks form when existing rock is changed by great HEAT and PRESSURE, without melting.", vi:"Đá biến chất hình thành khi đá có sẵn bị biến đổi bởi NHIỆT ĐỘ và ÁP SUẤT lớn mà chưa nóng chảy."},
    {en:"Limestone becomes marble; shale becomes slate; sandstone becomes quartzite.", vi:"Đá vôi thành cẩm thạch; đá phiến sét thành đá đen lợp mái; sa thạch thành thạch anh."},
    {en:"Metamorphic rocks are usually harder than the rock they came from, and may have bands or stripes.", vi:"Đá biến chất thường cứng hơn đá gốc và có thể có vân hoặc dải màu."},
    {en:"The rock cycle: rock is worn away, becomes sediment, is pressed into sedimentary rock, changed into metamorphic rock, melted into magma, then cooled into igneous rock.", vi:"Vòng tuần hoàn đá: đá bị bào mòn thành trầm tích &rarr; đá trầm tích &rarr; đá biến chất &rarr; magma &rarr; đá mắc-ma."},
    {en:"Weathering breaks rock down where it is; erosion moves the pieces away.", vi:"Phong hoá làm vỡ đá tại chỗ; xói mòn cuốn các mảnh vỡ đi nơi khác."},
    {en:"The rock cycle has no start and no end &mdash; it keeps going and takes millions of years.", vi:"Vòng tuần hoàn đá không có điểm đầu điểm cuối, cứ lặp lại và mất hàng triệu năm."}],
  voc:[["metamorphic rock","đá biến chất"],["pressure","áp suất"],["marble","đá cẩm thạch"],["slate","đá phiến lợp mái"],["rock cycle","vòng tuần hoàn đá"],["weathering","sự phong hoá"],["erosion","sự xói mòn"],["band","dải, vân đá"],["transported","bị cuốn đi"],["uplift","sự nâng lên"]],
  quiz:[
    {q:"What changes rock into metamorphic rock?", o:["Melting completely","Great heat and pressure","Settling in layers","Dissolving in water"], a:1,
     e:"Nhiệt và áp suất lớn làm đá biến đổi nhưng chưa nóng chảy — nóng chảy hẳn thì thành magma."},
    {q:"Limestone under great heat and pressure becomes:", o:["Granite","Marble","Sandstone","Basalt"], a:1,
     e:"Đá vôi biến thành cẩm thạch, cứng hơn nhiều và được dùng làm tượng, bậc thang."},
    {q:"What is the difference between weathering and erosion?", o:["They are the same","Weathering breaks rock where it is; erosion carries the pieces away","Weathering only happens in winter","Erosion only happens underground"], a:1,
     e:"Phong hoá là vỡ tại chỗ, xói mòn là bị nước hay gió cuốn đi. Đề rất hay hỏi phân biệt hai từ này."},
    {q:"In the rock cycle, what must happen for magma to form?", o:["Rock is worn away","Rock melts","Sediment settles","Fossils form"], a:1,
     e:"Magma là đá nóng chảy, nên đá phải bị nung tới mức chảy ra."},
    {q:"Which statement about the rock cycle is TRUE?", o:["It starts with igneous rock and ends with soil","It has no beginning and no end","It takes about one year","Only sedimentary rock takes part"], a:1,
     e:"Vòng tuần hoàn lặp đi lặp lại liên tục, không có điểm bắt đầu hay kết thúc."},
    {q:"A rock has coloured bands and is very hard. It is most likely:", o:["Sedimentary","Metamorphic","Freshly cooled lava","Soil"], a:1,
     e:"Vân dải và độ cứng cao là dấu hiệu điển hình của đá biến chất."}]},

{ id:"s21", subject:"science", t:"Soil", vi:"Đất",
  kp:[
    {en:"Soil is made of tiny pieces of weathered rock mixed with humus, water and air.", vi:"Đất gồm các mảnh đá bị phong hoá trộn với mùn, nước và không khí."},
    {en:"Humus is rotted plant and animal material. It holds water and gives plants nutrients.", vi:"Mùn là xác động thực vật phân huỷ; nó giữ nước và cung cấp chất dinh dưỡng cho cây."},
    {en:"Sandy soil has large particles: water drains through quickly and it dries out fast.", vi:"Đất cát có hạt to: nước thoát rất nhanh và đất mau khô."},
    {en:"Clay soil has tiny particles: water drains very slowly and the soil can become waterlogged.", vi:"Đất sét có hạt rất nhỏ: nước thoát chậm và đất dễ bị úng."},
    {en:"Loam is a mixture of sand, clay and humus. It drains well but keeps enough water, so it is best for growing.", vi:"Đất thịt là hỗn hợp cát, sét và mùn: thoát nước tốt mà vẫn giữ đủ ẩm nên trồng cây tốt nhất."},
    {en:"Earthworms make tunnels that let air and water into the soil and mix humus through it.", vi:"Giun đất đào hang cho không khí và nước vào đất, đồng thời trộn đều mùn."},
    {en:"To compare how fast water drains through soils, use the same amount of soil and the same amount of water each time.", vi:"So sánh tốc độ thoát nước phải dùng cùng lượng đất và cùng lượng nước cho mỗi loại."}],
  voc:[["soil","đất"],["humus","mùn"],["particle","hạt"],["sandy soil","đất cát"],["clay soil","đất sét"],["loam","đất thịt"],["drainage","sự thoát nước"],["waterlogged","bị úng nước"],["earthworm","giun đất"],["fertile","màu mỡ"]],
  quiz:[
    {q:"What is humus?", o:["Small pieces of rock","Rotted plant and animal material","Water in the soil","Air in the soil"], a:1,
     e:"Mùn là phần hữu cơ đã phân huỷ, giúp đất giữ nước và giàu dinh dưỡng."},
    {q:"Water drains fastest through which soil?", o:["Clay soil","Sandy soil","Waterlogged soil","All the same"], a:1,
     e:"Hạt cát to nên khe hở giữa các hạt rộng, nước chảy qua rất nhanh."},
    {q:"Why can clay soil become waterlogged?", o:["Its particles are very small so water drains slowly","It has no water","It is full of sand","It contains no humus"], a:0,
     e:"Hạt sét rất nhỏ, khe hở hẹp nên nước gần như không thoát được và đọng lại."},
    {q:"Which soil is usually best for growing vegetables?", o:["Pure sand","Pure clay","Loam","Rock"], a:2,
     e:"Đất thịt cân bằng được hai việc: thoát nước tốt mà vẫn giữ đủ ẩm và dinh dưỡng."},
    {q:"How do earthworms help soil?", o:["They eat the roots","Their tunnels let in air and water and mix humus through the soil","They make the soil harder","They remove all the humus"], a:1,
     e:"Hang giun tạo đường cho không khí và nước, đồng thời giun trộn mùn xuống sâu."},
    {q:"In a drainage experiment you must keep the same:", o:["Type of soil","Amount of soil and amount of water","Colour of the funnel","Time of day only"], a:1,
     e:"Chỉ được đổi loại đất; lượng đất và lượng nước phải giữ nguyên thì mới công bằng."},
    {q:"Soil forms mainly from:", o:["Weathered rock mixed with humus","Melted lava","Sea water","Plastic waste"], a:0,
     e:"Đá bị phong hoá vỡ vụn dần, trộn với xác sinh vật phân huỷ thành đất — quá trình mất rất nhiều năm."}]}
);
</script>

<script>
DATA.science.units.push(
{ id:"s24", subject:"science", t:"The effects of forces", vi:"Tác dụng của lực",
  kp:[
    {en:"A force can make an object start moving, stop, speed up, slow down, change direction or change shape.", vi:"Lực có thể làm vật bắt đầu chuyển động, dừng, nhanh lên, chậm lại, đổi hướng hoặc đổi hình dạng."},
    {en:"When forces on an object are balanced, it stays still or keeps moving at the same speed.", vi:"Khi các lực cân bằng, vật đứng yên hoặc chuyển động đều."},
    {en:"When forces are unbalanced, the object speeds up, slows down or changes direction.", vi:"Khi các lực không cân bằng, vật sẽ nhanh lên, chậm lại hoặc đổi hướng."},
    {en:"Friction is a force between two surfaces rubbing together. It slows movement and makes heat.", vi:"Ma sát là lực giữa hai bề mặt cọ xát, làm chậm chuyển động và sinh nhiệt."},
    {en:"Rough surfaces give more friction; smooth or oiled surfaces give less.", vi:"Bề mặt nhám cho ma sát lớn; bề mặt nhẵn hoặc có dầu cho ma sát nhỏ."},
    {en:"Air resistance and water resistance are types of friction. A streamlined shape reduces them.", vi:"Lực cản không khí và lực cản nước là dạng ma sát; hình thuôn giúp giảm chúng."},
    {en:"Draw forces as arrows: the longer the arrow, the bigger the force.", vi:"Vẽ lực bằng mũi tên: mũi tên càng dài thì lực càng lớn."}],
  voc:[["balanced forces","lực cân bằng"],["unbalanced forces","lực không cân bằng"],["friction","ma sát"],["air resistance","lực cản không khí"],["streamlined","hình thuôn"],["direction","hướng"],["speed up","tăng tốc"],["slow down","giảm tốc"],["force arrow","mũi tên chỉ lực"],["surface","bề mặt"]],
  quiz:[
    {q:"A ball rolls along the ground and slowly stops. Which force does this?", o:["Gravity","Friction","Upthrust","Magnetism"], a:1,
     e:"Ma sát giữa bóng và mặt đất (cùng lực cản không khí) làm bóng chậm dần rồi dừng."},
    {q:"A cyclist travels at a steady speed in a straight line. The forces on the bike are:", o:["Balanced","Unbalanced","Zero","Only friction"], a:0,
     e:"Chuyển động đều nghĩa là lực đẩy tới bằng đúng lực cản, nên các lực cân bằng."},
    {q:"Which is NOT something a force can do?", o:["Change an object's shape","Change an object's direction","Change an object's colour","Make an object speed up"], a:2,
     e:"Lực làm đổi chuyển động hoặc hình dạng, nhưng không làm đổi màu vật."},
    {q:"Why do cyclists lean forward when going fast?", o:["To look better","To be more streamlined and reduce air resistance","To increase friction","To weigh less"], a:1,
     e:"Cúi người làm dáng thuôn hơn, giảm diện tích cản gió nên đi nhanh hơn với cùng sức đạp."},
    {q:"Oil is put on a squeaky hinge. What does this do?", o:["Increases friction","Reduces friction","Adds weight","Adds gravity"], a:1,
     e:"Dầu tạo lớp trơn giữa hai mặt kim loại nên ma sát giảm, bản lề hết kêu và đóng mở nhẹ."},
    {q:"Two arrows are drawn on a box: one 3 cm to the right and one 5 cm to the left. The box will:", o:["Stay still","Move to the right","Move to the left","Spin"], a:2,
     e:"Mũi tên dài hơn nghĩa là lực lớn hơn, nên hộp bị kéo về bên trái."},
    {q:"Which surface gives the MOST friction?", o:["Ice","Polished wood","Rough carpet","Wet tiles"], a:2,
     e:"Thảm nhám có bề mặt gồ ghề nhất nên ma sát lớn nhất."}]},

{ id:"s22", subject:"science", t:"Floating and sinking", vi:"Nổi và chìm",
  kp:[
    {en:"Water pushes up on anything placed in it. This upward force is called upthrust.", vi:"Nước đẩy lên mọi vật đặt vào nó; lực đẩy lên đó gọi là lực đẩy Ác-si-mét (upthrust)."},
    {en:"An object floats when the upthrust equals its weight, so the two forces are balanced.", vi:"Vật nổi khi lực đẩy lên bằng trọng lượng của nó, tức hai lực cân bằng."},
    {en:"An object sinks when its weight is greater than the upthrust.", vi:"Vật chìm khi trọng lượng lớn hơn lực đẩy lên."},
    {en:"Density decides floating: an object less dense than water floats, more dense sinks.", vi:"Khối lượng riêng quyết định: nhẹ hơn nước (cùng thể tích) thì nổi, nặng hơn thì chìm."},
    {en:"Shape matters. A solid lump of steel sinks, but the same steel shaped as a hull holds air and floats.", vi:"Hình dạng rất quan trọng: cục thép đặc thì chìm, nhưng thép cán thành vỏ tàu chứa không khí thì nổi."},
    {en:"Objects feel lighter in water because upthrust supports part of their weight.", vi:"Vật ở trong nước có cảm giác nhẹ hơn vì lực đẩy đỡ bớt một phần trọng lượng."}],
  voc:[["float","nổi"],["sink","chìm"],["upthrust","lực đẩy lên của nước"],["weight","trọng lượng"],["density","khối lượng riêng"],["hull","vỏ tàu"],["displace","chiếm chỗ, đẩy nước ra"],["buoyant","có sức nổi"],["submerge","chìm hẳn xuống"],["volume","thể tích"]],
  quiz:[
    {q:"What is the upward force from water called?", o:["Gravity","Friction","Upthrust","Weight"], a:2,
     e:"Nước đẩy vật lên bằng lực gọi là upthrust; trọng lực thì kéo vật xuống."},
    {q:"An object floats. What can you say about the forces on it?", o:["Weight is bigger than upthrust","Upthrust equals weight","There are no forces","Upthrust is zero"], a:1,
     e:"Nổi cân bằng nghĩa là lực đẩy lên đúng bằng trọng lượng, hai lực triệt tiêu nhau."},
    {q:"A solid steel block sinks but a steel ship floats. Why?", o:["Ships are made of lighter steel","The ship's shape holds air, making it less dense overall","Sea water is thicker","Ships have engines"], a:1,
     e:"Vỏ tàu rỗng chứa nhiều không khí nên khối lượng riêng trung bình của cả con tàu nhỏ hơn nước."},
    {q:"An object is more dense than water. It will:", o:["Float on top","Sink","Dissolve","Float halfway"], a:1,
     e:"Khối lượng riêng lớn hơn nước thì trọng lượng vượt lực đẩy nên vật chìm."},
    {q:"Why does a heavy stone feel lighter when you lift it under water?", o:["It really loses mass","Upthrust supports part of its weight","Water makes it smaller","Gravity stops in water"], a:1,
     e:"Khối lượng không đổi; chỉ là nước đỡ bớt nên tay ta phải dùng ít lực hơn."},
    {q:"You want to make a plasticine ball float. What should you do?", o:["Add more plasticine","Shape it into a bowl so it holds air","Make it into a smaller ball","Warm it up"], a:1,

 {en:"Farmers add compost to sandy soil to help it hold water, and dig sand into clay soil to improve drainage.",vi:"Nông dân trộn phân hữu cơ vào đất cát để giữ nước, và trộn cát vào đất sét để thoát nước tốt hơn."}],
 a:["Lấy ba loại đất, cho vào ba phễu lót giấy, đổ cùng lượng nước và đếm giây xem loại nào thoát nhanh nhất.","Cho một nắm đất vào cốc nước, khuấy rồi để lắng và quan sát các lớp.","Tìm giun trong vườn hoặc chậu cây và quan sát đường hang."],
 c:{q:"A gardener has heavy clay soil that stays wet. What should they add?",o:["More clay","Sand and compost","More water","Plastic"],a:1,
  e:"Cát tạo khe hở cho nước thoát, phân hữu cơ tạo mùn — cả hai làm đất sét tơi và dễ trồng hơn."}},
s24:{d:[{en:"Forces always come in pairs: when you push a wall, the wall pushes back on you with the same force.",vi:"Lực luôn xuất hiện theo cặp: ta đẩy tường thì tường đẩy lại ta với lực bằng đúng như vậy."},
 {en:"Friction is not always bad. Without it your shoes would slip and a car could never brake.",vi:"Ma sát không phải lúc nào cũng xấu: không có nó thì giày trượt và ô tô không phanh được."},
 {en:"An object with no force acting on it keeps moving forever &mdash; that is why things drift in space.",vi:"Vật không chịu lực nào sẽ chuyển động mãi, vì thế vật thể trôi hoài trong vũ trụ."}],
 a:["Đẩy một quyển sách trên bàn, trên khăn và trên gạch, so sánh độ khó.","Vẽ mũi tên lực cho một quả bóng đang rơi và một quả bóng đang nằm yên.","Tìm 3 chỗ trong nhà người ta cố tình tăng ma sát và 3 chỗ cố tình giảm."],
 c:{q:"A spacecraft switches off its engine far from any planet. What happens?",o:["It stops at once","It keeps moving at the same speed","It falls down","It speeds up"],a:1,
  e:"Không có ma sát hay lực cản nào, các lực cân bằng ở mức bằng không, nên tàu giữ nguyên tốc độ."}},
s22:{d:[{en:"An object pushes water out of the way. The weight of the water it pushes aside equals the upthrust.",vi:"Vật đẩy nước ra chỗ khác; trọng lượng phần nước bị đẩy ra chính bằng lực đẩy lên."},
 {en:"Ships float lower in fresh water than in sea water, because salty water is denser.",vi:"Tàu chìm sâu hơn trong nước ngọt so với nước biển, vì nước mặn có khối lượng riêng lớn hơn."},
 {en:"A submarine sinks by letting water into tanks and rises by pushing the water back out with air.",vi:"Tàu ngầm lặn bằng cách cho nước vào khoang và nổi lên bằng cách bơm khí đẩy nước ra."}],

 c:{q:"An egg sinks in tap water but floats in very salty water. Why?",o:["Salt makes the egg lighter","Salty water is denser, so upthrust is greater","Salt dissolves the shell","The egg absorbs salt"],a:1,
  e:"Nước muối đặc hơn nên lực đẩy lên lớn hơn, đủ cân bằng trọng lượng quả trứng."}},
s23:{d:[{en:"Light travels slower in glass than in water, and slower in water than in air &mdash; that is why it bends by different amounts.",vi:"Ánh sáng đi trong thuỷ tinh chậm hơn trong nước, trong nước chậm hơn trong không khí, nên độ bẻ cong khác nhau."},
 {en:"Each colour bends by a slightly different amount, which is why a prism separates them.",vi:"Mỗi màu bị bẻ cong một góc hơi khác nhau, nhờ vậy lăng kính tách được chúng ra."},
 {en:"Glasses work by bending light so it focuses exactly on the back of the eye.",vi:"Kính mắt hoạt động bằng cách bẻ tia sáng để nó hội tụ đúng vào đáy mắt."}],
 a:["Cắm ống hút vào cốc nước, nhìn ngang rồi nhìn từ trên xuống và tả sự khác nhau.","Đặt đồng xu dưới đáy bát, lùi lại tới khi khuất, rồi nhờ người rót nước vào và quan sát.","Cầm kính lúp soi chữ trong sách và giải thích vì sao chữ to lên."],
 c:{q:"A coin at the bottom of an empty bowl is hidden from view. Water is poured in and the coin appears. Why?",o:["The coin moves","Light from the coin refracts at the water surface and reaches your eye","Water reflects the coin","The bowl changes shape"],a:1,
  e:"Tia sáng từ đồng xu bị bẻ cong khi ra khỏi mặt nước nên đi tới được mắt ta, dù trước đó bị thành bát chắn."}}

{ id:"m13", subject:"math", t:"Special numbers, multiples and factors", vi:"Số đặc biệt, bội số và ước số",
  kp:[
    {en:"A factor divides exactly into a number. A multiple is what you get when you multiply.", vi:"Ước số chia hết cho số đó; bội số là kết quả khi nhân số đó lên."},
    {en:"A prime number has exactly two factors: 1 and itself. 2, 3, 5, 7, 11, 13, 17, 19 are prime.", vi:"Số nguyên tố có đúng hai ước là 1 và chính nó: 2, 3, 5, 7, 11, 13, 17, 19."},
    {en:"1 is NOT prime because it has only one factor. 2 is the only even prime number.", vi:"Số 1 KHÔNG phải số nguyên tố vì chỉ có một ước. Số 2 là số nguyên tố chẵn duy nhất."},
    {en:"Square numbers come from a number times itself: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100.", vi:"Số chính phương là số nhân với chính nó: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100."},
    {en:"Cube numbers come from a number times itself three times: 1, 8, 27, 64, 125.", vi:"Số lập phương: 1, 8, 27, 64, 125 &mdash; một số nhân với chính nó ba lần."},
    {en:"The lowest common multiple (LCM) is the smallest multiple two numbers share; the highest common factor (HCF) is the biggest factor they share.", vi:"Bội chung nhỏ nhất là bội chung bé nhất; ước chung lớn nhất là ước chung lớn nhất của hai số."}],
  voc:[["factor","ước số"],["multiple","bội số"],["prime number","số nguyên tố"],["composite","hợp số"],["square number","số chính phương"],["cube number","số lập phương"],["common multiple","bội chung"],["highest common factor","ước chung lớn nhất"]],
  quiz:[
    {q:"Which number is prime?", o:["1","9","17","21"], a:2,
     e:"17 chỉ chia hết cho 1 và 17. Số 1 không phải nguyên tố; 9 = 3&times;3; 21 = 3&times;7."},
    {q:"List all the factors of 12.", o:["1, 2, 3, 4, 6, 12","1, 12","2, 4, 6","12, 24, 36"], a:0,
     e:"Ước của 12 là các số chia hết 12: 1, 2, 3, 4, 6 và 12. Dãy 12, 24, 36 là BỘI chứ không phải ước."},
    {q:"Which is a square number?", o:["18","36","40","50"], a:1,
     e:"36 = 6 &times; 6. Học thuộc dãy 1, 4, 9, 16, 25, 36, 49, 64, 81, 100 sẽ làm bài rất nhanh."},
    {q:"What is the lowest common multiple of 4 and 6?", o:["2","12","24","10"], a:1,
     e:"Bội của 4: 4, 8, 12... Bội của 6: 6, 12... Số chung nhỏ nhất là 12."},
    {q:"What is the highest common factor of 18 and 24?", o:["2","3","6","9"], a:2,
     e:"Ước chung của 18 và 24 là 1, 2, 3, 6; lớn nhất là 6."},
    {q:"Why is 1 not a prime number?", o:["It is too small","It has only one factor, not two","It is odd","It is a square number"], a:1,
     e:"Định nghĩa số nguyên tố cần ĐÚNG HAI ước khác nhau; số 1 chỉ có một ước là chính nó."}]},

{ id:"m14", subject:"math", t:"Positive and negative integers, using letters", vi:"Số nguyên âm dương và dùng chữ thay số",
  kp:[
    {en:"Integers are whole numbers, positive or negative: ... &minus;3, &minus;2, &minus;1, 0, 1, 2, 3 ...", vi:"Số nguyên là số nguyên dương, âm hoặc 0."},
    {en:"On a number line, numbers get smaller as you move left. &minus;7 is less than &minus;3.", vi:"Trên trục số, càng sang trái càng nhỏ, nên &minus;7 < &minus;3."},
    {en:"Adding a positive number moves right; subtracting moves left. From &minus;5, add 8 to reach 3.", vi:"Cộng số dương thì đi sang phải, trừ thì đi sang trái. Từ &minus;5 cộng 8 được 3."},
    {en:"The difference between two temperatures is how far apart they are on the number line: from &minus;4&deg;C to 6&deg;C is 10 degrees.", vi:"Hiệu hai nhiệt độ là khoảng cách trên trục số: từ &minus;4&deg;C tới 6&deg;C là 10 độ."},
    {en:"A letter can stand for an unknown number: n + 5, 3n, n &divide; 2. Write 3n, never 3 &times; n.", vi:"Chữ cái thay cho số chưa biết: n + 5, 3n, n &divide; 2. Viết 3n chứ không viết 3 &times; n."},
    {en:"Solve an equation by doing the opposite operation to both sides: 4n = 20 &rarr; n = 20 &divide; 4 = 5.", vi:"Giải phương trình bằng phép tính ngược ở cả hai vế: 4n = 20 &rarr; n = 5."}],
  voc:[["integer","số nguyên"],["negative","âm"],["positive","dương"],["number line","trục số"],["difference","hiệu"],["expression","biểu thức"],["equation","phương trình"],["substitute","thay số vào"]],
  quiz:[
    {q:"Which is the smallest number?", o:["&minus;8","&minus;2","0","3"], a:0,
     e:"Trên trục số, &minus;8 nằm xa nhất về bên trái nên nhỏ nhất. Số âm càng lớn về trị số thì càng nhỏ."},
    {q:"The temperature is &minus;4&deg;C and rises by 9&deg;C. What is it now?", o:["5&deg;C","&minus;13&deg;C","13&deg;C","&minus;5&deg;C"], a:0,
     e:"Từ &minus;4 lên 0 mất 4 độ, còn 5 độ nữa &rarr; 5&deg;C."},
    {q:"What is the difference between &minus;3&deg;C and 7&deg;C?", o:["4 degrees","10 degrees","&minus;10 degrees","21 degrees"], a:1,
     e:"Đếm trên trục số: từ &minus;3 lên 0 là 3, từ 0 lên 7 là 7, tổng 10 độ."},
    {q:"If n = 7, what is 4n &minus; 5?", o:["16","23","28","47"], a:1,
     e:"4 &times; 7 = 28, trừ 5 được 23. Đừng viết liền thành 47."},
    {q:"Solve 5n = 45.", o:["n = 9","n = 40","n = 50","n = 225"], a:0,
     e:"Chia cả hai vế cho 5: n = 45 &divide; 5 = 9."},
    {q:"Which expression means &lsquo;a number multiplied by 6 then add 2&rsquo;?", o:["6 + n2","6n + 2","n + 62","2n + 6"], a:1,
     e:"Nhân trước rồi cộng: 6n + 2. Chú ý thứ tự, 2n + 6 là phép khác hẳn."}]},

{ id:"m15", subject:"math", t:"Quadrilaterals, circles and rotational symmetry", vi:"Tứ giác, hình tròn và đối xứng quay",
  kp:[
    {en:"A quadrilateral has 4 sides and its angles add up to 360&deg;.", vi:"Tứ giác có 4 cạnh và tổng bốn góc bằng 360&deg;."},
    {en:"Square: 4 equal sides, 4 right angles. Rectangle: 2 pairs of equal sides, 4 right angles.", vi:"Hình vuông: 4 cạnh bằng nhau, 4 góc vuông. Chữ nhật: hai cặp cạnh bằng nhau, 4 góc vuông."},
    {en:"Rhombus: 4 equal sides but angles not 90&deg;. Parallelogram: 2 pairs of parallel sides. Trapezium: exactly one pair of parallel sides.", vi:"Hình thoi: 4 cạnh bằng nhau nhưng góc không vuông. Hình bình hành: hai cặp cạnh song song. Hình thang: đúng một cặp cạnh song song."},
    {en:"In a circle: the radius goes from the centre to the edge; the diameter goes right across through the centre. Diameter = 2 &times; radius.", vi:"Trong hình tròn: bán kính từ tâm ra mép; đường kính đi ngang qua tâm. Đường kính = 2 &times; bán kính."},
    {en:"The circumference is the distance all the way round the circle.", vi:"Chu vi hình tròn là độ dài đường bao quanh."},
    {en:"A shape has rotational symmetry of order n if it looks the same n times during one full turn.", vi:"Hình có đối xứng quay bậc n nếu quay đủ một vòng thì n lần trông giống hệt ban đầu."}],
  voc:[["quadrilateral","tứ giác"],["rhombus","hình thoi"],["parallelogram","hình bình hành"],["trapezium","hình thang"],["radius","bán kính"],["diameter","đường kính"],["circumference","chu vi hình tròn"],["rotational symmetry","đối xứng quay"]],
  quiz:[
    {q:"A quadrilateral has angles 80&deg;, 100&deg; and 60&deg;. What is the fourth angle?", o:["100&deg;","120&deg;","140&deg;","60&deg;"], a:1,
     e:"Tổng bốn góc là 360&deg;: 360 &minus; (80 + 100 + 60) = 120&deg;."},
    {q:"Which shape has 4 equal sides but no right angles?", o:["Square","Rhombus","Rectangle","Trapezium"], a:1,
     e:"Hình thoi có 4 cạnh bằng nhau nhưng các góc không phải 90&deg;. Hình vuông thì có cả bốn góc vuông."},
    {q:"A circle has a radius of 7 cm. What is its diameter?", o:["3.5 cm","7 cm","14 cm","49 cm"], a:2,
     e:"Đường kính gấp đôi bán kính: 7 &times; 2 = 14 cm."},
    {q:"Which shape has exactly ONE pair of parallel sides?", o:["Parallelogram","Trapezium","Rhombus","Rectangle"], a:1,
     e:"Hình thang có đúng một cặp cạnh song song; hình bình hành và hình thoi có hai cặp."},
    {q:"What is the order of rotational symmetry of a square?", o:["1","2","4","8"], a:2,
     e:"Quay hình vuông một vòng thì có 4 lần trông giống ban đầu (mỗi 90&deg;)."},
    {q:"The line from the centre of a circle to any point on the edge is called the:", o:["Diameter","Circumference","Radius","Chord"], a:2,
     e:"Đó là bán kính (radius). Đường kính đi qua tâm và nối hai điểm trên đường tròn."}]},

{ id:"m16", subject:"math", t:"3D shapes, nets, capacity and volume", vi:"Hình khối, hình khai triển, dung tích và thể tích",
  kp:[
    {en:"A 3D shape has faces (flat surfaces), edges (where faces meet) and vertices (corners).", vi:"Hình khối có mặt, cạnh và đỉnh."},
    {en:"A cube has 6 faces, 12 edges and 8 vertices. A triangular prism has 5 faces, 9 edges and 6 vertices.", vi:"Lập phương: 6 mặt, 12 cạnh, 8 đỉnh. Lăng trụ tam giác: 5 mặt, 9 cạnh, 6 đỉnh."},
    {en:"A net is the flat shape that folds up to make a solid. A cube has 11 different possible nets.", vi:"Hình khai triển gấp lại thành hình khối; hình lập phương có 11 kiểu khai triển khác nhau."},
    {en:"Volume of a cuboid = length &times; width &times; height. Units are cubed: cm&sup3;, m&sup3;.", vi:"Thể tích hình hộp chữ nhật = dài &times; rộng &times; cao, đơn vị mũ ba."},
    {en:"Capacity is how much a container can hold, measured in ml and litres. 1 cm&sup3; holds exactly 1 ml.", vi:"Dung tích là lượng chứa được, đo bằng ml và lít. 1 cm&sup3; chứa đúng 1 ml."},
    {en:"So a box 10 cm &times; 10 cm &times; 10 cm has a volume of 1000 cm&sup3; and holds 1 litre.", vi:"Hộp 10 &times; 10 &times; 10 cm có thể tích 1000 cm&sup3; và chứa được 1 lít."}],
  voc:[["face","mặt"],["edge","cạnh"],["vertex / vertices","đỉnh"],["net","hình khai triển"],["prism","hình lăng trụ"],["pyramid","hình chóp"],["volume","thể tích"],["capacity","dung tích"]],
  quiz:[
    {q:"How many vertices does a cube have?", o:["6","8","12","4"], a:1,
     e:"Lập phương có 8 đỉnh, 6 mặt và 12 cạnh. Đừng nhầm số đỉnh với số mặt."},
    {q:"A net of a cube must have how many squares?", o:["4","5","6","8"], a:2,
     e:"Sáu mặt của hình lập phương nên hình khai triển phải có đúng 6 ô vuông."},
    {q:"A cuboid is 5 cm &times; 4 cm &times; 3 cm. What is its volume?", o:["12 cm&sup3;","60 cm&sup3;","60 cm&sup2;","47 cm&sup3;"], a:1,
     e:"5 &times; 4 &times; 3 = 60, đơn vị cm&sup3; vì thể tích dùng mũ ba."},
    {q:"A container has a volume of 2500 cm&sup3;. What is its capacity?", o:["2.5 ml","250 ml","2500 ml","25 litres"], a:2,
     e:"1 cm&sup3; = 1 ml nên 2500 cm&sup3; chứa 2500 ml, tức 2,5 lít."},
    {q:"How many faces does a triangular prism have?", o:["3","4","5","6"], a:2,
     e:"Hai mặt tam giác ở hai đầu và ba mặt chữ nhật ở thân, tổng cộng 5 mặt."},
    {q:"Which solid has a circular base and comes to a point?", o:["Cylinder","Cone","Cube","Sphere"], a:1,
     e:"Hình nón có đáy tròn và thu về một đỉnh; hình trụ thì hai đáy tròn song song."}]}
);
</script>

<script>
DATA.math.units.push(
{ id:"m17", subject:"math", t:"Adding and subtracting decimals and fractions", vi:"Cộng trừ số thập phân và phân số",
  kp:[
    {en:"To add or subtract decimals, line up the decimal points, then fill empty places with zeros.", vi:"Cộng trừ số thập phân: xếp thẳng hàng dấu phẩy, chỗ trống thì thêm số 0."},
    {en:"3.4 + 12.75 becomes 03.40 + 12.75 = 16.15 when written in columns.", vi:"3.4 + 12.75 viết thành 03.40 + 12.75 = 16.15."},
    {en:"To add or subtract fractions, they must have the SAME denominator first.", vi:"Cộng trừ phân số phải quy đồng MẪU SỐ trước."},
    {en:"Find a common denominator, change both fractions, then add only the numerators: 1/4 + 1/3 = 3/12 + 4/12 = 7/12.", vi:"Tìm mẫu chung, đổi cả hai phân số, rồi chỉ cộng tử: 1/4 + 1/3 = 7/12."},
    {en:"Never add the denominators. 1/4 + 1/3 is NOT 2/7.", vi:"Không bao giờ cộng mẫu với mẫu. 1/4 + 1/3 KHÔNG phải 2/7."},
    {en:"Simplify the answer at the end, and check it is sensible by estimating first.", vi:"Rút gọn kết quả ở bước cuối và ước lượng trước để kiểm tra tính hợp lý."}],
  voc:[["decimal point","dấu phẩy thập phân"],["column","cột"],["denominator","mẫu số"],["numerator","tử số"],["common denominator","mẫu số chung"],["simplify","rút gọn"],["equivalent","tương đương"],["estimate","ước lượng"]],
  quiz:[
    {q:"3.4 + 12.75 =", o:["15.79","16.15","46.15","3.5275"], a:1,
     e:"Xếp thẳng hàng: 03.40 + 12.75 = 16.15. Viết 3.4 thành 3.40 để đủ cột."},
    {q:"20 &minus; 4.65 =", o:["15.35","16.45","15.45","16.35"], a:0,
     e:"Viết 20 thành 20.00 rồi trừ: 20.00 &minus; 4.65 = 15.35."},
    {q:"1/4 + 1/3 =", o:["2/7","7/12","5/12","1/12"], a:1,
     e:"Quy đồng mẫu 12: 3/12 + 4/12 = 7/12. Cộng mẫu với mẫu ra 2/7 là sai."},
    {q:"5/6 &minus; 1/3 =", o:["4/3","1/2","4/6","1/6"], a:1,
     e:"1/3 = 2/6, nên 5/6 &minus; 2/6 = 3/6 = 1/2 sau khi rút gọn."},
    {q:"What must you do BEFORE adding 2/5 and 1/4?", o:["Multiply them","Make the denominators the same","Add the denominators","Simplify 2/5"], a:1,
     e:"Bắt buộc quy đồng mẫu trước; mẫu chung ở đây là 20."},
    {q:"Estimate 9.87 + 4.06 first. About how much is it?", o:["About 5","About 14","About 40","About 130"], a:1,
     e:"Làm tròn: 10 + 4 = 14. Kết quả chính xác 13.93 rất gần, nên đáp án hợp lý."}]},

{ id:"m18", subject:"math", t:"Multiplication, division and tests of divisibility", vi:"Nhân, chia và dấu hiệu chia hết",
  kp:[
    {en:"A number is divisible by 2 if it ends in 0, 2, 4, 6 or 8.", vi:"Chia hết cho 2 nếu tận cùng là 0, 2, 4, 6 hoặc 8."},
    {en:"Divisible by 3 if the digits add up to a multiple of 3. 261 &rarr; 2+6+1 = 9, so yes.", vi:"Chia hết cho 3 nếu tổng các chữ số chia hết cho 3. Ví dụ 261 &rarr; 2+6+1 = 9."},
    {en:"Divisible by 5 if it ends in 0 or 5; divisible by 10 if it ends in 0.", vi:"Chia hết cho 5 nếu tận cùng là 0 hoặc 5; chia hết cho 10 nếu tận cùng là 0."},
    {en:"Divisible by 9 if the digits add up to a multiple of 9; by 4 if the last two digits make a multiple of 4.", vi:"Chia hết cho 9 nếu tổng chữ số chia hết cho 9; chia hết cho 4 nếu hai chữ số cuối chia hết cho 4."},
    {en:"For long multiplication, split by place value: 34 &times; 26 = 34&times;20 + 34&times;6 = 680 + 204 = 884.", vi:"Nhân số lớn: tách theo hàng, 34 &times; 26 = 680 + 204 = 884."},
    {en:"Always check a division with multiplication, and remember the remainder must be smaller than the divisor.", vi:"Kiểm tra phép chia bằng phép nhân; số dư luôn nhỏ hơn số chia."}],
  voc:[["divisible","chia hết"],["divisor","số chia"],["dividend","số bị chia"],["quotient","thương"],["remainder","số dư"],["product","tích"],["partition","tách số"],["inverse","phép ngược"]],
  quiz:[
    {q:"Which number is divisible by 3?", o:["124","251","261","410"], a:2,
     e:"2+6+1 = 9 chia hết cho 3 nên 261 chia hết cho 3. Các số kia có tổng chữ số 7, 8 và 5."},
    {q:"Which number is divisible by BOTH 5 and 2?", o:["25","32","60","45"], a:2,
     e:"Chia hết cho cả 2 và 5 nghĩa là chia hết cho 10, tức tận cùng là 0 &rarr; 60."},
    {q:"Is 738 divisible by 9?", o:["Yes, because 7+3+8 = 18","No, it is odd","Yes, because it ends in 8","No, 9 is too big"], a:0,
     e:"Tổng chữ số 18 chia hết cho 9 nên cả số chia hết cho 9."},
    {q:"What is 47 &times; 23?", o:["1081","1071","941","1181"], a:0,
     e:"47&times;20 = 940 và 47&times;3 = 141; cộng lại 1081. Ước lượng 50&times;23 = 1150 nên hợp lý."},
    {q:"What is 253 &divide; 7?", o:["36 r 1","36 r 4","35 r 8","37 r 2"], a:0,
     e:"7 &times; 36 = 252, còn dư 1. Số dư 1 nhỏ hơn 7 nên hợp lệ."},
    {q:"Which test shows 1236 is divisible by 4?", o:["It ends in 6","The last two digits 36 make a multiple of 4","The digits add to 12","It is even"], a:1,
     e:"Dấu hiệu chia hết cho 4 là hai chữ số cuối chia hết cho 4: 36 &divide; 4 = 9."}]},

{ id:"m19", subject:"math", t:"Multiplying and dividing fractions and decimals", vi:"Nhân chia phân số và số thập phân",
  kp:[
    {en:"To multiply fractions, multiply the tops and multiply the bottoms: 2/3 &times; 3/4 = 6/12 = 1/2.", vi:"Nhân phân số: nhân tử với tử, mẫu với mẫu, rồi rút gọn."},
    {en:"A fraction of an amount means multiply: 3/4 of 20 = 20 &divide; 4 &times; 3 = 15.", vi:"Lấy phân số của một lượng chính là nhân: 3/4 của 20 = 15."},
    {en:"To divide a fraction by a whole number, multiply the denominator: 1/2 &divide; 3 = 1/6.", vi:"Chia phân số cho số nguyên thì nhân mẫu số lên: 1/2 &divide; 3 = 1/6."},
    {en:"To multiply decimals, ignore the points, multiply, then put back the same total number of decimal places.", vi:"Nhân số thập phân: bỏ dấu phẩy, nhân bình thường, rồi trả lại đúng tổng số chữ số thập phân."},
    {en:"0.4 &times; 0.3: 4 &times; 3 = 12, and there are 2 decimal places altogether, so the answer is 0.12.", vi:"0.4 &times; 0.3 &rarr; 4&times;3 = 12, có 2 chữ số thập phân nên kết quả 0.12."},
    {en:"To divide a decimal by a whole number, keep the decimal point in line: 7.2 &divide; 4 = 1.8.", vi:"Chia số thập phân cho số nguyên: giữ dấu phẩy thẳng hàng, 7.2 &divide; 4 = 1.8."}],
  voc:[["multiply","nhân"],["divide","chia"],["of","của (nghĩa là nhân)"],["decimal place","chữ số thập phân"],["simplify","rút gọn"],["improper fraction","phân số lớn hơn 1"],["mixed number","hỗn số"],["reciprocal","số nghịch đảo"]],
  quiz:[
    {q:"2/3 &times; 3/5 =", o:["6/15","5/8","6/8","2/5"], a:0,
     e:"Nhân tử với tử và mẫu với mẫu: 6/15, rút gọn thành 2/5. Đáp án 6/15 và 2/5 cùng giá trị, ở đây chọn dạng chưa rút gọn."},
    {q:"What is 3/4 of 32?", o:["8","24","28","12"], a:1,
     e:"32 &divide; 4 = 8 rồi &times; 3 = 24. Chia cho mẫu trước rồi nhân với tử là cách nhanh nhất."},
    {q:"1/2 &divide; 4 =", o:["2","1/8","4/2","1/6"], a:1,
     e:"Chia cho 4 nghĩa là chia phần đó thành 4 phần nhỏ hơn: 1/2 &divide; 4 = 1/8."},
    {q:"0.6 &times; 0.4 =", o:["2.4","0.24","0.024","24"], a:1,
     e:"6 &times; 4 = 24; có tổng 2 chữ số thập phân nên đặt lại dấu phẩy: 0.24."},
    {q:"9.6 &divide; 3 =", o:["3.2","32","0.32","3.6"], a:0,
     e:"Chia từng phần: 9 &divide; 3 = 3 và 0.6 &divide; 3 = 0.2, cộng lại 3.2."},
    {q:"0.5 &times; 8 =", o:["0.4","4","40","0.04"], a:1,
     e:"0.5 chính là một nửa, nên 0.5 &times; 8 = 4."}]},

{ id:"m20", subject:"math", t:"Data: charts and graphs", vi:"Số liệu: các loại biểu đồ",
  kp:[
    {en:"A bar chart compares separate groups. The bars do not touch.", vi:"Biểu đồ cột so sánh các nhóm riêng biệt; các cột không dính nhau."},
    {en:"A dot plot shows each piece of data as one dot, so you can see repeats at a glance.", vi:"Biểu đồ chấm biểu diễn mỗi số liệu bằng một chấm, nhìn ra ngay giá trị nào lặp nhiều."},
    {en:"A waffle diagram is a 10 &times; 10 grid where each square is 1%, so it shows percentages.", vi:"Biểu đồ ô vuông là lưới 10 &times; 10, mỗi ô là 1%, dùng để thể hiện phần trăm."},
    {en:"A pie chart shows parts of a whole. The whole circle is 100% or 360&deg;.", vi:"Biểu đồ tròn thể hiện các phần của tổng thể; cả hình tròn là 100% hay 360&deg;."},
    {en:"A line graph shows how something changes over time. Only join the points if the data is continuous.", vi:"Đồ thị đường thể hiện thay đổi theo thời gian; chỉ nối điểm khi số liệu liên tục."},
    {en:"A scatter graph plots two things against each other to see if they are related.", vi:"Biểu đồ phân tán vẽ hai đại lượng theo nhau để xem chúng có liên hệ không."},
    {en:"Always read the scale on the axis before answering, and check whether it starts at zero.", vi:"Luôn đọc thang chia trên trục trước khi trả lời và kiểm tra xem trục có bắt đầu từ 0 không."}],
  voc:[["bar chart","biểu đồ cột"],["dot plot","biểu đồ chấm"],["waffle diagram","biểu đồ ô vuông"],["pie chart","biểu đồ tròn"],["line graph","đồ thị đường"],["scatter graph","biểu đồ phân tán"],["axis / axes","trục"],["scale","thang chia"]],
  quiz:[
    {q:"Which chart is best for showing how a plant grew over 8 weeks?", o:["Pie chart","Bar chart","Line graph","Waffle diagram"], a:2,
     e:"Thay đổi theo thời gian là số liệu liên tục nên dùng đồ thị đường."},
    {q:"In a waffle diagram, one square stands for:", o:["1 person","1%","10%","100"], a:1,
     e:"Lưới 10 &times; 10 có 100 ô, mỗi ô là 1% của tổng."},
    {q:"A pie chart shows a sector that is a quarter of the circle. What percentage is that?", o:["10%","25%","40%","90%"], a:1,
     e:"Một phần tư hình tròn là 25%, tương ứng góc 90&deg;."},
    {q:"Which chart would show whether taller children have bigger feet?", o:["Pie chart","Scatter graph","Waffle diagram","Bar chart"], a:1,
     e:"Biểu đồ phân tán vẽ hai đại lượng theo nhau để nhìn ra mối liên hệ."},
    {q:"Why must you check whether an axis starts at zero?", o:["It looks nicer","A graph can make small differences look huge if it does not","Zero is always needed","To save space"], a:1,
     e:"Trục không bắt đầu từ 0 làm chênh lệch nhỏ trông rất lớn — đây là cách biểu đồ gây hiểu nhầm."},
    {q:"Which chart shows parts of one whole?", o:["Line graph","Scatter graph","Pie chart","Dot plot"], a:2,
     e:"Biểu đồ tròn chia một tổng thể thành các phần, cộng lại đúng 100%."},
    {q:"In a bar chart the bars should:", o:["Touch each other","Have gaps between them","Be different widths","Have no labels"], a:1,
     e:"Các nhóm là riêng biệt nên cột phải có khoảng cách. Cột dính nhau là biểu đồ tần số cho số liệu liên tục."}]},

{ id:"m21", subject:"math", t:"The laws of arithmetic", vi:"Các quy tắc của phép tính",
  kp:[
    {en:"Order of operations: brackets first, then multiply and divide, then add and subtract.", vi:"Thứ tự phép tính: ngoặc trước, rồi nhân chia, cuối cùng cộng trừ."},
    {en:"The commutative law: order does not matter for + and &times;. 4 + 7 = 7 + 4 and 3 &times; 8 = 8 &times; 3.", vi:"Tính giao hoán: đổi chỗ không đổi kết quả với phép cộng và nhân."},
    {en:"Subtraction and division are NOT commutative: 9 &minus; 4 is not 4 &minus; 9.", vi:"Phép trừ và phép chia KHÔNG giao hoán: 9 &minus; 4 khác 4 &minus; 9."},
    {en:"The associative law: for + and &times; you can group differently. (2 + 3) + 7 = 2 + (3 + 7).", vi:"Tính kết hợp: với cộng và nhân, nhóm kiểu nào cũng cho cùng kết quả."},
    {en:"The distributive law: 6 &times; 23 = 6 &times; 20 + 6 &times; 3. This is why long multiplication works.", vi:"Tính phân phối: 6 &times; 23 = 6&times;20 + 6&times;3 &mdash; đây chính là nguyên lý của phép nhân số lớn."},
    {en:"Use the laws to make mental maths easier: 25 &times; 16 = 25 &times; 4 &times; 4 = 100 &times; 4 = 400.", vi:"Dùng các quy tắc để nhẩm nhanh: 25 &times; 16 = 25 &times; 4 &times; 4 = 400."}],
  voc:[["brackets","dấu ngoặc"],["commutative","giao hoán"],["associative","kết hợp"],["distributive","phân phối"],["operation","phép tính"],["expression","biểu thức"],["mental method","cách tính nhẩm"],["equivalent","tương đương"]],
  quiz:[
    {q:"8 + 2 &times; 5 =", o:["50","18","15","20"], a:1,
     e:"Nhân trước: 2 &times; 5 = 10, rồi cộng 8 &rarr; 18. Tính từ trái sang ra 50 là sai."},
    {q:"(6 + 4) &times; 3 =", o:["18","30","13","24"], a:1,
     e:"Ngoặc trước: 6 + 4 = 10, rồi 10 &times; 3 = 30."},
    {q:"Which pair are equal because of the commutative law?", o:["9 &minus; 5 and 5 &minus; 9","12 &divide; 4 and 4 &divide; 12","7 &times; 6 and 6 &times; 7","10 &minus; 3 and 3 + 10"], a:2,
     e:"Chỉ phép cộng và nhân mới giao hoán. Trừ và chia thì đổi chỗ là đổi kết quả."},
    {q:"Use the distributive law: 7 &times; 34 =", o:["7&times;30 + 7&times;4","7&times;30 &times; 7&times;4","7 + 30 + 4","34 &divide; 7"], a:0,
     e:"Tách 34 thành 30 + 4 rồi nhân từng phần: 210 + 28 = 238."},
    {q:"A quick way to work out 25 &times; 16 is:", o:["25 &times; 4 &times; 4","25 + 16","16 &divide; 25","25 &times; 10 + 6"], a:0,
     e:"Tách 16 = 4 &times; 4 rồi dùng tính kết hợp: 25&times;4 = 100, rồi 100&times;4 = 400."},
    {q:"20 &minus; (3 + 5) &times; 2 =", o:["4","24","34","12"], a:0,
     e:"Ngoặc trước: 3 + 5 = 8. Nhân: 8 &times; 2 = 16. Cuối cùng 20 &minus; 16 = 4."}]}
);
</script>

<script>
/* Bổ sung theo mục lục Cambridge Global English 6 */
DATA.esl.units.push(
{ id:"e12", subject:"esl", t:"Unit 1: My world", vi:"Unit 1: Thế giới của em",
  kp:[
    {en:"Feelings vocabulary: <i>proud, nervous, excited, anxious, relieved, disappointed, curious, grateful</i>.", vi:"Từ vựng cảm xúc: proud (tự hào), nervous (lo lắng), excited (hào hứng), relieved (nhẹ nhõm)."},
    {en:"Use the present perfect for experiences without a stated time: <i>I have visited three countries.</i>", vi:"Dùng hiện tại hoàn thành cho trải nghiệm không nêu mốc thời gian."},
    {en:"<b>Have you ever...?</b> asks about experience. Answer <i>Yes, I have</i> or <i>No, I never have.</i>", vi:"Have you ever...? hỏi về trải nghiệm; trả lời Yes, I have hoặc No, I never have."},
    {en:"Prepositions before nouns: <i>at school, on holiday, in hospital, by bus, for the first time</i>.", vi:"Giới từ đi với danh từ: at school, on holiday, in hospital, by bus, for the first time."},
    {en:"Map reading words: <i>north, south, east, west, border, capital, region, symbol, key</i>.", vi:"Từ vựng đọc bản đồ: hướng, biên giới, thủ đô, vùng, kí hiệu, chú giải."},
    {en:"A protest is when people come together to show they disagree with something. Malala protested for girls' education.", vi:"Protest là khi mọi người cùng lên tiếng phản đối điều gì đó; Malala đã đấu tranh cho quyền học của trẻ em gái."}],
  voc:[["proud","tự hào"],["nervous","lo lắng"],["relieved","nhẹ nhõm"],["grateful","biết ơn"],["border","biên giới"],["capital","thủ đô"],["protest","cuộc phản đối"],["admire","ngưỡng mộ"],["experience","trải nghiệm"],["achievement","thành tựu"]],
  quiz:[
    {q:"______ you ever ridden a camel?", o:["Did","Have","Are","Do"], a:1,
     e:"Hỏi về trải nghiệm dùng hiện tại hoàn thành: Have you ever...?"},
    {q:"She felt ______ when she finally found her lost dog.", o:["nervous","relieved","disappointed","curious"], a:1,
     e:"relieved là nhẹ nhõm sau khi lo lắng xong &mdash; đúng cảm xúc khi tìm lại được con chó."},
    {q:"We travelled to the island ______ boat.", o:["in","by","at","on"], a:1,
     e:"Phương tiện đi lại dùng <b>by</b>: by boat, by bus, by car, by plane."},
    {q:"My brother is ______ hospital because he broke his leg.", o:["at","in","on","by"], a:1,
     e:"<i>in hospital</i> nghĩa là đang nằm viện điều trị. <i>at the hospital</i> chỉ là có mặt ở đó."},
    {q:"I was very ______ of my sister when she won the competition.", o:["proud","anxious","bored","jealous"], a:0,
     e:"Cấu trúc <b>be proud of somebody</b> = tự hào về ai đó."},
    {q:"Which sentence is correct?", o:["I have been to Japan last year.","I have been to Japan.","I have went to Japan.","I am been to Japan."], a:1,
     e:"Không dùng hiện tại hoàn thành với mốc quá khứ <i>last year</i>, và past participle của go là <i>been/gone</i> chứ không phải <i>went</i>."}]},

{ id:"e13", subject:"esl", t:"Unit 2: Sport", vi:"Unit 2: Thể thao",
  kp:[
    {en:"Sports equipment: <i>racket, helmet, goggles, net, bat, glove, whistle, track</i>.", vi:"Dụng cụ thể thao: vợt, mũ bảo hiểm, kính bơi, lưới, gậy, găng, còi, đường chạy."},
    {en:"Parts of the body used in sport: <i>ankle, wrist, shoulder, knee, elbow, muscle, lung, heart</i>.", vi:"Bộ phận cơ thể trong thể thao: cổ chân, cổ tay, vai, đầu gối, khuỷu tay, cơ, phổi, tim."},
    {en:"First conditional with <b>if</b>: <i>If you train hard, you will improve.</i> if + present simple, will + verb.", vi:"Điều kiện loại 1 với if: if + hiện tại đơn, will + động từ."},
    {en:"<b>unless</b> means &lsquo;if not&rsquo;: <i>Unless you warm up, you will get injured.</i>", vi:"unless nghĩa là &lsquo;nếu không&rsquo;: Unless you warm up = If you don't warm up."},
    {en:"Advice: <b>should</b> for a good idea, <b>shouldn't</b> for a bad one, <b>mustn't</b> for something forbidden.", vi:"Khuyên nhủ: should (nên), shouldn't (không nên), mustn't (cấm)."},
    {en:"<b>needs</b> + noun or <b>needs to</b> + verb: <i>She needs more water. She needs to rest.</i>", vi:"needs + danh từ hoặc needs to + động từ."}],
  voc:[["racket","vợt"],["goggles","kính bơi"],["warm up","khởi động"],["injury","chấn thương"],["nutrition","dinh dưỡng"],["energy","năng lượng"],["muscle","cơ bắp"],["compete","thi đấu"],["opponent","đối thủ"],["endurance","sức bền"]],
  quiz:[
    {q:"If you practise every day, you ______ better.", o:["get","got","will get","would get"], a:2,
     e:"Điều kiện loại 1: mệnh đề if dùng hiện tại đơn, mệnh đề chính dùng will."},
    {q:"______ you wear a helmet, you cannot ride here.", o:["If","Unless","When","Because"], a:1,
     e:"Unless = if not. Câu này nghĩa là &lsquo;Nếu bạn không đội mũ bảo hiểm thì không được đi&rsquo;."},
    {q:"You ______ swim straight after eating. It is not safe.", o:["should","shouldn't","must","needs"], a:1,
     e:"Đây là lời khuyên không nên làm, dùng shouldn't."},
    {q:"Athletes ______ a lot of water during a race.", o:["need","needs to","needing","need to be"], a:0,
     e:"Chủ ngữ số nhiều <i>athletes</i> nên dùng <i>need</i>, theo sau là danh từ <i>a lot of water</i>."},
    {q:"You wear these to protect your eyes in the pool:", o:["gloves","goggles","a racket","a whistle"], a:1,
     e:"goggles là kính bơi, bảo vệ mắt khỏi nước có clo."},
    {q:"Which joint connects your foot to your leg?", o:["wrist","elbow","ankle","shoulder"], a:2,
     e:"ankle là cổ chân. wrist là cổ tay, elbow là khuỷu tay, shoulder là vai."}]},

{ id:"e14", subject:"esl", t:"Unit 3: Living things", vi:"Unit 3: Thế giới sinh vật",
  kp:[
    {en:"Animal body parts: <i>beak, feather, wing, claw, fin, gill, shell, tail, fur, scales</i>.", vi:"Bộ phận động vật: mỏ, lông vũ, cánh, vuốt, vây, mang, vỏ, đuôi, lông mao, vảy."},
    {en:"Use the present simple for facts that are always true: <i>Penguins live in Antarctica.</i>", vi:"Dùng hiện tại đơn cho sự thật luôn đúng."},
    {en:"Third person singular adds -s: <i>A bird builds a nest.</i> Do not forget the -s.", vi:"Ngôi thứ ba số ít thêm -s: A bird builds a nest."},
    {en:"Relative clauses add information: <i>The penguin, <b>which</b> lives in Antarctica, cannot fly.</i>", vi:"Mệnh đề quan hệ bổ sung thông tin: who cho người, which cho vật và con vật."},
    {en:"Wh- questions: <i>What, Where, When, Why, Who, Which, How</i>. The auxiliary comes before the subject.", vi:"Câu hỏi Wh-: trợ động từ đứng trước chủ ngữ, ví dụ <i>Where do penguins live?</i>"},
    {en:"Marine wildlife words: <i>coral reef, tide, current, plankton, predator, habitat, species</i>.", vi:"Từ vựng sinh vật biển: rạn san hô, thuỷ triều, dòng chảy, sinh vật phù du, kẻ săn mồi, môi trường sống, loài."}],
  voc:[["beak","mỏ chim"],["feather","lông vũ"],["gill","mang cá"],["claw","vuốt"],["coral reef","rạn san hô"],["species","loài"],["survive","sống sót"],["shelter","nơi trú"],["hatch","nở trứng"],["migrate","di cư"]],
  quiz:[
    {q:"A penguin ______ its eggs on its feet to keep them warm.", o:["keep","keeps","keeping","are keeping"], a:1,
     e:"Chủ ngữ số ít ngôi thứ ba nên động từ thêm -s: keeps."},
    {q:"The blue whale, ______ is the largest animal on Earth, eats tiny plankton.", o:["who","which","where","whose"], a:1,
     e:"Cá voi là động vật nên dùng which. Với thông tin giữa hai dấu phẩy thì không dùng that."},
    {q:"Fish breathe using their:", o:["lungs","gills","beaks","claws"], a:1,
     e:"Cá dùng mang (gills) để lấy oxygen hoà tan trong nước."},
    {q:"______ do sea turtles lay their eggs?", o:["What","Where","Who","Which"], a:1,
     e:"Hỏi về nơi chốn dùng Where."},
    {q:"Which sentence is correct?", o:["Birds has feathers.","A bird have feathers.","Birds have feathers.","Bird have feather."], a:2,
     e:"Chủ ngữ số nhiều <i>birds</i> đi với <i>have</i>, danh từ cũng phải số nhiều: feathers."},
    {q:"A group of the same kind of living thing is called a:", o:["habitat","species","predator","reef"], a:1,
     e:"species là loài. habitat là nơi sống, predator là kẻ săn mồi."}]},

{ id:"e15", subject:"esl", t:"Unit 4: Inventions", vi:"Unit 4: Phát minh",
  kp:[
    {en:"Use the past simple for finished actions with a past time: <i>Bell invented the telephone in 1876.</i>", vi:"Quá khứ đơn cho việc đã xong có mốc thời gian: invented in 1876."},
    {en:"Regular past verbs add -ed; irregular ones change completely: <i>make &rarr; made, build &rarr; built, think &rarr; thought</i>.", vi:"Động từ có quy tắc thêm -ed; bất quy tắc thì đổi hẳn: make &rarr; made, build &rarr; built."},
    {en:"Use <b>will</b> for predictions about the future: <i>Robots will do more of our work.</i>", vi:"Dùng will để dự đoán tương lai."},
    {en:"Soften a prediction with <i>probably, maybe, I think</i>: <i>I think cars will probably fly one day.</i>", vi:"Làm nhẹ dự đoán bằng probably, maybe, I think."},
    {en:"Multi-word verbs: <i>turn on, switch off, plug in, take apart, put together, come up with</i>.", vi:"Cụm động từ: bật, tắt, cắm điện, tháo ra, lắp lại, nghĩ ra."},
    {en:"Invention vocabulary: <i>device, gadget, tool, engine, wheel, battery, screen, invention, inventor</i>.", vi:"Từ vựng phát minh: thiết bị, dụng cụ, động cơ, bánh xe, pin, màn hình, phát minh, nhà phát minh."}],
  voc:[["invent","phát minh"],["inventor","nhà phát minh"],["device","thiết bị"],["gadget","đồ dùng nhỏ tiện lợi"],["engine","động cơ"],["battery","pin"],["design","thiết kế"],["improve","cải tiến"],["useful","hữu ích"],["portable","xách tay, di động"]],
  quiz:[
    {q:"Alexander Graham Bell ______ the telephone in 1876.", o:["invents","has invented","invented","will invent"], a:2,
     e:"Có mốc quá khứ rõ ràng 1876 nên dùng quá khứ đơn."},
    {q:"In fifty years, people ______ live on Mars.", o:["will probably","probably will not be","are probably","were probably"], a:0,
     e:"Dự đoán tương lai dùng will; probably đứng sau will."},
    {q:"Please ______ the light when you leave the room.", o:["switch off","switch of","switching off","switched"], a:0,
     e:"Cụm động từ <i>switch off</i> nghĩa là tắt. Sau <i>please</i> dùng động từ nguyên thể."},
    {q:"What is the past simple of &lsquo;think&rsquo;?", o:["thinked","thought","thinks","thinking"], a:1,
     e:"think là động từ bất quy tắc: think &rarr; thought &rarr; thought."},
    {q:"He ______ a brilliant idea for a new gadget.", o:["came up with","came up of","come up with","coming with"], a:0,
     e:"<i>come up with</i> nghĩa là nghĩ ra; ở quá khứ là <i>came up with</i>."},
    {q:"A small useful piece of equipment is called a:", o:["gadget","engine","wheel","screen"], a:0,
     e:"gadget là đồ dùng nhỏ tiện lợi, ví dụ đồng hồ thông minh hay máy xay cầm tay."}]},

{ id:"e16", subject:"esl", t:"Unit 5: Money", vi:"Unit 5: Tiền bạc",
  kp:[
    {en:"Money words: <i>save, spend, earn, borrow, lend, afford, cost, worth, budget, charity</i>.", vi:"Từ vựng tiền: tiết kiệm, tiêu, kiếm, mượn, cho mượn, đủ tiền mua, giá, đáng giá, ngân sách, từ thiện."},
    {en:"<b>borrow</b> means take from someone; <b>lend</b> means give to someone. <i>I borrowed money from him. He lent me money.</i>", vi:"borrow là mượn của ai; lend là cho ai mượn. Hai từ này rất hay bị nhầm."},
    {en:"Comparative adverbs: add -ly then <i>more</i>: <i>She saves more carefully than I do. He works harder.</i>", vi:"Trạng từ so sánh: thường dùng more + trạng từ, nhưng hard &rarr; harder, fast &rarr; faster."},
    {en:"Quantifiers: <b>much</b> with uncountable (much money), <b>many</b> with countable (many coins), <b>a lot of</b> with both.", vi:"much đi với danh từ không đếm được, many với đếm được, a lot of dùng cho cả hai."},
    {en:"<b>a few</b> = a small number (countable). <b>a little</b> = a small amount (uncountable).", vi:"a few dùng cho đếm được, a little dùng cho không đếm được."},
    {en:"Reflexive pronouns: <i>myself, yourself, himself, herself, itself, ourselves, yourselves, themselves</i>. <i>I bought it myself.</i>", vi:"Đại từ phản thân: myself, yourself, himself... dùng khi chủ ngữ và tân ngữ là một."}],
  voc:[["save","tiết kiệm"],["spend","tiêu"],["earn","kiếm được"],["borrow","mượn"],["lend","cho mượn"],["afford","đủ tiền mua"],["budget","ngân sách"],["charity","từ thiện"],["profit","lợi nhuận"],["discount","giảm giá"]],
  quiz:[
    {q:"Can I ______ your pen, please?", o:["lend","borrow","earn","afford"], a:1,
     e:"Mình lấy của người khác thì dùng borrow. Nếu bạn đưa cho mình thì bạn <i>lends</i> nó cho mình."},
    {q:"How ______ money did you spend?", o:["many","much","few","a lot"], a:1,
     e:"money là danh từ không đếm được nên dùng much."},
