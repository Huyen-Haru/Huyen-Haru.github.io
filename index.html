 {en:"We see colour because objects absorb some colours and reflect others. A red shirt reflects red light.",vi:"Ta thấy màu vì vật hấp thụ một số màu và phản xạ màu còn lại. Áo đỏ phản xạ ánh sáng đỏ."},
 {en:"Light bends when it passes from air into water — refraction — which makes a straw look broken in a glass.",vi:"Ánh sáng bị bẻ cong khi đi từ không khí vào nước (khúc xạ), nên ống hút trông như bị gãy trong cốc."}],
 a:["Dùng đèn pin chiếu một đồ chơi lên tường, di chuyển lại gần rồi ra xa và đo chiều dài bóng.","Cắm ống hút vào cốc nước, nhìn ngang và giải thích vì sao trông như gãy.","Đứng trước gương giơ tay phải và quan sát ảnh trong gương."],
 c:{q:"You see a flash of lightning, then hear thunder 6 seconds later. What does this tell you?",o:["The storm is very close","Light travels much faster than sound","Thunder happened later","Sound cannot travel far"],a:1,
  e:"Chớp và sấm xảy ra cùng lúc; ta thấy trước vì ánh sáng đi nhanh hơn âm thanh rất nhiều."}},
s7:{d:[{en:"Current is the flow of electricity, measured in amperes; voltage is the push that drives it, measured in volts.",vi:"Dòng điện là dòng chảy của điện, đo bằng ampe; hiệu điện thế là lực đẩy dòng đó, đo bằng vôn."},
 {en:"In a parallel circuit each lamp has its own path, so one lamp can go out while the others stay lit.",vi:"Trong mạch song song, mỗi bóng có đường riêng nên một bóng hỏng các bóng khác vẫn sáng — đèn trang trí nhà mình mắc kiểu này."},
 {en:"Water and electricity together are dangerous because water with dissolved salts conducts electricity.",vi:"Nước và điện rất nguy hiểm vì nước có muối hoà tan dẫn điện."}],
 a:["Đếm trong nhà có bao nhiêu công tắc, thử giải thích công tắc tạo khe hở trong mạch ra sao.","Tìm 5 vật cách điện và 5 vật dẫn điện trong nhà, xếp thành hai cột.","Quan sát dây sạc điện thoại: lõi kim loại làm gì, vỏ nhựa làm gì."],
 c:{q:"In a string of lights, one bulb breaks but the rest stay on. What kind of circuit is it?",o:["Series","Parallel","Broken","Short"],a:1,
  e:"Mạch song song cho mỗi bóng một đường đi riêng nên hỏng một bóng không làm tắt cả dây."}},
s8:{d:[{en:"The Sun is a star. It looks bigger and brighter than other stars only because it is much closer.",vi:"Mặt Trời là một ngôi sao; nó trông to và sáng hơn chỉ vì ở gần ta hơn rất nhiều."},
 {en:"The Moon does not spin freely: it always shows the same face to the Earth.",vi:"Mặt Trăng luôn hướng cùng một mặt về phía Trái Đất, nên ta không bao giờ nhìn thấy mặt kia từ Trái Đất."},
 {en:"Planets do not twinkle but stars do, because stars are point sources of light seen through moving air.",vi:"Sao nhấp nháy còn hành tinh thì không, vì sao ở rất xa nên chỉ là một điểm sáng bị không khí làm rung."}],
 a:["Cắm một chiếc que ngoài sân, đánh dấu bóng lúc 8 giờ, 12 giờ và 16 giờ rồi so sánh.","Ghi hình dạng Mặt Trăng mỗi tối trong một tuần và nhận xét quy luật.","Dùng quả bóng và đèn pin để diễn lại ngày và đêm cho bố mẹ xem."],
 c:{q:"Why do we always see the same side of the Moon?",o:["The Moon does not move","The Moon turns once for each orbit of the Earth","The Earth blocks the other side","The other side has no light"],a:1,
  e:"Mặt Trăng tự quay đúng một vòng trong mỗi vòng quay quanh Trái Đất, nên luôn quay cùng một mặt về phía ta."}},
s9:{d:[{en:"A result is accurate if it is close to the true value, and precise if repeats are close to each other.",vi:"Kết quả chính xác (accurate) là gần giá trị thật; kết quả ổn định (precise) là các lần đo gần nhau."},
 {en:"A range of at least five values gives a much clearer pattern than three.",vi:"Đo ít nhất 5 giá trị khác nhau sẽ thấy quy luật rõ hơn nhiều so với chỉ 3 giá trị."},
 {en:"A line of best fit is a smooth line through the trend, not a zigzag joining every dot.",vi:"Đường xu hướng phải là đường mượt đi qua xu hướng chung, không phải đường gấp khúc nối từng điểm."}],
 a:["Đặt một câu hỏi thí nghiệm ở nhà rồi ghi rõ: đổi gì, đo gì, giữ nguyên gì.","Đo thời gian đun sôi 200 ml nước ba lần rồi tính trung bình.","Vẽ bảng ba cột cho một thí nghiệm bất kỳ trước khi làm."],
 c:{q:"Three pupils measure the same length as 24.1, 24.2 and 24.0 cm, but the true value is 30 cm. The results are:",o:["Accurate but not precise","Precise but not accurate","Both","Neither"],a:1,
  e:"Ba lần đo rất gần nhau nên ổn định (precise), nhưng đều lệch xa giá trị thật nên không chính xác (accurate) — có thể do thước bị hỏng."}},
s10:{d:[{en:"The two lungs are not the same size: the left lung is smaller to leave room for the heart.",vi:"Hai lá phổi không bằng nhau: phổi trái nhỏ hơn để nhường chỗ cho tim."},
 {en:"If all the alveoli were flattened out they would cover about half a tennis court.",vi:"Nếu trải phẳng toàn bộ phế nang ra, diện tích xấp xỉ nửa sân tennis — đó là lý do trao đổi khí rất hiệu quả."},
 {en:"Breathing rate is controlled automatically by the brain, which senses carbon dioxide in the blood.",vi:"Não tự điều khiển nhịp thở bằng cách cảm nhận lượng carbon dioxide trong máu, nên ta không cần nghĩ mới thở."}],
 a:["Đếm số nhịp thở trong 1 phút lúc ngồi yên, rồi sau khi chạy tại chỗ 1 phút.","Hà hơi vào gương hoặc cửa kính và giải thích vì sao mờ đi.","Đặt tay lên bụng, hít sâu và cảm nhận cơ hoành hạ xuống."],
 c:{q:"Why does the body breathe faster when carbon dioxide in the blood rises?",o:["To cool down","To remove the carbon dioxide and take in more oxygen","To make the heart stop","To store air"],a:1,
  e:"Carbon dioxide tăng là tín hiệu cho não tăng nhịp thở để thải khí thừa và lấy thêm oxygen."}},
s11:{d:[{en:"The small intestine is about 6 metres long and its inner wall is covered in tiny folds called villi.",vi:"Ruột non dài khoảng 6 mét và thành trong phủ đầy nhung mao, giúp diện tích hấp thụ cực lớn."},
 {en:"Stomach acid is strong enough to kill most bacteria in food.",vi:"Axit dạ dày đủ mạnh để tiêu diệt phần lớn vi khuẩn trong thức ăn."},
 {en:"Most people have two kidneys but can live healthily with one.",vi:"Người có hai quả thận nhưng vẫn sống khoẻ với một quả — cơ thể có dự phòng."}],
 a:["Nhai một miếng cơm thật lâu và nhận xét vị ngọt dần lên, giải thích vì sao.","Đo xem hôm nay uống bao nhiêu ml nước và so với khoảng 1,5 lít nên uống.","Kể tên các món trong bữa tối và chỉ ra món nào nhiều chất xơ."],
 c:{q:"Why does the small intestine have millions of tiny folds called villi?",o:["To make it stronger","To increase the surface area for absorption","To store food","To make acid"],a:1,
  e:"Nhung mao làm tăng diện tích bề mặt nên hấp thụ được nhiều chất dinh dưỡng hơn trong cùng chiều dài ruột."}},
s12:{d:[{en:"Plastic can take hundreds of years to break down, while a banana skin takes a few weeks.",vi:"Nhựa cần hàng trăm năm để phân rã, còn vỏ chuối chỉ vài tuần."},
 {en:"Reducing comes before recycling: the best rubbish is the rubbish never made.",vi:"Giảm quan trọng hơn tái chế: rác tốt nhất là rác chưa từng sinh ra."},
 {en:"Trees take in carbon dioxide, so planting forests helps reduce air pollution.",vi:"Cây hấp thụ carbon dioxide, nên trồng rừng giúp giảm ô nhiễm không khí."}],
 a:["Đếm số đồ nhựa dùng một lần cả nhà dùng hôm nay và nghĩ cách bớt đi một món.","Phân loại rác một bữa cơm thành: tái chế được, phân huỷ được, còn lại.","Tắt đèn và quạt khi ra khỏi phòng, ghi lại xem làm được mấy lần trong ngày."],
 c:{q:"Which action reduces waste the most?",o:["Recycling a plastic bottle","Not using a plastic bottle at all","Burning the bottle","Burying the bottle"],a:1,
  e:"Theo thứ tự reduce - reuse - recycle, không tạo ra rác ngay từ đầu luôn hiệu quả nhất."}}
};
</script>

<script>
Object.assign(EXT, {
m1:{d:[{en:"Rounding twice is wrong: 4.348 rounds to 4.35 then 4.4, but the correct 1 d.p. answer is 4.3.",vi:"Không làm tròn hai lần. 4.348 phải nhìn thẳng chữ số hàng phần trăm là 4 nên ra 4.3, không phải 4.4."},
 {en:"A number rounded to 250 to the nearest ten lies between 245 and 254.",vi:"Số làm tròn tới 250 (chục gần nhất) nằm trong khoảng 245 đến 254 — dạng bài ngược rất hay ra đề."},
 {en:"Multiplying by 0.1 is the same as dividing by 10.",vi:"Nhân với 0.1 chính là chia cho 10; nhân với 0.01 là chia cho 100."}],
 a:["Đọc hoá đơn đi chợ và làm tròn từng món tới nghìn gần nhất rồi cộng nhẩm.","Xem nhiệt độ dự báo hôm nay và hôm qua, tính chênh lệch, có cả số âm càng tốt.","Đọc to số ki-lô-mét trên đồng hồ xe máy và nêu giá trị của từng chữ số."],
 c:{q:"A number rounds to 7.6 when rounded to one decimal place. What is the smallest it could be?",o:["7.5","7.55","7.6","7.649"],a:1,
  e:"Số nhỏ nhất làm tròn lên thành 7.6 là 7.55; số lớn nhất là dưới 7.65."}},
m2:{d:[{en:"To compare fractions quickly, cross-multiply: for 3/5 and 5/8, compare 3&times;8 = 24 with 5&times;5 = 25, so 5/8 is bigger.",vi:"So sánh nhanh hai phân số bằng nhân chéo: 3/5 và 5/8 &rarr; 24 và 25, nên 5/8 lớn hơn."},
 {en:"A percentage increase of 10% then a decrease of 10% does NOT return to the start.",vi:"Tăng 10% rồi giảm 10% không quay lại số ban đầu: 100 &rarr; 110 &rarr; 99."},
 {en:"To find the whole from a part: if 30% is 45, then 10% is 15 and 100% is 150.",vi:"Tìm số ban đầu từ một phần: 30% là 45 thì 10% là 15 và 100% là 150."}],
 a:["Tìm một món giảm giá khi đi siêu thị và tính giá sau giảm trước khi nhìn bảng giá.","Chia một chiếc bánh hoặc quả cam và viết phần của mỗi người dưới cả ba dạng.","Xem pin điện thoại còn bao nhiêu phần trăm và đổi ra phân số đơn giản."],
 c:{q:"A price rises by 10% then falls by 10%. Compared with the original price it is now:",o:["The same","1% lower","1% higher","10% lower"],a:1,
  e:"100 tăng 10% thành 110; 110 giảm 10% là giảm 11 nên còn 99 — thấp hơn 1%."}},
m3:{d:[{en:"A ratio compares parts with parts; a fraction compares a part with the whole. In 2 : 3, one part is 2/5 of the total.",vi:"Tỉ số so phần với phần, phân số so phần với tổng. Trong 2 : 3, phần đầu bằng 2/5 tổng."},
 {en:"On a map, a scale of 1 : 50 000 means 1 cm on paper is 50 000 cm (500 m) in real life.",vi:"Tỉ lệ bản đồ 1 : 50 000 nghĩa là 1 cm trên giấy bằng 500 m ngoài thực tế."},
 {en:"If two quantities are in direct proportion, dividing one by the other always gives the same number.",vi:"Hai đại lượng tỉ lệ thuận thì thương của chúng luôn là một hằng số."}],
 a:["Nấu ăn theo công thức và tính lại lượng nguyên liệu cho số người thật của nhà mình.","Pha nước cam theo tỉ lệ 1 : 4 rồi thử đổi sang 1 : 3 và nếm sự khác biệt.","Xem tỉ lệ trên bản đồ Google Maps và ước lượng quãng đường tới trường."],
 c:{q:"Orange squash is mixed with water in the ratio 1 : 4. How much squash is needed for 1 litre of drink?",o:["250 ml","200 ml","100 ml","500 ml"],a:1,
  e:"Tổng 5 phần cho 1000 ml, mỗi phần 200 ml. Nước cốt là 1 phần &rarr; 200 ml. Bẫy ở đây là chia cho 4 thay vì cho 5."}},
m4:{d:[{en:"Doubling and halving keeps a product the same: 16 &times; 25 = 8 &times; 50 = 4 &times; 100 = 400.",vi:"Gấp đôi số này và chia đôi số kia thì tích không đổi: 16 &times; 25 = 4 &times; 100 = 400."},
 {en:"To divide by 5, double the number then divide by 10.",vi:"Chia cho 5: nhân đôi rồi chia 10. Ví dụ 84 &divide; 5 = 168 &divide; 10 = 16.8."},
 {en:"Checking with an inverse operation catches most careless mistakes.",vi:"Kiểm tra bằng phép tính ngược bắt được hầu hết lỗi cẩu thả."}],
 a:["Cộng nhẩm tổng tiền khi mua 3 món ở cửa hàng trước khi thu ngân báo giá.","Chia đều số kẹo hoặc số quả cho cả nhà và nêu số dư.","Tính xem còn bao nhiêu phút nữa tới giờ ăn cơm, làm nhiều lần trong ngày."],
 c:{q:"Use doubling and halving to work out 35 &times; 4.",o:["70 &times; 2 = 140","35 &times; 2 = 70","140 &times; 2 = 280","35 + 4 = 39"],a:0,
  e:"Gấp đôi 35 thành 70 và chia đôi 4 thành 2, tích không đổi: 70 &times; 2 = 140."}},
m5:{d:[{en:"A sequence rule can use two steps: &lsquo;multiply by 2 then add 1&rsquo; gives 1, 3, 7, 15, 31.",vi:"Quy luật có thể gồm hai bước: nhân 2 rồi cộng 1 cho dãy 1, 3, 7, 15, 31."},
 {en:"Square numbers are 1, 4, 9, 16, 25; the difference between them is 3, 5, 7, 9 — the odd numbers.",vi:"Số chính phương 1, 4, 9, 16, 25 có hiệu liên tiếp là 3, 5, 7, 9 — chính là dãy số lẻ."},
 {en:"In algebra, 2n is always even and 2n + 1 is always odd, whatever whole number n is.",vi:"Trong đại số, 2n luôn chẵn và 2n + 1 luôn lẻ với mọi số nguyên n."}],
 a:["Tìm quy luật số nhà trên một dãy phố khi đi học về.","Xếp que tính thành dãy tam giác và tìm công thức tính số que cho hình thứ n.","Đặt cho bố mẹ một dãy số và mời đoán quy luật."],
 c:{q:"A sequence is 2, 5, 11, 23. What is the rule?",o:["Add 3 each time","Multiply by 2 then add 1","Multiply by 3","Add the previous two"],a:1,
  e:"2&times;2+1 = 5; 5&times;2+1 = 11; 11&times;2+1 = 23. Quy luật hai bước, không phải cộng một số cố định."}},
m6:{d:[{en:"The exterior angles of any polygon always add up to 360&deg;.",vi:"Tổng các góc ngoài của mọi đa giác luôn bằng 360&deg;."},
 {en:"A polygon with n sides can be split into n &minus; 2 triangles, so its angles add up to (n &minus; 2) &times; 180&deg;.",vi:"Đa giác n cạnh chia được thành n &minus; 2 tam giác, nên tổng các góc là (n &minus; 2) &times; 180&deg;."},
 {en:"Euler's rule for solids: faces + vertices = edges + 2. A cube: 6 + 8 = 12 + 2.",vi:"Công thức Euler: số mặt + số đỉnh = số cạnh + 2. Lập phương: 6 + 8 = 12 + 2."}],
 a:["Tìm trong nhà 5 vật là hình lăng trụ hoặc hình chóp và đếm mặt, cạnh, đỉnh.","Dùng thước đo góc đo ba góc của một miếng bìa tam giác rồi cộng lại xem có đúng 180&deg;.","Mở một hộp bánh ra thành hình phẳng và vẽ lại hình khai triển đó."],
 c:{q:"What do the interior angles of a pentagon add up to?",o:["360&deg;","540&deg;","720&deg;","900&deg;"],a:1,
  e:"Ngũ giác có 5 cạnh: (5 &minus; 2) &times; 180&deg; = 540&deg;."}},
m7:{d:[{en:"Reflecting in the x-axis changes the sign of y; reflecting in the y-axis changes the sign of x.",vi:"Đối xứng qua trục hoành đổi dấu y; qua trục tung đổi dấu x."},
 {en:"A rotation of 180&deg; about the origin turns (a, b) into (&minus;a, &minus;b).",vi:"Quay 180&deg; quanh gốc toạ độ biến (a, b) thành (&minus;a, &minus;b)."},
 {en:"The midpoint of two points is found by averaging the x values and the y values.",vi:"Trung điểm của hai điểm là trung bình cộng của các hoành độ và của các tung độ."}],
 a:["Chơi trò bắn tàu (battleship) với bố mẹ bằng lưới toạ độ tự vẽ.","Vẽ một chữ cái trên giấy kẻ ô rồi vẽ ảnh đối xứng của nó qua một trục.","Mô tả vị trí các phòng trong nhà bằng toạ độ trên bản vẽ đơn giản."],
 c:{q:"Point (4, &minus;2) is rotated 180&deg; about the origin. Where does it land?",o:["(&minus;4, 2)","(4, 2)","(&minus;4, &minus;2)","(2, &minus;4)"],a:0,
  e:"Quay 180&deg; quanh gốc đổi dấu cả hai toạ độ &rarr; (&minus;4, 2)."}},
m8:{d:[{en:"Metric prefixes are consistent: kilo means 1000, centi means one hundredth, milli means one thousandth.",vi:"Tiền tố đo lường thống nhất: kilo là 1000, centi là 1/100, milli là 1/1000."},
 {en:"To read a scale, count how many gaps there are between labelled numbers, not how many marks.",vi:"Đọc thang chia phải đếm số KHOẢNG giữa hai số ghi sẵn, không đếm số vạch."},
 {en:"Timetables use the 24-hour clock, and journey time is the difference between two times, not a subtraction of digits.",vi:"Bảng giờ tàu xe dùng hệ 24 giờ; thời gian đi là hiệu hai mốc giờ, không phải trừ số một cách máy móc."}],
 a:["Đo chiều cao của mình bằng cm rồi đổi sang m và mm.","Cân một túi gạo và đổi khối lượng ra gam, rồi ước lượng túi khác trước khi cân.","Tính thời gian từ lúc ra khỏi nhà tới lúc tới trường bằng đồng hồ 24 giờ."],
 c:{q:"A bus leaves at 08:47 and arrives at 09:32. How long is the journey?",o:["45 minutes","85 minutes","15 minutes","1 hour 45 minutes"],a:0,
  e:"Từ 08:47 tới 09:00 là 13 phút, thêm 32 phút nữa là 45 phút. Trừ thẳng 932 &minus; 847 sẽ ra sai."}},
m9:{d:[{en:"Doubling the sides of a square multiplies its area by 4, not by 2.",vi:"Gấp đôi cạnh hình vuông thì diện tích gấp 4 lần chứ không phải 2 lần."},
 {en:"Volume of any prism = area of the cross-section &times; length.",vi:"Thể tích mọi hình lăng trụ = diện tích mặt cắt &times; chiều dài."},
 {en:"1 litre = 1000 cm&sup3;, so a box 10 &times; 10 &times; 10 cm holds exactly 1 litre.",vi:"1 lít = 1000 cm&sup3;, nên hộp 10 &times; 10 &times; 10 cm chứa đúng 1 lít."}],
 a:["Đo chiều dài và rộng phòng ngủ rồi tính diện tích sàn.","Tính thể tích một hộp sữa hoặc hộp bánh và so với số ml ghi trên vỏ.","Đo chu vi mặt bàn học và tính xem cần bao nhiêu cm băng dính để viền quanh."],
 c:{q:"A square has sides of 5 cm. If each side is doubled, the new area is:",o:["50 cm&sup2;","100 cm&sup2;","25 cm&sup2;","20 cm&sup2;"],a:1,
  e:"Cạnh mới 10 cm nên diện tích 10 &times; 10 = 100 cm&sup2;, gấp 4 lần diện tích cũ 25 cm&sup2;."}},
m10:{d:[{en:"The mean is affected by one extreme value; the median is not.",vi:"Trung bình cộng bị một giá trị quá lớn hoặc quá nhỏ kéo lệch, còn trung vị thì không."},
 {en:"With an even number of values the median is halfway between the two middle ones.",vi:"Khi có số lượng giá trị chẵn, trung vị nằm giữa hai số ở giữa."},
 {en:"A graph can mislead if the vertical axis does not start at zero.",vi:"Biểu đồ có thể gây hiểu nhầm nếu trục dọc không bắt đầu từ 0 — hãy luôn kiểm tra."}],
 a:["Ghi số phút học mỗi ngày trong tuần rồi tính trung bình, trung vị và khoảng biến thiên.","Đếm màu xe đi qua cổng trong 5 phút và vẽ biểu đồ cột.","Tìm một biểu đồ trên báo và kiểm tra xem trục dọc có bắt đầu từ 0 không."],
 c:{q:"Five test scores are 8, 9, 9, 10 and 44. Which average best describes the class?",o:["The mean, because it uses every score","The median, because 44 is an extreme value","The range","The mode is always best"],a:1,
  e:"Giá trị 44 quá bất thường kéo trung bình lên tận 16. Trung vị bằng 9 mô tả nhóm đúng hơn."}},
m11:{d:[{en:"Probability can be written as a fraction, a decimal or a percentage: 1/4 = 0.25 = 25%.",vi:"Xác suất viết được dưới cả ba dạng: 1/4 = 0.25 = 25%."},
 {en:"With two dice there are 36 possible outcomes, and 7 is the most likely total.",vi:"Tung hai xúc xắc có 36 kết quả; tổng 7 là dễ ra nhất vì có 6 cách tạo ra nó."},
 {en:"Doing an experiment many times makes the experimental probability get closer to the theoretical one.",vi:"Làm thí nghiệm càng nhiều lần thì xác suất thực nghiệm càng tiến gần xác suất lý thuyết."}],
 a:["Tung đồng xu 20 lần, ghi kết quả rồi so với dự đoán 50 - 50.","Tung hai xúc xắc 30 lần, ghi tổng và xem tổng nào ra nhiều nhất.","Nói xem việc gì hôm nay là chắc chắn, có thể và không thể xảy ra."],
 c:{q:"Two dice are thrown and the numbers added. Which total is most likely?",o:["2","7","12","All the same"],a:1,
  e:"Tổng 7 có 6 cách tạo ra (1+6, 2+5, 3+4 và các cách đảo lại), nhiều hơn mọi tổng khác."}},
m12:{d:[{en:"A bar model turns words into a picture and makes the missing amount obvious.",vi:"Sơ đồ đoạn thẳng biến lời văn thành hình vẽ, làm lộ ra ngay phần cần tìm."},
 {en:"Work backwards for problems that end with a known result: undo each step in reverse.",vi:"Bài cho kết quả cuối thì làm ngược: đảo từng bước từ cuối về đầu."},
 {en:"Always ask &lsquo;is my answer sensible?&rsquo; — 4.4 buses or 0.5 people means something went wrong.",vi:"Luôn tự hỏi đáp án có hợp lý không: 4,4 chiếc xe hay 0,5 người là dấu hiệu sai."}],
 a:["Lập bài toán hai bước từ một tình huống thật trong ngày rồi giải.","Tính tiền thừa khi đi mua đồ, tự nhẩm trước khi người bán trả lại.","Vẽ sơ đồ đoạn thẳng cho một bài chia số phần trong sách bài tập."],
 c:{q:"Nam thinks of a number, doubles it, adds 6 and gets 20. What was the number?",o:["7","13","10","26"],a:0,
  e:"Làm ngược: 20 &minus; 6 = 14, rồi 14 &divide; 2 = 7. Kiểm tra lại: 7 &times; 2 + 6 = 20."}}
});
</script>

<script>
Object.assign(EXT, {
e1:{d:[{en:"Present perfect continuous (have been + -ing) stresses how long: <i>I have been waiting for an hour.</i>",vi:"Hiện tại hoàn thành tiếp diễn nhấn mạnh việc kéo dài bao lâu: <i>I have been waiting for an hour.</i>"},
 {en:"<i>gone</i> and <i>been</i> both come from <i>go</i>, but only <i>been</i> means the person has returned.",vi:"gone và been đều từ động từ go, nhưng chỉ been mới nghĩa là đã quay về."},
 {en:"With <i>this week / today / this year</i> use present perfect, because the time period is not finished.",vi:"Với this week, today, this year dùng hiện tại hoàn thành vì khoảng thời gian chưa kết thúc."}],
 a:["Kể cho bố mẹ 3 việc con đã làm hôm nay bằng present perfect (I have...).","Kể 3 việc đã làm cuối tuần trước bằng past simple, chú ý mốc thời gian.","Đặt 2 câu hỏi Have you ever...? cho người trong nhà."],
 c:{q:"Which sentence is correct?",o:["I have lived here since three years.","I have lived here for three years.","I live here since three years.","I am living here since 2020."],a:1,
  e:"for đi với khoảng thời gian (three years); since đi với mốc (2020). Đây là lỗi rất phổ biến."}},
e2:{d:[{en:"Questions usually follow the order of the text, so answer 3 is between answers 2 and 4.",vi:"Câu hỏi thường theo đúng thứ tự trong bài, nên đáp án câu 3 nằm giữa vùng của câu 2 và câu 4."},
 {en:"Watch for words like <i>always, never, all, only</i> in options — absolute words are often wrong.",vi:"Cẩn thận các từ tuyệt đối như always, never, all, only trong đáp án — thường là đáp án sai."},
 {en:"For &lsquo;How does the writer feel?&rsquo;, look at adjectives and verbs, not at the facts.",vi:"Câu hỏi về cảm xúc tác giả: nhìn vào tính từ và động từ chứ không nhìn số liệu."}],
 a:["Đọc lướt một bài báo tiếng Anh 1 phút rồi nói ý chính bằng một câu.","Chọn một đoạn văn và gạch chân 5 từ khoá quan trọng nhất.","Đọc nhãn một sản phẩm tiếng Anh trong nhà và tìm nhanh một con số cụ thể."],
 c:{q:"An option says &lsquo;Everyone in the world now recycles.&rsquo; The text says many countries recycle more. The option is:",o:["Correct","Too absolute, so wrong","Impossible to judge","The main idea"],a:1,
  e:"Bài chỉ nói nhiều nước tái chế nhiều hơn, không nói tất cả mọi người. Từ tuyệt đối làm đáp án sai."}},
e3:{d:[{en:"Present perfect passive: <i>The work has been finished.</i> (has/have been + past participle)",vi:"Bị động hiện tại hoàn thành: has/have been + V3, ví dụ <i>The work has been finished.</i>"},
 {en:"Modal passive: <i>The rubbish must be collected.</i> (modal + be + past participle)",vi:"Bị động với modal: modal + be + V3, ví dụ <i>The rubbish must be collected.</i>"},
 {en:"Only verbs that take an object can be made passive: you cannot say &lsquo;was arrived&rsquo;.",vi:"Chỉ động từ có tân ngữ mới chuyển được sang bị động; không có &lsquo;was arrived&rsquo;."}],
 a:["Viết 3 câu bị động mô tả việc nhà: The dishes are washed every evening.","Tìm 2 câu bị động trên bao bì sản phẩm (made in, produced by).","Kể lại một thí nghiệm Science bằng câu bị động."],
 c:{q:"Which sentence CANNOT be made passive?",o:["They built the school.","She wrote the letter.","He arrived early.","We cleaned the room."],a:2,
  e:"arrive là nội động từ, không có tân ngữ nên không chuyển sang bị động được."}},
e4:{d:[{en:"You can swap the clauses: <i>We will stay in if it rains.</i> No comma is needed then.",vi:"Có thể đảo vế: <i>We will stay in if it rains.</i> Khi đó không cần dấu phẩy."},
 {en:"<i>might</i> or <i>may</i> can replace <i>will</i> in a first conditional to show less certainty.",vi:"Trong loại 1 có thể thay will bằng might hoặc may để giảm mức chắc chắn."},
 {en:"<i>when</i> means it definitely happens; <i>if</i> means it may or may not.",vi:"when nghĩa là chắc chắn xảy ra; if nghĩa là có thể xảy ra hoặc không."}],
 a:["Viết 3 câu loại 1 về kế hoạch ngày mai của con.","Viết 2 câu loại 2 bắt đầu bằng If I were...","Nói một sự thật khoa học bằng câu điều kiện loại 0."],
 c:{q:"Choose the better sentence for something certain: &lsquo;___ I finish my homework, I will watch TV.&rsquo;",o:["If","When","Unless","Although"],a:1,
  e:"Chắc chắn sẽ làm xong bài thì dùng when. Dùng if nghĩa là chưa chắc làm xong."}},
e5:{d:[{en:"If the fact is still true now, the tense does not have to change: <i>He said the Earth is round.</i>",vi:"Nếu sự thật vẫn đúng ở hiện tại thì không bắt buộc lùi thì: <i>He said the Earth is round.</i>"},
 {en:"Reported commands use <i>told + person + to + verb</i>: <i>She told me to sit down.</i>",vi:"Câu mệnh lệnh tường thuật: told + người + to + V, ví dụ <i>She told me to sit down.</i>"},
 {en:"Yes/no questions are reported with <i>if</i> or <i>whether</i>: <i>He asked if I was ready.</i>",vi:"Câu hỏi yes/no tường thuật dùng if hoặc whether: <i>He asked if I was ready.</i>"}],
 a:["Nghe bố mẹ nói một câu rồi tường thuật lại bằng tiếng Anh.","Tường thuật 3 lời cô giáo dặn hôm nay bằng told me to...","Kể lại một câu hỏi bạn hỏi con bằng asked if..."],
 c:{q:"&lsquo;Are you cold?&rsquo; she asked. &rarr; She asked ______ I was cold.",o:["that","if","what","which"],a:1,
  e:"Câu hỏi yes/no khi tường thuật dùng if hoặc whether, không dùng that."}},
e6:{d:[{en:"<i>that</i> cannot be used in a clause between commas: &#10007; <i>My bike, that is new, ...</i>",vi:"Không dùng that cho mệnh đề nằm giữa hai dấu phẩy; phải dùng which hoặc who."},
 {en:"The relative pronoun can be left out when it is the object: <i>the book (which) I read</i>.",vi:"Có thể lược bỏ đại từ quan hệ khi nó là tân ngữ: <i>the book I read</i>."},
 {en:"Combining sentences with relative clauses is one of the fastest ways to raise a Writing mark.",vi:"Nối câu bằng mệnh đề quan hệ là cách nhanh nhất để nâng điểm phần Writing."}],
 a:["Viết 3 câu giới thiệu người trong nhà bằng who.","Mô tả 2 đồ vật yêu thích bằng which hoặc that.","Ghép 4 câu ngắn trong bài đọc thành 2 câu dài hơn."],
 c:{q:"Which sentence is correct?",o:["My sister, that lives in Hue, is a nurse.","My sister, who lives in Hue, is a nurse.","My sister who, lives in Hue, is a nurse.","My sister which lives in Hue is a nurse."],a:1,
  e:"Mệnh đề bổ sung nằm giữa hai dấu phẩy và nói về người nên dùng who, không dùng that."}},
e7:{d:[{en:"<i>had to</i> is the past of both <i>must</i> and <i>have to</i>: <i>I had to leave early.</i>",vi:"had to là dạng quá khứ của cả must và have to."},
 {en:"<i>can't</i> can express a strong guess: <i>He can't be at home, his car has gone.</i>",vi:"can't còn dùng để phỏng đoán chắc chắn là không: <i>He can't be at home.</i>"},
 {en:"<i>could</i> is more polite than <i>can</i> when asking for something.",vi:"could lịch sự hơn can khi đề nghị hoặc xin phép."}],
 a:["Viết 3 nội quy lớp học bằng must và mustn't.","Nói 2 lời khuyên cho bạn bị ốm bằng should.","Xin phép bố mẹ một việc bằng May I hoặc Could I."],
 c:{q:"&lsquo;His bag is gone, so he ______ still be in the classroom.&rsquo;",o:["must","can't","should","might not"],a:1,
  e:"Cặp sách đã biến mất nên chắc chắn bạn ấy KHÔNG còn trong lớp &rarr; can't be."}},
e8:{d:[{en:"Vary sentence length: a short sentence after two long ones adds impact.",vi:"Đổi độ dài câu: một câu ngắn sau hai câu dài tạo nhấn mạnh rất tốt."},
 {en:"Show, don't tell: instead of &lsquo;I was scared&rsquo;, write &lsquo;My hands were shaking.&rsquo;",vi:"Tả thay vì kể: thay vì &lsquo;I was scared&rsquo; hãy viết &lsquo;My hands were shaking.&rsquo;"},
 {en:"A report needs headings, facts and the passive; a story needs description and dialogue.",vi:"Bài báo cáo cần tiêu đề, số liệu và câu bị động; truyện cần miêu tả và lời thoại."}],
 a:["Viết một email 5 câu cho ông bà kể về tuần vừa rồi.","Viết lại một câu kể cảm xúc thành câu tả hành động.","Lập dàn ý 3 đoạn cho một câu chuyện trước khi ngủ."],
 c:{q:"Which sentence &lsquo;shows&rsquo; rather than &lsquo;tells&rsquo;?",o:["I was very happy.","The party was fun.","I could not stop grinning as I opened the box.","It was a good day."],a:2,
  e:"Câu C miêu tả hành động cụ thể để người đọc tự cảm nhận được niềm vui, thay vì nói thẳng."}},
e9:{d:[{en:"<i>im-</i> is used before m and p, <i>ir-</i> before r, <i>il-</i> before l: impossible, irregular, illegal.",vi:"im- dùng trước m và p, ir- trước r, il- trước l: impossible, irregular, illegal."},
 {en:"Many science words come from Latin or Greek: <i>bio</i> = life, <i>photo</i> = light, <i>thermo</i> = heat.",vi:"Nhiều từ khoa học gốc Latin hoặc Hy Lạp: bio là sự sống, photo là ánh sáng, thermo là nhiệt."},
 {en:"Recording a new word with a sentence, not just a translation, makes it stick far better.",vi:"Ghi từ mới kèm một câu ví dụ thay vì chỉ ghi nghĩa sẽ nhớ lâu hơn nhiều."}],
 a:["Chọn 5 từ mới hôm nay, viết mỗi từ một câu của riêng con.","Tìm 3 từ ghép trong sách và tách ra hai từ gốc.","Đoán nghĩa 2 từ chưa biết trong bài đọc rồi tra từ điển kiểm tra."],
 c:{q:"Which prefix is correct: ______regular?",o:["im-","ir-","il-","un-"],a:1,
  e:"Trước phụ âm r dùng ir- &rarr; irregular."}},
e10:{d:[{en:"Numbers are often said in an unusual way: 1 500 can be &lsquo;one thousand five hundred&rsquo; or &lsquo;fifteen hundred&rsquo;.",vi:"Số có thể đọc theo nhiều cách: 1 500 có thể là &lsquo;fifteen hundred&rsquo;."},
 {en:"Listen for signposts: <i>first, then, after that, finally</i> tell you the order of the answers.",vi:"Nghe các từ chỉ dẫn: first, then, after that, finally cho biết thứ tự đáp án."},
 {en:"Write answers as you hear them; do not wait until the end to write everything.",vi:"Viết đáp án ngay khi nghe thấy, đừng để tới cuối mới ghi."}],
 a:["Nghe một bài hát tiếng Anh và ghi lại 5 từ nghe rõ nhất.","Xem 3 phút phim hoạt hình tiếng Anh có phụ đề rồi tắt phụ đề xem lại.","Nghe bố mẹ đọc một dãy số tiếng Anh và ghi lại."],
 c:{q:"The speaker says &lsquo;fifteen hundred people came&rsquo;. How do you write this number?",o:["15","150","1 500","15 000"],a:2,
  e:"fifteen hundred = 15 &times; 100 = 1 500. Cách đọc này rất hay xuất hiện trong bài nghe."}},
e11:{d:[{en:"Fillers such as <i>Well, ... Let me think, ...</i> buy you time without silence.",vi:"Các từ đệm như Well... hay Let me think... giúp có thời gian suy nghĩ mà không bị im lặng."},
 {en:"Compare two things using <i>-er than</i> or <i>more ... than</i> to make answers richer.",vi:"So sánh hai thứ bằng -er than hoặc more... than để câu trả lời phong phú hơn."},
 {en:"Ending an answer with a question keeps the conversation going: <i>...What about you?</i>",vi:"Kết câu trả lời bằng một câu hỏi ngược lại giúp hội thoại tiếp diễn: <i>What about you?</i>"}],
 a:["Miêu tả một bức ảnh trong nhà bằng 5 câu tiếng Anh.","Trả lời 3 câu hỏi của bố mẹ, mỗi câu đều có because.","Nói 1 phút về ngày hôm nay, không dừng lại quá 3 giây."],
 c:{q:"Which reply keeps the conversation going best?",o:["Yes.","I like football. What about you?","Football.","I don't know."],a:1,
  e:"Trả lời đầy đủ rồi hỏi ngược lại vừa thể hiện vốn từ vừa duy trì hội thoại — giám khảo đánh giá cao."}}
});
</script>

  display:grid;place-items:center;font-size:13px;flex:none;color:transparent}
.todo[data-done="1"]{background:var(--good-bg); border-color:var(--good)}

<script>
if(!S.todo) S.todo = {};
function extHTML(uid){
  const x = EXT[uid]; if(!x) return "";
  return `<div class="card" style="padding:15px 14px">
      <p class="label" style="margin-bottom:11px">&#10022; Đào sâu &middot; vượt lên trên sách giáo khoa</p>
      <div class="stack-s">${x.d.map(p=>`<div class="deep"><div class="row" style="align-items:flex-start">
        <p class="en" style="flex:1">${p.en}</p>${spk(p.en)}</div>
        <p class="vi${viClass()}">${p.vi}</p></div>`).join("")}</div></div>
    ${applyHTML(uid)}
    <div class="card" style="padding:15px 14px">
      <p class="label" style="margin-bottom:8px">&#127919; Câu hỏi thử thách</p>
      <p class="qtext" style="font-size:16px;margin:2px 0 12px">${x.c.q}</p>
      <div class="stack-s" id="chal"></div><div id="chalAfter"></div></div>`;
}
function applyHTML(uid){
  const x = EXT[uid]; if(!x) return "";
  return `<div class="card" style="padding:15px 14px">
    <p class="label" style="margin-bottom:4px">&#9757; Ứng dụng ngay hôm nay</p>
    <p style="font-size:12.5px;color:var(--ink-faint);margin-bottom:11px">Ba việc làm được ngay ở nhà. Chạm để đánh dấu đã làm.</p>
    <div class="stack-s" data-todo="${uid}">${x.a.map((t,i)=>
      `<button class="todo" data-i="${i}" data-done="${S.todo[uid+":"+i]===today()?1:0}">
        <span class="box">&#10003;</span><span>${t}</span></button>`).join("")}</div></div>`;
}
function bindApply(root, uid){
  const box = root.querySelector(`[data-todo="${uid}"]`); if(!box) return;
  box.querySelectorAll('.todo').forEach(b=>b.onclick=()=>{
    const key = uid+":"+b.dataset.i;
    if(S.todo[key]===today()){ delete S.todo[key]; b.dataset.done="0"; }
    else { S.todo[key]=today(); b.dataset.done="1"; }
    save();
  });
}
function bindExt(root, uid){
  bindApply(root, uid);
  const x = EXT[uid], wrap = root.querySelector('#chal'), after = root.querySelector('#chalAfter');
  if(!wrap) return;
  x.c.o.forEach((o,j)=>{
    const b = el(`<button class="opt"><span class="k">${"ABCD"[j]}</span><span>${o}</span></button>`);
    b.onclick=()=>{
      [...wrap.children].forEach((n,y)=>{ n.disabled=true;
        if(y===x.c.a) n.dataset.s="right"; else if(y===j) n.dataset.s="wrong"; });
      const ok = j===x.c.a;
      after.innerHTML = `<div class="expl fade" style="margin-top:13px">
        <p class="v" style="color:var(--${ok?'good':'bad'})">${ok?"&#10003; Xuất sắc":"&#10007; Chưa đúng &mdash; đáp án là "+"ABCD"[x.c.a]}</p>
        <p>${x.c.e}</p></div>`;
    };
    wrap.appendChild(b);
  });
}
</script>

<script>
/* gắn phần Ứng dụng hôm nay vào ngay sau khi làm xong quiz một bài */
const _vResult = vResult;
vResult = function(){
  _vResult();
  const u = findUnit(ST.uid);
  if(!u || !EXT[u.id] || ST.src==="review" || ST.src==="mix") return;
  const card = el(applyHTML(u.id));
  const anchor = view.querySelector('.stack');
  anchor.insertBefore(card, anchor.children[1]);
  bindApply(view, u.id);
  view.querySelectorAll('[data-say]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); say(b.dataset.say); });
};
render();
</script>
