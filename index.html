<meta charset="utf-8">
<title>Lâm's Checkpoint Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checkpoint Lab">
<meta name="theme-color" content="#F2F5F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,600;0,7..72,700;1,7..72,600&family=Lexend:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --paper:#F2F5F9; --card:#FFFFFF; --card-2:#F8FAFC;
  --ink:#131B27; --ink-soft:#5A6879; --ink-faint:#8A97A8;
  --line:#DCE3EC; --grid:rgba(19,27,39,.05);
  --sci:#0E8A6E; --sci-bg:#E2F2ED;
  --mat:#C94E26; --mat-bg:#FBE8E0;
  --esl:#4A5CD1; --esl-bg:#E7EAFC;
  --good:#0E8A6E; --good-bg:#E2F2ED;
  --bad:#BF3A31;  --bad-bg:#FBE6E4;
  --warn:#A9700E; --warn-bg:#FBF0DC;
  --shadow:0 1px 2px rgba(19,27,39,.05), 0 10px 26px -16px rgba(19,27,39,.28);
  --r:14px; --ac:var(--ink); --ac-bg:var(--card-2);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1219; --card:#161D27; --card-2:#1C242F;
    --ink:#E7EDF6; --ink-soft:#98A5B7; --ink-faint:#6C7A8C;
    --line:#26303D; --grid:rgba(255,255,255,.035);
    --sci:#31C4A0; --sci-bg:#0F312B;
    --mat:#F0865A; --mat-bg:#382017;
    --esl:#8E9BF7; --esl-bg:#1C2145;
    --good:#31C4A0; --good-bg:#0F312B;
    --bad:#F0736A;  --bad-bg:#3A1E1B;
    --warn:#E0A94A; --warn-bg:#332711;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1219; --card:#161D27; --card-2:#1C242F;
  --ink:#E7EDF6; --ink-soft:#98A5B7; --ink-faint:#6C7A8C;
  --line:#26303D; --grid:rgba(255,255,255,.035);
  --sci:#31C4A0; --sci-bg:#0F312B;
  --mat:#F0865A; --mat-bg:#382017;
  --esl:#8E9BF7; --esl-bg:#1C2145;
  --good:#31C4A0; --good-bg:#0F312B;
  --bad:#F0736A;  --bad-bg:#3A1E1B;
  --warn:#E0A94A; --warn-bg:#332711;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Lexend,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:400; font-size:16px; line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{font-family:Literata,Georgia,serif; font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; text-align:left}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--esl); outline-offset:2px; border-radius:6px}

.app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
  background:color-mix(in srgb, var(--paper) 82%, transparent);
  border-left:1px solid var(--line); border-right:1px solid var(--line)}
@media(max-width:520px){.app{border:0}}
.topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:12px 16px; background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); min-height:56px}
.topbar h1{font-size:17px; letter-spacing:-.02em}
.back{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-size:17px;flex:none}
.spacer{flex:1}
.streak{font-size:13px; padding:5px 10px; border-radius:99px; background:var(--mat-bg); color:var(--mat); font-weight:500}
main{flex:1; padding:16px 16px 100px}
.tabs{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
  max-width:480px; margin:0 auto; background:color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1; padding:7px 2px 6px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:10.5px; color:var(--ink-faint); font-weight:500; text-align:center; position:relative}
.tab span:first-child{font-size:19px; line-height:1.1}
.tab[aria-current="true"]{color:var(--ink); background:var(--card-2)}
.tab .badge{position:absolute; top:3px; right:calc(50% - 22px); min-width:17px; height:17px; padding:0 4px;
  border-radius:99px; background:var(--bad); color:#fff; font-size:10px; font-weight:700; line-height:17px; text-align:center}

.eyebrow{font-family:Literata,serif; font-style:italic; font-size:13px; color:var(--ink-soft)}
.label{font-size:11px; text-transform:uppercase; letter-spacing:.11em; font-weight:600; color:var(--ink-faint)}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.stack{display:flex; flex-direction:column; gap:14px}
.stack-s{display:flex; flex-direction:column; gap:9px}
.row{display:flex; align-items:center; gap:10px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  padding:14px 18px; border-radius:12px; background:var(--ink); color:var(--paper); font-weight:500; font-size:15px}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:var(--card); color:var(--ink); border:1px solid var(--line)}
.btn-accent{background:var(--ac); color:#fff}
:root[data-theme="dark"] .btn-accent{color:#0D1219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-accent{color:#0D1219}}
.btn-sm{padding:9px 14px; font-size:13.5px; width:auto}
.pill{display:inline-block; font-size:11.5px; font-weight:500; padding:3px 9px; border-radius:99px;
  background:var(--card-2); color:var(--ink-soft); border:1px solid var(--line); white-space:nowrap}
.pill.on{background:var(--ac-bg); color:var(--ac); border-color:transparent}
.pill.warn{background:var(--warn-bg); color:var(--warn); border-color:transparent}
.bar{height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--ac); border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1)}

.hero{padding:18px; border-radius:18px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow)}
.hero h2{font-size:22px; margin:2px 0 6px}
.plan{display:flex; gap:8px; margin:14px 0 16px}
.leg{flex:1; padding:9px 10px; border-radius:11px; background:var(--card-2); border:1px solid var(--line)}
.leg b{display:block; font-family:Literata,serif; font-size:13px}
.leg small{font-size:11px; color:var(--ink-faint)}
.subj{display:block; width:100%; padding:15px 16px; border-radius:var(--r);
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); border-left:4px solid var(--ac)}
.subj h3{font-size:17px}
.subj .n{font-size:13px; color:var(--ink-soft)}
.dot{width:9px;height:9px;border-radius:99px;background:var(--ac);flex:none}
.unit{display:block; width:100%; padding:13px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line)}
.unit.locked{opacity:.5; background:transparent; box-shadow:none; border-style:dashed}
.unit h4{font-size:15px}
.unit .en{font-size:12.5px; color:var(--ink-soft)}
.num{width:28px;height:28px;border-radius:9px;background:var(--ac-bg);color:var(--ac);
  display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;font-family:"JetBrains Mono",monospace}

.kp{padding:14px; border-radius:12px; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--ac)}
.kp .en{font-family:Literata,serif; font-weight:600; font-size:15.5px; line-height:1.45}
.kp .vi{font-size:14px; color:var(--ink-soft); margin-top:7px}
.vi.veil{color:transparent; background:var(--card-2); border-radius:6px; cursor:pointer; user-select:none; position:relative}
.vi.veil::after{content:"Chạm để xem tiếng Việt"; position:absolute; inset:0; display:grid; place-items:center;
  color:var(--ink-faint); font-size:12.5px; letter-spacing:.02em}
.spk{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card-2);
  display:grid;place-items:center;font-size:14px;flex:none}
.spk:active{background:var(--ac-bg)}
.voc{display:flex; align-items:center; gap:10px; padding:10px 13px; border-bottom:1px solid var(--line)}
.voc:last-child{border-bottom:0}
.voc b{font-family:Literata,serif; font-size:14.5px; font-weight:600}
.voc i{font-style:normal; font-size:13.5px; color:var(--ink-soft); text-align:right; flex:1}
.voc i.veil{color:transparent; background:var(--card-2); border-radius:6px; min-height:20px; cursor:pointer}
.passage{padding:16px; border-radius:12px; background:var(--card-2); border:1px solid var(--line);
  font-family:Literata,serif; font-size:15px; line-height:1.65}
.passage p+p{margin-top:10px}

.fc{min-height:230px; padding:22px; border-radius:18px; background:var(--card); border:1px solid var(--line);
  box-shadow:var(--shadow); display:flex; flex-direction:column; justify-content:center; gap:12px; text-align:center}
.fc .q{font-family:Literata,serif; font-size:19px; font-weight:700; line-height:1.35}
.fc .a{font-size:14.5px; color:var(--ink-soft)}

.qtext{font-family:Literata,serif; font-size:18px; font-weight:700; line-height:1.45; margin:6px 0 14px}
.opt{display:flex; gap:11px; align-items:flex-start; width:100%; padding:13px 14px;
  border-radius:12px; background:var(--card); border:1.5px solid var(--line); font-size:15px; line-height:1.4}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--card-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;font-family:"JetBrains Mono",monospace}
.opt[data-s="right"]{border-color:var(--good); background:var(--good-bg)}
.opt[data-s="right"] .k{background:var(--good); color:var(--card); border-color:transparent}
.opt[data-s="wrong"]{border-color:var(--bad); background:var(--bad-bg)}
.opt[data-s="wrong"] .k{background:var(--bad); color:var(--card); border-color:transparent}
.opt[data-s="pick"]{border-color:var(--ac); background:var(--ac-bg)}
.opt[data-s="pick"] .k{background:var(--ac); color:var(--card); border-color:transparent}
.expl{padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--card-2)}
.expl .v{font-weight:600; font-size:14px; margin-bottom:5px}
.expl p{font-size:14px; color:var(--ink-soft)}
.score{font-family:"JetBrains Mono",monospace; font-size:46px; font-weight:700; line-height:1; letter-spacing:-.03em}
.rev{padding:12px 14px; border-radius:11px; border:1px solid var(--line); background:var(--card)}
.rev .qq{font-family:Literata,serif; font-weight:600; font-size:14px}
.rev .aa{font-size:13px; margin-top:4px}
.tick{color:var(--good); font-weight:700}
.cross{color:var(--bad); font-weight:700}

.navgrid{display:grid; grid-template-columns:repeat(6,1fr); gap:7px}
.navgrid button{aspect-ratio:1; border-radius:9px; border:1.5px solid var(--line); background:var(--card);
  display:grid; place-items:center; font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:700}
.navgrid button[data-s="done"]{background:var(--ac-bg); border-color:transparent; color:var(--ac)}
.navgrid button[data-s="now"]{border-color:var(--ac); border-width:2.5px}
.navgrid button[data-s="right"]{background:var(--good-bg); color:var(--good); border-color:transparent}
.navgrid button[data-s="wrong"]{background:var(--bad-bg); color:var(--bad); border-color:transparent}

.chart{display:flex; align-items:flex-end; gap:7px; height:96px; padding:0 2px}
.chart div{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:5px; height:100%}
.chart i{display:block; width:100%; border-radius:5px 5px 2px 2px; background:var(--ac-bg); min-height:3px}
.chart i.has{background:var(--ac)}
.chart small{font-size:10px; color:var(--ink-faint)}
.kv{display:flex; justify-content:space-between; gap:12px; padding:11px 14px; border-bottom:1px solid var(--line); font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
.sw{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 15px}
.sw .t{font-size:14.5px}
.sw .t small{display:block; font-size:12px; color:var(--ink-faint)}
.toggle{width:46px; height:27px; border-radius:99px; background:var(--line); position:relative; flex:none; transition:background .2s}
.toggle::after{content:""; position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:99px;
  background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s}
.toggle[aria-pressed="true"]{background:var(--good)}
.toggle[aria-pressed="true"]::after{transform:translateX(19px)}

.note{padding:13px 15px; border-radius:12px; background:var(--esl-bg); font-size:13.5px; line-height:1.5}
.timer{font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:700; padding:5px 9px;
  border-radius:8px; background:var(--card-2); border:1px solid var(--line)}
.timer.low{background:var(--bad-bg); color:var(--bad); border-color:transparent}
.fade{animation:fade .28s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
</style>

<div class="app">
  <header class="topbar">
    <button class="back" id="back" hidden aria-label="Quay lại">&#8592;</button>
    <h1 id="ttl">Checkpoint Lab</h1>
    <div class="spacer"></div>
    <div id="topright" class="row" style="gap:6px"></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>

<script>
const DATA = {
science: { name:"Science", vi:"Khoa học", icon:"&#129514;", ac:"--sci", acbg:"--sci-bg", units:[

{ id:"s1", t:"Circulatory system & health", vi:"Hệ tuần hoàn và sức khoẻ",
  kp:[
    {en:"The circulatory system is the heart, the blood vessels and the blood.", vi:"Hệ tuần hoàn gồm tim, mạch máu và máu — vận chuyển oxygen và chất dinh dưỡng đi khắp cơ thể."},
    {en:"The heart is a muscle with four chambers. It pumps blood all the time.", vi:"Tim là một khối cơ có 4 ngăn, bơm máu liên tục kể cả khi ta ngủ."},
    {en:"Arteries carry blood AWAY from the heart. They have thick, muscular walls because the blood is at high pressure.", vi:"Động mạch đưa máu ĐI khỏi tim, thành dày và có cơ vì áp lực máu rất cao."},
    {en:"Veins carry blood BACK to the heart. They have thinner walls and valves to stop blood flowing backwards.", vi:"Tĩnh mạch đưa máu VỀ tim, thành mỏng hơn và có van để máu không chảy ngược."},
    {en:"Capillaries are only one cell thick, so oxygen and nutrients can pass into the body cells.", vi:"Mao mạch chỉ dày bằng một tế bào, nên oxygen và chất dinh dưỡng đi xuyên qua được vào tế bào."},
    {en:"Blood is made of red blood cells (carry oxygen), white blood cells (fight disease), platelets (clotting) and plasma (liquid).", vi:"Máu gồm: hồng cầu chở oxygen, bạch cầu chống bệnh, tiểu cầu làm đông máu, huyết tương là phần lỏng."},
    {en:"Blood picks up oxygen in the lungs and gives out carbon dioxide.", vi:"Máu nhận oxygen tại phổi và thải carbon dioxide ra ngoài."},
    {en:"During exercise the pulse rate rises because muscles need more oxygen and glucose.", vi:"Khi vận động, nhịp mạch tăng vì cơ bắp cần nhiều oxygen và glucose hơn."}],
  voc:[["heart","tim"],["artery","động mạch"],["vein","tĩnh mạch"],["capillary","mao mạch"],["valve","van (tim, tĩnh mạch)"],["red blood cell","hồng cầu"],["platelet","tiểu cầu"],["plasma","huyết tương"],["pulse rate","nhịp mạch (lần/phút)"],["oxygen","khí oxy"]],
  quiz:[
    {q:"Which blood vessel carries blood away from the heart?", o:["Artery","Vein","Capillary","Valve"], a:0,
     e:"Động mạch (artery) mang máu ĐI khỏi tim. Mẹo nhớ: <b>A</b>rtery = <b>A</b>way. Tĩnh mạch (vein) mang máu về tim."},
    {q:"Why do arteries have thicker walls than veins?", o:["They carry more blood","The blood in them is at higher pressure","They are closer to the skin","They carry carbon dioxide"], a:1,
     e:"Tim bơm máu vào động mạch với áp lực rất mạnh, nên thành động mạch phải dày và có cơ để chịu được áp lực đó."},
    {q:"Which part of the blood carries oxygen around the body?", o:["Plasma","Platelets","Red blood cells","White blood cells"], a:2,
     e:"Hồng cầu chứa haemoglobin để gắn oxygen. Bạch cầu chống bệnh, tiểu cầu làm đông máu, huyết tương là phần lỏng."},
    {q:"Where does the blood collect oxygen?", o:["In the stomach","In the lungs","In the muscles","In the liver"], a:1,
     e:"Ở phổi, oxygen từ không khí đi vào máu và carbon dioxide đi ra — gọi là trao đổi khí (gas exchange)."},
    {q:"Ha runs for two minutes. What happens to her pulse rate and why?", o:["It falls, because she is tired","It stays the same","It rises, because her muscles need more oxygen","It rises, because her blood gets thicker"], a:2,
     e:"Cơ bắp hoạt động cần nhiều oxygen và glucose hơn nên tim đập nhanh hơn. Sau khi nghỉ, nhịp mạch giảm về bình thường."},
    {q:"In an investigation about exercise and pulse rate, which is the variable you CHANGE?", o:["The type of exercise","The person being tested","The way you measure the pulse","The time you rest first"], a:0,
     e:"Biến thay đổi (independent variable) là loại vận động. Các yếu tố còn lại phải giữ nguyên để bài thí nghiệm công bằng — fair test."}]},

{ id:"s2", t:"Reversible & irreversible changes", vi:"Biến đổi thuận nghịch và không thuận nghịch",
  kp:[
    {en:"A reversible change can be changed back. The material stays the same substance.", vi:"Biến đổi thuận nghịch: có thể quay lại chất ban đầu, không tạo ra chất mới."},
    {en:"Melting, freezing, evaporating, condensing and dissolving are all reversible.", vi:"Nóng chảy, đông đặc, bay hơi, ngưng tụ và hoà tan đều là thuận nghịch."},
    {en:"An irreversible change makes a NEW substance and cannot be changed back.", vi:"Biến đổi không thuận nghịch tạo ra CHẤT MỚI và không quay lại được."},
    {en:"Burning, cooking, rusting and mixing vinegar with bicarbonate of soda are irreversible.", vi:"Đốt cháy, nấu chín, gỉ sét, trộn giấm với baking soda — đều không thuận nghịch."},
    {en:"Signs of an irreversible change: a gas is made, a colour change, heat or light is given out.", vi:"Dấu hiệu nhận biết: có khí hoặc bọt sinh ra, đổi màu, toả nhiệt hoặc phát sáng."},
    {en:"Melting is not the same as dissolving. Melting needs heat; dissolving needs a solvent such as water.", vi:"Nóng chảy KHÁC hoà tan. Nóng chảy do nhiệt; hoà tan cần dung môi như nước."},
    {en:"Rusting needs iron, oxygen and water together.", vi:"Gỉ sét cần đủ cả ba: sắt, oxygen và nước."},
    {en:"Separate mixtures by sieving, filtering, evaporating or using a magnet.", vi:"Tách hỗn hợp: rây, lọc, làm bay hơi, hoặc dùng nam châm."}],
  voc:[["reversible","thuận nghịch (quay lại được)"],["irreversible","không thuận nghịch"],["dissolve","hoà tan"],["solution","dung dịch"],["evaporate","bay hơi"],["condense","ngưng tụ"],["rusting","sự gỉ sét"],["filtering","lọc"],["soluble","tan được"],["mixture","hỗn hợp"]],
  quiz:[
    {q:"Which change is IRREVERSIBLE?", o:["Melting chocolate","Freezing water","Burning wood","Dissolving sugar"], a:2,
     e:"Đốt gỗ tạo ra tro, khí carbon dioxide và hơi nước — chất mới, không thể biến lại thành gỗ. Ba đáp án còn lại quay lại được."},
    {q:"Salt is stirred into water and disappears. How can you get the salt back?", o:["Filter the solution","Evaporate the water","Use a magnet","You cannot get it back"], a:1,
     e:"Muối tan hoàn toàn nên lọc không giữ lại được. Làm nước bay hơi thì muối kết tinh trở lại — chứng minh hoà tan là thuận nghịch."},
    {q:"An egg is fried. Which shows this is an irreversible change?", o:["It gets hot","A new substance is made and it cannot go back","It changes shape","It becomes lighter"], a:1,
     e:"Nóng lên hay đổi hình dạng chưa đủ. Dấu hiệu quyết định là tạo ra chất mới và không thể trở lại trứng sống."},
    {q:"Which three things are needed for iron to rust?", o:["Iron, heat and light","Iron, oxygen and water","Iron, salt and air","Iron, carbon dioxide and water"], a:1,
     e:"Cần đủ sắt + oxygen + nước. Thiếu một yếu tố (ví dụ sơn phủ chặn nước và không khí) thì không gỉ."},
    {q:"Sand is mixed with water. The best way to separate it is to:", o:["Evaporate the water","Filter the mixture","Use a magnet","Freeze the mixture"], a:1,
     e:"Cát không tan nên bị giữ lại trên giấy lọc, nước chảy qua. Bay hơi chỉ dùng khi chất đã tan."},
    {q:"Vinegar is added to bicarbonate of soda and bubbles appear. This tells you that:", o:["The mixture is dissolving","A gas is being made, so it is irreversible","The vinegar is evaporating","The change is reversible"], a:1,
     e:"Bọt khí là dấu hiệu có khí mới sinh ra (carbon dioxide) — chất mới đã hình thành, nên là biến đổi không thuận nghịch."}]},

{ id:"s3", t:"Classification, food chains & adaptation", vi:"Phân loại, chuỗi thức ăn và thích nghi",
  kp:[
    {en:"Living things are sorted into groups: vertebrates (with a backbone) and invertebrates (without one).", vi:"Sinh vật được chia nhóm: động vật có xương sống và không xương sống."},
    {en:"The five vertebrate groups are fish, amphibians, reptiles, birds and mammals.", vi:"Năm nhóm có xương sống: cá, lưỡng cư, bò sát, chim và thú."},
    {en:"A branching key (dichotomous key) sorts organisms using yes/no questions about visible features.", vi:"Khoá lưỡng phân dùng câu hỏi có/không về đặc điểm nhìn thấy được để phân loại."},
    {en:"In a food chain, arrows show the flow of energy and always point TO the eater.", vi:"Trong chuỗi thức ăn, mũi tên chỉ chiều truyền năng lượng và luôn hướng VỀ con vật ăn."},
    {en:"Producers (green plants) make their own food. Consumers eat other living things. Decomposers break down dead material.", vi:"Sinh vật sản xuất (cây xanh) tự tạo thức ăn; sinh vật tiêu thụ ăn sinh vật khác; sinh vật phân huỷ phân giải xác chết."},
    {en:"A food web joins several food chains in the same habitat.", vi:"Lưới thức ăn là nhiều chuỗi thức ăn nối với nhau trong cùng một môi trường sống."},
    {en:"An adaptation is a feature that helps an organism survive in its habitat — thick fur in cold places, deep roots in deserts.", vi:"Thích nghi là đặc điểm giúp sinh vật sống được trong môi trường của nó: lông dày ở xứ lạnh, rễ sâu ở sa mạc."},
    {en:"If one species in a food web disappears, the numbers of the other species change too.", vi:"Nếu một loài trong lưới thức ăn biến mất, số lượng các loài khác cũng thay đổi theo."}],
  voc:[["vertebrate","động vật có xương sống"],["invertebrate","động vật không xương sống"],["amphibian","lưỡng cư"],["habitat","môi trường sống"],["producer","sinh vật sản xuất"],["consumer","sinh vật tiêu thụ"],["predator / prey","kẻ săn mồi / con mồi"],["decomposer","sinh vật phân huỷ"],["adaptation","sự thích nghi"],["classify","phân loại"]],
  quiz:[
    {q:"In the food chain grass &rarr; rabbit &rarr; fox, what does the arrow mean?", o:["&ldquo;is eaten by&rdquo;","&ldquo;eats&rdquo;","&ldquo;lives near&rdquo;","&ldquo;is bigger than&rdquo;"], a:0,
     e:"Mũi tên chỉ chiều năng lượng đi: cỏ <i>bị ăn bởi</i> thỏ. Nhiều bạn nhớ ngược thành &ldquo;ăn&rdquo; nên vẽ sai chiều mũi tên."},
    {q:"Which animal group has a backbone, lays eggs and has dry scaly skin?", o:["Amphibians","Reptiles","Fish","Mammals"], a:1,
     e:"Bò sát: da khô, có vảy, đẻ trứng trên cạn. Lưỡng cư da ẩm và đẻ trứng dưới nước; cá có vảy ướt và sống dưới nước."},
    {q:"What is the producer in the chain: leaf &rarr; caterpillar &rarr; bird &rarr; cat?", o:["Cat","Bird","Caterpillar","Leaf"], a:3,
     e:"Sinh vật sản xuất luôn đứng đầu chuỗi và là thực vật, vì nó tự tạo thức ăn nhờ quang hợp."},
    {q:"A polar bear has thick white fur. This adaptation helps it to:", o:["Swim faster","Keep warm and stay hidden in snow","Find food underground","Breathe under water"], a:1,
     e:"Lông dày giữ nhiệt trong khí hậu lạnh, màu trắng giúp nguỵ trang trên tuyết khi săn mồi — hai lợi ích cùng lúc."},
    {q:"All the foxes in a food web are removed. What most likely happens to the rabbits?", o:["Their number falls","Their number rises","Nothing changes","They become producers"], a:1,
     e:"Mất kẻ săn mồi thì số thỏ tăng lên. Sau đó cỏ bị ăn nhiều hơn nên có thể lại giảm — thay đổi lan ra cả lưới thức ăn."},
    {q:"Which question is best for a branching key?", o:["Is the animal friendly?","Does the animal have six legs?","Is the animal happy?","Does the animal like water?"], a:1,
     e:"Câu hỏi trong khoá phân loại phải quan sát được và trả lời chắc chắn có/không. &ldquo;Thân thiện&rdquo; hay &ldquo;vui&rdquo; là ý kiến, không đo được."}]},

{ id:"s4", t:"Solids, liquids, gases & solutions", vi:"Chất rắn, lỏng, khí và dung dịch",
  kp:[
    {en:"Solids keep their shape and volume; liquids keep volume but take the shape of the container; gases fill all the space.", vi:"Rắn giữ nguyên hình dạng và thể tích; lỏng giữ thể tích nhưng theo hình bình chứa; khí lan đầy không gian."},
    {en:"In solids the particles are packed and only vibrate. In liquids they slide past each other. In gases they move fast and far apart.", vi:"Hạt trong chất rắn xếp sát và chỉ rung; trong chất lỏng trượt lên nhau; trong chất khí bay nhanh và cách xa nhau."},
    {en:"Water melts at 0&deg;C and boils at 100&deg;C.", vi:"Nước nóng chảy ở 0&deg;C và sôi ở 100&deg;C — hai mốc bắt buộc nhớ."},
    {en:"Evaporation happens at any temperature and only at the surface. Boiling happens all through the liquid at its boiling point.", vi:"Bay hơi xảy ra ở mọi nhiệt độ và chỉ trên bề mặt; sôi xảy ra trong toàn khối chất lỏng tại nhiệt độ sôi."},
    {en:"Evaporation is faster when it is hotter, windier, or the surface area is larger.", vi:"Bay hơi nhanh hơn khi nóng hơn, có gió, hoặc diện tích mặt thoáng lớn hơn."},
    {en:"A solution = solute (the thing that dissolves) + solvent (usually water). Sugar is soluble; sand is insoluble.", vi:"Dung dịch = chất tan + dung môi (thường là nước). Đường tan được, cát không tan."},
    {en:"More solute dissolves when the solvent is warmer or when you stir.", vi:"Chất tan tan nhiều và nhanh hơn khi nước ấm hơn hoặc khi khuấy."},
    {en:"When a solution cannot dissolve any more solute it is saturated.", vi:"Khi dung dịch không hoà tan thêm được nữa thì gọi là dung dịch bão hoà."}],
  voc:[["particle","hạt (phân tử)"],["melting point","nhiệt độ nóng chảy"],["boiling point","nhiệt độ sôi"],["evaporation","sự bay hơi"],["condensation","sự ngưng tụ"],["solute","chất tan"],["solvent","dung môi"],["insoluble","không tan"],["saturated","bão hoà"],["surface area","diện tích bề mặt"]],
  quiz:[
    {q:"Which state of matter has a fixed volume but no fixed shape?", o:["Solid","Liquid","Gas","None of them"], a:1,
     e:"Chất lỏng giữ nguyên thể tích nhưng đổ vào bình nào thì mang hình bình đó. Rắn cố định cả hai; khí không cố định cái nào."},
    {q:"Two identical puddles dry up. One is in the sun and one is in the shade. Which dries first and why?", o:["The shade one, it is cooler","The sun one, higher temperature speeds up evaporation","Both at the same time","The shade one, less wind"], a:1,
     e:"Nhiệt độ cao cung cấp nhiều năng lượng hơn cho các hạt nước thoát khỏi bề mặt, nên vũng nước ngoài nắng khô trước."},
    {q:"What is the difference between evaporation and boiling?", o:["Boiling only happens at the surface","Evaporation happens at any temperature; boiling only at the boiling point","Evaporation needs a lid","There is no difference"], a:1,
     e:"Bay hơi xảy ra ở mọi nhiệt độ và chỉ ở mặt thoáng. Sôi chỉ xảy ra tại nhiệt độ sôi và diễn ra trong toàn khối chất lỏng."},
    {q:"In a cup of sweet tea, what is the solvent?", o:["The sugar","The water","The cup","The steam"], a:1,
     e:"Dung môi là chất hoà tan chất khác — ở đây là nước. Đường là chất tan (solute)."},
    {q:"Why does sugar dissolve faster in hot water?", o:["Hot water is thinner","The particles move faster and mix more quickly","Hot water is heavier","Sugar melts in hot water"], a:1,
     e:"Nước nóng có các hạt chuyển động nhanh hơn nên va chạm và tách các hạt đường nhanh hơn. Lưu ý: đường <i>tan</i> chứ không <i>nóng chảy</i>."},
    {q:"At which temperature does ice melt?", o:["0&deg;C","10&deg;C","100&deg;C","&minus;10&deg;C"], a:0,
     e:"Nước đá nóng chảy ở 0&deg;C, và cũng chính là nhiệt độ nước đóng băng. 100&deg;C là nhiệt độ sôi."}]},

{ id:"s5", t:"Forces, friction & gravity", vi:"Lực, ma sát và trọng lực",
  kp:[
    {en:"A force is a push or a pull. It is measured in newtons (N) with a forcemeter.", vi:"Lực là sự đẩy hoặc kéo, đo bằng niutơn (N) với lực kế."},
    {en:"Forces can make an object start moving, stop, speed up, slow down or change shape or direction.", vi:"Lực làm vật bắt đầu chuyển động, dừng lại, nhanh lên, chậm lại, đổi hướng hoặc đổi hình dạng."},
    {en:"Gravity is the force that pulls everything towards the centre of the Earth. Weight is the pull of gravity.", vi:"Trọng lực kéo mọi vật về tâm Trái Đất. Trọng lượng chính là lực hút đó."},
    {en:"Mass (kg) is how much matter is in an object; weight (N) changes with gravity. On the Moon your mass is the same but your weight is less.", vi:"Khối lượng (kg) không đổi; trọng lượng (N) thay đổi theo trọng lực. Lên Mặt Trăng khối lượng giữ nguyên nhưng trọng lượng nhỏ hơn."},
    {en:"Friction is a force between two surfaces that are rubbing. It slows things down and makes heat.", vi:"Ma sát là lực giữa hai bề mặt cọ xát, làm vật chậm lại và sinh nhiệt."},
    {en:"Rough surfaces give more friction; smooth or oiled surfaces give less.", vi:"Bề mặt nhám cho ma sát lớn; bề mặt nhẵn hoặc có dầu cho ma sát nhỏ."},
    {en:"Air resistance and water resistance are friction from air and water. A streamlined shape reduces them.", vi:"Lực cản không khí và lực cản nước là ma sát của không khí và nước; hình dạng thuôn giúp giảm chúng."},
    {en:"When forces on an object are balanced, it stays still or keeps moving at the same speed.", vi:"Khi các lực cân bằng, vật đứng yên hoặc chuyển động đều."}],
  voc:[["force","lực"],["newton (N)","niutơn"],["forcemeter","lực kế"],["gravity","trọng lực"],["mass","khối lượng"],["weight","trọng lượng"],["friction","ma sát"],["air resistance","lực cản không khí"],["streamlined","có hình thuôn, giảm cản"],["balanced forces","lực cân bằng"]],
  quiz:[
    {q:"What unit is force measured in?", o:["Kilograms","Newtons","Metres","Litres"], a:1,
     e:"Lực đo bằng niutơn (N). Kilôgam là đơn vị khối lượng — đừng nhầm hai đại lượng này."},
    {q:"An astronaut travels to the Moon. What happens?", o:["Mass and weight both stay the same","Mass stays the same, weight decreases","Mass decreases, weight stays the same","Both increase"], a:1,
     e:"Khối lượng là lượng vật chất nên không đổi. Trọng lực trên Mặt Trăng yếu hơn nên trọng lượng nhỏ hơn (khoảng 1/6)."},
    {q:"Why do trainers have a rough pattern on the sole?", o:["To reduce friction","To increase friction so you do not slip","To make them lighter","To look nice only"], a:1,
     e:"Đế nhám tăng ma sát với mặt sàn, giúp bám tốt và không trượt. Đây là ví dụ ma sát có lợi."},
    {q:"A parachute makes a falling person slow down because it:", o:["Reduces gravity","Increases air resistance","Increases weight","Removes friction"], a:1,
     e:"Dù có diện tích lớn nên hứng nhiều không khí, làm lực cản không khí tăng và cân bằng dần với trọng lực."},
    {q:"A box rests on a table without moving. This is because:", o:["No forces act on it","The forces on it are balanced","Gravity has stopped","Friction has disappeared"], a:1,
     e:"Vẫn có lực: trọng lực kéo xuống, mặt bàn đẩy lên bằng đúng độ lớn. Hai lực cân bằng nên hộp đứng yên."},
    {q:"Which shape moves through water most easily?", o:["A flat square plate","A streamlined pointed shape","A wide open cup","A rough cube"], a:1,
     e:"Hình thuôn nhọn rẽ nước dễ, giảm lực cản của nước — vì thế cá và tàu ngầm đều có dạng này."}]},

{ id:"s6", t:"Light, shadows & reflection", vi:"Ánh sáng, bóng tối và phản xạ",
  kp:[
    {en:"Light travels in straight lines from a light source such as the Sun, a lamp or a flame.", vi:"Ánh sáng truyền theo đường thẳng từ nguồn sáng như Mặt Trời, đèn hoặc ngọn lửa."},
    {en:"We see an object when light from it enters our eyes. The Moon is not a light source — it reflects sunlight.", vi:"Ta nhìn thấy vật khi ánh sáng từ vật đi vào mắt. Mặt Trăng không phải nguồn sáng, nó phản xạ ánh sáng Mặt Trời."},
    {en:"Opaque materials block light, translucent ones let some through, transparent ones let light through clearly.", vi:"Vật cản sáng chặn hoàn toàn; vật mờ cho một phần ánh sáng qua; vật trong suốt cho ánh sáng qua rõ."},
    {en:"A shadow forms when an opaque object blocks light. The shadow has the same shape as the object.", vi:"Bóng hình thành khi vật cản sáng chặn ánh sáng; bóng có hình dạng giống vật."},
    {en:"Move the object closer to the light source and the shadow gets BIGGER; move it away and the shadow gets smaller.", vi:"Đưa vật lại gần nguồn sáng thì bóng TO ra; đưa ra xa thì bóng nhỏ lại."},
    {en:"Light reflects off a smooth shiny surface. The angle of incidence equals the angle of reflection.", vi:"Ánh sáng phản xạ trên mặt nhẵn bóng: góc tới bằng góc phản xạ."},
    {en:"In a mirror the image is the same size, the same distance behind the mirror, and left and right are swapped.", vi:"Ảnh trong gương cùng kích thước, cách gương một khoảng bằng vật, và trái phải bị đảo ngược."},
    {en:"White light can be split into a spectrum of colours by a prism or by raindrops making a rainbow.", vi:"Ánh sáng trắng bị tách thành dải màu qua lăng kính hoặc hạt mưa tạo cầu vồng."}],
  voc:[["light source","nguồn sáng"],["opaque","không cho ánh sáng qua"],["translucent","mờ, cho một phần qua"],["transparent","trong suốt"],["shadow","bóng"],["reflect","phản xạ"],["angle of incidence","góc tới"],["mirror image","ảnh trong gương"],["prism","lăng kính"],["spectrum","quang phổ, dải màu"]],
  quiz:[
    {q:"Which of these is NOT a light source?", o:["The Sun","A candle flame","The Moon","A torch bulb"], a:2,
     e:"Mặt Trăng chỉ phản xạ ánh sáng Mặt Trời, nó không tự phát ra ánh sáng nên không phải nguồn sáng."},
    {q:"A toy is moved closer to a torch. What happens to its shadow on the wall?", o:["It gets bigger","It gets smaller","It disappears","It stays the same"], a:0,
     e:"Vật càng gần nguồn sáng thì chặn được nhiều tia sáng hơn và các tia loe rộng hơn, nên bóng trên tường to ra."},
    {q:"Frosted bathroom glass lets some light through but you cannot see clearly. It is:", o:["Transparent","Translucent","Opaque","Reflective"], a:1,
     e:"Kính mờ = translucent: ánh sáng đi qua nhưng bị tán xạ nên hình ảnh không rõ. Trong suốt là transparent, cản hẳn là opaque."},
    {q:"Light hits a mirror at 30&deg; to the mirror's normal. At what angle does it reflect?", o:["15&deg;","30&deg;","60&deg;","90&deg;"], a:1,
     e:"Định luật phản xạ: góc tới bằng góc phản xạ, nên vẫn là 30&deg;."},
    {q:"Why can you see this page?", o:["Your eyes send out light","Light from the page enters your eyes","The page makes its own light","Shadows fall on it"], a:1,
     e:"Ta nhìn thấy vật không tự phát sáng nhờ ánh sáng phản xạ từ vật đi vào mắt. Mắt không phát ra ánh sáng."},
    {q:"You hold up your right hand in front of a mirror. In the image it looks like:", o:["The right hand","The left hand","No hand","Two hands"], a:1,
     e:"Gương đảo trái - phải (lateral inversion), nên tay phải trông như tay trái. Kích thước và khoảng cách thì không đổi."}]},

{ id:"s7", t:"Electricity & circuits", vi:"Điện và mạch điện",
  kp:[
    {en:"A circuit must be a complete loop from one end of the cell, through the components, and back to the other end.", vi:"Mạch điện phải là vòng kín từ cực này của pin, qua các bộ phận, rồi về cực kia."},
    {en:"A switch works by making a gap in the circuit (off) or closing it (on).", vi:"Công tắc hoạt động bằng cách tạo khe hở (tắt) hoặc nối liền mạch (bật)."},
    {en:"Conductors let electricity flow — metals, graphite. Insulators do not — plastic, rubber, wood, glass.", vi:"Vật dẫn cho điện đi qua (kim loại, than chì); vật cách điện thì không (nhựa, cao su, gỗ, thuỷ tinh)."},
    {en:"Adding more cells makes the lamp brighter because the voltage is higher.", vi:"Thêm pin làm đèn sáng hơn vì hiệu điện thế lớn hơn."},
    {en:"Adding more lamps in a series circuit makes each one dimmer.", vi:"Thêm bóng đèn vào mạch nối tiếp thì mỗi bóng tối đi."},
    {en:"In a series circuit there is one path; if one lamp breaks, they all go out.", vi:"Mạch nối tiếp chỉ có một đường đi; một bóng hỏng là cả mạch tắt."},
    {en:"Longer or thinner wire increases resistance, so the current is smaller and the lamp is dimmer.", vi:"Dây dài hơn hoặc mảnh hơn làm điện trở tăng, dòng điện nhỏ đi nên đèn tối hơn."},
    {en:"Circuit symbols must be drawn with a ruler: cell, lamp, switch, buzzer, motor, wire.", vi:"Kí hiệu mạch điện phải vẽ bằng thước: pin, bóng đèn, công tắc, còi, động cơ, dây dẫn."}],
  voc:[["circuit","mạch điện"],["cell / battery","pin / bộ pin"],["conductor","vật dẫn điện"],["insulator","vật cách điện"],["switch","công tắc"],["voltage","hiệu điện thế"],["current","dòng điện"],["resistance","điện trở"],["series circuit","mạch nối tiếp"],["component","bộ phận, linh kiện"]],
  quiz:[
    {q:"A lamp does not light up. Which is the most likely cause?", o:["The circuit has a gap in it","The wires are too short","The lamp is plastic","There is too much light in the room"], a:0,
     e:"Mạch phải kín thì dòng điện mới chạy. Hở mạch (dây tuột, công tắc mở, pin lắp sai chiều) là nguyên nhân phổ biến nhất."},
    {q:"Which material is an insulator?", o:["Copper","Aluminium","Rubber","Steel"], a:2,
     e:"Cao su không cho điện đi qua nên dùng bọc dây dẫn. Đồng, nhôm, thép đều là kim loại nên dẫn điện."},
    {q:"A second cell is added to a circuit with one lamp. The lamp will:", o:["Get dimmer","Get brighter","Stay the same","Go out"], a:1,
     e:"Thêm pin làm hiệu điện thế tăng, dòng điện qua đèn lớn hơn nên đèn sáng hơn (nhưng dễ cháy nếu quá nhiều pin)."},
    {q:"Two lamps are added to a series circuit that had one lamp. Each lamp now:", o:["Is brighter","Is dimmer","Is unchanged","Flashes"], a:1,
     e:"Cùng một nguồn phải chia cho nhiều bóng hơn, điện trở tổng tăng nên dòng điện giảm và mỗi bóng tối hơn."},
    {q:"Why is the handle of a screwdriver made of plastic?", o:["It is cheaper","Plastic is an insulator, so it protects the user","Plastic conducts better","To make it heavier"], a:1,
     e:"Nhựa cách điện nên ngăn dòng điện truyền vào tay người dùng — đây là ứng dụng an toàn điện."},
    {q:"In a fair test on wire length and lamp brightness, what must stay the SAME?", o:["The length of the wire","The number of cells","The brightness","The type of measurement"], a:1,
     e:"Chỉ được thay đổi chiều dài dây. Số pin, loại dây và bóng đèn phải giữ nguyên; độ sáng là kết quả đo được."}]},

{ id:"s8", t:"Earth and Space", vi:"Trái Đất và Vũ trụ",
  kp:[
    {en:"The Earth spins on its axis once every 24 hours. This gives day and night.", vi:"Trái Đất tự quay quanh trục hết 24 giờ, tạo ra ngày và đêm."},
    {en:"The Sun does not move across the sky — it looks that way because the Earth is turning.", vi:"Mặt Trời không thực sự đi ngang bầu trời; đó là do Trái Đất quay."},
    {en:"The Earth orbits the Sun once every 365&frac14; days. That is one year.", vi:"Trái Đất quay quanh Mặt Trời hết 365 ngày 1/4 — đó là một năm."},
    {en:"The Earth's axis is tilted. This tilt causes the seasons, not the distance from the Sun.", vi:"Trục Trái Đất nghiêng, và chính độ nghiêng này tạo ra các mùa — không phải do xa gần Mặt Trời."},
    {en:"It is summer in the hemisphere tilted towards the Sun: longer days and more direct sunlight.", vi:"Bán cầu nghiêng về phía Mặt Trời là mùa hè: ngày dài hơn và nắng chiếu thẳng hơn."},
    {en:"The Moon orbits the Earth about every 28 days, giving the phases of the Moon.", vi:"Mặt Trăng quay quanh Trái Đất khoảng 28 ngày, tạo ra các pha của Mặt Trăng."},
    {en:"The eight planets in order from the Sun: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.", vi:"Tám hành tinh theo thứ tự từ Mặt Trời: Thuỷ, Kim, Trái Đất, Hoả, Mộc, Thổ, Thiên Vương, Hải Vương."},
    {en:"Shadows are longest in the early morning and late afternoon, and shortest at midday.", vi:"Bóng dài nhất vào sáng sớm và chiều muộn, ngắn nhất vào giữa trưa."}],
  voc:[["axis","trục quay"],["rotate / spin","tự quay"],["orbit","quỹ đạo, quay quanh"],["tilt","độ nghiêng"],["hemisphere","bán cầu"],["phases of the Moon","các pha Mặt Trăng"],["solar system","hệ Mặt Trời"],["star","ngôi sao"],["satellite","vệ tinh"],["sunrise / sunset","bình minh / hoàng hôn"]],
  quiz:[
    {q:"What causes day and night?", o:["The Sun moving round the Earth","The Earth spinning on its axis","The Moon blocking the Sun","The Earth orbiting the Sun"], a:1,
     e:"Trái Đất tự quay quanh trục trong 24 giờ; nửa hướng về Mặt Trời là ban ngày, nửa kia là ban đêm."},
    {q:"What causes the seasons?", o:["The Earth being closer to the Sun in summer","The tilt of the Earth's axis","The Moon's orbit","Clouds in winter"], a:1,
     e:"Đây là câu hay bị sai. Nguyên nhân là trục nghiêng, nên các bán cầu nhận ánh nắng thẳng hoặc xiên vào từng thời điểm trong năm."},
    {q:"How long does the Earth take to orbit the Sun once?", o:["24 hours","28 days","365&frac14; days","10 years"], a:2,
     e:"Một vòng quanh Mặt Trời là một năm. 24 giờ là một vòng tự quay; 28 ngày là chu kỳ Mặt Trăng."},
    {q:"When is a shadow shortest during the day?", o:["At sunrise","At midday","At sunset","At night"], a:1,
     e:"Giữa trưa Mặt Trời lên cao nhất nên tia sáng gần như chiếu thẳng xuống, bóng ngắn nhất."},
    {q:"Which planet is fourth from the Sun?", o:["Venus","Mars","Jupiter","Mercury"], a:1,
     e:"Thứ tự: Thuỷ (1), Kim (2), Trái Đất (3), Hoả (4). Sao Hoả là hành tinh thứ tư."},
    {q:"Why does the Moon appear to change shape during a month?", o:["Clouds cover part of it","We see different amounts of its sunlit side as it orbits Earth","The Moon really changes shape","The Earth's shadow always covers it"], a:1,
     e:"Mặt Trăng luôn có nửa được chiếu sáng; khi nó quay quanh Trái Đất, ta thấy phần sáng đó ở những góc khác nhau nên hình dạng thay đổi."}]},

{ id:"s10", t:"The lungs and breathing", vi:"Phổi và sự hô hấp",
  kp:[
    {en:"When you breathe in, air goes down the trachea (windpipe) into two bronchi and then into the lungs.", vi:"Khi hít vào, không khí đi qua khí quản, vào hai phế quản rồi tới hai lá phổi."},
    {en:"Inside the lungs the air reaches millions of tiny air sacs called alveoli.", vi:"Trong phổi, không khí tới hàng triệu túi khí nhỏ gọi là phế nang."},
    {en:"Gas exchange happens at the alveoli: oxygen goes into the blood, carbon dioxide comes out.", vi:"Trao đổi khí diễn ra ở phế nang: oxygen vào máu, carbon dioxide đi ra."},
    {en:"The diaphragm is a muscle under the lungs. It flattens to pull air in and relaxes to push air out.", vi:"Cơ hoành nằm dưới phổi: hạ xuống thì hít vào, nâng lên thì thở ra."},
    {en:"Breathed-out air has less oxygen, more carbon dioxide and more water vapour than the air we breathe in.", vi:"Khí thở ra có ít oxygen hơn, nhiều carbon dioxide và hơi nước hơn khí hít vào."},
    {en:"During exercise you breathe faster and deeper because muscles need more oxygen.", vi:"Khi vận động ta thở nhanh và sâu hơn vì cơ bắp cần nhiều oxygen hơn."},
    {en:"Smoking damages the lungs and makes gas exchange much less efficient.", vi:"Hút thuốc làm hỏng phổi và giảm mạnh hiệu quả trao đổi khí."}],
  voc:[["trachea / windpipe","khí quản"],["bronchi","phế quản"],["lungs","phổi"],["alveoli","phế nang (túi khí)"],["diaphragm","cơ hoành"],["gas exchange","trao đổi khí"],["breathing rate","nhịp thở"],["inhale / exhale","hít vào / thở ra"],["water vapour","hơi nước"],["ribcage","lồng ngực"]],
  quiz:[
    {q:"Which tube carries air from your throat towards the lungs?", o:["The oesophagus","The trachea","An artery","The diaphragm"], a:1,
     e:"Khí quản (trachea) dẫn không khí; thực quản (oesophagus) mới là ống dẫn thức ăn — hai ống này rất hay bị nhầm."},
    {q:"Where does gas exchange take place?", o:["In the trachea","In the alveoli","In the heart","In the ribs"], a:1,
     e:"Phế nang có thành cực mỏng và rất nhiều mao mạch bao quanh, nên oxygen và carbon dioxide đi qua được."},
    {q:"What does the diaphragm do when you breathe IN?", o:["It flattens and moves down","It rises up","It stops moving","It closes the trachea"], a:0,
     e:"Cơ hoành hạ xuống làm lồng ngực rộng ra, áp suất giảm nên không khí tràn vào phổi."},
    {q:"Compared with air breathed in, air breathed out has:", o:["More oxygen","Less carbon dioxide","More carbon dioxide and water vapour","Exactly the same gases"], a:2,
     e:"Cơ thể lấy bớt oxygen và thải carbon dioxide cùng hơi nước — vì thế hà hơi vào gương thì gương mờ đi."},
    {q:"Why do you breathe faster when you run?", o:["Your lungs get smaller","Your muscles need more oxygen","Your heart stops","The air gets thinner"], a:1,
     e:"Cơ bắp hoạt động mạnh cần nhiều oxygen và thải nhiều carbon dioxide hơn, nên nhịp thở tăng."},
    {q:"Alveoli have thin walls and a very large surface area so that:", o:["They are strong","Gases can pass through quickly","They can store food","They make blood"], a:1,
     e:"Thành mỏng và diện tích lớn giúp trao đổi khí diễn ra nhanh và nhiều."},
    {q:"Which habit damages the alveoli most?", o:["Running","Smoking","Sleeping","Drinking water"], a:1,
     e:"Khói thuốc phá huỷ phế nang, làm diện tích trao đổi khí giảm nên người hút thuốc dễ hụt hơi."}]},

{ id:"s11", t:"The digestive system and the kidneys", vi:"Hệ tiêu hoá và thận",
  kp:[
    {en:"Digestion breaks food into small pieces that can pass into the blood.", vi:"Tiêu hoá là quá trình phân nhỏ thức ăn để hấp thụ được vào máu."},
    {en:"The path of food: mouth &rarr; oesophagus &rarr; stomach &rarr; small intestine &rarr; large intestine.", vi:"Đường đi của thức ăn: miệng &rarr; thực quản &rarr; dạ dày &rarr; ruột non &rarr; ruột già."},
    {en:"Teeth and saliva start digestion in the mouth; saliva also makes food easier to swallow.", vi:"Răng và nước bọt bắt đầu tiêu hoá ở miệng, đồng thời làm thức ăn dễ nuốt."},
    {en:"The stomach churns food and adds acid to break it down further.", vi:"Dạ dày co bóp nhào trộn thức ăn và tiết axit để phân giải tiếp."},
    {en:"Nutrients are absorbed into the blood through the wall of the small intestine.", vi:"Chất dinh dưỡng được hấp thụ vào máu qua thành ruột non."},
    {en:"The large intestine takes back water; what is left leaves the body as waste.", vi:"Ruột già hấp thụ lại nước; phần còn lại thải ra ngoài."},
    {en:"The kidneys filter the blood and remove waste and extra water as urine.", vi:"Thận lọc máu, loại bỏ chất thải và nước thừa dưới dạng nước tiểu."},
    {en:"A balanced diet with fibre and enough water keeps the digestive system healthy.", vi:"Ăn cân bằng, đủ chất xơ và uống đủ nước giúp hệ tiêu hoá khoẻ mạnh."}],
  voc:[["digestion","sự tiêu hoá"],["oesophagus","thực quản"],["stomach","dạ dày"],["small intestine","ruột non"],["large intestine","ruột già"],["absorb","hấp thụ"],["nutrients","chất dinh dưỡng"],["kidney","thận"],["urine","nước tiểu"],["fibre","chất xơ"]],
  quiz:[
    {q:"What is the job of digestion?", o:["To make food taste better","To break food into pieces small enough to enter the blood","To store food in the stomach","To remove water"], a:1,
     e:"Thức ăn phải được phân nhỏ tới mức đi qua được thành ruột vào máu thì cơ thể mới dùng được."},
    {q:"Put in order: mouth, small intestine, stomach, oesophagus.", o:["mouth, stomach, oesophagus, small intestine","mouth, oesophagus, stomach, small intestine","mouth, small intestine, stomach, oesophagus","stomach, mouth, oesophagus, small intestine"], a:1,
     e:"Thức ăn đi từ miệng xuống thực quản, vào dạ dày rồi mới tới ruột non."},
    {q:"Where are most nutrients absorbed into the blood?", o:["The stomach","The small intestine","The large intestine","The kidneys"], a:1,
     e:"Ruột non dài và có nhiều nếp gấp nên diện tích hấp thụ rất lớn."},
    {q:"What does the large intestine mainly take back?", o:["Oxygen","Water","Sugar","Protein"], a:1,
     e:"Ruột già hấp thụ lại nước, nên uống thiếu nước dễ gây táo bón."},
    {q:"What do the kidneys do?", o:["Digest fat","Filter the blood and make urine","Pump blood","Store air"], a:1,
     e:"Thận lọc máu, giữ lại chất cần và thải chất thải cùng nước thừa ra ngoài."},
    {q:"Which food helps food move through the intestines?", o:["Food with fibre, such as vegetables","Sweets","Fried food","Ice cream"], a:0,
     e:"Chất xơ trong rau củ giúp thức ăn di chuyển dễ dàng trong ruột."},
    {q:"Saliva in the mouth helps by:", o:["Cooling the food","Starting to break down food and making it easier to swallow","Adding vitamins","Killing all bacteria"], a:1,
     e:"Nước bọt vừa bắt đầu phân giải tinh bột vừa làm thức ăn trơn để nuốt."},
    {q:"Why should you chew your food well?", o:["It tastes nicer","Smaller pieces are easier to digest","It uses less saliva","It makes you eat faster"], a:1,
     e:"Nhai kỹ tạo ra các mẩu nhỏ, tăng diện tích cho dịch tiêu hoá tác động nên tiêu hoá nhanh hơn."}]},

{ id:"s12", t:"Humans and the environment", vi:"Con người và môi trường",
  kp:[
    {en:"Human activity can damage habitats: cutting down forests, building, farming and pollution.", vi:"Hoạt động của con người có thể phá huỷ môi trường sống: chặt rừng, xây dựng, canh tác và ô nhiễm."},
    {en:"If a habitat is destroyed, the animals and plants living there may die or move away.", vi:"Khi môi trường sống bị phá, động thực vật ở đó có thể chết hoặc phải rời đi."},
    {en:"Pollution of air, water and land harms living things, including humans.", vi:"Ô nhiễm không khí, nước và đất gây hại cho mọi sinh vật, kể cả con người."},
    {en:"Removing one species affects the whole food web, not just that species.", vi:"Mất một loài sẽ ảnh hưởng tới cả lưới thức ăn chứ không chỉ riêng loài đó."},
    {en:"People can protect the environment: reduce, reuse, recycle, plant trees, create nature reserves.", vi:"Con người có thể bảo vệ môi trường: giảm, tái sử dụng, tái chế, trồng cây, lập khu bảo tồn."},
    {en:"Renewable resources such as wind and sunlight do not run out; fossil fuels do.", vi:"Tài nguyên tái tạo như gió và ánh nắng không cạn kiệt; nhiên liệu hoá thạch thì có."},
    {en:"Scientists collect evidence over many years before saying an environment is changing.", vi:"Nhà khoa học thu thập số liệu qua nhiều năm trước khi kết luận môi trường đang thay đổi."}],
  voc:[["environment","môi trường"],["pollution","ô nhiễm"],["habitat destruction","phá huỷ nơi sống"],["endangered","có nguy cơ tuyệt chủng"],["conservation","bảo tồn"],["recycle","tái chế"],["renewable","tái tạo được"],["fossil fuel","nhiên liệu hoá thạch"],["nature reserve","khu bảo tồn"],["litter","rác thải vứt bừa"]],
  quiz:[
    {q:"Which activity most directly destroys a forest habitat?", o:["Planting trees","Cutting down trees for wood","Watching birds","Recycling paper"], a:1,
     e:"Chặt cây lấy gỗ phá trực tiếp nơi sống của rất nhiều loài trong rừng."},
    {q:"A river is polluted and the small fish die. What happens to the birds that eat them?", o:["Their number rises","Their number falls","Nothing changes","They become producers"], a:1,
     e:"Mất nguồn thức ăn thì số chim giảm — thay đổi lan theo cả lưới thức ăn."},
    {q:"Which is a renewable resource?", o:["Coal","Oil","Wind","Natural gas"], a:2,
     e:"Gió không bao giờ cạn; than, dầu và khí đốt là nhiên liệu hoá thạch và sẽ hết."},
    {q:"What does &lsquo;recycle&rsquo; mean?", o:["Throw away","Make waste into something new","Burn rubbish","Bury rubbish"], a:1,
     e:"Tái chế là biến rác thành vật liệu hoặc sản phẩm mới, giúp giảm rác và tiết kiệm tài nguyên."},
    {q:"Why are nature reserves created?", o:["To build more houses","To protect habitats and the species living there","To grow more crops","To store rubbish"], a:1,
     e:"Khu bảo tồn giữ nguyên môi trường sống để các loài, nhất là loài nguy cấp, tồn tại được."},
    {q:"Which action by a pupil helps most every day?", o:["Leaving lights on","Using a refillable water bottle","Buying more plastic bags","Dropping litter"], a:1,
     e:"Dùng bình nước tái sử dụng cắt giảm rác nhựa mỗi ngày — thay đổi nhỏ nhưng lặp lại rất nhiều lần."},
    {q:"Before saying an environment is changing, scientists must:", o:["Guess","Collect evidence over a long time","Ask one person","Look once"], a:1,
     e:"Kết luận khoa học phải dựa trên số liệu thu thập lâu dài, không dựa vào một lần quan sát."}]},

{ id:"s9", t:"Scientific enquiry & fair tests", vi:"Phương pháp thí nghiệm và bài kiểm chứng công bằng",
  kp:[
    {en:"A prediction says what you think will happen AND uses science to say why.", vi:"Dự đoán phải nói điều gì sẽ xảy ra VÀ giải thích bằng kiến thức khoa học."},
    {en:"The independent variable is the ONE thing you change. The dependent variable is what you measure.", vi:"Biến độc lập là điều duy nhất ta thay đổi; biến phụ thuộc là điều ta đo được."},
    {en:"Control variables are everything you keep the same. Keeping them the same makes the test fair.", vi:"Biến kiểm soát là những gì phải giữ nguyên — đó chính là điều làm bài thí nghiệm công bằng."},
    {en:"Repeat each measurement three times and take an average to make results more reliable.", vi:"Lặp lại phép đo 3 lần rồi lấy trung bình để kết quả đáng tin cậy hơn."},
    {en:"A result that does not fit the pattern is an anomalous result. Check it or leave it out of the average.", vi:"Kết quả lệch hẳn khỏi quy luật gọi là kết quả bất thường; nên kiểm tra lại hoặc bỏ khi tính trung bình."},
    {en:"Use a line graph for continuous data (time, temperature) and a bar chart for groups (types of material).", vi:"Dùng đồ thị đường cho số liệu liên tục (thời gian, nhiệt độ); dùng biểu đồ cột cho các nhóm (loại vật liệu)."},
    {en:"A conclusion answers the question using the evidence: &ldquo;The longer the wire, the dimmer the lamp, because...&rdquo;", vi:"Kết luận phải trả lời câu hỏi dựa trên số liệu: &ldquo;Dây càng dài thì đèn càng tối, vì...&rdquo;"},
    {en:"An evaluation says what went well, what could be improved and how.", vi:"Đánh giá: điều gì làm tốt, điều gì cần cải thiện và cải thiện bằng cách nào."}],
  voc:[["prediction","dự đoán"],["variable","biến số"],["independent variable","biến độc lập (thay đổi)"],["dependent variable","biến phụ thuộc (đo)"],["control variable","biến giữ nguyên"],["fair test","thí nghiệm công bằng"],["reliable","đáng tin cậy"],["anomalous result","kết quả bất thường"],["evidence","bằng chứng"],["conclusion","kết luận"]],
  quiz:[
    {q:"In a test on how the length of a pendulum affects its swing time, what is the independent variable?", o:["The swing time","The length of the pendulum","The mass of the bob","The number of swings"], a:1,
     e:"Biến độc lập là thứ ta chủ động thay đổi — chiều dài dây. Thời gian dao động là biến phụ thuộc (đo được)."},
    {q:"Why should a measurement be repeated three times?", o:["To use up more time","To make the results more reliable and spot mistakes","To change the answer","Because the teacher says so"], a:1,
     e:"Lặp lại giúp phát hiện phép đo sai và lấy trung bình, làm kết quả đáng tin cậy hơn."},
    {q:"Results for water cooling every minute are best shown on:", o:["A bar chart","A pie chart","A line graph","A branching key"], a:2,
     e:"Nhiệt độ theo thời gian là số liệu liên tục nên dùng đồ thị đường, và có thể nối điểm để thấy xu hướng."},
    {q:"Four readings are 21, 22, 21, 45. Which is the anomalous result?", o:["21","22","45","There is none"], a:2,
     e:"45 lệch hẳn khỏi ba giá trị còn lại nên là kết quả bất thường; cần đo lại hoặc loại khỏi trung bình."},
    {q:"Which is a good prediction?", o:["Something will happen","The ice will melt faster in the warm room because heat gives particles more energy","I think it will be interesting","The experiment will work"], a:1,
     e:"Dự đoán tốt phải nêu rõ kết quả mong đợi VÀ lý do khoa học. Các đáp án khác quá mơ hồ."},
    {q:"In a fair test on which material keeps water warmest, which must stay the same?", o:["The type of material","The starting temperature of the water","The final temperature","The colour of the material"], a:1,
     e:"Chỉ thay đổi loại vật liệu. Nhiệt độ ban đầu, lượng nước và thời gian phải giữ nguyên; nhiệt độ cuối là kết quả đo."}]}
]},

math: { name:"Mathematics", vi:"Toán", icon:"&#128208;", ac:"--mat", acbg:"--mat-bg", units:[

{ id:"m1", t:"Place value, decimals & rounding", vi:"Giá trị theo vị trí, số thập phân, làm tròn",
  kp:[
    {en:"Each column is 10 times the column on its right: 1 000 000 &rarr; 100 000 &rarr; ... &rarr; 0.1 &rarr; 0.01 &rarr; 0.001.", vi:"Mỗi cột gấp 10 lần cột bên phải nó, kéo dài cả sang phần thập phân."},
    {en:"In 3.671 the 6 means 6 tenths, the 7 means 7 hundredths, the 1 means 1 thousandth.", vi:"Đọc đúng vị trí: phần mười, phần trăm, phần nghìn."},
    {en:"Multiplying by 10 or 100 moves the digits LEFT; dividing moves them RIGHT.", vi:"Nhân 10 hoặc 100 thì các chữ số dịch sang TRÁI; chia thì dịch sang PHẢI."},
    {en:"To round, look at the digit just after the place you are rounding to. 5 or more &rarr; round up.", vi:"Làm tròn: nhìn chữ số NGAY SAU vị trí cần làm tròn; từ 5 trở lên thì tăng thêm 1."},
    {en:"To compare decimals, line up the decimal points and compare from the left. 0.5 is bigger than 0.45.", vi:"So sánh số thập phân: so từ trái sang, thêm số 0 cho bằng chữ số. 0.5 > 0.45."},
    {en:"On a number line, &minus;7 is less than &minus;3. Numbers get smaller as you move left.", vi:"Trên trục số, càng sang trái càng nhỏ, nên &minus;7 < &minus;3."},
    {en:"Estimate first by rounding, then check your exact answer is sensible.", vi:"Ước lượng trước bằng cách làm tròn, rồi kiểm tra kết quả chính xác có hợp lý không."}],
  voc:[["place value","giá trị theo vị trí"],["tenths","phần mười"],["hundredths","phần trăm"],["thousandths","phần nghìn"],["round to 1 d.p.","làm tròn 1 chữ số thập phân"],["estimate","ước lượng"],["ascending order","thứ tự tăng dần"],["negative number","số âm"]],
  quiz:[
    {q:"What is the value of the digit 7 in 3.671?", o:["7 tenths","7 hundredths","7 thousandths","7 units"], a:1,
     e:"Đếm từ dấu thập phân: 6 là phần mười, 7 là phần trăm (0.07), 1 là phần nghìn."},
    {q:"Round 4.687 to two decimal places.", o:["4.68","4.69","4.7","4.6"], a:1,
     e:"Giữ 2 chữ số thập phân, nhìn chữ số thứ ba là 7 (&ge;5) nên tăng 8 lên 9 &rarr; 4.69."},
    {q:"0.4 &divide; 100 =", o:["0.04","0.004","4","40"], a:1,
     e:"Chia 100 thì các chữ số dịch sang phải 2 cột: 0.4 &rarr; 0.04 &rarr; 0.004."},
    {q:"Which number is the largest?", o:["0.5","0.45","0.505","0.55"], a:3,
     e:"Viết đều 3 chữ số: 0.500 / 0.450 / 0.505 / 0.550 &rarr; 0.550 lớn nhất. Số dài hơn không có nghĩa là lớn hơn."},
    {q:"Round 24 953 to the nearest thousand.", o:["24 000","24 900","25 000","30 000"], a:2,
     e:"Cột nghìn là 4, chữ số ngay sau là 9 (&ge;5) nên tăng lên 25 &rarr; 25 000."},
    {q:"The temperature is &minus;6&deg;C. It rises by 9&deg;C. What is the new temperature?", o:["3&deg;C","&minus;3&deg;C","&minus;15&deg;C","15&deg;C"], a:0,
     e:"Đi lên 9 đơn vị từ &minus;6: từ &minus;6 lên 0 mất 6, còn 3 nữa &rarr; +3&deg;C."}]},

{ id:"m2", t:"Fractions, decimals & percentages", vi:"Phân số, số thập phân và phần trăm",
  kp:[
    {en:"Learn by heart: 1/2 = 0.5 = 50%, 1/4 = 0.25 = 25%, 1/5 = 0.2 = 20%, 1/8 = 0.125 = 12.5%.", vi:"Học thuộc bảng quy đổi này — đề Checkpoint dùng liên tục."},
    {en:"Fraction to decimal: divide the top by the bottom. 3 &divide; 8 = 0.375.", vi:"Đổi phân số sang thập phân: lấy tử chia mẫu."},
    {en:"Decimal to percentage: multiply by 100. 0.375 &rarr; 37.5%.", vi:"Đổi thập phân sang phần trăm: nhân 100."},
    {en:"Quick percentages: 10% = &divide;10, 1% = &divide;100, 50% = &divide;2, 25% = &divide;4. Build others from these.", vi:"Mẹo tính nhanh: ghép các mốc 10%, 1%, 50%, 25%. Ví dụ 15% = 10% + 5%."},
    {en:"Equivalent fractions: multiply or divide top AND bottom by the same number.", vi:"Phân số bằng nhau: nhân hoặc chia CẢ tử và mẫu cho cùng một số."},
    {en:"To add or subtract fractions you need the same denominator first.", vi:"Cộng trừ phân số phải quy đồng mẫu số trước."},
    {en:"Simplify by dividing top and bottom by their highest common factor.", vi:"Rút gọn bằng cách chia cả tử và mẫu cho ước chung lớn nhất."}],
  voc:[["numerator","tử số"],["denominator","mẫu số"],["equivalent","tương đương, bằng nhau"],["simplify","rút gọn"],["percentage","phần trăm"],["discount","giảm giá"],["improper fraction","phân số lớn hơn 1"],["mixed number","hỗn số"]],
  quiz:[
    {q:"What is 15% of 60?", o:["6","9","12","15"], a:1,
     e:"10% của 60 = 6. 5% là một nửa của 10% = 3. Cộng lại: 6 + 3 = 9."},
    {q:"Write 3/8 as a decimal.", o:["0.38","0.375","0.83","3.8"], a:1,
     e:"3 &divide; 8 = 0.375. Nhớ 1/8 = 0.125 nên 3/8 = 3 &times; 0.125."},
    {q:"Which is bigger: 2/5 or 0.45?", o:["2/5","0.45","They are equal","Cannot tell"], a:1,
     e:"2/5 = 0.4, so với 0.45 thì 0.45 lớn hơn. Luôn đổi về cùng một dạng rồi mới so sánh."},
    {q:"Simplify 18/24 to its simplest form.", o:["9/12","6/8","3/4","2/3"], a:2,
     e:"Ước chung lớn nhất của 18 và 24 là 6: 18&divide;6 = 3, 24&divide;6 = 4 &rarr; 3/4. Các đáp án khác đúng giá trị nhưng chưa rút gọn hết."},
    {q:"1/4 + 1/3 =", o:["2/7","7/12","1/7","5/12"], a:1,
     e:"Quy đồng mẫu 12: 3/12 + 4/12 = 7/12. Không được cộng tử với tử và mẫu với mẫu."},
    {q:"A jacket costs $80. In a sale it has 25% off. What is the sale price?", o:["$20","$55","$60","$75"], a:2,
     e:"25% của 80 = 20 (số tiền giảm). Giá phải trả = 80 &minus; 20 = $60. Câu hỏi hỏi giá bán chứ không hỏi số tiền giảm."}]},

{ id:"m3", t:"Ratio and proportion", vi:"Tỉ số và tỉ lệ",
  kp:[
    {en:"A ratio compares two amounts, e.g. 2 : 3. It has no units.", vi:"Tỉ số so sánh hai lượng, ví dụ 2 : 3, và không có đơn vị."},
    {en:"The ratio 2 : 3 means the whole is split into 2 + 3 = 5 equal parts.", vi:"Tỉ số 2 : 3 nghĩa là toàn bộ chia thành 2 + 3 = 5 phần bằng nhau."},
    {en:"To share 30 in the ratio 2 : 3: 30 &divide; 5 = 6 per part, so 12 and 18.", vi:"Chia 30 theo tỉ số 2 : 3: lấy 30 &divide; 5 = 6 cho mỗi phần, được 12 và 18."},
    {en:"Simplify a ratio by dividing both sides by the same number: 10 : 15 = 2 : 3.", vi:"Rút gọn tỉ số bằng cách chia hai vế cho cùng một số: 10 : 15 = 2 : 3."},
    {en:"Proportion compares a part with the whole, often as a fraction or percentage.", vi:"Tỉ lệ so sánh một phần với toàn bộ, thường viết dạng phân số hoặc phần trăm."},
    {en:"Recipe scaling: if a recipe for 4 people needs 200 g, then for 6 people find one person first (50 g), then multiply.", vi:"Bài công thức nấu ăn: tìm lượng cho 1 người trước (unitary method), rồi nhân lên."},
    {en:"Direct proportion: if one amount doubles, the other doubles too.", vi:"Tỉ lệ thuận: một đại lượng gấp đôi thì đại lượng kia cũng gấp đôi."}],
  voc:[["ratio","tỉ số"],["proportion","tỉ lệ"],["share in the ratio","chia theo tỉ số"],["for every","cứ mỗi"],["scale up / down","tăng / giảm theo tỉ lệ"],["unitary method","phương pháp quy về đơn vị"],["equivalent ratio","tỉ số bằng nhau"],["per","mỗi"]],
  quiz:[
    {q:"Share $40 between Mai and Nam in the ratio 3 : 5. How much does Nam get?", o:["$15","$24","$25","$16"], a:2,
     e:"Tổng số phần: 3 + 5 = 8. Mỗi phần: 40 &divide; 8 = 5. Nam có 5 phần &rarr; 5 &times; 5 = $25 (Mai được $15)."},
    {q:"Simplify the ratio 12 : 18.", o:["6 : 9","2 : 3","1 : 2","4 : 6"], a:1,
     e:"Chia cả hai vế cho ước chung lớn nhất là 6 &rarr; 2 : 3. 6 : 9 và 4 : 6 đúng nhưng chưa rút gọn hết."},
    {q:"A recipe for 4 people uses 200 g of rice. How much for 6 people?", o:["250 g","300 g","350 g","400 g"], a:1,
     e:"Quy về 1 người: 200 &divide; 4 = 50 g. Với 6 người: 50 &times; 6 = 300 g."},
    {q:"In a class of 30, the ratio of girls to boys is 2 : 3. How many girls are there?", o:["10","12","15","18"], a:1,
     e:"Tổng phần: 5. Mỗi phần: 30 &divide; 5 = 6. Số nữ = 2 &times; 6 = 12."},
    {q:"For every 3 red beads there are 4 blue beads. There are 21 red beads. How many blue?", o:["24","28","18","32"], a:1,
     e:"21 &divide; 3 = 7 nhóm. Mỗi nhóm có 4 hạt xanh &rarr; 7 &times; 4 = 28."},
    {q:"5 pens cost $3.50. What do 8 pens cost?", o:["$5.20","$5.60","$4.90","$6.00"], a:1,
     e:"Giá 1 bút: 3.50 &divide; 5 = $0.70. Tám bút: 0.70 &times; 8 = $5.60."}]},

{ id:"m4", t:"Mental & written calculation", vi:"Tính nhẩm và tính viết bốn phép",
  kp:[
    {en:"Order of operations: brackets, then &times; and &divide;, then + and &minus;.", vi:"Thứ tự phép tính: ngoặc trước, rồi nhân chia, cuối cùng cộng trừ."},
    {en:"Mental strategy: round then adjust. 199 + 46 = 200 + 46 &minus; 1 = 245.", vi:"Mẹo nhẩm: làm tròn rồi bù trừ. 199 + 46 = 200 + 46 &minus; 1."},
    {en:"To multiply by 5, multiply by 10 then halve. To multiply by 4, double twice.", vi:"Nhân 5: nhân 10 rồi chia đôi. Nhân 4: gấp đôi hai lần."},
    {en:"Long multiplication: split the number by place value, e.g. 34 &times; 26 = 34&times;20 + 34&times;6.", vi:"Nhân số lớn: tách theo hàng, ví dụ 34 &times; 26 = 34&times;20 + 34&times;6."},
    {en:"Check a division with multiplication: if 96 &divide; 8 = 12, then 12 &times; 8 must be 96.", vi:"Kiểm tra phép chia bằng phép nhân ngược lại."},
    {en:"A remainder must be smaller than the divisor.", vi:"Số dư luôn phải nhỏ hơn số chia."},
    {en:"Estimate first: 297 &times; 4 is about 300 &times; 4 = 1200, so an answer near 1188 is sensible.", vi:"Ước lượng trước để biết kết quả có hợp lý không."}],
  voc:[["sum / total","tổng"],["difference","hiệu"],["product","tích"],["quotient","thương"],["remainder","số dư"],["multiple","bội số"],["factor","ước số"],["brackets","dấu ngoặc"]],
  quiz:[
    {q:"5 + 3 &times; 4 =", o:["32","17","23","12"], a:1,
     e:"Nhân trước: 3 &times; 4 = 12, rồi cộng 5 &rarr; 17. Nếu tính từ trái sang sẽ ra 32 — đó là lỗi phổ biến nhất."},
    {q:"(8 + 2) &times; 3 &minus; 5 =", o:["25","19","30","21"], a:0,
     e:"Ngoặc trước: 10. Rồi nhân: 10 &times; 3 = 30. Cuối cùng trừ 5 &rarr; 25."},
    {q:"What is 34 &times; 26?", o:["784","884","874","904"], a:1,
     e:"34 &times; 20 = 680 và 34 &times; 6 = 204. Cộng lại: 680 + 204 = 884. Ước lượng 34&times;26 &asymp; 30&times;26 = 780 nên 884 hợp lý."},
    {q:"What is 137 &divide; 6?", o:["22 r 5","23 r 1","22 r 4","21 r 6"], a:0,
     e:"6 &times; 22 = 132, còn dư 5. Số dư 5 nhỏ hơn số chia 6 nên hợp lệ. Đáp án 21 r 6 sai vì dư bằng số chia."},
    {q:"A quick way to work out 48 &times; 5 is:", o:["48 &times; 10 &divide; 2","48 + 5","48 &divide; 10 &times; 2","48 &times; 2 &times; 2"], a:0,
     e:"48 &times; 10 = 480, chia đôi được 240. Nhân 10 rồi chia đôi luôn nhanh hơn nhân 5 trực tiếp."},
    {q:"Estimate 612 &minus; 289.", o:["About 200","About 300","About 400","About 900"], a:1,
     e:"Làm tròn: 600 &minus; 300 = 300. Kết quả chính xác là 323, rất gần ước lượng."}]},

{ id:"m5", t:"Sequences, rules & simple algebra", vi:"Dãy số, quy luật và đại số đơn giản",
  kp:[
    {en:"A sequence follows a rule. Find the difference between terms first.", vi:"Dãy số theo một quy luật; hãy tìm hiệu giữa các số hạng trước tiên."},
    {en:"The rule can be described in words: &lsquo;add 4 each time&rsquo; or &lsquo;multiply by 2&rsquo;.", vi:"Quy luật có thể mô tả bằng lời: cộng 4 mỗi lần, hoặc nhân 2 mỗi lần."},
    {en:"In algebra a letter stands for an unknown number: n + 5, 3n, n &divide; 2.", vi:"Trong đại số, chữ cái thay cho số chưa biết: n + 5, 3n, n &divide; 2."},
    {en:"3n means 3 &times; n. Never write the multiplication sign.", vi:"3n nghĩa là 3 &times; n; không viết dấu nhân."},
    {en:"To solve n + 7 = 12, do the opposite operation: n = 12 &minus; 7 = 5.", vi:"Giải n + 7 = 12 bằng phép ngược lại: n = 12 &minus; 7 = 5."},
    {en:"To solve 4n = 20, divide both sides by 4: n = 5.", vi:"Giải 4n = 20: chia hai vế cho 4 &rarr; n = 5."},
    {en:"For a pattern of matchstick shapes, count how many are added each time — that number goes with n.", vi:"Với dãy hình que diêm, đếm số que thêm mỗi lần — con số đó đi kèm với n."}],
  voc:[["sequence","dãy số"],["term","số hạng"],["rule","quy luật"],["expression","biểu thức"],["equation","phương trình"],["unknown","ẩn số"],["substitute","thay số vào"],["inverse operation","phép tính ngược"]],
  quiz:[
    {q:"What is the next number: 4, 9, 14, 19, ___?", o:["23","24","25","20"], a:1,
     e:"Hiệu giữa các số là 5 &rarr; 19 + 5 = 24."},
    {q:"Solve n &minus; 8 = 15.", o:["n = 7","n = 23","n = 120","n = 22"], a:1,
     e:"Làm phép ngược lại: n = 15 + 8 = 23. Kiểm tra: 23 &minus; 8 = 15 &#10003;"},
    {q:"Solve 6n = 42.", o:["n = 6","n = 7","n = 36","n = 48"], a:1,
     e:"6n nghĩa là 6 &times; n. Chia hai vế cho 6: n = 42 &divide; 6 = 7."},
    {q:"If n = 5, what is 3n + 2?", o:["10","17","32","15"], a:1,
     e:"Thay n = 5: 3 &times; 5 = 15, cộng 2 &rarr; 17. Đừng viết liền thành 35 rồi cộng 2."},
    {q:"A pattern uses 4 sticks for 1 square, 7 for 2 squares, 10 for 3 squares. How many for 10 squares?", o:["31","40","34","37"], a:0,
     e:"Mỗi hình vuông thêm 3 que, hình đầu tiên có 4. Quy luật: 3n + 1 &rarr; 3 &times; 10 + 1 = 31."},
    {q:"Which sequence has the rule &lsquo;multiply by 3&rsquo;?", o:["2, 5, 8, 11","2, 6, 18, 54","3, 6, 9, 12","1, 3, 5, 7"], a:1,
     e:"2 &rarr; 6 &rarr; 18 &rarr; 54 mỗi lần nhân 3. Dãy 3, 6, 9, 12 là cộng 3 chứ không phải nhân 3."}]},

{ id:"m6", t:"2D and 3D shapes, angles", vi:"Hình phẳng, hình khối và góc",
  kp:[
    {en:"Angles on a straight line add up to 180&deg;. Angles around a point add up to 360&deg;.", vi:"Các góc trên một đường thẳng cộng lại 180&deg;; các góc quanh một điểm cộng lại 360&deg;."},
    {en:"The angles in any triangle add up to 180&deg;. In any quadrilateral they add up to 360&deg;.", vi:"Tổng ba góc trong tam giác là 180&deg;; tổng bốn góc trong tứ giác là 360&deg;."},
    {en:"Acute < 90&deg;, right = 90&deg;, obtuse is between 90&deg; and 180&deg;, reflex is more than 180&deg;.", vi:"Góc nhọn < 90&deg;, góc vuông = 90&deg;, góc tù từ 90&deg; đến 180&deg;, góc phản > 180&deg;."},
    {en:"An equilateral triangle has 3 equal sides and 3 angles of 60&deg;. An isosceles triangle has 2 equal sides and 2 equal angles.", vi:"Tam giác đều: 3 cạnh bằng nhau, mỗi góc 60&deg;. Tam giác cân: 2 cạnh và 2 góc bằng nhau."},
    {en:"A prism has the same cross-section all the way through; a pyramid comes to a point.", vi:"Hình lăng trụ có mặt cắt giống nhau suốt chiều dài; hình chóp thu về một đỉnh."},
    {en:"A cube has 6 faces, 12 edges and 8 vertices.", vi:"Hình lập phương có 6 mặt, 12 cạnh và 8 đỉnh."},
    {en:"A net is the flat shape that folds up into a 3D solid.", vi:"Hình khai triển (net) là hình phẳng gấp lại thành hình khối."}],
  voc:[["acute angle","góc nhọn"],["obtuse angle","góc tù"],["reflex angle","góc phản"],["parallel","song song"],["perpendicular","vuông góc"],["vertex / vertices","đỉnh"],["face","mặt"],["edge","cạnh"],["net","hình khai triển"],["quadrilateral","tứ giác"]],
  quiz:[
    {q:"Two angles on a straight line are 115&deg; and x. What is x?", o:["65&deg;","75&deg;","85&deg;","245&deg;"], a:0,
     e:"Tổng các góc kề bù trên đường thẳng là 180&deg;, nên x = 180 &minus; 115 = 65&deg;."},
    {q:"A triangle has angles 40&deg; and 75&deg;. What is the third angle?", o:["55&deg;","65&deg;","75&deg;","115&deg;"], a:1,
     e:"Tổng ba góc là 180&deg;: 180 &minus; (40 + 75) = 180 &minus; 115 = 65&deg;."},
    {q:"How many edges does a cube have?", o:["6","8","12","24"], a:2,
     e:"Lập phương có 6 mặt, 8 đỉnh và 12 cạnh. Nhiều bạn nhầm 6 (số mặt) với số cạnh."},
    {q:"An angle of 200&deg; is called:", o:["Acute","Obtuse","Reflex","Right"], a:2,
     e:"Góc lớn hơn 180&deg; là góc phản (reflex). Góc tù chỉ từ 90&deg; đến dưới 180&deg;."},
    {q:"Each angle of an equilateral triangle is:", o:["45&deg;","60&deg;","90&deg;","30&deg;"], a:1,
     e:"Ba góc bằng nhau và tổng 180&deg; &rarr; mỗi góc 180 &divide; 3 = 60&deg;."},
    {q:"Which shape has 2 pairs of parallel sides and 4 right angles?", o:["Trapezium","Rhombus","Rectangle","Kite"], a:2,
     e:"Hình chữ nhật có hai cặp cạnh song song và bốn góc vuông. Hình thoi có cạnh song song nhưng góc không nhất thiết vuông."}]},

{ id:"m7", t:"Coordinates, reflection & translation", vi:"Toạ độ, đối xứng và tịnh tiến",
  kp:[
    {en:"A coordinate is written (x, y): go ALONG the corridor first, then UP the stairs.", vi:"Toạ độ viết (x, y): đi NGANG trước rồi mới đi LÊN."},
    {en:"The first quadrant has positive x and y. Stage 6 also uses negative coordinates in all four quadrants.", vi:"Góc phần tư thứ nhất có x, y dương; lớp 6 dùng cả toạ độ âm ở bốn góc phần tư."},
    {en:"A reflection flips a shape over a mirror line. Every point stays the same distance from the line.", vi:"Phép đối xứng lật hình qua trục; mỗi điểm cách trục một khoảng không đổi."},
    {en:"A translation slides a shape without turning it, e.g. 3 right and 2 down.", vi:"Phép tịnh tiến trượt hình mà không quay, ví dụ sang phải 3 và xuống 2."},
    {en:"A rotation turns a shape about a centre, e.g. 90&deg; clockwise.", vi:"Phép quay xoay hình quanh một tâm, ví dụ 90&deg; theo chiều kim đồng hồ."},
    {en:"After reflection, translation or rotation the shape stays the SAME SIZE — these are congruent.", vi:"Sau khi lật, trượt hay quay, hình vẫn GIỮ NGUYÊN kích thước — gọi là hai hình bằng nhau."},
    {en:"A line of symmetry cuts a shape into two matching halves. A square has 4.", vi:"Trục đối xứng chia hình thành hai nửa khớp nhau; hình vuông có 4 trục."}],
  voc:[["coordinate","toạ độ"],["x-axis / y-axis","trục hoành / trục tung"],["origin","gốc toạ độ (0, 0)"],["quadrant","góc phần tư"],["reflection","phép đối xứng"],["translation","phép tịnh tiến"],["rotation","phép quay"],["mirror line","trục đối xứng"],["clockwise","theo chiều kim đồng hồ"],["congruent","bằng nhau (cùng hình dạng và kích thước)"]],
  quiz:[
    {q:"Which point is 3 to the right and 2 up from the origin?", o:["(2, 3)","(3, 2)","(&minus;3, 2)","(2, &minus;3)"], a:1,
     e:"Toạ độ là (x, y): sang phải 3 nên x = 3, lên 2 nên y = 2 &rarr; (3, 2). Đảo thứ tự là lỗi hay gặp."},
    {q:"Point A is at (4, 1). It is translated 2 left and 3 up. Where is it now?", o:["(6, 4)","(2, 4)","(2, &minus;2)","(6, &minus;2)"], a:1,
     e:"Sang trái 2 thì x giảm: 4 &minus; 2 = 2. Lên 3 thì y tăng: 1 + 3 = 4 &rarr; (2, 4)."},
    {q:"A shape is reflected in a mirror line. Which is true?", o:["It becomes smaller","It stays the same size","It rotates 90&deg;","It doubles in size"], a:1,
     e:"Phép đối xứng chỉ lật hình, không đổi kích thước — hình mới và hình cũ bằng nhau (congruent)."},
    {q:"How many lines of symmetry does a square have?", o:["1","2","4","8"], a:2,
     e:"Hình vuông có 4 trục đối xứng: hai đường qua trung điểm các cạnh và hai đường chéo."},
    {q:"Point B is at (&minus;3, 2). Which quadrant is it in?", o:["First (top right)","Second (top left)","Third (bottom left)","Fourth (bottom right)"], a:1,
     e:"x âm nên nằm bên trái, y dương nên nằm phía trên &rarr; góc phần tư thứ hai."},
    {q:"A shape is rotated 90&deg; clockwise then 90&deg; clockwise again. This is the same as:", o:["No turn","A 180&deg; turn","A 270&deg; turn","A reflection"], a:1,
     e:"Hai lần quay 90&deg; cùng chiều cộng lại thành 180&deg;."}]},

{ id:"m8", t:"Measures: length, mass, capacity, time", vi:"Đo lường: độ dài, khối lượng, dung tích và thời gian",
  kp:[
    {en:"1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm.", vi:"1 km = 1000 m; 1 m = 100 cm; 1 cm = 10 mm."},
    {en:"1 kg = 1000 g, 1 tonne = 1000 kg, 1 litre = 1000 ml.", vi:"1 kg = 1000 g; 1 tấn = 1000 kg; 1 lít = 1000 ml."},
    {en:"To change a big unit to a small unit, MULTIPLY. Small to big, DIVIDE.", vi:"Đổi từ đơn vị lớn sang nhỏ thì NHÂN; từ nhỏ sang lớn thì CHIA."},
    {en:"1 cm&sup3; holds exactly 1 ml of water.", vi:"1 cm&sup3; chứa đúng 1 ml nước."},
    {en:"24-hour clock: 14:30 is 2:30 pm. Add 12 to afternoon times.", vi:"Giờ 24h: 14:30 là 2:30 chiều. Buổi chiều cộng thêm 12."},
    {en:"Time calculations use 60, not 100: 1 h 45 min + 30 min = 2 h 15 min.", vi:"Tính thời gian dùng hệ 60 chứ không phải 100: 1 giờ 45 phút + 30 phút = 2 giờ 15 phút."},
    {en:"Read a scale by working out what one small division is worth first.", vi:"Đọc vạch chia: tính giá trị của một vạch nhỏ trước đã."}],
  voc:[["length","độ dài"],["mass","khối lượng"],["capacity","dung tích"],["convert","đổi đơn vị"],["scale","vạch chia, thang đo"],["timetable","thời gian biểu"],["duration","khoảng thời gian"],["approximately","xấp xỉ"]],
  quiz:[
    {q:"How many millimetres are there in 3.5 cm?", o:["3.5 mm","35 mm","350 mm","0.35 mm"], a:1,
     e:"1 cm = 10 mm, nên 3.5 &times; 10 = 35 mm. Đổi sang đơn vị nhỏ hơn nên phải nhân."},
    {q:"A bottle holds 1.5 litres. How many millilitres is that?", o:["150 ml","1500 ml","15 ml","15 000 ml"], a:1,
     e:"1 lít = 1000 ml, nên 1.5 &times; 1000 = 1500 ml."},
    {q:"A film starts at 19:45 and lasts 1 hour 40 minutes. When does it end?", o:["21:25","20:85","21:15","20:25"], a:0,
     e:"19:45 + 1 giờ = 20:45; cộng thêm 40 phút: 20:45 + 15 = 21:00, còn 25 phút &rarr; 21:25. Không có &ldquo;20:85&rdquo; vì phút chỉ đến 59."},
    {q:"2500 g is the same as:", o:["25 kg","2.5 kg","250 kg","0.25 kg"], a:1,
     e:"1000 g = 1 kg, nên 2500 &divide; 1000 = 2.5 kg. Từ đơn vị nhỏ sang lớn thì chia."},
    {q:"14:20 on a 24-hour clock is:", o:["2:20 am","2:20 pm","4:20 pm","12:20 pm"], a:1,
     e:"14 &minus; 12 = 2, và vì lớn hơn 12 nên là buổi chiều &rarr; 2:20 pm."},
    {q:"A jug scale goes from 0 to 500 ml with 10 marks. What is one mark worth?", o:["10 ml","50 ml","5 ml","100 ml"], a:1,
     e:"500 &divide; 10 = 50 ml mỗi vạch. Luôn tính giá trị một vạch trước khi đọc mực chất lỏng."}]},

{ id:"m9", t:"Area, perimeter and volume", vi:"Diện tích, chu vi và thể tích",
  kp:[
    {en:"Perimeter is the distance all the way round. Add all the sides. Units: cm, m.", vi:"Chu vi là độ dài đường bao quanh; cộng tất cả các cạnh. Đơn vị: cm, m."},
    {en:"Area of a rectangle = length &times; width. Units are squared: cm&sup2;, m&sup2;.", vi:"Diện tích hình chữ nhật = dài &times; rộng. Đơn vị có mũ 2: cm&sup2;, m&sup2;."},
    {en:"Area of a triangle = (base &times; height) &divide; 2.", vi:"Diện tích tam giác = (đáy &times; chiều cao) &divide; 2."},
    {en:"For an L-shape, split it into rectangles, find each area, then add.", vi:"Với hình chữ L, chia thành các hình chữ nhật, tính từng phần rồi cộng lại."},
    {en:"Volume of a cuboid = length &times; width &times; height. Units are cubed: cm&sup3;, m&sup3;.", vi:"Thể tích hình hộp chữ nhật = dài &times; rộng &times; cao. Đơn vị có mũ 3."},
    {en:"Two shapes can have the same area but different perimeters.", vi:"Hai hình có thể cùng diện tích nhưng khác chu vi."},
    {en:"Always write the correct unit — losing the unit loses a mark.", vi:"Luôn ghi đúng đơn vị; thiếu đơn vị là mất điểm."}],
  voc:[["perimeter","chu vi"],["area","diện tích"],["volume","thể tích"],["cuboid","hình hộp chữ nhật"],["base","đáy"],["height","chiều cao"],["square centimetre","xăng-ti-mét vuông"],["dimensions","kích thước"]],
  quiz:[
